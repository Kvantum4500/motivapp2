function refreshWebauthnLockOverlay(){
  const el = document.getElementById('webauthn-lock-overlay');
  if(!el) return;
  el.innerHTML = App.webauthnLock.active ? webauthnLockOverlayHtml() : '';
  el.classList.toggle('open', !!App.webauthnLock.active);
}
function webauthnLockShow(){
  App.webauthnLock.active = true;
  App.webauthnLock.mode = 'biometric';
  App.webauthnLock.error = null;
  App.webauthnLock.busy = false;
  refreshWebauthnLockOverlay();
}
function webauthnLockHide(){
  App.webauthnLock.active = false;
  refreshWebauthnLockOverlay();
}
function webauthnLockSwitchMode(mode){
  App.webauthnLock.mode = mode;
  App.webauthnLock.error = null;
  refreshWebauthnLockOverlay();
  if(mode==='password' && typeof ensureCloudInit==='function'){
    // Előkészítjük a Firebase Auth-ot, hogy submitkor lehetőleg már
    // rendelkezésre álljon fbAuth.currentUser (ld. webauthnLockSubmitPassword()).
    ensureCloudInit();
  }
}
async function webauthnLockTryBiometric(){
  const st = App.webauthnLock;
  st.busy = true; st.error = null; refreshWebauthnLockOverlay();
  try{
    const enrolledUid = localStorage.getItem(WEBAUTHN_ENROLLED_UID_KEY);
    const credId = webauthnCredIdForUid(enrolledUid);
    if(!credId) throw new Error('Nincs ezen az eszközön tárolt ujjlenyomat-regisztráció.');
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const assertion = await navigator.credentials.get({
      publicKey:{
        challenge,
        allowCredentials:[{ id: webauthnBase64UrlToBuf(credId), type:'public-key' }],
        userVerification:'required',
        timeout:60000,
      }
    });
    if(!assertion) throw new Error('Nem érkezett feloldási válasz.');
    // A promise sikeres feloldása MAGA a jel (ld. a szekció fejlécében lévő
    // biztonsági keretezést) - nincs itt semmilyen aláírás-ellenőrzés, a
    // Firebase-munkamenet már úgyis a Phase A LOCAL persistence-ének
    // köszönhetően aktív.
    st.busy = false;
    webauthnLockHide();
  }catch(e){
    console.warn('MotivApp: WebAuthn feloldási kísérlet sikertelen/megszakítva.', e);
    st.busy = false;
    st.error = 'Nem sikerült az ujjlenyomatos azonosítás, próbáld újra, vagy használd a jelszót.';
    refreshWebauthnLockOverlay();
  }
}
async function webauthnLockSubmitPassword(){
  const st = App.webauthnLock;
  const emailEl = document.getElementById('webauthn-lock-email');
  const passEl = document.getElementById('webauthn-lock-password');
  const email = (emailEl && emailEl.value || '').trim();
  const password = (passEl && passEl.value) || '';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    st.error = 'Adj meg egy érvényes e-mail címet.';
    refreshWebauthnLockOverlay();
    return;
  }
  if(!password){
    st.error = 'Add meg a jelszavad.';
    refreshWebauthnLockOverlay();
    return;
  }
  st.busy = true; st.error = null; refreshWebauthnLockOverlay();
  if(typeof ensureCloudInit==='function') ensureCloudInit();
  // fbAuth/fbAvailable betöltése (SDK-szkriptek) aszinkron, ld. ensureCloudInit()
  // doksiját - rövid ideig, türelmesen várunk rá ahelyett, hogy azonnal
  // hibát mutatnánk, amíg épp folyamatban van.
  let waited = 0;
  while((_fbInitInFlight || (!_fbInitAttempted && !fbAvailable)) && waited < 8000){
    await new Promise(r=>setTimeout(r, 150));
    waited += 150;
  }
  if(!fbAvailable || !fbAuth){
    st.busy = false;
    st.error = 'A jelszavas feloldás jelenleg nem elérhető (nincs internetkapcsolat, vagy a szolgáltatás nem tölthető be). Próbáld meg az ujjlenyomatot, vagy próbáld újra később.';
    refreshWebauthnLockOverlay();
    return;
  }
  // fbAuth.currentUser (a LOCAL persistence-ből visszaálló munkamenet) SZINTÉN
  // aszinkron módon áll csak vissza - erre is türelmesen várunk, mielőtt
  // hibát mutatnánk, ld. a Phase B brief idevágó megjegyzését.
  waited = 0;
  while(!fbAuth.currentUser && waited < 5000){
    await new Promise(r=>setTimeout(r, 150));
    waited += 150;
  }
  if(!fbAuth.currentUser){
    st.busy = false;
    st.error = 'A munkamenet előkészítése még folyamatban van, próbáld újra pár másodperc múlva.';
    refreshWebauthnLockOverlay();
    return;
  }
  try{
    // Ez a lépés VALÓDI szerver-oldali ellenőrzést végez a Firebase Auth
    // ellen - ez a funkció tényleges biztonsági hátsó védelmi vonala
    // (ld. a szekció fejlécének biztonsági keretezését).
    const cred = firebase.auth.EmailAuthProvider.credential(email, password);
    await fbAuth.currentUser.reauthenticateWithCredential(cred);
    st.busy = false;
    webauthnLockHide();
  }catch(e){
    st.busy = false;
    st.error = cloudAuthErrorMessage(e); // ugyanaz a magyar hibatérkép, mint a normál bejelentkező formnál
    refreshWebauthnLockOverlay();
  }
}


/* ===== FÁJLBA MENTÉS/BETÖLTÉS (File System Access API, opcionális) =====
   A hasFSAccess feature-detect eldönti, hogy a böngésző tudja-e a
   showSaveFilePicker/showOpenFilePicker API-t — ez Android/TWA alatt
   Chrome-verziótól függően hiányozhat, ezért ez a funkció mindenhol csak
   progresszív ráépülés a meglévő letöltés/fájlválasztó folyamatra, SOHA
   nem kötelező előfeltétel (ld. saveToFile()/loadFromFile()).
   A kiválasztott FileSystemFileHandle-t az oldal-újratöltések között egy
   minimális, saját IndexedDB store-ban tartjuk meg (a localStorage csak
   szöveget tud, a handle nem szerializálható stringgé, de structured
   clone-nal IndexedDB-be igen). Minden IndexedDB hívás try/catch-elve
   van: bármilyen hiba esetén úgy viselkedünk, mintha nem lenne elmentett
   handle — ez sosem dobhat el nem kapott hibát, és sosem akaszthatja meg
   a mentést/betöltést.

   isNativeApp/hasFSAccess sorrendje SZÁNDÉKOS: a natív Android app saját,
   megbízható AndroidBackup/onShowFileChooser hidat ad (ld. lejjebb), ami
   mindig működik. Néhány újabb Android WebView build viszont MAGÁT a
   showSaveFilePicker/showOpenFilePicker függvényt is definiálja, de a
   WebView-nak nincs hozzá saját UI-ja a fájlválasztó/engedély-párbeszéd
   megjelenítésére - a hívás emiatt sem nem teljesül, sem el nem utasítja
   magát, hanem VÉGLEGESEN FÜGGŐBEN marad (a Promise se nem resolve-ol,
   se nem reject-ál), ami a felhasználó számára "a gomb semmit nem csinál"
   -ként jelentkezik (ellentétben egy dobott hibával, amit a catch ág már
   kezel). Mivel a natív hidak megléte önmagában bizonyítja, hogy natív
   appban futunk, ott sose próbálkozzunk a bizonytalan FS Access API-val -
   a hasFSAccess csak böngészőben/telepített webes (TWA) verzióban, natív
   híd hiányában lehet igaz. */
const isNativeApp = typeof window.AndroidBackup !== 'undefined' && !!window.AndroidBackup;
const hasFSAccess = !isNativeApp && typeof window.showSaveFilePicker === 'function' && typeof window.showOpenFilePicker === 'function';
const FS_DB_NAME = 'motivapp-fs', FS_STORE_NAME = 'handles', FS_HANDLE_KEY = 'backupFile';
function _openFsDb(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(FS_DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(FS_STORE_NAME); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function getStoredHandle(){
  try{
    const db = await _openFsDb();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(FS_STORE_NAME,'readonly');
      const req = tx.objectStore(FS_STORE_NAME).get(FS_HANDLE_KEY);
      req.onsuccess = ()=>resolve(req.result||null);
      req.onerror = ()=>reject(req.error);
    });
  }catch(e){ return null; }
}
async function setStoredHandle(handle){
  try{
    const db = await _openFsDb();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(FS_STORE_NAME,'readwrite');
      tx.objectStore(FS_STORE_NAME).put(handle, FS_HANDLE_KEY);
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){ /* nem kritikus — ha nem sikerül elmenteni a handle-t, a következő
                mentés/betöltés egyszerűen újra fájlválasztót fog nyitni */ }
}

/* ---------- utils ---------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad(n){ return n<10?'0'+n:''+n; }
/* Helyi naptári komponensekből építi az ISO dátumot, NEM toISOString()-tal (ami UTC-re
   konvertál és pozitív UTC-eltolású időzónában — pl. Magyarország — hajnalban egy
   nappal korábbi dátumot adna vissza "ma"-ként). */
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtTime(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDateHu(iso){
  const d=new Date(iso+'T00:00:00');
  const days=['Vasárnap','Hétfő','Kedd','Szerda','Csütörtök','Péntek','Szombat'];
  const months=['jan.','febr.','márc.','ápr.','máj.','jún.','júl.','aug.','szept.','okt.','nov.','dec.'];
  return days[d.getDay()]+' · '+months[d.getMonth()]+' '+d.getDate()+'.';
}
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
/* scheduleDayIndex: az adott nap (iso) hányadik napja (0-indexelt) a felhasználó
   műszakrend-mintájának (App.state.schedule.pattern) éppen futó ismétlésében —
   ugyanaz a modulo-számítás, amit korábban dayTypeFor közvetlenül elvégzett
   (ld. lentebb); külön függvénybe emelve, hogy a parseLocalCycleQuestionCommand
   (helyi AI-parancs, ld. HELYI AI PARANCSOK szekció) is újrahasználhassa, ahelyett
   hogy újraimplementálná a műszakrend-modulo aritmetikát. Override-okat (dayTypeFor
   szándékosan) NEM vesz figyelembe — a mintában elfoglalt pozíciót adja vissza,
   nem a ténylegesen aznapra beállított naptípust. */
function scheduleDayIndex(iso){
  const pat = App.state.schedule.pattern;
  if(!pat || !pat.length) return 0;
  return ((daysBetween(App.state.schedule.startDate, iso) % pat.length)+pat.length)%pat.length;
}
function dayTypeFor(iso){
  const ov = App.state.schedule.overrides[iso];
  if(ov) return ov;
  const pat = App.state.schedule.pattern;
  if(!pat || !pat.length) return 'pihen';
  return pat[scheduleDayIndex(iso)];
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* fmtFtInput(n): ugyanazt a szóközös ezres-tagolást adja, mint a sima
   Number.prototype.toLocaleString('hu-HU') mindenhol máshol az appban (pl.
   "150 000 Ft" egy kártyán) - AZZAL A KÜLÖNBSÉGGEL, hogy a bare
   .toLocaleString('hu-HU')-nak van egy empirikusan igazolt böngésző-motor
   kvirkje: 4-jegyű (1000-9999) összegeknél NEM tesz be elválasztót
   ((5000).toLocaleString('hu-HU') === "5000"!), csak 5+ jegytől. Explicit
   useGrouping:true opcióval az Intl.NumberFormat ezt kijavítja ("5 000"),
   5+ jegynél pedig KARAKTERRŐL KARAKTERRE ugyanazt adja, mint a bare
   toLocaleString('hu-HU') - tehát ez a csere sehol nem tér el a meglévő
   megjelenítésektől, csak a hiányzó 4-jegyű tagolást pótolja ott, ahol ez a
   helper használva van (a 14 élőben tagolt Ft-mező). */
function fmtFtInput(n){
  return new Intl.NumberFormat('hu-HU',{useGrouping:true}).format(n);
}
/* formatAmountInputLive(el): egy Ft-összeg <input type="text" inputmode="numeric">
   mezőt élőben, GÉPELÉS KÖZBEN ezres-tagol (fmtFtInput()-tal, ld. fent). Csak
   számjegyeket enged meg (bármi más karaktert eldob) - forintösszegeknél nincs
   tizedesjegy/fillér az App.state-ben, ezért ez biztonságos. A kurzorpozíciót
   a mező elé eső SZÁMJEGYEK száma alapján állítja vissza újraformázás után,
   hogy a szám közepén gépelés közben a kurzor ne ugorjon a mező végére minden
   billentyűleütésnél. */
function formatAmountInputLive(el){
  if(!el || el._amountFormatBound) return; // idempotens - ne kössünk rá duplán, ha egy sheet/lista többször renderelődik
  el._amountFormatBound = true;
  el.addEventListener('input', function(){
    const cursorPos = el.selectionStart;
    const digitsBeforeCursor = el.value.slice(0, cursorPos).replace(/\D/g,'').length;
    const digits = el.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'');
    el.value = digits ? fmtFtInput(Number(digits)) : '';
    let seen = 0, newPos = el.value.length;
    for(let i=0;i<el.value.length;i++){
      if(/\d/.test(el.value[i])) seen++;
      if(seen===digitsBeforeCursor){ newPos = i+1; break; }
    }
    if(digitsBeforeCursor===0) newPos = 0;
    el.setSelectionRange(newPos, newPos);
  });
}
/* parseAmountInput(v): a formatAmountInputLive()-tal formázott (szóközökkel tagolt)
   mező .value-jából (vagy közvetlen string/number bemenetből) visszanyeri a tiszta
   számot - minden számjegyen kívüli karaktert eldob, tehát a "150 000" -> 150000-et
   ad. Mindenhol EZT kell hívni parseFloat(...)/parseInt(...) helyett az érintett 14
   mezőnél, különben a szóköz miatt parseFloat("150 000") téves eredményt (150)
   adna. */
function parseAmountInput(v){
  const s = (v==null) ? '' : String(v);
  return parseFloat(s.replace(/[^\d]/g,'')) || 0;
}
/* sanitizeImportedId/sanitizeIcon: closes an XSS hole found in a security review.
   Many render sites build `onclick="fn('${x.id}')"` from stored .id values -
   escapeHtml() alone doesn't make that safe, because a value containing a quote
   still terminates the surrounding HTML attribute (or the inner JS string) once
   the browser decodes the markup, regardless of HTML-entity-encoding it first.
   uid() (the only way an id is ever generated by this app itself) only ever
   produces [a-z0-9] characters, so stripping anything else from an id coming
   from an UNTRUSTED source (an imported backup file, or an AI suggestion) is a
   no-op on every legitimately-produced id and neutralizes an injected one -
   applied at the few places untrusted data enters App.state, rather than at
   every onclick call site. sanitizeIcon does the same job for .icon fields
   (also interpolated unescaped at several render sites): icons are meant to be
   a single short emoji/glyph, so stripping HTML-significant characters and
   capping the length costs nothing for real icons. */
function sanitizeImportedId(id){
  const s = String(id==null?'':id).replace(/[^a-z0-9]/gi,'');
  return s || uid();
}
function sanitizeIcon(icon){
  return String(icon==null?'':icon).replace(/[<>&"']/g,'').slice(0,8);
}
/* Sweeps every array of {id, icon}-bearing records that can be populated from
   an imported backup file, sanitizing both fields in place. Called once from
   applyImportedJson() right before the imported state is committed. New
   id/icon-bearing arrays added later should be added to idIconArrays below. */
function sanitizeImportedIdsAndIcons(state){
  const idIconArrays = [
    state.tasks, state.events, state.workouts, state.journeys, state.journal,
    state.activities, state.customSports, state.customSkillNodes,
    state.finance && state.finance.mandatory,
    state.finance && state.finance.discretionary,
    state.finance && state.finance.savings,
    state.finance && state.finance.foodOrders,
    state.finance && state.finance.accounts,
    state.finance && state.finance.incomeSources,
  ];
  idIconArrays.forEach(arr=>{
    if(!Array.isArray(arr)) return;
    arr.forEach(item=>{
      if(!item || typeof item!=='object') return;
      if('id' in item) item.id = sanitizeImportedId(item.id);
      if('icon' in item) item.icon = sanitizeIcon(item.icon);
    });
  });
  // Task steps (Feladatkezelő lépéssor) carry their own nested ids.
  if(Array.isArray(state.tasks)){
    state.tasks.forEach(t=>{
      if(Array.isArray(t.steps)){
        t.steps.forEach(s=>{ if(s && typeof s==='object' && 'id' in s) s.id = sanitizeImportedId(s.id); });
      }
    });
  }
  // Életkampány (RPG) küldetések: state.rpg.weeks[i].quests, egyenként {id,...} -
  // nem illenek bele a fenti lapos idIconArrays listába (52 beágyazott tömb).
  if(state.rpg && Array.isArray(state.rpg.weeks)){
    state.rpg.weeks.forEach(w=>{
      if(w && Array.isArray(w.quests)){
        w.quests.forEach(q=>{ if(q && typeof q==='object' && 'id' in q) q.id = sanitizeImportedId(q.id); });
      }
    });
  }
}
// Kerekít és levágja a felesleges tizedeseket (pl. 6.133333333333334 -> 6.1,
// 6.0 -> 6) - egészségügyi mérőszámokhoz (alvás óra, lépés, pulzus stb.),
// amik osztásból vagy külső szinkronból (pl. jövőbeli Health Connect import)
// származhatnak, nem csak kézi bevitelből.
function fmtHealthNum(v, decimals){
  if(typeof v!=='number' || !isFinite(v)) return '—';
  const f = Math.pow(10, decimals||0);
  return String(Math.round(v*f)/f);
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2200);
}
/* toastUndo: egységes "visszavonható törlés" minta. A #toast pill-stílusát
   követi (ugyanazok a --paper/--ink/--radius tokenek), de a natív #toast
   elemtől külön, JS-ből felépített elemet használ, hogy ne kelljen a
   megosztott #toast DOM/CSS-t (más csapattagok is szerkesztik a fájlt)
   módosítani. A "Visszavonás" gomb néhány másodpercig aktív; lejárat után
   (vagy kattintás után) eltűnik, és a törlés véglegessé válik. */
let _toastUndoEl = null;
function toastUndo(msg, undoFn){
  let t = _toastUndoEl;
  if(!t){
    t = document.createElement('div');
    t.id = 'toast-undo';
    t.setAttribute('role','status'); t.setAttribute('aria-live','polite');
    t.style.cssText = 'position:fixed;bottom:calc(90px + var(--safe-bottom));left:50%;'
      +'transform:translateX(-50%) translateY(20px);background:var(--paper);color:var(--ink);'
      +'padding:9px 9px 9px 18px;border-radius:999px;font-weight:600;font-size:13px;z-index:100;'
      +'opacity:0;transition:.2s;pointer-events:none;display:flex;align-items:center;gap:10px;'
      +'max-width:calc(100vw - 32px);box-shadow:0 6px 20px rgba(0,0,0,.28);';
    document.body.appendChild(t);
    _toastUndoEl = t;
  }
  clearTimeout(t._tm);
  t.innerHTML = '';
  const label = document.createElement('span');
  label.textContent = msg;
  label.style.cssText = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
  const btn = document.createElement('button');
  btn.type = 'button'; btn.textContent = 'Visszavonás';
  btn.style.cssText = 'background:var(--trail-yellow);color:var(--ink);border:none;'
    +'border-radius:999px;padding:6px 14px;font-weight:700;font-size:12.5px;cursor:pointer;flex-shrink:0;';
  const hide = ()=>{ t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(20px)'; t.style.pointerEvents='none'; };
  btn.onclick = ()=>{ clearTimeout(t._tm); hide(); if(typeof undoFn==='function') undoFn(); };
  t.appendChild(label); t.appendChild(btn);
  t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)'; t.style.pointerEvents='auto';
  t._tm = setTimeout(hide, 5000);
}
function openSheet(html){

/* closeSheet() is the single, shared exit point for every sheet in the app - the ✕
   buttons, tapping the dim backdrop (see the sheetbg click listener below), AND (for the
   native bank/Foodora notification queue specifically) the explicit "Mentés" save path,
   which calls _finishActiveNotifQueueItem(true) before calling this. Because of that, this
   function doubles as the queue's "a sheet just stopped being shown" hook: when
   _activeNotifQueueItem is still set here, closeSheet() was reached WITHOUT that explicit
   acknowledgement first (i.e. the ✕ button or an outside tap) - see _activeNotifQueueItem's
   own comment for why that case is handled as an in-session-only, non-native-acknowledged
   dismiss rather than a plain close. */
function closeSheet(){
  if(_activeNotifQueueItem){ _finishActiveNotifQueueItem(false); return; }
  document.getElementById('sheetbg').classList.remove('open');
}
document.getElementById('sheetbg').addEventListener('click',e=>{ if(e.target.id==='sheetbg') closeSheet(); });
/* Globális [data-click] delegálás — egyszerű, legfeljebb 2 pozicionális
   (data-id/data-id2) string-argumentumot váró műveletekhez (pl. küldetés
   pipálása/törlése, hét-váltás), hogy ne kelljen felhasználói adatot
   (szöveg, id) onclick="fn('...')" attribútumba interpolálni. Gazdagabb
   payloadhoz (pl. {trackId,text,xp} objektum) NEM ezt bővítjük, hanem az
   érintett nézet saját, hatókörre szűkített querySelectorAll(...).forEach
   rebind-jét használjuk (ld. pl. RENDERERS.kampany #view-kampany
   [data-rpg-json]). */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-click]');
  if(!el) return;
  const fn = window[el.dataset.click];
  if(typeof fn !== 'function') return;
  const args = [];
  if('id' in el.dataset) args.push(el.dataset.id);
  if('id2' in el.dataset) args.push(el.dataset.id2);
  fn.apply(null, args);
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && document.getElementById('sheetbg').classList.contains('open')) closeSheet(); });
function kbActivate(e,fn){ if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){ e.preventDefault(); fn(); } }

function haversine(a,b){
  const R=6371000, toRad=x=>x*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}

function weekVolumeForMuscle(muscleId){
  const cutoff = Date.now()-28*86400000;
  let score=0;
  App.state.workouts.filter(w=>new Date(w.date).getTime()>cutoff).forEach(w=>{
    const daysAgo=(Date.now()-new Date(w.date).getTime())/86400000;
    const recency = Math.max(0.25, 1-(daysAgo/28));
    (w.muscleGroups||[]).forEach(m=>{ if(m===muscleId) score += 10*recency; });
  });
  Object.keys(App.state.skills).forEach(sid=>{
    const sk = allSkillNodes().find(s=>s.id===sid);
    if(sk && App.state.skills[sid]) (sk.muscles||[]).forEach(m=>{ if(m===muscleId) score+=6; });
  });
  return Math.max(0, Math.min(100, Math.round(score)));
}

const EVENT_COLORS = {munka:'blue',edzes:'red',pihenes:'green',esemeny:'blue',hatarido:'yellow',ai:'yellow'};

function taskRowHtml(t, afterToggle){
  if(t.type==='percent'){
    return `<div class="row" style="align-items:flex-start;">
      <div class="row-main">
        <div class="row-title" style="font-size:14px;">${escapeHtml(t.title)}</div>
        <div class="progwrap" style="margin:7px 0 4px;"><div class="progbar" style="width:${t.progress||0}%"></div></div>
        <div class="small muted">${t.progress||0}% kész</div>
      </div>
      <span class="g" style="cursor:pointer;padding-top:2px;" onclick="editTaskProgress('${t.id}')">✏️</span>
    </div>`;
  }
  if(t.type==='steps'){
    const steps = t.steps||[];
    const done = steps.filter(s=>s.done).length;
    const total = steps.length;
    const pct = total? Math.round(done/total*100) : 0;
    return `<div class="row" style="align-items:flex-start;cursor:pointer;" onclick="openStepsChecklistSheet('${t.id}')">
      <div class="row-main">
        <div class="row-title" style="font-size:14px;">${escapeHtml(t.title)}</div>
        <div class="progwrap" style="margin:7px 0 4px;"><div class="progbar" style="width:${pct}%"></div></div>
        <div class="small muted">${done}/${total} lépés kész</div>
      </div>
      <span class="g" style="padding-top:2px;">📋</span>
    </div>`;
  }
  return `<div class="row">
    <div class="row-check ${t.done?'done':''}" onclick="toggleTask('${t.id}');${afterToggle||''}">${t.done?'✓':''}</div>
    <div class="row-main"><div class="row-title ${t.done?'done':''}">${escapeHtml(t.title)}</div>
    ${t.priority? `<div class="row-sub">${t.priority==='high'?'🔴 magas prioritás':t.priority==='low'?'⚪ alacsony prioritás':'🟡 közepes prioritás'}</div>`:''}
    </div>
  </div>`;
}
function editTaskProgress(id){
  const t = App.state.tasks.find(x=>x.id===id); if(!t) return;
  openSheet(`<div class="sheet-head"><div class="sheet-title">${escapeHtml(t.title)}</div><button class="iconbtn" onclick="closeSheet()">✕</button></div>
    <div class="mono" id="tp-val" style="text-align:center;font-size:28px;margin-bottom:10px;font-weight:700;">${t.progress||0}%</div>
    <div class="field"><input type="range" id="tp-range" min="0" max="100" step="5" value="${t.progress||0}" style="width:100%;" oninput="document.getElementById('tp-val').textContent=this.value+'%'"></div>
    <button class="btn btn-primary btn-block" onclick="saveTaskProgress('${id}')">Mentés</button>`);
}
function saveTaskProgress(id){
  const t = App.state.tasks.find(x=>x.id===id); if(!t) return;
  t.progress = parseInt(document.getElementById('tp-range').value)||0;
  saveState(); closeSheet(); toast('Frissítve'); renderApp();
}

function toggleTask(id){
  const t = App.state.tasks.find(x=>x.id===id);
  if(t){ t.done=!t.done; saveState(); RENDERERS.ma(); }
}
function openAddTaskSheet(presetDate){

    <div class="field"><label>Mi a feladat?</label><input type="text" id="nt-title" placeholder="Pl. kampervan zsanér beszerzés"></div>
    <div class="field"><label>Határidő</label><input type="date" id="nt-due" value="${presetDate||todayISO()}"></div>
    <div class="field"><label>Meddig tart? (opcionális, több napos feladathoz)</label><input type="date" id="nt-due-end"></div>
    <div class="field"><label>Típus</label>
      <div class="chiprow" id="nt-type">
        <div class="chip active" data-v="checkbox">✓ Pipálható</div><div class="chip" data-v="percent">% Százalékos</div><div class="chip" data-v="steps">📋 Lépéssor</div>
      </div>
    </div>
    <div class="field"><label>Prioritás</label>
      <div class="chiprow" id="nt-prio">

      </div>

    <button class="btn btn-primary btn-block" onclick="saveNewTask()">Mentés</button>
  `);
  document.querySelectorAll('#nt-prio .chip').forEach(c=>c.addEventListener('click',()=>{

  }));
  document.querySelectorAll('#nt-type .chip').forEach(c=>c.addEventListener('click',()=>{

function saveNewTask(){
  const title = document.getElementById('nt-title').value.trim();
  if(!title){ toast('Adj meg egy címet'); return; }
  const due = document.getElementById('nt-due').value;
  const dueEnd = document.getElementById('nt-due-end').value;
  // Ha van megadva "meddig tart" dátum, annak >= a határidőnek kell lennie - ha nem,
  // inkább megszakítjuk a mentést egy hibaüzenettel, mint hogy csendben eldobjuk vagy
  // egynaposként mentsük (a felhasználó explicit tartományt akart megadni).
  if(dueEnd && dueEnd<due){ toast('A "meddig tart" dátum nem lehet korábbi a határidőnél'); return; }
  const prio = document.querySelector('#nt-prio .chip.active').dataset.v;
  const type = document.querySelector('#nt-type .chip.active').dataset.v;
  const task = {id:uid(),title,due,priority:prio,type,done:false};
  if(dueEnd) task.dueEnd=dueEnd;
  if(type==='steps') task.steps=[]; else task.progress=0;
  App.state.tasks.push(task);
  saveState();
  if(type==='steps'){
    toast('Feladat hozzáadva'); renderApp(); renderFeladatokSub();
    openEditStepsSheet(task.id);
  } else {
    closeSheet(); toast('Feladat hozzáadva'); renderApp(); renderFeladatokSub();
  }
}
/* Feladatkezelő - lépéssoros feladatok (type:'steps'): a tasks tömb elemei
   ilyenkor steps:[{id,text,done}] tömböt kapnak progress helyett.
   openEditStepsSheet()/saveEditedSteps() a lépések listáját szerkeszti
   (új lépéssoros feladatnál saveNewTask() ezt nyitja meg folytatásként,
   meglévőnél a pipálható nézet ✏️ gombja), openStepsChecklistSheet()/
   toggleStepDone() a pipálható nézetet adja. feladatokSubBodyHtml()/
   renderFeladatokSub() a teljes Feladatkezelő nézetet adja - ezt a két
   nevet egy másik ág már a nevük alapján hívja, ezért a nevük nem
   változtatható. */
let _stepsDraft = null;
function openEditStepsSheet(id){
  const t = App.state.tasks.find(x=>x.id===id); if(!t) return;
  _stepsDraft = {taskId:id, steps:(t.steps||[]).map(s=>({id:s.id,text:s.text}))};
  renderStepsEditSheet();
}
function renderStepsEditSheet(){
  const d = _stepsDraft; if(!d) return;
  const t = App.state.tasks.find(x=>x.id===d.taskId);
  openSheet(`
    <div class="sheet-head"><div class="sheet-title">Lépések${t?': '+escapeHtml(t.title):''}</div><button class="iconbtn" onclick="closeSheet()">✕</button></div>
    <div class="card" style="padding:4px 16px;margin-bottom:12px;">
      ${d.steps.length? d.steps.map((s,i)=>`<div class="row"><div class="row-main"><div class="row-title" style="font-size:14px;">${i+1}. ${escapeHtml(s.text)}</div></div><span class="g" style="cursor:pointer;" onclick="removeStepDraft(${i})">✕</span></div>`).join('') : `<div class="small muted" style="padding:12px 0;">Még nincs lépés hozzáadva.</div>`}
    </div>
    <div class="field"><label>Új lépés</label><input type="text" id="sd-text" placeholder="Pl. hagymát megdinsztelni" onkeydown="if(event.key==='Enter'){event.preventDefault();addStepDraft();}"></div>
    <button class="btn btn-secondary btn-block" style="margin-bottom:10px;" onclick="addStepDraft()">+ Lépés hozzáadása</button>
    <button class="btn btn-primary btn-block" onclick="saveEditedSteps()">Kész</button>
  `);
  document.getElementById('sd-text')?.focus();
}
function addStepDraft(){
  const inp = document.getElementById('sd-text'); if(!inp) return;
  const text = inp.value.trim();
  if(!text) return;
  _stepsDraft.steps.push({id:uid(),text});
  renderStepsEditSheet();
}
function removeStepDraft(idx){
  _stepsDraft.steps.splice(idx,1);
  renderStepsEditSheet();
}
function saveEditedSteps(){
  const d = _stepsDraft; if(!d) return;
  const t = App.state.tasks.find(x=>x.id===d.taskId);
  if(!t){ _stepsDraft=null; closeSheet(); return; }
  const prevDone = {}; (t.steps||[]).forEach(s=>{ prevDone[s.id]=s.done; });
  t.steps = d.steps.map(s=>({id:s.id, text:s.text, done:prevDone[s.id]||false}));
  _stepsDraft = null;
  saveState(); closeSheet(); toast('Lépések mentve'); renderApp(); renderFeladatokSub();
}
function openStepsChecklistSheet(id){
  const t = App.state.tasks.find(x=>x.id===id); if(!t) return;
  openSheet(`
    <div class="sheet-head"><div class="sheet-title">${escapeHtml(t.title)}</div><div class="flex gap8"><span class="g" style="cursor:pointer;" onclick="openEditStepsSheet('${id}')">✏️</span><button class="iconbtn" onclick="closeSheet()">✕</button></div></div>
    <div id="steps-checklist-list"></div>
  `);
  renderStepsChecklistList(id);
}
function renderStepsChecklistList(id){
  const c = document.getElementById('steps-checklist-list'); if(!c) return;
  const t = App.state.tasks.find(x=>x.id===id); if(!t) return;
  const steps = t.steps||[];
  c.innerHTML = steps.length? steps.map(s=>`
    <div class="row">
      <div class="row-check ${s.done?'done':''}" onclick="toggleStepDone('${id}','${s.id}')">${s.done?'✓':''}</div>
      <div class="row-main"><div class="row-title ${s.done?'done':''}">${escapeHtml(s.text)}</div></div>
    </div>`).join('') : `<div class="empty"><div class="ic">📋</div><div class="t">Még nincs lépés</div><div class="d">Add hozzá a fejlécben lévő ✏️ gombbal.</div></div>`;
}
function toggleStepDone(taskId, stepId){
  const t = App.state.tasks.find(x=>x.id===taskId); if(!t) return;
  const s = (t.steps||[]).find(x=>x.id===stepId); if(!s) return;
  s.done = !s.done;
  saveState();
  renderStepsChecklistList(taskId);
  renderFeladatokSub();
}
function _feladatokListHtml(){
  const all = App.state.tasks.slice().sort((a,b)=>(a.due||'').localeCompare(b.due||''));

  return `

    <div class="card" style="padding:4px 16px;">${plain.length? plain.map(t=>taskRowHtml(t,'renderFeladatokSub();')).join('') : `<div class="empty"><div class="ic">📋</div><div class="t">Nincs feladat</div></div>`}</div>
    <div class="sectiontitle">Lépéssoros feladatok</div>
    <div class="card" style="padding:4px 16px;">${steps.length? steps.map(t=>taskRowHtml(t)).join('') : `<div class="empty"><div class="ic">📋</div><div class="t">Nincs lépéssoros feladat</div></div>`}</div>
  `;
}
function feladatokSubBodyHtml(){

function renderCalContent(){

  if(App.ui.calView==='nap') renderNapView(c);
  else if(App.ui.calView==='het') renderHetView(c);
  else if(App.ui.calView==='honap') renderHonapView(c);
  else renderEvView(c);

function toLocalISO(d){
  // Helyi naptári komponensekből építi az ISO dátumot (NEM toISOString(), ami UTC-re
  // konvertál és pozitív UTC-eltolású időzónában (pl. HU) 1 nappal korábbra csúsztat).
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function shiftCalRef(dir){
  const d = new Date(App.ui.calRef+'T00:00:00');
  if(App.ui.calView==='nap') d.setDate(d.getDate()+dir);
  else if(App.ui.calView==='het') d.setDate(d.getDate()+dir*7);
  else if(App.ui.calView==='honap') d.setMonth(d.getMonth()+dir);
  else d.setFullYear(d.getFullYear()+dir);
  App.ui.calRef = toLocalISO(d);
  renderCalContent();
}
function fmtShort(iso){
  const d=new Date(iso+'T00:00:00');
  const months=['jan.','febr.','márc.','ápr.','máj.','jún.','júl.','aug.','szept.','okt.','nov.','dec.'];
  return months[d.getMonth()]+' '+d.getDate()+'.';
}
function dayCell(iso,todayIso,compact){
  const dtKey=dayTypeFor(iso);
  const dt=DAY_TYPES[dtKey]||DAY_TYPES.egyeb;
  const dnum=new Date(iso+'T00:00:00').getDate();
  const items=[...App.state.events.filter(e=>eventOccursOn(e,iso)).map(e=>e.title), ...App.state.tasks.filter(t=>taskOccursOn(t,iso)).map(t=>t.title)];
  const maxShow = compact?1:2;
  const shown = items.slice(0,maxShow);
  const extra = items.length-shown.length;
  const dtIco = (DAY_TYPE_SHORT[dtKey]||'').split(' ')[0];
  return `<div class="daycell ${iso===todayIso?'today':''}" onclick="openDaySheet('${iso}')">
    <div class="dn">${dnum}</div><div class="tp" style="background:var(--trail-${dt.color})"></div><div class="tp-ico" title="${escapeHtml(dt.label)}">${dtIco}</div>
    ${shown.map(t=>`<div class="evtxt">${escapeHtml(t)}</div>`).join('')}
    ${extra>0?`<div class="evmore">+${extra}</div>`:''}
  </div>`;
}

function renderNapView(c){

function layoutTree(nodes){
  const children={}; nodes.forEach(n=>children[n.id]=[]);
  nodes.forEach(n=>{ if(n.parent && children[n.parent]) children[n.parent].push(n.id); });
  const roots = nodes.filter(n=>!n.parent).map(n=>n.id);
  let leafCounter=0; const col={}, row={};
  function assign(id,depth){
    row[id]=depth;
    const kids=children[id];
    if(!kids.length){ col[id]=leafCounter++; return col[id]; }
    kids.forEach(k=>assign(k,depth+1));
    col[id]=kids.reduce((s,k)=>s+col[k],0)/kids.length;
    return col[id];
  }
  roots.forEach(r=>assign(r,0));
  return nodes.map(n=>({...n,col:col[n.id]||0,row:row[n.id]||0}));
}

   Mindegyik KIZÁRÓLAG a meglévő App.state adatokból számol render-időben — nem ír
   App.state-be, és nem ad hozzá új perzisztens mezőt. isoAddDays() a kódbázis
   dokumentált toLocalISO()-mintáját követi (ld. a fájl elején a "Timezone-konvenció"
   fejlesztői irányelvet): SOHA nem toISOString()-ot használ. */
function isoAddDays(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+n);
  return toLocalISO(d);
}

/* 1) Műszaktípus szerinti pénzügy/energia elemzés (ld. backlog #33).
   Napi átlagos "egyéb" (nem kötelező) költést és átlagos energiaváltozást mutat
   műszaktípusonként (nappal/éjszaka/pihenő/szabi/egyéb).
   - A költés forrása App.state.finance.spendLedger (minden source: ai/manual/bank/
     foodora — ez már tartalmazza a foodOrders-ből eredő "foodora" tételeket is,
     ld. recordSpendAndCheckDup() hívásait, ezért a foodOrders-t itt NEM adjuk
     hozzá külön, hogy ne dupláznánk).
   - A napi átlaghoz a spendLedger/activities dátumai közül a legkorábbitól a
     legkésőbbiig (vagy máig, ha az később) tartó időszakban megszámoljuk, hány
     nap esik az adott műszaktípusra (dayTypeFor minden napra) — ez a nevező, hogy
     a ritkán előforduló műszaktípusok (pl. kevés "szabi" nap) ne torzítsanak.
   - Az energiaváltozás App.state.activities-ből jön (minden bejegyzésnek van
     energyBefore/energyAfter, ld. saveActivity/applyAiSuggestion 'activity_log'
     és 'workout' ágai) — itt egyszerű, eseményenkénti átlagot számolunk. */
function computeShiftTypeStats(){
  const spend = App.state.finance.spendLedger||[];
  const acts = App.state.activities||[];
  const allDates = [...spend.map(s=>s.date), ...acts.map(a=>a.date)].filter(Boolean);
  if(!allDates.length) return null;
  const sorted = allDates.slice().sort();
  const start = sorted[0];
  let end = sorted[sorted.length-1];
  const today = todayISO();
  if(end < today) end = today;
  const totalDays = Math.min(daysBetween(start,end)+1, 400); // biztonsági korlát nagyon régi/hibás dátumok ellen
  const dayTypeCount = {};
  for(let i=0;i<totalDays;i++){
    const dt = dayTypeFor(isoAddDays(start,i));
    dayTypeCount[dt] = (dayTypeCount[dt]||0)+1;
  }
  const spendSum = {};
  spend.forEach(s=>{ if(!s.date) return; const dt=dayTypeFor(s.date); spendSum[dt]=(spendSum[dt]||0)+(s.amount||0); });
  const energySum = {}, energyCount = {};
  acts.forEach(a=>{
    if(!a.date || a.energyBefore==null || a.energyAfter==null) return;
    const dt = dayTypeFor(a.date);
    energySum[dt] = (energySum[dt]||0)+(a.energyAfter-a.energyBefore);
    energyCount[dt] = (energyCount[dt]||0)+1;
  });
  return Object.keys(DAY_TYPES).map(dt=>({
    dt, label:DAY_TYPES[dt].label, color:DAY_TYPES[dt].color,
    days: dayTypeCount[dt]||0,
    avgSpend: dayTypeCount[dt] ? Math.round((spendSum[dt]||0)/dayTypeCount[dt]) : null,
    avgEnergyDelta: energyCount[dt] ? Math.round(energySum[dt]/energyCount[dt]) : null,
    energyEntries: energyCount[dt]||0,
  }));
}

/* 2) Alvás → másnapi feladatteljesítés korreláció (ld. backlog #34).
   Tasks-nak NINCS teljesítési időbélyege (a saveNewTask()/toggleTask() csak egy
   done:boolean-t vezet, doneAt-ot nem — ld. toggleTask() kb. 1070. sor), ezért
   csak azt tudjuk vizsgálni, hogy egy adott napra (t.due) eső feladat végül
   elkészült-e, nem azt, hogy MIKOR. "Összehasonlítható nap" = van healthLog
   alvásadat aznapra ÉS van legalább 1 feladat a rákövetkező napra (t.due alapján,
   nem taskOccursOn — a "másnap" itt kifejezetten a határidő napja). 5 alatt
   nem mutatunk bucketes bontást (túl kevés adatból félrevezető lenne). */
function computeSleepTaskCorrelation(){
  const healthLog = (App.state.healthLog||[]).filter(h=>h.date && h.sleepH!=null);
  const tasks = App.state.tasks||[];
  const rows = [];
  healthLog.forEach(h=>{
    const nextIso = isoAddDays(h.date, 1);
    const due = tasks.filter(t=>t.due===nextIso);
    if(!due.length) return;
    const done = due.filter(t=>t.done).length;
    rows.push({date:h.date, sleepH:h.sleepH, total:due.length, done});
  });
  return rows;
}
const SLEEP_BUCKETS = [
  {label:'< 6 óra', test:h=>h<6},
  {label:'6–7 óra', test:h=>h>=6&&h<7},
  {label:'7–8 óra', test:h=>h>=7&&h<8},
  {label:'8+ óra', test:h=>h>=8},
];
function renderSleepTaskSection(){
  const rows = computeSleepTaskCorrelation();
  if(rows.length < 5){
    return `<div class="sectiontitle">😴 Alvás → másnapi feladatteljesítés</div>
    <div class="card"><div class="empty"><div class="ic">😴</div><div class="t">Még nincs elég adat</div><div class="d">Legalább 5 olyan nap kell, amikor van rögzített alvásidő ÉS másnapra határidős feladat is van (eddig: ${rows.length}).</div></div></div>`;
  }
  const buckets = SLEEP_BUCKETS.map(b=>{
    const matched = rows.filter(r=>b.test(r.sleepH));
    const totalTasks = matched.reduce((s,r)=>s+r.total,0);
    const doneTasks = matched.reduce((s,r)=>s+r.done,0);
    return {label:b.label, days:matched.length, rate: totalTasks? Math.round(100*doneTasks/totalTasks) : null};
  });
  const rowsHtml = buckets.map(b=>`
    <div class="flex between center" style="padding:6px 0;">
      <span class="small" style="width:76px;flex-shrink:0;">${b.label}</span>
      <div style="flex:1;background:var(--surface-3);border-radius:999px;height:8px;overflow:hidden;margin:0 8px;"><div style="height:100%;border-radius:999px;background:var(--trail-blue);width:${b.rate||0}%;"></div></div>
      <span class="mono small" style="width:88px;text-align:right;flex-shrink:0;">${b.rate!=null? b.rate+'% ('+b.days+' nap)':'nincs adat'}</span>
    </div>`).join('');
  return `<div class="sectiontitle">😴 Alvás → másnapi feladatteljesítés</div>
  <div class="card" style="padding:6px 16px;">
    <div class="small muted" style="margin-bottom:8px;">${rows.length} összehasonlítható nap alapján: az előző éjszakai alvásidő szerinti csoportokban mennyi a másnapra eső feladatok teljesítési aránya.</div>
    ${rowsHtml}
  </div>`;
}

/* 3) Banki/Foodora-eredetű költés → energia (ld. backlog #38).
   A leggyérebb adatú nézet a négy közül: spendLedger 'bank'/'foodora' forrású
   tételei valószínűleg ritkák (csak akkor keletkeznek, ha a natív értesítés-
   figyelő ténylegesen elkapott egy banki/Foodora push-t, ld. dev guideline a
   'financeContextExclude' mintáról). EZÉRT itt NEM formális korrelációs
   együtthatót számolunk, hanem (a taskleírásban is javasolt egyszerűsítés)
   mindig megmutatjuk az időbeli áttekintést (mely napon mennyi ilyen költés
   volt, aznapi átlagos energiaváltozással együtt), és CSAK akkor egészítjük ki
   egy "költéses nap vs. többi nap" átlag-összevetéssel, ha legalább 5 nap van,
   ahol VAN is ilyen költés ÉS van aznapi energiaadat is. */
function computeSpendEnergyTimeline(){
  const spend = (App.state.finance.spendLedger||[]).filter(s=>s.date && (s.source==='foodora'||s.source==='bank'));
  const acts = App.state.activities||[];
  const energyByDate = {};
  acts.forEach(a=>{
    if(!a.date || a.energyBefore==null || a.energyAfter==null) return;
    if(!energyByDate[a.date]) energyByDate[a.date] = [];
    energyByDate[a.date].push(a.energyAfter-a.energyBefore);
  });
  const byDate = {};
  spend.forEach(s=>{
    if(!byDate[s.date]) byDate[s.date] = {amount:0,count:0,sources:new Set()};
    byDate[s.date].amount += s.amount||0;
    byDate[s.date].count++;
    byDate[s.date].sources.add(s.source);
  });
  const rows = Object.keys(byDate).sort().map(d=>{
    const e = energyByDate[d];
    return {
      date:d, amount:byDate[d].amount, count:byDate[d].count, sources:[...byDate[d].sources],
      energyDelta: e? Math.round(e.reduce((a,b)=>a+b,0)/e.length) : null
    };
  });
  const overlap = rows.filter(r=>r.energyDelta!=null);
  let comparison = null;
  if(overlap.length>=5){
    const otherDeltas = [];
    Object.keys(energyByDate).forEach(d=>{
      if(byDate[d]) return; // ez a nap már a "költéses" csoportban van
      const list = energyByDate[d];
      otherDeltas.push(list.reduce((a,b)=>a+b,0)/list.length);
    });
    if(otherDeltas.length>=3){
      comparison = {
        spendAvg: Math.round(overlap.reduce((s,r)=>s+r.energyDelta,0)/overlap.length),
        otherAvg: Math.round(otherDeltas.reduce((a,b)=>a+b,0)/otherDeltas.length),
        spendDays: overlap.length, otherDays: otherDeltas.length
      };
    }
  }
  return {rows, comparison};
}
function renderSpendEnergySection(){
  const {rows, comparison} = computeSpendEnergyTimeline();
  if(!rows.length){

/* 4) Napló hangulat + műszaktípus trend (ld. backlog #40). */
function computeJournalMoodStats(){
  const journal = (App.state.journal||[]).filter(e=>e.mood!=null && e.date);
  const byType = {};
  journal.forEach(e=>{
    const dt = dayTypeFor(e.date);
    if(!byType[dt]) byType[dt] = {sum:0,count:0};
    byType[dt].sum += e.mood; byType[dt].count++;
  });
  const stats = Object.keys(DAY_TYPES).map(dt=>({
    dt, label:DAY_TYPES[dt].label, color:DAY_TYPES[dt].color,
    count: (byType[dt]||{}).count||0,
    avg: (byType[dt]&&byType[dt].count) ? byType[dt].sum/byType[dt].count : null
  }));
  const cutoff = isoAddDays(todayISO(), -30);
  const trend = journal.filter(e=>e.date>=cutoff).slice().sort((a,b)=>a.date.localeCompare(b.date));
  return {stats, trend, totalEntries:journal.length};
}
function renderJournalMoodSection(){
  const {stats, trend, totalEntries} = computeJournalMoodStats();
  if(totalEntries < 3){
    return `<div class="sectiontitle">📓 Hangulat és műszaktípus</div>
    <div class="card"><div class="empty"><div class="ic">📓</div><div class="t">Még nincs elég naplóbejegyzés</div><div class="d">Írj néhány hangulatértékes naplóbejegyzést (Beosztás → Napló), hogy lássuk a mintákat.</div></div></div>`;
  }
  const activeTypes = stats.filter(s=>s.count>0);
  const byTypeHtml = activeTypes.map(s=>`

      <span class="flex gap8 center small"><span class="dot dot-${s.color}"></span>${s.label}</span>

    </div>`).join('');
  const moodColor = m => m>=4?'var(--trail-green)':m===3?'var(--trail-yellow)':'var(--trail-red)';
  const trendHtml = trend.length>=2 ? `
    <div style="display:flex;align-items:flex-end;gap:3px;height:64px;margin-top:10px;overflow-x:auto;padding-bottom:2px;">
      ${trend.map(e=>`<div title="${fmtDateHu(e.date)}: ${e.mood}/5" style="flex-shrink:0;width:9px;height:${e.mood*11+6}px;background:${moodColor(e.mood)};border-radius:3px;"></div>`).join('')}

  ` : `<div class="small muted" style="margin-top:8px;">Legalább 2 bejegyzés kell az elmúlt 30 napból a trendhez.</div>`;

const TREE_SLOT=70, TREE_ROWH=90, TREE_PADX=16, TREE_PADY=18, TREE_ICON=38, TREE_NODEW=60;
function allSports(){ return SPORTS.concat(App.state.customSports||[]); }
function allSkillNodes(){ return SKILL_DEFS.concat(App.state.customSkillNodes||[]); }
function skillState(n){
  if(!n.parent) return 'root';
  if(App.state.skills[n.id]) return 'unlocked';
  const p = allSkillNodes().find(x=>x.id===n.parent);
  const parentReady = p && (!p.parent || !!App.state.skills[p.id]);
  return parentReady ? 'available' : 'locked';
}
function renderSkillsView(c){

  c.innerHTML = `
    <div class="chiprow" style="margin-bottom:14px;">

      </div>
    </div>
    <div class="card" style="padding:12px 0;">${nodes.length? renderSportTree(nodes) : `<div class="empty"><div class="ic">🌳</div><div class="t">Még nincs skillfa</div></div>`}</div>
  `;

function setSkillSport(id){ App.ui.skillSport=id; renderFejlContent(); }
function renderSportTree(nodes){
  const laid = layoutTree(nodes);
  const maxCol = Math.max(...laid.map(n=>n.col));
  const maxRow = Math.max(...laid.map(n=>n.row));
  const W = TREE_PADX*2 + maxCol*TREE_SLOT + TREE_NODEW;
  const H = TREE_PADY*2 + maxRow*TREE_ROWH + TREE_ICON + 46;
  const pos={}; laid.forEach(n=>{ pos[n.id]={x:TREE_PADX+n.col*TREE_SLOT+TREE_NODEW/2, y:TREE_PADY+n.row*TREE_ROWH}; });
  let lines='';
  laid.forEach(n=>{
    if(n.parent && pos[n.parent]){
      const p=pos[n.parent], ch=pos[n.id];
      const x1=p.x,y1=p.y+TREE_ICON,x2=ch.x,y2=ch.y,midY=(y1+y2)/2;
      const active = skillState(n)!=='locked';
      lines += `<path d="M${x1},${y1} C${x1},${midY} ${x2},${midY} ${x2},${y2}" fill="none" stroke="${active?'#D9A441':'#33413A'}" stroke-width="2" stroke-dasharray="5,5"/>`;
    }
  });
  let nodesHtml='';
  laid.forEach(n=>{
    const p=pos[n.id], st=skillState(n);
    nodesHtml += `<div class="treenode ${st}" style="left:${(p.x-TREE_NODEW/2).toFixed(1)}px;top:${p.y}px;width:${TREE_NODEW}px;" onclick="onSkillTap('${n.id}')">
      <div class="tn-ic">${escapeHtml(n.icon)}</div>
      <div class="tn-lb">${escapeHtml(n.name)}</div>
    </div>`;
  });
  return `<div class="treescroll"><div class="treecanvas" style="width:${W}px;height:${H}px;">
    <svg width="${W}" height="${H}" style="position:absolute;left:0;top:0;">${lines}</svg>
    ${nodesHtml}
  </div></div>`;
}
function onSkillTap(id){
  const s = allSkillNodes().find(x=>x.id===id);
  const st = skillState(s);
  if(st==='root'){ toast((allSports().find(sp=>sp.id===s.sport)||{}).name+' ág kezdőpontja'); return; }
  if(st==='unlocked'){
    const dependents = skillDescendants(id).filter(n=>App.state.skills[n.id]);
    const dependentsWarning = dependents.length
      ? `<div class="small" style="margin-bottom:14px;padding:10px;border-radius:10px;background:var(--trail-red-bg);color:#E8A392;line-height:1.5;">⚠️ ${dependents.length} tőle függő, már feloldott skill is visszavonásra kerül: ${dependents.map(n=>escapeHtml(n.name)).join(', ')}.</div>`
      : '';
    openSheet(`<div class="sheet-head"><div class="sheet-title">${escapeHtml(s.icon)} ${escapeHtml(s.name)}</div><button class="iconbtn" onclick="closeSheet()">✕</button></div>
      <div class="small muted" style="margin-bottom:14px;">Feloldva. Kapcsolódó izomcsoportok: ${(s.muscles||[]).map(m=>(MUSCLE_GROUPS.find(x=>x.id===m)||{}).label).join(', ')||'—'}</div>
      ${dependentsWarning}
      <button class="btn btn-ghost btn-block" onclick="revokeSkillCascade('${id}')">Visszavonás${dependents.length?` (+${dependents.length} függő)`:''}</button>`);
    return;
  }
  if(st==='locked'){
    const parentName = (allSkillNodes().find(x=>x.id===s.parent)||{}).name;
    openSheet(`<div class="sheet-head"><div class="sheet-title">🔒 ${escapeHtml(s.name)}</div><button class="iconbtn" onclick="closeSheet()">✕</button></div>
      <div class="small muted">Előbb oldd fel: <b>${escapeHtml(parentName)}</b></div>`);
    return;
  }
  openSheet(`<div class="sheet-head"><div class="sheet-title">${escapeHtml(s.icon)} ${escapeHtml(s.name)}</div><button class="iconbtn" onclick="closeSheet()">✕</button></div>
    <div class="small muted" style="margin-bottom:14px;">Feloldod ezt a skillt? Ez frissíti a TEST nézeten a(z) ${(s.muscles||[]).map(m=>(MUSCLE_GROUPS.find(x=>x.id===m)||{}).label).join(', ')||'—'} fejlettségét.</div>
    <button class="btn btn-primary btn-block" onclick="App.state.skills['${id}']=true;saveState();closeSheet();toast('Feloldva! 🎉');RENDERERS.fejlodes();">Feloldom ✓</button>`);
}
/* Az `id` skilltől lefelé, a `.parent` láncot rekurzívan bejárva, az ÖSSZES
   leszármazott skill-node (feloldott állapottól függetlenül). */
function skillDescendants(id){
  const nodes = allSkillNodes();
  const out = [];
  const stack = [id];
  while(stack.length){
    const cur = stack.pop();
    nodes.filter(n=>n.parent===cur).forEach(ch=>{ out.push(ch); stack.push(ch.id); });
  }
  return out;
}
/* Egy feloldott skill visszavonása CASCADE-dal: minden tőle függő, jelenleg
   feloldott leszármazott skillt is visszavon, hogy a skillfa állapota
   (szülő feloldva <= gyerek feloldva) mindig konzisztens maradjon. */
function revokeSkillCascade(id){
  const s = allSkillNodes().find(x=>x.id===id);
  const dependents = skillDescendants(id).filter(n=>App.state.skills[n.id]);
  App.state.skills[id] = false;
  dependents.forEach(n=>{ App.state.skills[n.id] = false; });
  saveState(); closeSheet();
  toast(dependents.length
    ? `Visszavonva: ${s?s.name:''} + ${dependents.length} függő skill`
    : 'Visszavonva');
  RENDERERS.fejlodes();
}

/* requestApiKeySheet: a natív window.prompt() helyett az openSheet() mintát
   követő, stílusos beviteli ablak az Anthropic API kulcshoz. Promise-t ad
   vissza, ami a "Mentés" gombra kattintáskor a beírt (trimmelt) kulccsal,
   bármilyen egyéb bezárási úton (✕ gomb, "Mégse", háttérre kattintás, Esc)
   üres string-gel oldódik fel — így a hívó (callMotivAI) mindig kap egy
   választ, és soha nem akad be egy le nem zárt Promise-on. A #sheetbg elem
   'open' class-ának megfigyelésével (MutationObserver) minden bezárási útvonalat
   lefed anélkül, hogy a megosztott closeSheet()/globális event listenerekhez
   (503-515. sor körül, más csapattagok is szerkeszthetik) hozzá kellene nyúlni. */
let _apiKeySheetSave = null;
function requestApiKeySheet(){
  return new Promise((resolve)=>{
    let settled=false;
    const bg=document.getElementById('sheetbg');
    let observer;
    const finish=(val)=>{
      if(settled) return;
      settled=true;
      if(observer) observer.disconnect();
      _apiKeySheetSave=null;
      resolve(val);
    };
    _apiKeySheetSave=function(){
      const el=document.getElementById('apikey-input');
      const v=(el&&el.value)||'';
      finish(v.trim());
      closeSheet();
    };
    openSheet(`
      <div class="sheet-head"><div class="sheet-title">🔑 Anthropic API kulcs szükséges</div><button class="iconbtn" onclick="closeSheet()">✕</button></div>
      <div class="small g" style="line-height:1.55;margin-bottom:14px;">Ez egyszemélyes app, szerver-proxy nélkül — a MotivAI funkciókhoz saját Anthropic API kulcs kell. A kulcsot kizárólag ezen az eszközön, a böngésző localStorage-ában tároljuk el, sehova máshova nem küldjük.</div>
      <div class="field"><label>API kulcs</label><input type="password" id="apikey-input" placeholder="sk-ant-..." autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();_apiKeySheetSave();}"></div>
      <button class="btn btn-primary btn-block" onclick="_apiKeySheetSave()">Mentés</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="closeSheet()">Mégse</button>
    `);
    observer=new MutationObserver(()=>{ if(!bg.classList.contains('open')) finish(''); });
    observer.observe(bg,{attributes:true,attributeFilter:['class']});
  });
}
/* ===== callMotivAI: közös helper minden Anthropic Messages API hívásra =====
   Ez egyszemélyes, nem publikus app — nincs szerver-proxy, ezért az MVP-
   megoldás egy futásidejű, localStorage-ban tárolt API-kulcs, amit első
   használatkor egyszer bekérünk (lásd requestApiKeySheet). A hívó kód csak
   callMotivAI({...})-t hív, a modellnevet és a payloadot változatlanul hagyva;
   a hitelesítési fejlécek és a hibakezelés (hiányzó/érvénytelen kulcs, HTTP
   hiba, limit-hiba) itt központosított. */
async function callMotivAI(payload){
  let apiKey = localStorage.getItem('motivai:apikey');
  if(!apiKey){
    apiKey = (await requestApiKeySheet()).trim();
    if(!apiKey) throw new Error('Nincs megadva API kulcs, az AI-hívás nem indítható el.');
    localStorage.setItem('motivai:apikey', apiKey);
  }
  const resp = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify(payload)
  });
  let data;
  try{ data=await resp.json(); }
  catch(parseErr){ throw new Error('Válasz-feldolgozási hiba (HTTP '+resp.status+')'); }

  if(!resp.ok){
    if(resp.status===401){
      localStorage.removeItem('motivai:apikey');
      throw new Error('Érvénytelen vagy lejárt API kulcs (401). Próbáld újra, és add meg a kulcsot ismét.');
    }
    const err=data&&data.error?data.error:{};
    if(err.type==='exceeded_limit' || err.status==='exceeded_limit' || /limit/i.test(err.message||'')){
      throw new Error('Az AI használati kerete jelenleg elérte a limitet. A pénzügyi adatbevitel továbbra is működik helyben, az általános AI-kérdéseket a keret visszaállása után lehet újra elküldeni.');
    }
    throw new Error(err.message||('HTTP '+resp.status));
  }
  return data;
}

/* validateGeneratedSkillTree: az AI által visszaadott skillfa-JSON ellenőrzése,
   mielőtt bekerül a state-be. Duplikált id vagy ismeretlen/ciklikus parent
   hivatkozás a layoutTree() rekurzív assign(id,depth) függvényét végtelen
   rekurzióba (böngésző-fagyás / stack overflow) vihetné. */
function validateGeneratedSkillTree(gen){
  const ids = new Set();
  gen.forEach(n=>{
    if(!n || typeof n.id!=='string' || !n.id) throw new Error('invalid-node');
    // A promptban kért "csak a-z0-9" szabályt itt kényszerítjük ki (a modell
    // ettől eltérhetne) - a végleges node-id ebből épül fel (ld. idMap lent), és
    // egy onclick="onSkillTap('${n.id}')"-be kerül escapelés nélkül, tehát egy
    // idézőjelet/szögletes zárójelet tartalmazó id XSS-t nyitna.
    if(!/^[a-z0-9]+$/i.test(n.id)) throw new Error('invalid-id-charset: '+n.id);
    if(ids.has(n.id)) throw new Error('duplicate-id: '+n.id);
    ids.add(n.id);
  });
  const byId={}; gen.forEach(n=>{ byId[n.id]=n; });
  gen.forEach(n=>{
    if(n.parent!=null && !ids.has(n.parent)) throw new Error('unknown-parent: '+n.parent);
  });
  const maxSteps = gen.length + 1;
  gen.forEach(n=>{
    let cur=n, steps=0;
    while(cur && cur.parent!=null){
      steps++;
      if(steps>maxSteps) throw new Error('cyclic-parent chain at '+n.id);
      cur = byId[cur.parent];
    }
  });
}

async function generateCustomSport(){
  const name=document.getElementById('sp-name').value.trim();
  if(!name){ toast('Adj meg egy nevet'); return; }
  const icon=document.querySelector('#sp-icon .chip.active').dataset.v;
  const slug='c'+uid();
  openSheet(`<div class="sheet-head"><div class="sheet-title">${icon} ${escapeHtml(name)}</div></div><div class="small muted" style="text-align:center;padding:26px 0;">MotivAI generálja a skillfát…</div>`);
  try{
    const prompt = 'Készíts elágazó skill-fát (haladási rendszert) ehhez a sporthoz/tevékenységhez: "'+name+'". Kizárólag egy JSON tömböt adj vissza, más szöveg vagy magyarázat nélkül, pontosan ilyen formában: [{"id":"n1","name":"...","icon":"emoji","parent":null},{"id":"n2","name":"...","icon":"emoji","parent":"n1"}]. Szabályok: 14-20 elem, PONTOSAN egy gyökér elem (parent:null, ez legyen a sportág neve/kezdőpontja), utána 2-4 párhuzamos ág, mindegyik alaptól haladóig/elitig haladva. Minden id egyedi, rövid, csak a-z0-9 karakterek. A name magyarul, tömören (max 4 szó). Az icon egyetlen, a lépéshez illő emoji legyen.';
    const data = await callMotivAI({model:'claude-sonnet-4-6',max_tokens:1500,messages:[{role:'user',content:prompt}]});
    const raw=(data.content||[]).map(b=>b.text||'').join('');
    const m=raw.match(/\[[\s\S]*\]/);
    if(!m) throw new Error('no-json');
    const gen=JSON.parse(m[0]);
    if(!Array.isArray(gen)||!gen.length) throw new Error('empty');
    validateGeneratedSkillTree(gen);
    const idMap={}; gen.forEach(n=>{ idMap[n.id]=slug+'_'+n.id; });
    const newNodes=gen.map(n=>({id:idMap[n.id],sport:slug,name:n.name||'?',icon:sanitizeIcon(n.icon)||'⭐',parent:n.parent?(idMap[n.parent]||null):null,muscles:[]}));
    App.state.customSports.push({id:slug,name,icon});
    App.state.customSkillNodes=(App.state.customSkillNodes||[]).concat(newNodes);
    App.ui.skillSport=slug;
    saveState(); closeSheet(); toast('Skillfa elkészült 🎉'); renderApp();
  }catch(e){
    console.error('sport generation failed',e);
    closeSheet(); toast('Nem sikerült generálni, próbáld újra');
  }
}

function drawFreqChart(canvas){
  if(!canvas) return;
  const ctx = setupCanvas(canvas);
  const w=canvas._cssW,h=canvas._cssH;
  const weeks=[...Array(8)].map((_,i)=>7-i).reverse();
  const counts = weeks.map(wAgo=>{
    const from = Date.now()-wAgo*7*86400000, to = from+7*86400000;
    return App.state.workouts.filter(w=>{const t=new Date(w.date).getTime();return t>=from&&t<to;}).length;
  });
  const max = Math.max(1,...counts);
  const bw = w/counts.length;
  ctx.clearRect(0,0,w,h);
  counts.forEach((v,i)=>{
    const bh = (v/max)*(h-18);
    ctx.fillStyle = i===counts.length-1? '#D9A441':'#3E5A4E';
    ctx.beginPath();
    roundRectPath(ctx, i*bw+bw*0.22, h-bh-16, bw*0.56, bh, 4);
    ctx.fill();
    ctx.fillStyle='#93A79A'; ctx.font='10px IBM Plex Mono'; ctx.textAlign='center';
    ctx.fillText(v, i*bw+bw*0.5, h-bh-20<10?12:h-bh-20);
  });
}
function drawWeightChart(canvas){
  if(!canvas) return;
  const ctx = setupCanvas(canvas);
  const w=canvas._cssW,h=canvas._cssH;
  ctx.clearRect(0,0,w,h);
  const log = App.state.weightLog.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-14);
  if(log.length<2){ ctx.fillStyle='#6C8177'; ctx.font='12px Inter'; ctx.textAlign='center'; ctx.fillText('Legalább 2 mérés kell a trendhez', w/2, h/2); return; }
  const vals = log.map(l=>l.kg);
  const min=Math.min(...vals)-0.5, max=Math.max(...vals)+0.5;
  const stepX = w/(vals.length-1);
  ctx.beginPath();
  vals.forEach((v,i)=>{
    const x=i*stepX, y=h-16-((v-min)/(max-min))*(h-30);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle='#5C8F62'; ctx.lineWidth=2; ctx.stroke();
  vals.forEach((v,i)=>{
    const x=i*stepX, y=h-16-((v-min)/(max-min))*(h-30);
    ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fillStyle='#D9A441'; ctx.fill();
  });
  ctx.fillStyle='#93A79A'; ctx.font='10px IBM Plex Mono'; ctx.textAlign='left';
  ctx.fillText(vals[0]+' kg', 0, h-2);
  ctx.textAlign='right';
  ctx.fillText(vals[vals.length-1]+' kg', w, h-2);
}
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function setupCanvas(canvas){
  const cssW = canvas.parentElement.clientWidth;
  const cssH = parseInt(canvas.getAttribute('height'))||130;
  const dpr = window.devicePixelRatio||1;
  canvas.width = cssW*dpr; canvas.height = cssH*dpr;
  canvas.style.width=cssW+'px'; canvas.style.height=cssH+'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas._cssW=cssW; canvas._cssH=cssH;
  return ctx;
}

      <div class="small g" style="margin-top:14px;line-height:1.5;text-align:left;">${(typeof window.AndroidTracking!=='undefined' && window.AndroidTracking) ? 'Natív alkalmazás — lezárt kijelzőnél vagy háttérbe küldve is folytatódik a rögzítés (értesítés jelzi, amíg fut).' : 'Amíg ez az ablak nyitva van és világít a kijelző, böngészőből követi az utat. Lezárt kijelzőnél / háttérbe küldve a követés megszakadhat — ezt a natív Android verzió oldja meg teljesen.'}</div>

function testGpsDiag(){
  if(!navigator.geolocation){ App.ui.trackError='A böngésző/környezet nem támogatja a helymeghatározást (navigator.geolocation nem elérhető).'; renderTrackView(); return; }

  navigator.geolocation.getCurrentPosition(

    err=>{ App.ui.trackError=`Hiba (kód ${err.code}): ${err.message||'ismeretlen'}. 1=engedély megtagadva, 2=pozíció nem elérhető, 3=időtúllépés.`; renderTrackView(); },
    {enableHighAccuracy:true,timeout:10000}
  );

let _trackTimer=null;
let _wakeLock=null;
let _trackDraftLastSave=0;
const TRACK_DRAFT_POINT_INTERVAL = 10; // draft-mentés minden N. GPS-ponthoz
const TRACK_DRAFT_MS_INTERVAL = 60000; // ...VAGY legfeljebb ennyi másodpercenként, amelyik előbb jön
/* Időszakos draft-mentés App.state-be (és onnan localStorage-ba, saveState()
   révén), hogy egy oldal-újratöltés / összeomlás ne vigye el a teljes,
   még el nem mentett túrát. Csak az aktuális felvétel pillanatképét tárolja;
   sikeres végleges mentéskor / elvetéskor törlődik (ld. saveJourney,
   discardTrack, stopTracking). */
function saveTrackDraft(){
  if(!App.ui.trackPoints || App.ui.trackPoints.length<2) return;
  App.state.trackDraft = { points: App.ui.trackPoints, start: App.ui.trackStart, savedAt: Date.now() };
  saveState();
}
/* A natív TrackingForegroundService (ld. Kotlin oldal, TrackingBridge.kt) a
   WebView-tól/JS-től teljesen függetlenül, zárolt kijelzőnél/háttérbe küldött
   appnál is gyűjti a GPS-pontokat, natívan eltárolva őket. Ez a függvény kérdezi
   le és üríti ki ezt a natív tárolót, és ugyanúgy fűzi az App.ui.trackPoints
   tömbhöz, mint az élő, watchPosition-ből érkező pontokat (ld. lent) - a
   projektnek jelenleg nincs külön GPS-zajszűrő rétege (shouldAcceptTrackPoint),
   ezért a natív pontok is ugyanazt a szűretlen kezelést kapják. Böngészőben/
   telepített webes verzióban window.AndroidTracking nincs jelen, ott ez no-op. */
function pullNativeTrackPoints(){
  if(typeof window.AndroidTracking==='undefined' || !window.AndroidTracking) return;
  try{
    const json = window.AndroidTracking.takePendingPointsJson();
    if(!json) return;
    const points = JSON.parse(json);
    if(!Array.isArray(points) || !points.length) return;
    for(const p of points){
      if(p && typeof p.lat==='number' && typeof p.lng==='number' && typeof p.t==='number'){
        App.ui.trackPoints.push({lat:p.lat,lng:p.lng,t:p.t});
      }
    }
    if(App.ui.trackPoints.length % TRACK_DRAFT_POINT_INTERVAL === 0){ saveTrackDraft(); _trackDraftLastSave=Date.now(); }
    renderTrackView();
  }catch(e){ console.warn('pullNativeTrackPoints hiba', e); }
}
function startTracking(resumeDraft){
  if(!navigator.geolocation){ App.ui.trackError='A böngésző/környezet nem támogatja a helymeghatározást.'; renderTrackView(); return; }
  if(resumeDraft && App.state.trackDraft && App.state.trackDraft.points && App.state.trackDraft.points.length>=2){
    App.ui.trackPoints = App.state.trackDraft.points.slice();
    App.ui.trackStart = App.state.trackDraft.start || Date.now();
  } else {
    App.ui.trackPoints=[]; App.ui.trackStart=Date.now();
    App.state.trackDraft=null; saveState();
  }
  App.ui.tracking=true; App.ui.trackError=null;
  App.ui.watchId = navigator.geolocation.watchPosition(
    pos=>{
      App.ui.trackError=null;
      App.ui.trackPoints.push({lat:pos.coords.latitude,lng:pos.coords.longitude,t:Date.now()});
      if(App.ui.trackPoints.length % TRACK_DRAFT_POINT_INTERVAL === 0){ saveTrackDraft(); _trackDraftLastSave=Date.now(); }
    },
    err=>{ App.ui.trackError=`GPS hiba (kód ${err.code}): ${err.message||'nem elérhető'}. 1=engedély megtagadva, 2=pozíció nem elérhető, 3=időtúllépés.`; renderTrackView(); },
    {enableHighAccuracy:true,maximumAge:2000,timeout:15000}
  );
  clearInterval(_trackTimer);
  _trackDraftLastSave=Date.now();
  // A natív túrakövető foreground service indítása (ld. TrackingBridge/
  // TrackingForegroundService, Kotlin oldal) - böngészőben/webes verzióban
  // window.AndroidTracking nincs jelen, ott ez no-op. Natív appban, ha a
  // helymeghatározás engedélye még nincs megadva, a natív oldal csendben
  // kihagyja az indítást (nem omlik össze) - a lenti időzítő minden
  // másodpercben újrapróbálja, tehát amint a felhasználó megadja az
  // engedélyt (a fenti watchPosition kéri ki), a következő ütésre elindul.
  if(typeof window.AndroidTracking!=='undefined' && window.AndroidTracking){
    try{ window.AndroidTracking.start(); }catch(e){}
  }
  _trackTimer=setInterval(()=>{
    if(App.ui.terkepView==='track') renderTrackView();
    if(App.ui.tracking && Date.now()-_trackDraftLastSave>=TRACK_DRAFT_MS_INTERVAL){ saveTrackDraft(); _trackDraftLastSave=Date.now(); }
    if(App.ui.tracking && typeof window.AndroidTracking!=='undefined' && window.AndroidTracking){
      try{ window.AndroidTracking.start(); }catch(e){} // idempotens újrapróbálkozás, ld. fent
      pullNativeTrackPoints();
    }
  },1000);
  if('wakeLock' in navigator){
    navigator.wakeLock.request('screen').then(wl=>{ _wakeLock=wl; }).catch(err=>{ /* nem támogatott / megtagadva – csendben figyelmen kívül hagyjuk, ez csak kijelző-ébrentartás előtérben */ });
  }
  renderTrackView();
}
function stopTracking(){
  if(App.ui.watchId!=null) navigator.geolocation.clearWatch(App.ui.watchId);
  clearInterval(_trackTimer);
  pullNativeTrackPoints(); // utolsó, még fel nem dolgozott natív pontok bevétele lezárás előtt
  if(typeof window.AndroidTracking!=='undefined' && window.AndroidTracking){
    try{ window.AndroidTracking.stop(); }catch(e){}
  }
  App.ui.tracking=false;
  if(_wakeLock){ _wakeLock.release().catch(()=>{}); _wakeLock=null; }
  if(App.ui.trackPoints.length>=2){ saveTrackDraft(); openSaveJourneySheet(); }
  else { App.ui.trackPoints=[]; App.ui.trackStart=null; App.state.trackDraft=null; saveState(); renderTrackView(); toast('Túl kevés GPS-pont a mentéshez, próbáld tovább követni a túrát.'); }
}
document.addEventListener('visibilitychange', ()=>{
  if(App.ui.tracking && document.visibilityState==='visible' && 'wakeLock' in navigator && !_wakeLock){
    navigator.wakeLock.request('screen').then(wl=>{ _wakeLock=wl; }).catch(()=>{});
  }
});
function openSaveJourneySheet(){
  const dist=trackDistanceKm(), elapsed=Date.now()-App.ui.trackStart;
  openSheet(`
    <div class="sheet-head"><div class="sheet-title">Túra mentése</div><button class="iconbtn" onclick="discardTrack()">✕</button></div>
    <div class="small muted" style="margin-bottom:12px;">${dist.toFixed(2)} km · ${fmtElapsed(elapsed)}</div>
    <div class="field"><label>Elnevezés</label><input type="text" id="nj-name" value="Túra – ${fmtDateHu(todayISO())}"></div>
    <button class="btn btn-primary btn-block" onclick="saveJourney()">Mentés</button>
  `);

function discardTrack(){ App.ui.trackPoints=[]; App.ui.trackStart=null; App.state.trackDraft=null; saveState(); closeSheet(); renderTrackView(); }
// decimatePoints: egyszerű, fix-lépésközű ritkítás - egy hosszú túra GPS-pontjainak
// száma korlátlanul nőhetne (minden mentett pont örökre localStorage-ban marad), ez
// egyetlen hosszú túránál is könnyen több ezer pontot jelenthet. A cél csak a
// TÁROLT adat méretének korlátozása, nem valódi útvonal-egyszerűsítés (pl.
// Douglas-Peucker) - az első és utolsó pont mindig megmarad, a kettő közöttiek
// egyenletes lépésközzel ritkulnak, ha a pontszám a limit fölött van.
function decimatePoints(points, maxPoints){
  if(!Array.isArray(points) || points.length<=maxPoints) return points;
  const step = points.length / maxPoints;
  const out = [];
  for(let i=0;i<maxPoints;i++) out.push(points[Math.floor(i*step)]);
  out.push(points[points.length-1]);
  return out;
}
function saveJourney(){
  const name=document.getElementById('nj-name').value.trim()||'Túra';
  const dist=trackDistanceKm(), durationMin=(Date.now()-App.ui.trackStart)/60000;
  App.state.journeys.push({id:uid(),name,date:todayISO(),distanceKm:dist,durationMin,points:decimatePoints(App.ui.trackPoints, 1500)});
  App.state.trackDraft=null;
  saveState(); App.ui.trackPoints=[]; App.ui.trackStart=null;
  closeSheet(); toast('Túra elmentve 🥾'); renderApp();
}
/* ===== Draft-visszaállítás induláskor =====
   Ha App.state.trackDraft egy korábbi, nem lezárt felvételt tartalmaz
   (pl. összeomlás/frissítés szakította meg), induláskor felajánljuk a

function promptResumeTrackDraft(){

function fmtElapsed(ms){ const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60; return h>0? h+':'+pad(m)+':'+pad(sec) : pad(m)+':'+pad(sec); }
function trackDistanceKm(){ let d=0; const p=App.ui.trackPoints; for(let i=1;i<p.length;i++) d+=haversine(p[i-1],p[i]); return d/1000; }

function deleteJourney(id){
  const idx=App.state.journeys.findIndex(j=>j.id===id);
  if(idx===-1) return;
  const removed=App.state.journeys[idx];
  App.state.journeys.splice(idx,1);
  saveState();
  RENDERERS.terkep();
  toastUndo('Túra törölve', ()=>{
    App.state.journeys.splice(Math.min(idx,App.state.journeys.length),0,removed);
    saveState();
    RENDERERS.terkep();
  });
}
function fmtDuration(min){ if(!min) return '?'; const h=Math.floor(min/60),m=Math.round(min%60); return h? h+'ó '+m+'p' : m+'p'; }

/* Per-túra részletes statisztika sheet - a TÚRÁK lista 📊 gombja nyitja. Csak
   ténylegesen meglévő/származtatható adatot mutat (nincs kitalált magasság
   stb.): a mentéskor eltárolt distanceKm/durationMin a forrás, ebből
   számolt átlagsebesség/tempó, a points tömb hossza, a GPS-pontok t
   (Date.now()) mezőjéből (ha van - a kézi útvonal-javító beszúrt pontjainak
   nincs) a kezdés/befejezés időpontja, és a kezdő-végpont légvonalbeli
   távolsága (haversine() - ld. fent) a tényleges (bejárt) távhoz képest. */
function openJourneyStatsSheet(id){
  const j = App.state.journeys.find(x=>x.id===id);
  if(!j) return;
  const distanceKm = j.distanceKm||0;
  const durationMin = j.durationMin||0;
  const avgSpeedKmh = durationMin>0 ? (distanceKm/(durationMin/60)) : 0;
  const paceMinPerKm = distanceKm>0 ? (durationMin/distanceKm) : 0;
  const paceStr = paceMinPerKm>0 ? Math.floor(paceMinPerKm)+':'+pad(Math.round((paceMinPerKm%1)*60))+' / km' : null;
  const pts = Array.isArray(j.points) ? j.points : [];
  const withTime = pts.filter(p=>typeof p.t==='number');
  const startTime = withTime.length ? fmtTime(new Date(withTime[0].t)) : null;
  const endTime = withTime.length>1 ? fmtTime(new Date(withTime[withTime.length-1].t)) : null;
  const straightLineKm = pts.length>1 ? haversine(pts[0], pts[pts.length-1])/1000 : null;
  const line = (label,val)=>`<div class="flex between" style="padding:7px 0;"><span class="small muted">${escapeHtml(label)}</span><span class="mono small" style="font-weight:700;">${escapeHtml(String(val))}</span></div>`;
  openSheet(`
    <div class="sheet-head"><div class="sheet-title">📊 ${escapeHtml(j.name)}</div><button class="iconbtn" onclick="closeSheet()">✕</button></div>
    <div class="card" style="padding:4px 16px;">
      ${line('Dátum', fmtDateHu(j.date))}
      ${line('Táv', distanceKm.toFixed(2)+' km')}
      ${line('Időtartam', fmtDuration(durationMin))}
      ${avgSpeedKmh>0 ? line('Átlagsebesség', avgSpeedKmh.toFixed(1)+' km/ó') : ''}
      ${paceStr ? line('Átlagos tempó', paceStr) : ''}
      ${line('GPS pontok száma', pts.length+' db')}
      ${startTime ? line('Kezdés', startTime) : ''}
      ${endTime ? line('Befejezés', endTime) : ''}
      ${straightLineKm!=null ? line('Légvonalban (kezdő–végpont)', straightLineKm.toFixed(2)+' km') : ''}
    </div>
  `);
}
