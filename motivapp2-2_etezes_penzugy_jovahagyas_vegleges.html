/* ---- Natív értesítés-híd (window.AndroidNotify, ld. NotifyBridge.kt) ----
   Ugyanaz a feature-detect minta, mint androidHealthAvailable(). Böngészőben
   / TWA-ban window.AndroidNotify mindig undefined marad, ez a normális eset. */
function androidNotifyAvailable(){
  return typeof window!=='undefined' && typeof window.AndroidNotify!=='undefined' && !!window.AndroidNotify;
}

/* ---- Natív térkép-híd (window.AndroidMaps, ld. MapsBridge.kt) ----
   Ugyanaz a feature-detect minta, mint androidHealthAvailable()/androidNotifyAvailable().
   Böngészőben / TWA-ban window.AndroidMaps mindig undefined marad — ilyenkor a Túrák
   listában a natív-térkép gomb egyszerűen nem jelenik meg (nem letiltott állapotban
   mutatjuk, hanem el sem rendereljük), és a meglévő SVG-alapú renderRouteSvg() marad az
   egyetlen (mindig, hálózat nélkül is működő) útvonalnézet. */
function androidMapsAvailable(){
  return typeof window!=='undefined' && typeof window.AndroidMaps!=='undefined' && !!window.AndroidMaps;
}
function openJourneysNativeMap(journeys){
  const withPts = (journeys||[]).filter(j=>j.points && j.points.length>1);
  if(!withPts.length) return;
  const payload = withPts.map(j=>({name:j.name, points:j.points}));
  try{ window.AndroidMaps.openJourneysMap(JSON.stringify(payload)); }
  catch(e){ toast('Nem sikerült megnyitni a natív térképet.'); }
}
function openJourneyNativeMap(id){
  const j = App.state.journeys.find(x=>x.id===id);
  if(!j) return;
  openJourneysNativeMap([j]);
}

/* ---- Beágyazott natív térkép (ÚTVONALAK al-fül, window.AndroidMaps.showEmbeddedMap/
   updateEmbeddedMapRect/hideEmbeddedMap/isMapEmbedLocked/requestEmbeddedMapUnlock, ld.
   MapsBridge.kt) ----
   A natív oldalon egy valódi Google MapView-t rétegez a WebView FÖLÉ (natív FrameLayout-
   testvérként), pontosan a lenti #route-map-slot kártya képernyő-téglalapjára pozicionálva
   - ld. MainWebViewActivity.kt osztály-doksija a teljes mechanizmusért. Ez a natív térkép
   SOSE váltja le a #route-map-slot-ban lévő, mindig elérhető SVG útvonalnézetet a DOM-ban -
   tisztán vizuális overlay fölötte -, tehát ha nincs natív híd (böngésző/TWA), ha a havi
   keret lezárt, vagy ha bármi hiba történik beágyazás közben, a felhasználó pontosan
   ugyanazt az SVG nézetet látja, mint eddig, teljesen érintetlenül. */
let _embeddedMapSyncFn = null;
/** renderMapView hívja meg, amikor androidMapsAvailable() && hasRoutes && nincs lezárva a
 *  keret - elindítja a beágyazást ÉS a folyamatos pozíció-szinkronizálást. */
function showNativeMapEmbed(toShow){
  if(!androidMapsAvailable()) return;
  const payload = (toShow||[]).filter(j=>j.points && j.points.length>1).map(j=>({name:j.name, points:j.points}));
  if(!payload.length) return;
  try{ window.AndroidMaps.showEmbeddedMap(JSON.stringify(payload)); }
  catch(e){ return; } // hiba esetén az alatta lévő SVG nézet változatlanul látszik - ld. fenti doksi
  syncEmbeddedMapRect();
  if(_embeddedMapSyncFn){
    window.removeEventListener('resize', _embeddedMapSyncFn);
    const oldRoot = document.getElementById('view-root');
    if(oldRoot) oldRoot.removeEventListener('scroll', _embeddedMapSyncFn);
  }
  _embeddedMapSyncFn = syncEmbeddedMapRect;
  window.addEventListener('resize', _embeddedMapSyncFn);
  const root = document.getElementById('view-root');
  if(root) root.addEventListener('scroll', _embeddedMapSyncFn, {passive:true});
}
/** A #route-map-slot kártya AKTUÁLIS képernyő-téglalapját (CSS px -> eszköz px, ld.
 *  devicePixelRatio szorzás ITT, a JS oldalon - a natív oldal emiatt már kész eszköz-
 *  pixellel dolgozik, semmilyen egységátváltást nem kell végeznie) küldi át a natív
 *  overlay-nek. Némán kilép, ha a slot elem épp nem létezik (pl. a felhasználó időközben
 *  másik nézetre navigált - ilyenkor hideNativeMapEmbed már úgyis elrejtette az overlay-t). */
function syncEmbeddedMapRect(){
  if(!androidMapsAvailable()) return;
  const slot = document.getElementById('route-map-slot');
  if(!slot) return;
  const r = slot.getBoundingClientRect();
  const dpr = window.devicePixelRatio||1;
  try{
    window.AndroidMaps.updateEmbeddedMapRect(
      Math.round(r.left*dpr), Math.round(r.top*dpr), Math.round(r.width*dpr), Math.round(r.height*dpr)
    );
  }catch(e){}
}
/** Minden olyan navigációs függvénynek (setTab/openSub/closeSub/setTerkepView) MEG KELL
 *  hívnia ezt a legelső lépésként, mielőtt bármilyen App.ui állapotot módosítana - egy már
 *  elrejtett overlay-en meghívva ártalmatlan no-op, tehát a "biztos, ami biztos, minden
 *  navigációs úton hívjuk" a legkevésbé hibalehetőséges megközelítés (ld. index.html
 *  feladat-doksija) - sose maradjon egy natív térkép-overlay a képernyőn ragadva rossz
 *  tartalom fölött, ha egy navigációs útvonal lemaradna. */
function hideNativeMapEmbed(){
  if(_embeddedMapSyncFn){
    window.removeEventListener('resize', _embeddedMapSyncFn);
    const root = document.getElementById('view-root');
    if(root) root.removeEventListener('scroll', _embeddedMapSyncFn);
    _embeddedMapSyncFn = null;
  }
  if(androidMapsAvailable()){
    try{ window.AndroidMaps.hideEmbeddedMap(); }catch(e){}
  }
}
function requestEmbeddedMapUnlock(){
  if(!androidMapsAvailable()) return;
  try{ window.AndroidMaps.requestEmbeddedMapUnlock(); }catch(e){}
}
/* Natív -> JS visszahívás (ld. window.onAndroidHealthResult / window.onBankNotification
   ugyanezen mintája) - a natív oldal a feloldás-megerősítő párbeszédablak IGEN gombja után
   hívja meg. Csak akkor csinál bármit, ha a felhasználó továbbra is pontosan ezen a nézeten
   van (Térkép tab, ÚTVONALAK al-fül) - egyébként a beágyazás újrapróbálása értelmetlen (és
   akár egy már máshova navigált nézet fölé rajzolna vissza egy overlay-t). */
window.onEmbeddedMapUnlocked = function(){
  if(!(App.ui.tab==='terkep' && App.ui.terkepView==='map')) return;
  const journeys = App.state.journeys;
  const toShow = App.ui.selectedJourney ? journeys.filter(j=>j.id===App.ui.selectedJourney) : journeys;
  const hasRoutes = toShow.some(j=>j.points && j.points.length>1);
  if(androidMapsAvailable() && hasRoutes && !window.AndroidMaps.isMapEmbedLocked()){
    renderTerkepContent(); // újrarendereli a nézetet, hogy a lezárt-üzenet is eltűnjön, majd beágyaz
  }
};

/* ---- Segédfüggvények ---- */
function rpgClamp(n,min,max){ return Math.max(min, Math.min(max,n)); }

function rpgLevelFromXp(xp, baseReq, growth){
  let level=1, req=baseReq, remaining=xp;
  while(remaining>=req){
    remaining-=req;
    level++;
    req = Math.round(baseReq + (level-1)*growth);
  }
  return {level, into:remaining, need:req, pct: Math.min(100, Math.round(remaining/req*100))};
}
function rpgTrackLevel(xp){ return rpgLevelFromXp(xp, 100, 30); }
function rpgOverallLevel(xp){ return rpgLevelFromXp(xp, 500, 120); }

function rpgTrackTotalXp(trackId){
  let sum=0;
  App.state.rpg.weeks.forEach(w=>{
    w.quests.forEach(q=>{ if(q.trackId===trackId && q.done) sum += q.xp; });
  });
  return sum;
}
function rpgOverallTotalXp(){
  return RPG_TRACKS.reduce((s,t)=> s + rpgTrackTotalXp(t.id), 0);
}
function rpgWeekScore(weekNum){
  return App.state.rpg.weeks[weekNum-1].quests.reduce((s,q)=> s + (q.done? q.xp : 0), 0);
}
function rpgGetCurrentWeekIndex(){
  const start = new Date(App.state.rpg.meta.startDate + 'T00:00:00');
  const now = new Date();
  const diffDays = Math.floor((now - start) / 86400000);
  return rpgClamp(Math.floor(diffDays/rpgCycleDays())+1, 1, rpgWeeksTotal());
}
function rpgWeekDateRange(weekNum){
  const start = new Date(App.state.rpg.meta.startDate + 'T00:00:00');
  const from = new Date(start.getTime() + (weekNum-1)*rpgCycleDays()*86400000);
  const to = new Date(from.getTime() + (rpgCycleDays()-1)*86400000);
  const fmt = d => d.toLocaleDateString('hu-HU', {month:'short', day:'numeric'});
  return fmt(from) + ' – ' + fmt(to);
}
function rpgQuarterOf(weekNum){ return Math.min(3, Math.floor((weekNum-1)/rpgWeeksPerQuarter())); }

function rpgCurrentStreak(){
  const cur = rpgGetCurrentWeekIndex();
  let streak=0;
  for(let w=cur; w>=1; w--){
    if(rpgWeekScore(w) > 0){ streak++; continue; }
    if(w===cur) continue; // a folyamatban lévő ciklus még nem teljesített pontja nem szakítja meg a korábbi sorozatot
    break;
  }
  return streak;
}
function rpgNeglectedWeeksCount(trackId){
  const cur = rpgGetCurrentWeekIndex();
  let n=0;
  for(let w=cur; w>=1; w--){
    if(App.state.rpg.weeks[w-1].quests.some(q=>q.trackId===trackId && q.done)) break;
    n++;
    if(n>=8) break;
  }
  return n;
}

/* ---- Szabályalapú "AI" coach ---- */
function rpgGenerateAgentReport(track){
  const cur = rpgGetCurrentWeekIndex();
  const xp = rpgTrackTotalXp(track.id);
  const lvl = rpgTrackLevel(xp);
  const neglected = rpgNeglectedWeeksCount(track.id);
  const doneThisWeek = App.state.rpg.weeks[cur-1].quests.some(q=>q.trackId===track.id && q.done);

  let status, icon, text;
  if(neglected>=2){
    status='warning'; icon='⚠️';
    text = neglected+' ciklus óta nincs itt aktivitás. Javaslom egy könnyű küldetéssel újraindítani.';
  } else if(lvl.into>0 && lvl.need-lvl.into<=15){
    status='success'; icon='✨';
    text = 'Már csak '+(lvl.need-lvl.into)+' XP a következő szintig — egy küldetés és meglesz!';
  } else if(doneThisWeek){
    status='success'; icon='✅';
    text = 'Ebben a ciklusban már dolgoztunk ezen — szép munka, '+lvl.level+'. szinten állunk.';
  } else {
    status='info'; icon='📋';
    text = lvl.level+'. szinten állunk, '+xp+' összes XP-vel. Van kapacitás egy új küldetésre.';
  }

  const existingTexts = new Set(App.state.rpg.weeks[cur-1].quests.filter(q=>q.trackId===track.id).map(q=>q.text));
  const pool = RPG_TEMPLATES[track.id];
  const suggestion = pool.find(tp=>!existingTexts.has(tp.text)) || pool[Math.floor(Math.random()*pool.length)];

  return {status, icon, text, suggestion, level:lvl.level, neglected};
}
function rpgGeneratePMMessage(reports){
  const warnings = reports.filter(x=>x.r.status==='warning').sort((a,b)=>b.r.neglected-a.r.neglected);
  const cur = rpgGetCurrentWeekIndex();
  const overall = rpgOverallLevel(rpgOverallTotalXp());
  const streak = rpgCurrentStreak();

  const lines = [];
  if(warnings.length){
    const names = warnings.slice(0,3).map(x=>x.t.name).join(', ');
    lines.push({icon:'📋', text:'Ciklus prioritása a csapatnak: '+names+'. Ide irányítsuk elsőként a figyelmet ebben a ciklusban.'});
  } else {
    lines.push({icon:'✅', text:'A csapat minden területen aktív, nincs elhanyagolt front — tartsuk is így!'});
  }
  lines.push({icon:'📊', text:'Karakter szint: '+overall.level+' · '+rpgOverallTotalXp()+' összes XP · '+streak+' ciklusos sorozat · '+cur+'. ciklus / '+rpgWeeksTotal()+'.'});
  lines.push({icon:'📜', text: RPG_QUOTES[Math.floor(Math.random()*RPG_QUOTES.length)]});
  return lines;
}
function rpgPrioritizeReports(reports){
  return [...reports].sort((a,b)=>{
    if(a.r.status==='warning' && b.r.status!=='warning') return -1;
    if(b.r.status==='warning' && a.r.status!=='warning') return 1;
    return a.r.level - b.r.level;
  });
}
function rpgApplyWeeklyPack(){
  const cur = rpgGetCurrentWeekIndex();
  const agentReports = RPG_TRACKS.map(t=>({t, r: rpgGenerateAgentReport(t)}));
  const picks = rpgPrioritizeReports(agentReports).slice(0,3);
  let added = 0;
  picks.forEach(({t,r})=>{
    const dup = App.state.rpg.weeks[cur-1].quests.some(q=>q.trackId===t.id && q.text===r.suggestion.text);
    if(!dup){
      App.state.rpg.weeks[cur-1].quests.push({id:uid(), trackId:t.id, text:r.suggestion.text, xp:r.suggestion.xp, done:false, doneAt:null});
      added++;
    }
  });
  if(added>0) saveState();
  RENDERERS.kampany();
  toast(added>0 ? added+' küldetés hozzáadva a ciklus-csomagból.' : 'Ezek a küldetések már mind fel voltak véve ebben a ciklusban.');
}

/* ---- Kedvencek ---- */
function rpgIsFavorite(trackId, text, xp){
  return App.state.rpg.favorites.some(f=>f.trackId===trackId && f.text===text && f.xp===xp);
}
function rpgToggleFavorite(trackId, text, xp){
  if(rpgIsFavorite(trackId, text, xp)){
    App.state.rpg.favorites = App.state.rpg.favorites.filter(f=>!(f.trackId===trackId && f.text===text && f.xp===xp));
  } else {
    App.state.rpg.favorites.push({trackId, text, xp});
  }
  saveState(); RENDERERS.kampany();
}

/* ---- Fejlődési szakaszok ---- */
function rpgOverallStage(level){
  let current = RPG_OVERALL_STAGES[0];
  RPG_OVERALL_STAGES.forEach(s=>{ if(level>=s[0]) current=s; });
  return current;
}
function rpgCurrentTierOf(trackId, level){
  const stages = RPG_TIER_STAGES[trackId];
  let current = stages[0];
  stages.forEach(s=>{ if(level>=s[0]) current=s; });
  return current;
}

/* ---- Küldetés-műveletek ---- */
function rpgAddQuest(weekNum, trackId, text, xp){
  weekNum = Number(weekNum);
  App.state.rpg.weeks[weekNum-1].quests.push({id:uid(), trackId, text, xp:Number(xp), done:false, doneAt:null});
  saveState(); RENDERERS.kampany();
}
function rpgToggleQuest(weekNum, questId){
  weekNum = Number(weekNum);
  const week = App.state.rpg.weeks[weekNum-1];
  if(!week) return;
  const q = week.quests.find(qq=>qq.id===questId);
  if(!q) return;
  const track = RPG_TRACK_BY_ID[q.trackId];
  const before = rpgTrackLevel(rpgTrackTotalXp(q.trackId));
  q.done = !q.done;
  q.doneAt = q.done ? new Date().toISOString() : null;
  saveState();
  const after = rpgTrackLevel(rpgTrackTotalXp(q.trackId));
  if(q.done){
    if(after.level > before.level){
      toast('🎉 Szintlépés! ' + track.name + ' — ' + after.level + '. szint!');
    } else {
      toast('+' + q.xp + ' XP — ' + track.name);
    }
    if(androidNotifyAvailable()){
      try{ window.AndroidNotify.reportActivity(rpgCurrentStreak(), todayISO()); }catch(e){}
      if(after.level > before.level){
        try{ window.AndroidNotify.notify(4310, 'Szintlépés!', track.name + ' — ' + after.level + '. szint!'); }catch(e){}
      }
    }
    rpgCheckBossDefeats();
  }
  RENDERERS.kampany();
}
function rpgDeleteQuest(weekNum, questId){
  weekNum = Number(weekNum);
  const week = App.state.rpg.weeks[weekNum-1];
  if(!week) return;
  week.quests = week.quests.filter(q=>q.id!==questId);
  saveState(); RENDERERS.kampany();
}
// Negyedik/quarter "boss fight" — akkor "győzzük le", ha a 9 skill fából
// legalább RPG_BOSS_DEFEAT_THRESHOLD elérte a RPG_QUARTER_TARGET_XP-t abban
// a negyedévben. Csak egyszer natívan-értesít negyedévenként (bossNotified).
function rpgCheckBossDefeats(){
  for(let qi=0; qi<4; qi++){
    const startW = qi===0 ? 1 : rpgQuarterBoundary(qi-1)+1, endW = rpgQuarterBoundary(qi);
    let metCount = 0;
    RPG_TRACKS.forEach(t=>{
      let sum=0;
      for(let w=startW; w<=endW; w++){
        App.state.rpg.weeks[w-1].quests.forEach(qu=>{ if(qu.trackId===t.id && qu.done) sum+=qu.xp; });
      }
      if(sum >= RPG_QUARTER_TARGET_XP) metCount++;
    });
    if(metCount >= RPG_BOSS_DEFEAT_THRESHOLD && !App.state.rpg.bossNotified.includes(qi)){
      App.state.rpg.bossNotified.push(qi);
      saveState();
      if(androidNotifyAvailable()){
        try{ window.AndroidNotify.notify(4311, 'Boss legyőzve!', 'Q' + (qi+1) + ' negyedéves boss fight teljesítve!'); }catch(e){}
      }
    }
  }
}

/* ---- Ciklus-vége AI-összefoglaló (natív push + MotivAI chat) ----
   Amikor egy munkarend-ciklus (egy teljes App.state.schedule.pattern-ismétlés,
   ld. rpgGetCurrentWeekIndex) lezárul, sablon-alapú (NEM élő API-hívás — ugyanaz
   az elv, mint rpgGenerateAgentReport/rpgGeneratePMMessage-nél) rövid összegzést
   készítünk róla, és MIND natív push-értesítésként (window.AndroidNotify, ld.
   androidNotifyAvailable()), MIND MotivAI chat-üzenetként (App.state.aiChat)
   megjelenítjük. Ugyanazt a dedup-mintát követi, mint rpgCheckBossDefeats
   (App.state.rpg.cycleSummaryNotified — már összefoglalózott ciklusindexek
   tömbje, ld. defaultState()). Szándékosan CSAK a legutóbb lezárt ciklust nézi
   (nem megy végig visszamenőleg minden korábbi, még nem összegzett cikluson,
   ahogy rpgCheckBossDefeats teszi a negyedévekkel) — egy hosszú kihagyás utáni
   újranyitás így nem zúdít egyszerre sok elavult push-értesítést a felhasználóra.
   Hívja: init() minden app-indításkor/-visszatéréskor (ld. fájl vége). */
function rpgCheckCycleSummary(){
  if(!App.state.rpg || !App.state.rpg.onboarded) return;
  const cur = rpgGetCurrentWeekIndex();
  const justEnded = cur - 1;
  if(justEnded < 1) return; // még az első ciklusban vagyunk, nincs mit összegezni
  if(!Array.isArray(App.state.rpg.cycleSummaryNotified)) App.state.rpg.cycleSummaryNotified = [];
  if(App.state.rpg.cycleSummaryNotified.includes(justEnded)) return;

  const summary = rpgGenerateCycleSummary(justEnded);
  App.state.rpg.cycleSummaryNotified.push(justEnded);
  App.state.aiChat.push({role:'assistant', content:summary.chatText, suggestions:[]});
  saveState();

  if(androidNotifyAvailable()){
    try{ window.AndroidNotify.notify(4312, summary.title, summary.pushBody); }catch(e){}
  }
}
/* rpgCycleDateBoundsISO: a weekNum-edik ciklus [kezdő, záró] naptári napja ISO-
   stringként — ugyanaz a számítás, mint rpgWeekDateRange()-ben, csak nyers
   toLocalISO() dátumokkal (nem hu-HU formázott felirattal), hogy más adatlisták
   (tasks/spendLedger/healthLog/journal) dátummezőivel közvetlenül összevethető
   legyen. */
function rpgCycleDateBoundsISO(weekNum){
  const start = new Date(App.state.rpg.meta.startDate + 'T00:00:00');
  const from = new Date(start.getTime() + (weekNum-1)*rpgCycleDays()*86400000);
  const to = new Date(from.getTime() + (rpgCycleDays()-1)*86400000);
  return {fromISO: toLocalISO(from), toISO: toLocalISO(to)};
}
/* rpgGenerateCycleSummary: a weekNum-edik (már lezárult) ciklushoz olcsón elérhető
   valós számokból (összes XP a 9 RPG_TRACKS-en, határidős feladatok teljesítve/
   összesen, elköltött összeg, átlagos alvás/lépésszám, átlagos naplóhangulat)
   épít fel egy-két mondatos, sablon-generált magyar szöveget — NINCS élő API-
   hívás, ld. a fájl eleji sablon-elvet (rpgGenerateAgentReport/PMMessage). */
function rpgGenerateCycleSummary(weekNum){
  const {fromISO, toISO} = rpgCycleDateBoundsISO(weekNum);
  const xp = rpgWeekScore(weekNum);

  const cycleTasks = App.state.tasks.filter(t=>t.due && t.due>=fromISO && t.due<=toISO);
  const doneTasks = cycleTasks.filter(t=>t.done).length;

  const spend = (App.state.finance.spendLedger||[])
    .filter(e=>e.date>=fromISO && e.date<=toISO)
    .reduce((s,e)=> s + (Number(e.amount)||0), 0);

  const healthEntries = (App.state.healthLog||[]).filter(h=>h.date>=fromISO && h.date<=toISO);
  const sleepVals = healthEntries.map(h=>h.sleepH).filter(v=>typeof v==='number' && !isNaN(v));
  const avgSleep = sleepVals.length ? sleepVals.reduce((s,v)=>s+v,0)/sleepVals.length : null;
  const stepsVals = healthEntries.map(h=>h.steps).filter(v=>typeof v==='number' && !isNaN(v));
  const avgSteps = stepsVals.length ? Math.round(stepsVals.reduce((s,v)=>s+v,0)/stepsVals.length) : null;

  const moodEntries = (App.state.journal||[]).filter(j=>j.date>=fromISO && j.date<=toISO && typeof j.mood==='number');
  const avgMood = moodEntries.length ? (moodEntries.reduce((s,j)=>s+j.mood,0)/moodEntries.length) : null;

  const rangeLabel = fmtDateHu(fromISO).split(' · ')[1] + ' – ' + fmtDateHu(toISO).split(' · ')[1];

  const lines = [];
  lines.push(xp+' XP a kilenc fejlődési területen');
  lines.push(doneTasks+'/'+cycleTasks.length+' határidős feladat teljesítve');
  if(spend>0) lines.push(spend.toLocaleString('hu-HU')+' Ft elköltve');
  if(avgSleep!=null) lines.push('átlag '+avgSleep.toFixed(1)+' óra alvás');
  if(avgSteps!=null) lines.push('átlag '+avgSteps.toLocaleString('hu-HU')+' lépés/nap');
  if(avgMood!=null) lines.push('átlag '+avgMood.toFixed(1)+'/5 naplóhangulat');

  const chatText = '📊 Lezárult egy ciklus ('+rangeLabel+')! Összefoglaló: '+lines.join(', ')+'.';
  const pushBody = lines.join(', ')+'.';
  return {title:'Ciklus lezárva!', chatText, pushBody};
}

/* ---- Duplikált küldetés megerősítése (openSheet-alapú, a forrás app
   confirmModal()-jának megfelelője — modal helyett sheet, mert #modalRoot
   nem létezik ebben az appban). A szöveget/xp-t egy modul-szintű változóban
   tároljuk el, hogy ne kelljen szabad szöveget onclick-attribútumba
   interpolálni. ---- */
let _rpgPendingQuest = null;
function rpgConfirmDuplicateQuest(weekNum, trackId, text, xp){
  _rpgPendingQuest = {weekNum:Number(weekNum), trackId, text, xp:Number(xp)};
  openSheet(`<div class="sheet-head"><div class="sheet-title">Már felvetted</div><button class="iconbtn" onclick="closeSheet()">✕</button></div>
    <div class="small muted" style="margin-bottom:16px;">Ezt a küldetést már hozzáadtad ebben a ciklusban. Biztosan mégegyszer felveszed (dupla XP-ért)?</div>
    <button class="btn btn-primary btn-block" data-click="rpgConfirmDuplicateQuestYes">Igen, hozzáadom</button>`);
}
function rpgConfirmDuplicateQuestYes(){
  const p = _rpgPendingQuest;
  _rpgPendingQuest = null;
  closeSheet();
  if(!p) return;
  rpgAddQuest(p.weekNum, p.trackId, p.text, p.xp);
}

/* ---- Chip-kattintások (kedvenc/sablon/javaslat) — a scoped rebind minta
   (#view-kampany [data-rpg-json]) a RENDERERS.kampany() végén köti be. ---- */
function rpgHandleChipClick(d){
  if(d.kind === 'suggest'){
    const cur = rpgGetCurrentWeekIndex();
    const dup = App.state.rpg.weeks[cur-1].quests.some(q=>q.trackId===d.trackId && q.text===d.text);
    if(dup){ rpgConfirmDuplicateQuest(cur, d.trackId, d.text, d.xp); return; }
    rpgAddQuest(cur, d.trackId, d.text, d.xp);
    toast('Küldetés hozzáadva a(z) ' + cur + '. ciklushoz — ' + RPG_TRACK_BY_ID[d.trackId].name);
  } else if(d.kind === 'quick'){
    const wk = App.ui.rpgViewingWeek;
    const dup = App.state.rpg.weeks[wk-1].quests.some(q=>q.trackId===d.trackId && q.text===d.text);
    if(dup){ rpgConfirmDuplicateQuest(wk, d.trackId, d.text, d.xp); return; }
    rpgAddQuest(wk, d.trackId, d.text, d.xp);
  } else if(d.kind === 'fav'){
    rpgToggleFavorite(d.trackId, d.text, d.xp);
  }
}

function rpgRenderTierPathRow(trackId, level, color){
  const stages = RPG_TIER_STAGES[trackId];
  return stages.map((s,i)=>{
    const reached = level >= s[0];
    const connector = i>0 ? `<div style="flex:0 0 14px;height:2px;background:${reached?color:'var(--line)'};margin-top:18px;"></div>` : '';
    return connector + `
      <div class="rpg-tier-stage">
        <div style="width:36px;height:36px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:18px;
          background:${reached? color+'30':'var(--surface-3)'};border:2px solid ${reached? color:'var(--line)'};">${s[1]}</div>
        <div class="small" style="color:${reached?'var(--paper)':'var(--muted)'};line-height:1.2;">${s[2]}</div>
        <div class="small muted">Szint ${s[0]}+</div>
      </div>`;
  }).join('');
}
function rpgRenderTrackPathCard(t){
  const xp = rpgTrackTotalXp(t.id);
  const lvl = rpgTrackLevel(xp);
  const stage = rpgCurrentTierOf(t.id, lvl.level);
  return `
    <div class="card rpg-track-card" style="--tc:${t.color}">
      <div class="flex between center" style="margin-bottom:8px;">
        <div class="flex center gap8"><span>${t.icon}</span><b class="small">${escapeHtml(t.name)}</b></div>
        <span class="rpg-lvl-badge">Szint ${lvl.level}</span>
      </div>
      <p class="small muted" style="margin-bottom:8px;">Jelenlegi forma: <b style="color:${t.color}">${stage[1]} ${stage[2]}</b></p>
      <div style="display:flex;align-items:flex-start;overflow-x:auto;padding-bottom:4px;">${rpgRenderTierPathRow(t.id, lvl.level, t.color)}</div>
    </div>`;
}
function rpgRenderMapTab(){
  const cur = rpgGetCurrentWeekIndex();
  const viewingWeek = App.ui.rpgViewingWeek;
  const stage = rpgOverallStage(rpgOverallLevel(rpgOverallTotalXp()).level);
  const cols = 13, rows = 4;
  const marginX = 50, marginY = 55, rowGap = 145, colGap = 58;
  const width = marginX*2 + (cols-1)*colGap;
  const height = marginY*2 + (rows-1)*rowGap;

  const points = [];
  for(let w=1; w<=rpgWeeksTotal(); w++){
    const rowIdx = Math.floor((w-1)/cols);
    const colIdx = (w-1)%cols;
    const xColIdx = (rowIdx%2===0) ? colIdx : (cols-1-colIdx);
    points.push({w, x: marginX + xColIdx*colGap, y: marginY + rowIdx*rowGap});
  }
  const pathD = points.map((p,i)=> (i===0?'M':'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');

  const quarterBossWeeks = [0,1,2,3].map(rpgQuarterBoundary);
  const nodesSvg = points.map(p=>{
    const isBoss = quarterBossWeeks.includes(p.w);
    const score = rpgWeekScore(p.w);
    const isCurrent = p.w===cur;
    const reached = p.w <= cur;
    const fill = reached ? (score>0 || isBoss ? '#D9A441' : 'rgba(217,164,65,0.35)') : 'rgba(237,233,221,0.08)';
    const r = isBoss ? 15 : (isCurrent ? 13 : 8);
    const ring = isCurrent ? `<circle cx="${p.x}" cy="${p.y}" r="${r+7}" fill="none" stroke="#EDE9DD" stroke-width="2.5" opacity="0.8"><animate attributeName="r" values="${r+5};${r+11};${r+5}" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0.15;0.9" dur="1.8s" repeatCount="indefinite"/></circle>` : '';
    const label = isBoss ? '🏰' : (isCurrent ? stage[1] : p.w);
    const bossLabel = isBoss ? `<text x="${p.x}" y="${p.y - r - 8}" text-anchor="middle" font-size="10" fill="#4A85AC">Q${rpgQuarterOf(p.w)+1} Boss</text>` : '';
    return `<g data-click="rpgJumpToWeek" data-id="${p.w}" style="cursor:pointer;">
        ${ring}
        <circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${fill}" stroke="${isBoss?'#4A85AC':'rgba(237,233,221,0.25)'}" stroke-width="${isBoss?2.5:1.5}"/>
        <text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-size="${isBoss?14:(isCurrent?15:9.5)}" fill="${reached?'#12181A':'#93A79A'}">${label}</text>
        ${bossLabel}
      </g>`;
  }).join('');

  return `
    <div class="sectiontitle">Fő pálya — a teljes ${rpgWeeksTotal()} ciklusos utazás</div>
    <p class="small muted" style="margin:-6px 0 12px;">A kampányod egész éves útvonala. Kattints egy állomásra, hogy odaugorj arra a ciklusra. Jelenlegi formád: <b style="color:var(--trail-yellow);">${stage[1]} ${stage[2]}</b></p>
    <div class="card" style="overflow-x:auto;">
      <svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;min-width:600px;display:block;">
        <path d="${pathD}" fill="none" stroke="rgba(237,233,221,0.15)" stroke-width="4"/>
        ${nodesSvg}
      </svg>
    </div>
    <div class="sectiontitle" style="margin-top:22px;">A célok saját útjai</div>
    <p class="small muted" style="margin:-6px 0 12px;">Minden cél a saját tempójában fejlődik — más-más felszerelést vagy formát kapsz, ahogy haladsz benne.</p>
    <div style="display:grid;gap:12px;">${RPG_TRACKS.map(t=>rpgRenderTrackPathCard(t)).join('')}</div>
  `;
}

    return `

function rpgRenderConfetti(){
  const colors = ['#D9A441','#4A85AC','#5C8F62','#C1432B','#EDE9DD'];
  let pieces = '';
  for(let i=0;i<24;i++){
    const left = Math.round(Math.random()*100);
    const delay = (Math.random()*0.6).toFixed(2);
    const color = colors[i % colors.length];
    pieces += `<span class="rpg-confetti-piece" style="left:${left}%;background:${color};animation-delay:${delay}s;"></span>`;
  }
  return `<div class="rpg-confetti-wrap">${pieces}</div>`;
}
function rpgRenderTimelineTab(){
  const cur = rpgGetCurrentWeekIndex();
  const viewingWeek = App.ui.rpgViewingWeek;
  let blocks = '';
  for(let q=0; q<4; q++){
    const startW = q===0 ? 1 : rpgQuarterBoundary(q-1)+1, endW = rpgQuarterBoundary(q);
    let cells = '';
    for(let w=startW; w<=endW; w++){
      const score = rpgWeekScore(w);
      const intensity = score===0 ? 0.04 : Math.min(0.9, 0.15 + score/150);
      cells += `<div class="rpg-weekcell ${w===cur?'current':''} ${w===viewingWeek?'viewing':''}" data-click="rpgJumpToWeek" data-id="${w}" style="background:rgba(217,164,65,${intensity})" title="${w}. ciklus — ${score} XP">${w}</div>`;
    }
    const started = cur >= startW;
    const qXpByTrack = RPG_TRACKS.map(t=>{
      let sum=0;
      for(let w=startW; w<=endW; w++){
        App.state.rpg.weeks[w-1].quests.forEach(qu=>{ if(qu.trackId===t.id && qu.done) sum+=qu.xp; });
      }
      return {t, sum};
    });
    const metCount = qXpByTrack.filter(x=>x.sum>=RPG_QUARTER_TARGET_XP).length;
    const defeated = metCount >= RPG_BOSS_DEFEAT_THRESHOLD;
    const bossBars = qXpByTrack.map(({t,sum})=>{
      const pct = Math.min(100, Math.round(sum/RPG_QUARTER_TARGET_XP*100));
      return `<div style="margin-bottom:6px;">
        <div class="flex between small muted"><span>${t.icon} ${escapeHtml(t.name)}</span><span>${sum} / ${RPG_QUARTER_TARGET_XP} XP</span></div>
        <div class="rpg-xpbar"><i style="width:${pct}%; --tc:${t.color}"></i></div>
      </div>`;
    }).join('');
    const confetti = defeated ? rpgRenderConfetti() : '';

    blocks += `
      <div class="sectiontitle" style="margin-top:22px;">Q${q+1} — ${startW}–${endW}. ciklus ${!started?'🔒':''}</div>
      <div class="rpg-weekgrid">${cells}</div>
      <div class="card rpg-boss-card ${!started?'locked':''} ${defeated?'defeated':''}">
        ${confetti}
        <div class="card-title">${defeated ? '🏆 Boss legyőzve!' : '⚔️ Negyedéves Boss Fight'}</div>
        ${started ? `
          <p class="small muted" style="margin:6px 0 10px;">${metCount} / ${RPG_TRACKS.length} skill fa érte el a ${RPG_QUARTER_TARGET_XP} XP-s negyedéves célt${defeated?' — a boss legyőzve!':''}.</p>
          ${bossBars}
          <div class="field" style="margin-top:12px;margin-bottom:0;">
            <label>Negyedéves reflexió</label>
            <textarea data-rpg-reflection="${q}" placeholder="Mit tanultál ebben a negyedévben? Mi működött, mi nem?">${escapeHtml(App.state.rpg.quarterReflections[q]||'')}</textarea>
          </div>
        ` : `<p class="small muted" style="margin-top:6px;">Ez a negyedév még nem kezdődött el.</p>`}
      </div>`;
  }
  return `<div class="sectiontitle">Kampány idővonal — ${rpgWeeksTotal()} ciklus</div>${blocks}`;
}

/* ================= REGRESSIÓS DIAGNOSZTIKA (golden-set) =================
   Console-ból hívható: runRegressionChecks(). Kizárólag a MEGLÉVŐ, éles
   függvényeket hívja meg (handleLocalAiCommand / addLocalAiSuggestions /
   sendAiMessage / callMotivAI / toLocalISO / todayISO) — nem duplikálja a
   felismerő logikát. Ahol a teszthez ideiglenes patch szükséges (pl.
   callMotivAI kicserélése egy kontrollált Promise-ra, vagy az #ai-input DOM
   elem hiányának pótlása), azt try/finally biztosítja: a függvény lefutása
   UTÁN App.state.aiChat, App.state.aiPerm és a DOM pontosan olyan állapotban
   marad, mint előtte, és soha nem megy ki valódi hálózati kérés az
   api.anthropic.com felé (callMotivAI mindig helyben kipatch-elve fut az
   ehhez szükséges ellenőrzéseknél). */
// #ai-input csak akkor van a DOM-ban, ha épp a MotivAI chat nézet (RENDERERS.ai)
// van nyitva. A sendAiMessage() ezt olvassa közvetlenül — ha diagnosztikát más
// nézetről futtatjuk, ideiglenesen pótoljuk egy rejtett, nem-UI elemmel, majd
// a teszt végén eltávolítjuk (ha mi hoztuk létre), vagy visszaállítjuk az
// eredeti értékét (ha már létezett, azaz a valódi UI-hoz tartozik).
function ensureAiInput(){
  const existing=document.getElementById('ai-input');
  if(existing) return {el:existing, created:false, prevValue:existing.value};
  const el=document.createElement('input');
  el.type='text'; el.id='ai-input'; el.style.display='none';
  document.body.appendChild(el);
  return {el, created:true, prevValue:''};
}
function releaseAiInput(ref){
  if(!ref) return;
  if(ref.created){ if(ref.el.parentNode) ref.el.parentNode.removeChild(ref.el); }
  else { ref.el.value=ref.prevValue; }
}

async function regressionCheckAiDuplicateGuard(){
  const results=[];
  function rec(name, pass, detail){ results.push({'Teszt':name, 'Eredmény':pass?'PASS':'FAIL', 'Részlet':detail||''}); }

  // ---- 1) Dupla-küldés guard (_aiSending) ----
  try{
    const origCallMotivAI=callMotivAI;
    const inputRef=ensureAiInput();
    const baseLen=App.state.aiChat.length;
    const testText='Milyen idő lesz holnap Budapesten?'; // nem-helyi szöveg: handleLocalAiCommand nem ismeri fel
    let resolvePending;
    const pending=new Promise(res=>{ resolvePending=res; });
    callMotivAI=function(){ return pending; };
    let pass=false, detail='';
    try{
      inputRef.el.value=testText;
      const p1=sendAiMessage(); // szinkron fut az első await-ig: _aiSending=true, 'user' buborék push-olva
      const p2=sendAiMessage(); // guard: _aiSending még true -> azonnal visszatér, nem push-ol semmit
      resolvePending({content:[{text:'ok'}]});
      await p1; await p2;
      const added=App.state.aiChat.slice(baseLen);
      const userBubbles=added.filter(m=>m.role==='user' && m.content===testText);
      pass=userBubbles.length===1;
      detail=userBubbles.length+' db "user" buborék került be ugyanazzal a tartalommal (elvárt: 1)';
    } finally {
      callMotivAI=origCallMotivAI;
      App.state.aiChat.length=baseLen;
      saveState();
      releaseAiInput(inputRef);
    }
    rec('1) Dupla AI-üzenet guard (_aiSending)', pass, detail);
  }catch(e){
    rec('1) Dupla AI-üzenet guard (_aiSending)', false, 'Hiba a teszt közben: '+(e&&e.message?e.message:e));
  }

  return results;
}

function regressionCheckLocalTaskFinanceParsing(){
  const results=[];
  function rec(name, pass, detail){ results.push({'Teszt':name, 'Eredmény':pass?'PASS':'FAIL', 'Részlet':detail||''}); }

  // ---- 2) "Feladat rögzítése holnapra: garázs befizetni 16k ft" -> helyi 'task' felismerés,
  //         NEM finance tétel (a financeContextExclude-nak továbbra is ki kell zárnia a finance
  //         ágból — lásd handleLocalAiCommand -, viszont a parseLocalTaskEventCommand felismeri
  //         feladatként, hiszen ez a PM-döntés MOST felülíródott: a feladat/esemény-rögzítés
  //         helyben, API kulcs nélkül is működik). ----
  try{
    const baseLen=App.state.aiChat.length;
    let pass=false, detail='';
    try{
      const text='Feladat rögzítése holnapra: garázs befizetni 16k ft';
      const ret=handleLocalAiCommand(text);
      const last=App.state.aiChat[App.state.aiChat.length-1];
      const suggs=(last && Array.isArray(last.suggestions)) ? last.suggestions : [];
      const taskSugg=suggs.find(s=>s.type==='task');
      const financeSugg=suggs.find(s=>s.type==='finance');
      pass = ret===true && !!taskSugg && !financeSugg;
      detail='handleLocalAiCommand(...) -> '+ret+'; task javaslat: '+(taskSugg?JSON.stringify({title:taskSugg.title,due:taskSugg.due}):'nincs')+'; finance javaslat (NEM várt): '+(financeSugg?JSON.stringify(financeSugg):'nincs');
    } finally {
      App.state.aiChat.length=baseLen;
      saveState();
    }
    rec('2) Feladat-kontextus -> helyi task felismerés (garázs 16k ft, NEM finance)', pass, detail);
  }catch(e){
    rec('2) Feladat-kontextus -> helyi task felismerés (garázs 16k ft, NEM finance)', false, 'Hiba a teszt közben: '+(e&&e.message?e.message:e));
  }

  // ---- 2b) "befizetés" substring-hiba az income-ágban (regresszió a #1-es hibára) ----
  // A "befizetés" szó normalizálva ("befizetes") TARTALMAZZA a "fizetes" substringet,
  // ezért substring-kereséssel (n.includes('fizetes')) a bevétel-ág hamisan elkapná egy
  // feladat-kontextusú üzenetet is (pl. "Garázs befizetés 16k ft" egy feladat címében).
  // A #2-es teszt ("...garázs befizetni 16k ft") ezt NEM fedezi le, mert "befizetni" nem
  // tartalmazza a "fizetes" substringet — ehhez kifejezetten a "befizetés" szó kell.
  // Kontroll-esetek: a "Bevétel 470k ft" és "Kaptam 300k fizetést" szövegeknek továbbra is
  // 'income' javaslatot KELL adniuk (a szóhatáros \b...\w*\b illesztésnek a toldalékolt
  // "fizetést" alakra is illeszkednie kell).
  try{
    const baseLen=App.state.aiChat.length;
    let pass=true, detailParts=[];

    function checkCase(text, expectTask, expectIncome, expectedAmount){
      App.state.aiChat.length=baseLen;
      const ret=handleLocalAiCommand(text);
      const last=App.state.aiChat[App.state.aiChat.length-1];
      const suggs=(last && Array.isArray(last.suggestions)) ? last.suggestions : [];
      const taskSugg=suggs.find(s=>s.type==='task');
      const incomeSugg=suggs.find(s=>s.type==='income');
      const financeSugg=suggs.find(s=>s.type==='finance');
      let ok = ret===true;
      if(expectTask) ok = ok && !!taskSugg && !incomeSugg && !financeSugg;
      if(expectIncome) ok = ok && !!incomeSugg && !taskSugg && Number(incomeSugg.amount)===expectedAmount;
      if(!ok) pass=false;
      detailParts.push('"'+text+'" -> ret='+ret+'; task='+(taskSugg?JSON.stringify({title:taskSugg.title,due:taskSugg.due}):'nincs')+'; income='+(incomeSugg?JSON.stringify(incomeSugg):'nincs')+'; finance='+(financeSugg?JSON.stringify(financeSugg):'nincs')+' ('+(ok?'OK':'FAIL')+')');
    }

    try{
      // Reprodukció: a "befizetés" szót tartalmazó feladat-kontextusú üzenet -> task,
      // NEM income és NEM finance.
      checkCase("Állíts be holnapra feladatot azzal a névvel hogy 'Garázs befizetés 16k ft'", true, false, null);
      // Kontroll: a valódi bevétel-bejelentések továbbra is income javaslatot adnak.
      checkCase('Bevétel 470k ft', false, true, 470000);
      checkCase('Kaptam 300k fizetést', false, true, 300000);
    } finally {
      App.state.aiChat.length=baseLen;
      saveState();
    }
    rec('2b) "befizetés" substring-hiba javítva (garázs befizetés -> task, NEM income) + income kontroll-esetek', pass, detailParts.join(' | '));
  }catch(e){
    rec('2b) "befizetés" substring-hiba javítva (garázs befizetés -> task, NEM income) + income kontroll-esetek', false, 'Hiba a teszt közben: '+(e&&e.message?e.message:e));
  }

  // ---- 2c) ugyanaz a substring-hibaosztály a "cats" (számla-kulcsszó) ágban ----
  // A "net" (Internet) és "viz" (Víz) rövid kulcsszavak substring-kereséssel hamisan
  // illeszkednének a "netto" ("Nettó fizetésem...") és "vizsga" szavak elejére. A javítás
  // után a rövid (<=3 betűs) kulcsszavak csak TELJES szóként (záró \b-vel is) illeszkednek,
  // a hosszabbaknál (pl. "aram") viszont megmarad a \w* toldalék-illesztés, hogy a jogos
  // ragozott alakok (pl. "aramot") továbbra is felismerésre kerüljenek.
  try{
    const baseLen=App.state.aiChat.length;
    let pass=true, detailParts=[];
    function checkFinance(text, expectFinanceName, expectNoFinance){
      App.state.aiChat.length=baseLen;
      const ret=handleLocalAiCommand(text);
      const last=App.state.aiChat[App.state.aiChat.length-1];
      const suggs=(last && Array.isArray(last.suggestions)) ? last.suggestions : [];
      const financeSuggs=suggs.filter(s=>s.type==='finance');
      let ok=true;
      if(expectFinanceName) ok = financeSuggs.some(s=>s.name===expectFinanceName);
      if(expectNoFinance) ok = ok && financeSuggs.length===0;
      if(!ok) pass=false;
      detailParts.push('"'+text+'" -> finance='+JSON.stringify(financeSuggs)+' ('+(ok?'OK':'FAIL')+')');
    }
    try{
      // Reprodukció: "Nettó" ne ismerődjön fel "Internet" kulcsszóként.
      checkFinance("Nettó fizetésem 480k ft", null, true);
      // Reprodukció: "Vizsga" ne ismerődjön fel "Víz" kulcsszóként.
      checkFinance("Vizsga előtt vettem egy könyvet 3000 ft", null, true);
      // Kontroll: a valódi, rövid kulcsszavas számlák továbbra is felismerésre kerülnek.
      checkFinance("Viz 5000 ft", 'Víz');
      // Kontroll: a hosszabb kulcsszavak ragozott alakja továbbra is felismerésre kerül.
      checkFinance("Az áramot kifizettem 5000 ft", 'Áram');
    } finally {
      App.state.aiChat.length=baseLen;
      saveState();
    }
    rec('2c) "net"/"viz" rövid kulcsszó substring-hiba javítva (netto/vizsga NEM finance) + kontroll-esetek', pass, detailParts.join(' | '));
  }catch(e){
    rec('2c) "net"/"viz" rövid kulcsszó substring-hiba javítva (netto/vizsga NEM finance) + kontroll-esetek', false, 'Hiba a teszt közben: '+(e&&e.message?e.message:e));
  }

  // ---- 2d) Múlt idejű mondat + task-trigger UGYANABBAN az üzenetben (bugfix reprodukció):
  //         "Befizetett számlák: áram 17k ft, Víz 5k ft. Feladat rögzítése holnapra: garázs
  //         befizetni 16k ft" -> KÉT finance tétel (Áram, Víz) ÉS PONTOSAN EGY task ("garázs
  //         befizetni 16k ft", holnapi határidővel) — a "Befizetett számlák..." mondat NEM
  //         válhat task-jelöltté üres dátummal (ez volt az eredeti, élesből jelentett hiba,
  //         lásd parseLocalTaskEventCommand pozíció-alapú eligibilitás + taskEventContextExclude). ----
  try{
    const baseLen=App.state.aiChat.length;
    let pass=false, detail='';
    try{
      const text='Befizetett számlák: áram 17k ft, Víz 5k ft. Feladat rögzítése holnapra: garázs befizetni 16k ft';
      const ret=handleLocalAiCommand(text);
      const last=App.state.aiChat[App.state.aiChat.length-1];
      const suggs=(last && Array.isArray(last.suggestions)) ? last.suggestions : [];
      const financeSuggs=suggs.filter(s=>s.type==='finance');
      const taskSuggs=suggs.filter(s=>s.type==='task');
      const d=new Date(); d.setDate(d.getDate()+1); const expectedDate=toLocalISO(d);
      const hasAram=financeSuggs.some(s=>s.name==='Áram' && Number(s.amount)===17000);
      const hasViz=financeSuggs.some(s=>s.name==='Víz' && Number(s.amount)===5000);
      const goodTask=taskSuggs.length===1 && /garazs/.test(normalizeHU(taskSuggs[0].title||'')) && taskSuggs[0].due===expectedDate;
      pass = ret===true && financeSuggs.length===2 && hasAram && hasViz && goodTask;
      detail='finance ('+financeSuggs.length+' db)='+JSON.stringify(financeSuggs.map(s=>({name:s.name,amount:s.amount})))+'; task ('+taskSuggs.length+' db)='+JSON.stringify(taskSuggs.map(s=>({title:s.title,due:s.due})))+' (elvárt: 2 finance [Áram 17000, Víz 5000], PONTOSAN 1 task [garázs..., due='+expectedDate+'])';
    } finally {
      App.state.aiChat.length=baseLen;
      saveState();
    }
    rec('2d) Múlt idejű mondat + task-trigger egy üzenetben: nincs hamis üres-dátumú task (bugfix)', pass, detail);
  }catch(e){
    rec('2d) Múlt idejű mondat + task-trigger egy üzenetben: nincs hamis üres-dátumú task (bugfix)', false, 'Hiba a teszt közben: '+(e&&e.message?e.message:e));
  }

  // ---- 2e) parseHUFAmount: 1-3 jegyű összeg csak "ft"/"forint" mértékegységgel ismerhető fel
  //          (pl. "Kávé 450 ft" -> 450), mértékegység NÉLKÜLI rövid szám NEM összeg (pl. "3
  //          feladat" NEM 3 Ft) — a 4-9 jegyű/ezres-tagolt és a "k"/"ezer" toldalékos ágak
  //          viselkedése változatlan marad. ----
  try{
    let pass=true, detailParts=[];
    function checkAmt(text, expected){
      const got=parseHUFAmount(text);
      const ok = got===expected;
      if(!ok) pass=false;
      detailParts.push('"'+text+'" -> '+got+' (elvárt '+expected+')'+(ok?' OK':' FAIL'));
    }
    checkAmt('Kávé 450 ft', 450);
    checkAmt('Ebéd 99 forint', 99);
    checkAmt('3 feladat', null);
    checkAmt('17k ft', 17000);
    checkAmt('12345 ft', 12345);
    rec('2e) parseHUFAmount: 1-3 jegyű összeg csak "ft"/"forint" mértékegységgel (450, 99), rövid szám mértékegység nélkül NEM összeg (3 feladat)', pass, detailParts.join(' | '));
  }catch(e){
    rec('2e) parseHUFAmount: 1-3 jegyű összeg csak "ft"/"forint" mértékegységgel (450, 99), rövid szám mértékegység nélkül NEM összeg (3 feladat)', false, 'Hiba a teszt közben: '+(e&&e.message?e.message:e));
  }

  return results;
}

  // 4b) A teljes sendAiMessage() hibaút letesztelése úgy, hogy callMotivAI-t (nem window.prompt-ot!)

  // esetén callMotivAI sosem hívná meg a promptot, és a teszt véletlenül valódi API-hívást indítana)

  // teszt továbbra is a valódi API-hiba-útvonalat fedje le (handleLocalAiCommand ilyenkor
  // false-t ad, sendAiMessage csak ekkor jut el a callMotivAI hívásig).
  try{

    const inputRef=ensureAiInput();
    const baseLen=App.state.aiChat.length;
    const text='Milyen idő lesz holnap Budapesten?';
    callMotivAI=function(){ return Promise.reject(new Error('Nincs megadva API kulcs, az AI-hívás nem indítható el.')); };

  try{

  }catch(e){

  }

  return results;
}

function regressionCheckDateHelpers(){
  const results=[];
  function rec(name, pass, detail){ results.push({'Teszt':name, 'Eredmény':pass?'PASS':'FAIL', 'Részlet':detail||''}); }

  // ---- 5) toLocalISO pontos léptetése év-/hónapváltás határán ----
  try{
    const t1=new Date(2025,11,31); t1.setDate(t1.getDate()+1); // 2025-12-31 -> 2026-01-01 (évváltás)
    const r1=toLocalISO(t1);

    const t2=new Date(2026,0,31); t2.setDate(t2.getDate()+1); // 2026-01-31 -> 2026-02-01 (hónapváltás)
    const r2=toLocalISO(t2);

    const t3=new Date(2026,2,10); t3.setDate(t3.getDate()+7); // sima egy-hetes léptetés
    const r3=toLocalISO(t3);
    const expected3=t3.getFullYear()+'-'+String(t3.getMonth()+1).padStart(2,'0')+'-'+String(t3.getDate()).padStart(2,'0');

    const pass = r1==='2026-01-01' && r2==='2026-02-01' && r3===expected3;
    rec('5) toLocalISO év-/hónapváltás + heti léptetés', pass,
      'évváltás: '+r1+' (elvárt 2026-01-01); hónapváltás: '+r2+' (elvárt 2026-02-01); heti léptetés: '+r3+' (elvárt '+expected3+')');
  }catch(e){
    rec('5) toLocalISO év-/hónapváltás + heti léptetés', false, 'Hiba a teszt közben: '+(e&&e.message?e.message:e));
  }

  // ---- 6) todayISO() helyi getterekkel dolgozik (nincs UTC-csúszás) ----
  try{
    const t=todayISO();
    const now=new Date();
    const expected=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    const pass1 = t===expected;
    let pass2=true, guardDetail='(kihagyva)';
    try{
      /* Csak a tényleges dátum-építő függvények FORRÁSKÓDJÁT (Function.toString(),
         ami nem tartalmazza a függvény előtti kommenteket) vizsgáljuk, NEM a teljes
         oldal HTML-jét — az utóbbi a kommenteket és ezt a tesztet magát is
         tartalmazná, ami önmagát buktatná meg, függetlenül a tényleges kódtól. */
      const fnsToCheck=[todayISO, toLocalISO, shiftCalRef, renderHetView, shiftNutRef, renderNutHet, applyDayTypeTemplateForward];
      const offenders=fnsToCheck.filter(fn=>typeof fn==='function' && /\.toISOString\s*\(/.test(fn.toString())).map(fn=>fn.name);
      pass2 = offenders.length===0;
      guardDetail = pass2 ? 'nincs toISOString hívás az ellenőrzött dátum-építő függvényekben' : 'TALÁLT toISOString hívást: '+offenders.join(', ')+' — regresszió!';
    }catch(e2){
      guardDetail='guard kihagyva (hiba): '+(e2&&e2.message?e2.message:e2);
    }
    rec('6) todayISO helyi dátum + toISOString guard', pass1 && pass2, 'todayISO() -> '+t+' (elvárt '+expected+'); guard: '+guardDetail);
  }catch(e){
    rec('6) todayISO helyi dátum + toISOString guard', false, 'Hiba a teszt közben: '+(e&&e.message?e.message:e));
  }

  return results;
}

      'tartományon belül (03-10,03-11,03-12): '+inRange+'; tartományon kívül (03-09,03-13): '+outRange);
  }catch(e){
    rec('7) taskOccursOn tartomány-illesztés (due 03-10 .. dueEnd 03-12)', false, 'Hiba a teszt közben: '+(e&&e.message?e.message:e));
  }

  // ---- 8) eventOccursOn: date/endDate tartomány pontosan a tartományon belüli napokra igaz ----
  try{
    const ev={id:'y',title:'teszt',date:'2026-03-10',endDate:'2026-03-12'};
    const inRange = ['2026-03-10','2026-03-11','2026-03-12'].every(d=>eventOccursOn(ev,d));
    const outRange = !eventOccursOn(ev,'2026-03-09') && !eventOccursOn(ev,'2026-03-13');
    const pass = inRange && outRange;
    rec('8) eventOccursOn tartomány-illesztés (date 03-10 .. endDate 03-12)', pass,
      'tartományon belül (03-10,03-11,03-12): '+inRange+'; tartományon kívül (03-09,03-13): '+outRange);
  }catch(e){
    rec('8) eventOccursOn tartomány-illesztés (date 03-10 .. endDate 03-12)', false, 'Hiba a teszt közben: '+(e&&e.message?e.message:e));
  }

  return results;
}

async function runRegressionChecks(){
  const results=[];
  results.push(...(await regressionCheckAiDuplicateGuard()));
  results.push(...regressionCheckLocalTaskFinanceParsing());
  results.push(...regressionCheckLocalMealParsing());
  results.push(...(await regressionCheckLocalEventParsing()));
  results.push(...regressionCheckDateHelpers());
  results.push(...regressionCheckOccursOnHelpers());

  const failCount=results.filter(r=>r['Eredmény']==='FAIL').length;
  if(typeof console.table==='function') console.table(results);
  else results.forEach(r=>console.log(r['Teszt']+': '+r['Eredmény']+' — '+r['Részlet']));
  console.log('[runRegressionChecks] Összesen: '+results.length+', PASS: '+(results.length-failCount)+', FAIL: '+failCount);
  return results;
}
window.runRegressionChecks = runRegressionChecks;

/* PWA / offline: a service worker cache-eli az app-shellt (ez a fájl +
   manifest + ikonok), hogy telepítés/hozzáadás után internet nélkül is
   elinduljon és működjön az app. file:// -ról nyitva a böngészők nem
   engedik a Service Worker regisztrációt (ez normális, csak https://
   vagy localhost alól működik), ezért a hibát csendben elnyeljük. */

/* Frissítés-értesítő sáv: amikor egy éles push után új service worker
   települ a háttérben, a MÁR MEGNYITOTT munkamenet ezt csak reload után
   futtatná le — ezért ahelyett, hogy a felhasználó alól rántanánk fel az
   oldalt (pl. gépelés közben), egy eldobható sávon kínáljuk fel az azonnali
   frissítést, a toastUndo()-éhoz hasonló, önálló DOM-elemes mintával. */
let _updateBannerEl = null;
function showUpdateBanner(){
  if(_updateBannerEl) return;
  const t = document.createElement('div');
  t.id = 'update-banner';
  t.setAttribute('role','status'); t.setAttribute('aria-live','polite');
  t.style.cssText = 'position:fixed;bottom:calc(90px + var(--safe-bottom));left:50%;'
    +'transform:translateX(-50%);background:var(--paper);color:var(--ink);'
    +'padding:9px 9px 9px 18px;border-radius:999px;font-weight:600;font-size:13px;z-index:110;'
    +'display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);'
    +'box-shadow:0 6px 20px rgba(0,0,0,.28);';
  const label = document.createElement('span');
  label.textContent = 'Új verzió elérhető';
  label.style.cssText = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
  const btn = document.createElement('button');
  btn.type = 'button'; btn.textContent = 'Frissítés';
  btn.style.cssText = 'background:var(--trail-yellow);color:var(--ink);border:none;'
    +'border-radius:999px;padding:6px 14px;font-weight:700;font-size:12.5px;cursor:pointer;flex-shrink:0;';
  btn.onclick = ()=>window.location.reload();
  t.appendChild(label); t.appendChild(btn);
  document.body.appendChild(t);
  _updateBannerEl = t;
}
/* selfHealIfStale: a service worker SAJÁT frissítési ciklusától (reg.update()
   / skipWaiting+clients.claim) FÜGGETLEN védőháló. Egy régóta futó, telepített
   példányban (pl. Android TWA) előfordulhat, hogy ez a ciklus valamiért nem
   fut le megbízhatóan — pl. egy korábbi telepítés csendben elakadt, mert a
   cache.addAll() egyetlen fájl (pl. ikon) átmeneti hibája miatt sosem futott
   le (ld. sw.js install handler), vagy egyszerűen a böngésző hosszú ideig nem
   ellenőrzött újra. ETTŐL FÜGGETLENÜL, minden oldalbetöltéskor lekérjük magát
   a sw.js-t no-store + egyedi query stringgel (ez sem a böngésző HTTP-cache-ét,
   sem a GitHub Pages CDN URL-kulcsos cache-ét nem hagyja érvényesülni), és
   összevetjük a benne szereplő CACHE_NAME-et az EXPECTED_SW_CACHE_NAME-mel,
   amit EZ a betöltött oldal saját magától vár. Eltérés = ez az oldalpéldány
   régebbi, mint amit a szerver most kiszolgál — ilyenkor minden SW-regisztrációt
   és cache-et törlünk, majd újratöltünk, ami ugyanazt csinálja, mint a
   chrome://serviceworker-internals-beli kézi "Unregister", csak automatikusan.
   sessionStorage-flaggel legfeljebb egyszer avatkozik be munkamenetenként,
   hogy egy váratlan/tartós eltérés esetén se tudjon végtelen reload-hurkot
   okozni. */
function selfHealIfStale(){
  if(!('serviceWorker' in navigator)) return;
  if(sessionStorage.getItem('motivapp2:selfHealed')) return;
  fetch('./sw.js?t='+Date.now(), {cache:'no-store'})
    .then(res=>res.text())
    .then(text=>{
      const m = text.match(/CACHE_NAME\s*=\s*'([^']+)'/);
      if(!m || m[1]===EXPECTED_SW_CACHE_NAME) return;
      sessionStorage.setItem('motivapp2:selfHealed','1');
      return navigator.serviceWorker.getRegistrations()
        .then(regs=>Promise.all(regs.map(r=>r.unregister())))
        .then(()=>('caches' in window ? caches.keys() : []))
        .then(names=>Promise.all(names.map(n=>caches.delete(n))))
        .then(()=>{ window.location.reload(); });
    })
    .catch(()=>{}); // offline / hálózati hiba — nincs teendő, a normál SW-ciklus még megpróbálhatja
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    selfHealIfStale();
    navigator.serviceWorker.register('sw.js').then(reg=>{
      window._swReg = reg;
      const watchForInstall = worker=>{
        if(!worker) return;
        worker.addEventListener('statechange', ()=>{
          // A meglévő controller jelenléte különbözteti meg az első
          // telepítést (nincs mit felkínálni) a háttérben érkezett
          // frissítéstől (van futó, régebbi verzió — azt kínáljuk fel).
          if(worker.state==='installed' && navigator.serviceWorker.controller){
            showUpdateBanner();
          }
        });
      };
      watchForInstall(reg.installing);
      reg.addEventListener('updatefound', ()=>watchForInstall(reg.installing));
      // Rendszeres háttér-ellenőrzés: óránként, és minden alkalommal, amikor
      // a felhasználó visszatér az appba (tabváltás / képernyő felébresztése).
      // A hibát korábban csendben elnyeltük — most legalább console.error-ral
      // látszik, ha ismételten sikertelen (pl. tartósan offline az eszköz).
      setInterval(()=>reg.update().catch(e=>console.error('SW update check failed', e)), 60*60*1000);
      document.addEventListener('visibilitychange', ()=>{
        if(document.visibilityState==='visible'){
          selfHealIfStale();
          reg.update().catch(e=>console.error('SW update check failed', e));
        }
      });
    }).catch(()=>{});
  });
}
