function applyAiSuggestion(s){
  const applier = AI_SUGGESTION_APPLIERS[s.type];
  if(applier) return applier(s);
  // Ismeretlen javaslat-típus: NEM mentünk semmit "találgatva" (korábban minden fel
  // nem ismert type itt hibásan feladatként mentődött, ami 'event' javaslatra téves
  // volt) — inkább jelezzük, hogy nem sikerült feldolgozni.
  return 'Nem sikerült feldolgozni a javaslatot (ismeretlen típus) ✗';
}
function acceptAiSuggestion(mi,si){
  const s = App.state.aiChat[mi].suggestions[si];
  // Szerkeszthető mezők beolvasása a kártyáról jóváhagyás előtt (lásd renderAiChat).
  if(s.type==='finance' || s.type==='income' || s.type==='discretionary_spend' || s.type==='savings_add'){
    const el = document.getElementById('ai-sugg-amount-'+mi+'-'+si);
    if(el) s.amount = parseAmountInput(el.value);
  } else if(s.type==='meal'){
    const kcalEl=document.getElementById('ai-sugg-kcal-'+mi+'-'+si);
    const proteinEl=document.getElementById('ai-sugg-protein-'+mi+'-'+si);
    const carbsEl=document.getElementById('ai-sugg-carbs-'+mi+'-'+si);
    const fatEl=document.getElementById('ai-sugg-fat-'+mi+'-'+si);
    if(kcalEl) s.kcal=Number(kcalEl.value)||0;
    if(proteinEl) s.protein=Number(proteinEl.value)||0;
    if(carbsEl) s.carbs=Number(carbsEl.value)||0;
    if(fatEl) s.fat=Number(fatEl.value)||0;
  } else if(s.type==='task'){
    const titleEl=document.getElementById('ai-sugg-title-'+mi+'-'+si);
    const dueEl=document.getElementById('ai-sugg-date-'+mi+'-'+si);
    const dueEndEl=document.getElementById('ai-sugg-dueend-'+mi+'-'+si);
    if(titleEl && titleEl.value.trim()) s.title=titleEl.value.trim();
    if(dueEl) s.due=dueEl.value||'';
    if(dueEndEl) s.dueEnd=dueEndEl.value||'';
  } else if(s.type==='event'){
    const titleEl=document.getElementById('ai-sugg-title-'+mi+'-'+si);
    const dateEl=document.getElementById('ai-sugg-date-'+mi+'-'+si);
    const endDateEl=document.getElementById('ai-sugg-enddate-'+mi+'-'+si);
    const timeEl=document.getElementById('ai-sugg-time-'+mi+'-'+si);
    if(titleEl && titleEl.value.trim()) s.title=titleEl.value.trim();
    if(dateEl) s.date=dateEl.value||'';
    if(endDateEl) s.endDate=endDateEl.value||'';
    if(timeEl) s.time=timeEl.value||'';
  } else if(s.type==='workout'){
    const catEl=document.getElementById('ai-sugg-cat-'+mi+'-'+si);
    const dateEl=document.getElementById('ai-sugg-date-'+mi+'-'+si);
    const durEl=document.getElementById('ai-sugg-dur-'+mi+'-'+si);
    const musclesRow=document.getElementById('ai-sugg-muscles-'+mi+'-'+si);
    const ebEl=document.getElementById('ai-sugg-energybefore-'+mi+'-'+si);
    const eaEl=document.getElementById('ai-sugg-energyafter-'+mi+'-'+si);
    if(catEl && catEl.value.trim()) s.category=catEl.value.trim();
    if(dateEl) s.date=dateEl.value||todayISO();
    if(durEl) s.durationMin=parseInt(durEl.value)||null;
    if(musclesRow) s.muscleGroups=[...musclesRow.querySelectorAll('.chip.active')].map(c=>c.dataset.v);
    if(ebEl) s.energyBefore=parseInt(ebEl.value)||0;
    if(eaEl) s.energyAfter=parseInt(eaEl.value)||0;
  } else if(s.type==='rpg_quest_add'){
    const trackEl=document.getElementById('ai-sugg-track-'+mi+'-'+si);
    const textEl=document.getElementById('ai-sugg-text-'+mi+'-'+si);
    const xpEl=document.getElementById('ai-sugg-xp-'+mi+'-'+si);
    if(trackEl) s.trackId=trackEl.value;
    if(textEl && textEl.value.trim()) s.text=textEl.value.trim();
    if(xpEl) s.xp=parseInt(xpEl.value)||10;
  } else if(s.type==='rpg_quest_complete'){
    const textEl=document.getElementById('ai-sugg-text-'+mi+'-'+si);
    if(textEl && textEl.value.trim()) s.text=textEl.value.trim();
  } else if(s.type==='activity_log'){
    const atypeEl=document.getElementById('ai-sugg-atype-'+mi+'-'+si);
    const durEl=document.getElementById('ai-sugg-dur-'+mi+'-'+si);
    const ebEl=document.getElementById('ai-sugg-eb-'+mi+'-'+si);
    const eaEl=document.getElementById('ai-sugg-ea-'+mi+'-'+si);
    if(atypeEl) s.activityType=atypeEl.value;
    if(durEl) s.durationMin=parseInt(durEl.value)||0;
    if(ebEl) s.energyBefore=parseInt(ebEl.value)||0;
    if(eaEl) s.energyAfter=parseInt(eaEl.value)||0;
  } else if(s.type==='weight'){
    const kgEl=document.getElementById('ai-sugg-kg-'+mi+'-'+si);
    const dateEl=document.getElementById('ai-sugg-date-'+mi+'-'+si);
    if(kgEl) s.kg=Number(kgEl.value)||0;
    if(dateEl) s.date=dateEl.value||todayISO();
  } else if(s.type==='health_log'){
    const sleepEl=document.getElementById('ai-sugg-sleep-'+mi+'-'+si);
    const stepsEl=document.getElementById('ai-sugg-steps-'+mi+'-'+si);
    const pulseEl=document.getElementById('ai-sugg-pulse-'+mi+'-'+si);
    s.sleepH = sleepEl && sleepEl.value!=='' ? Number(sleepEl.value) : undefined;
    s.steps = stepsEl && stepsEl.value!=='' ? Number(stepsEl.value) : undefined;
    s.pulse = pulseEl && pulseEl.value!=='' ? Number(pulseEl.value) : undefined;
  } else if(s.type==='journal'){
    const moodEl=document.getElementById('ai-sugg-mood-'+mi+'-'+si);
    const textEl=document.getElementById('ai-sugg-jtext-'+mi+'-'+si);
    s.mood = moodEl && moodEl.value!=='' ? parseInt(moodEl.value) : undefined;
    if(textEl) s.text=textEl.value.trim();
  }
  const msg = applyAiSuggestion(s);
  if(msg) toast(msg);
  App.state.aiChat[mi].suggestions.splice(si,1);
  saveState(); renderAiChat(); renderApp();
}

function renderExpenseDistribution(f){
  const items=[...f.mandatory.map(x=>({name:x.name,icon:x.icon,val:x.amount||0})),
    ...f.discretionary.map(x=>({name:x.name,icon:x.icon,val:x.spent||0})),
    ...f.savings.map(x=>({name:x.name,icon:x.icon,val:x.saved||0}))];
  const max=Math.max(1,...items.map(i=>i.val));
  return items.map(i=>`<div class="flex center gap8" style="padding:6px 0;">
    <span style="font-size:14px;width:18px;">${escapeHtml(i.icon||'•')}</span>
    <span class="small" style="width:88px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(i.name)}</span>
    <div style="flex:1;background:var(--surface-3);border-radius:999px;height:8px;overflow:hidden;"><div style="height:100%;background:var(--trail-blue);width:${Math.round(100*i.val/max)}%;border-radius:999px;"></div></div>
    <span class="mono small" style="width:64px;text-align:right;flex-shrink:0;">${i.val.toLocaleString('hu-HU')} Ft</span>
  </div>`).join('');
}
function drawDonutChart(canvas,segments,centerLabel,centerValue){
  const ctx=setupCanvas(canvas), w=canvas._cssW, h=canvas._cssH;
  ctx.clearRect(0,0,w,h);
  const cx=w/2, cy=h/2, r=Math.max(0,Math.min(w,h)/2-6), rInner=r*0.62;
  /* r lehet 0 (vagy anélkül a fenti Math.max nélkül negatív), ha a canvas szülőjének
     clientWidth-je épp 0 - ez akkor fordul elő, ha egy globális renderApp() úgy fut le,
     hogy a Pénzügyek "Áttekintés" al-fül épp nincs láthatóan az aktív nézetben (setupCanvas()
     a szülő clientWidth-jéből számol). Negatív sugárral ctx.arc() "IndexSizeError: The
     radius provided is negative" hibával elszállna - ilyenkor egyszerűen nincs mit
     kirajzolni (0 méretű canvas), a következő tényleges Pénzügyek/Áttekintés-megnyitáskor
     (RENDERERS.finance() requestAnimationFrame-je) úgyis újrarajzolódik helyes mérettel. */
  if(r<=0) return;
  const total=segments.reduce((s,x)=>s+Math.max(0,x.value),0)||1;
  let start=-Math.PI/2;
  segments.forEach(seg=>{
    const angle=(Math.max(0,seg.value)/total)*Math.PI*2;
    if(angle<=0.001) return;
    ctx.beginPath(); ctx.arc(cx,cy,r,start,start+angle); ctx.arc(cx,cy,rInner,start+angle,start,true); ctx.closePath();
    ctx.fillStyle=seg.color; ctx.fill();
    start+=angle;
  });
  ctx.fillStyle='#93A79A'; ctx.font='10px IBM Plex Mono'; ctx.textAlign='center';
  ctx.fillText(centerLabel, cx, cy-4);
  ctx.fillStyle='#EDE9DD'; ctx.font='bold 14px IBM Plex Mono';
  ctx.fillText(centerValue, cx, cy+14);
}

// recordSpendAndCheckDup: minden egyes rögzített egyéb kiadást felír egy közös,
// könnyű naplóba (App.state.finance.spendLedger), és megnézi, volt-e MÁR ugyanazon a
// napon, ugyanahhoz a kategóriához, ugyanakkora összeggel, MÁS forrásból rögzített
// tétel - ha igen, ez valószínűleg ugyanannak a valódi tranzakciónak a duplikált
// rögzítése (pl. az AI chat és a banki értesítés is elkapta ugyanazt a fizetést).
// NEM blokkol (lehet, hogy tényleg két külön, egyforma összegű vásárlás történt
// aznap) - csak egy külön toast-figyelmeztetést ad vissza a hívónak.
function recordSpendAndCheckDup(categoryId, amount, date, source){
  App.state.finance.spendLedger = App.state.finance.spendLedger || [];
  const dup = App.state.finance.spendLedger.find(e=>
    e.categoryId===categoryId && e.amount===amount && e.date===date && e.source!==source);
  App.state.finance.spendLedger.push({id:uid(), categoryId, amount, date, source});
  // Ésszerű méretkorlát - a napló csak dedup-célra kell, nem hosszú távú history-nak.
  if(App.state.finance.spendLedger.length>500) App.state.finance.spendLedger = App.state.finance.spendLedger.slice(-500);
  return dup ? 'Figyelem: úgy tűnik, ez már rögzítve lett ma ehhez a kategóriához ugyanekkora összeggel (' + (source==='ai'?'chat':source==='foodora'?'Foodora-értesítés':source==='bank'?'banki értesítés':'kézi rögzítés') + ') — ellenőrizd, nem duplikálod-e.' : null;
}
function saveSpend(id){

  x.spent=(x.spent||0)+v;
  const dupWarning = recordSpendAndCheckDup(x.id, v, todayISO(), 'manual');
  checkDiscretionaryUnderBudget(x); // Ötlet #35 pénzügyi ág - ld. a definíciónál
  saveState(); closeSheet(); toast(dupWarning ? 'Rögzítve ⚠️ '+dupWarning : 'Rögzítve'); RENDERERS.finance();
}

/* ===== NATÍV ÉRTESÍTÉS-HÍDOK (Android WebView.evaluateJavascript hívja) =====
   window.onBankNotifications / window.onFoodoraNotifications: a natív oldal a
   PendingNotificationStore-ban (natív oldal, titkosítva) várakozó, adott csomagból
   érkező push-értesítéseket jelzi ide EGYETLEN hívásban, JSON tömbként - lásd
   NativeBridge.kt. A régi (v2.2.16 előtti) egyes-számú window.onBankNotification /
   window.onFoodoraNotification hívás CSAK egyetlen rekordot adott át, és a natív oldal
   AZONNAL törölte is a natív tárolóból, mihelyt átadta - emiatt egy neglektált
   értesítési sávban egyszerre több banki/Foodora értesítés ülhetett, de csak a
   LEGUTOLSÓ maradt meg, a többi némán elveszett (lásd git history). A többes szám
   szándékosan más függvénynevet ad, nehogy összekeveredjen/csendben ütközzön a régi,
   egyes-számú kontraktussal.
   A `amount` MINDIG csak előtöltési javaslat - soha nem írunk vele állapotot a
   felhasználó kifejezett "Mentés" kattintása nélkül. Érvénytelen/hiányzó összeg esetén
   is megnyílik a lap, csak üresen/0-val előtöltve, hogy a felhasználó kézzel be tudja
   írni.
   Mivel egyszerre több rekord is várakozhat, de egyszerre csak EGY jóváhagyó lap
   látható (openSheet() mindig felülírja az előzőt), az összes bejövő rekord egy közös,
   csak-memóriabeli munkamenet-sorba (_notifQueue) kerül, és _advanceNotifQueue() mindig
   csak a sor ELSŐ elemét jeleníti meg - a következő csak azután, hogy a felhasználó
   ténylegesen döntött (Mentés VAGY explicit bezárás) a jelenleg látszóról. Egy rekord a
   NATÍV tárolóból is csak ekkor, a döntés után törlődik (NativeBridge.acknowledge*
   hívással) - ha az app menet közben leáll, a még el nem döntött rekordok a natív
   oldalon megmaradnak, és a következő indításkor/resume-nál újra felajánlásra kerülnek. */
let _notifQueue = []; // {type:'bank'|'food', postTime, amount, rawText, sourcePackage}[] - munkamenet-beli, nem perzisztens: az igazság forrása mindig a natív PendingNotificationStore.
/* A jelenleg látható jóváhagyó lap sorbeli eleme (vagy null, ha az épp nyitott sheet
   nem egy natív értesítés-sorból származik). closeSheet() ezt vizsgálja: ha ki van
   töltve, a sheet bezárása (✕ vagy a hátteret érintve) IMPLICIT, natívan NEM nyugtázott
   elvetésnek számít - a felhasználó explicit döntéshozatalt igénylő invariánsa miatt a
   rekord natívan megmarad "várakozó"-ként, csak ebből a munkamenet-sorból kerül ki (hogy
   a sorban lévő többi elem még megjelenhessen most), és a következő app-megnyitáskor
   újra felajánlásra kerül. */
let _activeNotifQueueItem = null;

function _enqueueNotifRecords(type, recordsJson){
  let records;
  try{ records = JSON.parse(recordsJson); }catch(e){ records = null; }
  if(!Array.isArray(records)) return;
  records.forEach(r=>{
    if(!r || typeof r.postTime!=='number') return;
    // Dedup: a natív oldal is elvileg csak egyszer küld egy adott postTime-ot, de egy
    // korábbi, még fel nem dolgozott hívás után érkező második push (pl. resume + kézi
    // teszt-gomb gyors egymásutánban) ugyanazt a rekordot még nem-nyugtázott állapotban
    // újra elküldheti - ezt itt, a sorba állítás előtt szűrjük ki, hogy ne jelenjen meg
    // kétszer ugyanaz a lap.
    if(_notifQueue.some(q=>q.type===type && q.postTime===r.postTime)) return;
    if(_activeNotifQueueItem && _activeNotifQueueItem.type===type && _activeNotifQueueItem.postTime===r.postTime) return;
    _notifQueue.push({type, postTime:r.postTime, amount:r.amount, rawText:r.rawText||'', sourcePackage:r.sourcePackage||''});
  });
}
window.onBankNotifications = function(recordsJson){
  _enqueueNotifRecords('bank', recordsJson);
  _advanceNotifQueue();
};
window.onFoodoraNotifications = function(recordsJson){
  _enqueueNotifRecords('food', recordsJson);
  _advanceNotifQueue();
};
/* Megjeleníti a sor élén álló elemet, ha épp nincs már megjelenítve egy natív-sorból
   származó lap. Sorrend: a queue mindig postTime szerint növekvő sorrendben érkezik a
   natív oldalról (lásd NotificationForwarderService.scanActiveNotifications), és csak a
   végére fűzünk hozzá (_enqueueNotifRecords), úgyhogy a sor eleje mindig a
   legrégebbi, még el nem döntött rekord - a felhasználó időrendben, egyesével látja
   őket. */
function _advanceNotifQueue(){
  if(_activeNotifQueueItem) return; // már látszik egy lap - a következő csak annak lezárása után jön
  const next = _notifQueue[0];
  if(!next) return;
  _activeNotifQueueItem = next;
  const amt = (typeof next.amount==='number' && isFinite(next.amount) && next.amount!==0) ? Math.abs(next.amount) : '';
  if(next.type==='bank') openBankNotificationSheet(amt, next.rawText);
  else openFoodoraOrderSheet(amt, next.rawText);
}
/* A jelenleg nyitott, natív-sorból származó lap lezárása.
   acknowledge=true: a felhasználó ténylegesen döntött (Mentés) - natívan is nyugtázzuk
     (NativeBridge.acknowledge{Bank,Foodora}Notification), így a rekord VÉGLEGESEN törlődik
     a natív PendingNotificationStore-ból is, nem csak ebből a munkamenet-sorból.
   acknowledge=false: a felhasználó explicit bezárta a lapot (✕ / háttérre koppintás)
     anélkül, hogy mentett volna - lásd _activeNotifQueueItem doksija: NEM nyugtázunk
     natívan, a rekord ott marad "várakozó"-ként a legközelebbi app-nyitásig/resume-ig,
     csak a munkamenet-sorból esik ki, hogy a többi elem most is megjelenhessen.
   Mindkét esetben: ha van még elem a sorban, nem zárjuk be ténylegesen a sheet
   hátterét, hanem egyből a következő lap tartalmára váltunk (nincs villódzó
   becsukás-újranyitás); ha nincs több, ténylegesen bezárjuk. */
function _finishActiveNotifQueueItem(acknowledge){
  const item = _activeNotifQueueItem;
  if(item){
    if(acknowledge){
      try{
        if(item.type==='bank' && window.NativeBridge && typeof window.NativeBridge.acknowledgeBankNotification==='function'){
          window.NativeBridge.acknowledgeBankNotification(item.postTime);
        }else if(item.type==='food' && window.NativeBridge && typeof window.NativeBridge.acknowledgeFoodoraNotification==='function'){
          window.NativeBridge.acknowledgeFoodoraNotification(item.postTime);
        }
      }catch(e){
        // Natív híd hiba esetén sem szabad a mentést megakasztani - legfeljebb a rekord
        // natívan is megmarad, és újra felajánlásra kerül legközelebb (ártalmatlan, csak
        // egy felesleges, dedupolt ismétlődés).
      }
    }
    // A most lezárt elem mindig a sor eleje (lásd _advanceNotifQueue) - de csak akkor
    // vesszük ki innen, ha még tényleg ott van (defenzív: elvben mindig ott van).
    if(_notifQueue[0]===item) _notifQueue.shift();
    _activeNotifQueueItem = null;
  }
  if(_notifQueue.length>0){ _advanceNotifQueue(); }
  else { document.getElementById('sheetbg').classList.remove('open'); }
}
// A natív oldal egy terhelést (költést) jelző banki értesítésből a MÍNUSZ előjelet is
// helyesen kiolvassa (pl. "-12 345 Ft" -> -12345) - ez itt a VÁRT, gyakori eset egy
// kiadást jelző értesítésnél, nem hibás bemenet. A költés-mezőnek viszont a pozitív
// összeg kell (mennyit adott ki a felhasználó), ezért Math.abs-szal vesszük az
// előjel nélküli nagyságot - egy nullás/érvénytelen összegnél pedig marad az üres
// előtöltés, hogy a felhasználó kézzel be tudja írni.
function openBankNotificationSheet(amount, rawText){
  const cats = App.state.finance.discretionary;
  const chips = cats.map((x,idx)=>`<div class="chip${idx===0?' active':''}" data-id="${escapeHtml(x.id)}">${escapeHtml(x.icon||'🛍️')} ${escapeHtml(x.name)}</div>`).join('');
  const queueHint = _notifQueue.length>1 ? `<div class="small muted" style="margin:-4px 0 10px;">${_notifQueue.length-1} további várakozó értesítés lesz felajánlva ez után.</div>` : '';
  openSheet(`<div class="sheet-head"><div class="sheet-title">Banki értesítés</div><button class="iconbtn" onclick="closeSheet()">✕</button></div>
    ${rawText?`<div class="small muted" style="margin:-4px 0 10px;">${escapeHtml(String(rawText)).slice(0,140)}</div>`:''}
    ${queueHint}
    <div class="field"><input type="text" inputmode="numeric" id="bn-amount" style="font-size:20px;text-align:center;padding:16px;" value="${amount?fmtFtInput(Number(amount)):''}" placeholder="Ft"></div>
    <div class="field"><label>Melyik kategóriába tartozik?</label>
      <div class="chiprow" id="bn-cat">${chips || '<span class="small muted">Nincs kategória felvéve - vegyél fel egyet a Pénzügyeknél.</span>'}</div>
    </div>
    <button class="btn btn-primary btn-block" onclick="saveBankNotification()">Mentés</button>`);
  document.querySelectorAll('#bn-cat .chip').forEach(c=>c.addEventListener('click',()=>{
    document.querySelectorAll('#bn-cat .chip').forEach(x=>x.classList.remove('active')); c.classList.add('active');
  }));
  formatAmountInputLive(document.getElementById('bn-amount'));
}
function saveBankNotification(){
  const v = parseAmountInput(document.getElementById('bn-amount').value);
  if(!v || !isFinite(v) || v<=0){ toast('Adj meg egy érvényes összeget'); return; }
  const activeChip = document.querySelector('#bn-cat .chip.active');
  if(!activeChip){ toast('Válassz kategóriát'); return; }
  const x = App.state.finance.discretionary.find(i=>i.id===activeChip.dataset.id);

  checkDiscretionaryUnderBudget(x); // Ötlet #35 pénzügyi ág - ld. a definíciónál
  saveState(); _finishActiveNotifQueueItem(true); toast(dupWarning ? 'Elmentve ⚠️ '+dupWarning : 'Elmentve'); RENDERERS.finance();
}
/* findFoodDiscretionaryCategory: a meglévő "Egyéb kategóriák" (discretionary)

/* saveDiscretionaryEdits: az "Egyéb kategóriák" (discretionary) tétele eddig
   csak a nézet sorrendjében volt mozgatható/törölhető, az elköltött összeg
   pedig csak NÖVELHETŐ volt (logSpendSheet()/saveSpend(), illetve a banki/
   Foodora értesítés-lapok) - sem a megnevezés, sem az ikon, sem a havi keret
   (cél összeg) nem volt utólag módosítható, csak létrehozáskor (ld.
   addDiscretionarySheet()/saveDiscretionary()). Ez a kötelező tételeknél már
   meglévő editMandatorySheet()/saveMandatoryAmount() mintáját követi:
   közvetlenül beállítja (nem hozzáadja) az egyes mezőket, tetszőleges
   értékre - az elköltött összegnél 0-t is beleértve. */
function saveDiscretionaryEdits(id){
  const x=App.state.finance.discretionary.find(i=>i.id===id); if(!x) return;
  const name=(document.getElementById('dc-edit-name').value||'').trim();
  if(!name){ toast('Adj meg egy nevet'); return; }

function removeFinanceItem(kind,id){
  const arr=App.state.finance[kind];
  const idx=arr.findIndex(x=>x.id===id);
  if(idx===-1) return;
  const removed=arr[idx];
  arr.splice(idx,1);
  saveState();
  RENDERERS.finance();
  toastUndo('Tétel törölve', ()=>{
    App.state.finance[kind].splice(Math.min(idx,App.state.finance[kind].length),0,removed);
    saveState();
    RENDERERS.finance();
  });
}
function moveFinanceItem(kind,id,direction){
  const arr=App.state.finance[kind];
  const idx=arr.findIndex(x=>x.id===id);
  if(idx===-1) return;
  const newIdx=idx+direction;
  if(newIdx<0||newIdx>=arr.length) return;
  const tmp=arr[idx]; arr[idx]=arr[newIdx]; arr[newIdx]=tmp;
  saveState(); RENDERERS.finance();
}

/* transferBetweenAccountsSheet(): két számla (chiprow-választó, ld. a fájlban
   máshol is használt "Honnan/Hova"-jellegű mintát, pl. mn-type/bn-cat) közötti
   utalás. A "Mire teszed félre?" cél-választó chip-sáv (#tr-goal-section)
   DINAMIKUSAN frissül a "Hova" választás módosulásakor (refreshTransferGoalSection())
   - csak akkor jelenik meg, ha a JELENLEG kiválasztott célszámla type==='savings',
   így a felhasznaló sosem lát értelmetlen célválasztót egy folyószámla-célnál.
   A cél választása MINDIG opcionális (alapértelmezett: "Nincs konkrét cél / Egyéb"
   chip aktív) - ld. a felhasználó saját megfogalmazását a jegyben. */
function transferBetweenAccountsSheet(){
  const accounts = App.state.finance.accounts||[];
  if(accounts.length<2){ toast('Legalább két számla kell az utaláshoz'); return; }
  const defaultFrom = accounts.find(a=>a.type==='checking') || accounts[0];
  const defaultTo = accounts.find(a=>a.id!==defaultFrom.id && a.type==='savings') || accounts.find(a=>a.id!==defaultFrom.id) || accounts[1];
  const chipsHtml = (selectedId)=>accounts.map(a=>`<div class="chip ${a.id===selectedId?'active':''}" data-id="${escapeHtml(a.id)}">${escapeHtml(a.icon||'💳')} ${escapeHtml(a.name)}</div>`).join('');
  openSheet(`<div class="sheet-head"><div class="sheet-title">Utalás számlák között</div><button class="iconbtn" onclick="closeSheet()">✕</button></div>
    <div class="field"><label>Honnan</label><div class="chiprow" id="tr-from">${chipsHtml(defaultFrom.id)}</div></div>
    <div class="field"><label>Hova</label><div class="chiprow" id="tr-to">${chipsHtml(defaultTo.id)}</div></div>
    <div class="field"><label>Összeg (Ft)</label><input type="text" inputmode="numeric" id="tr-amount" style="font-size:20px;text-align:center;padding:16px;" placeholder="Ft"></div>
    <div id="tr-goal-section"></div>
    <button class="btn btn-primary btn-block" onclick="saveTransfer()">Utalás</button>`);
  document.querySelectorAll('#tr-from .chip').forEach(c=>c.addEventListener('click',()=>{
    document.querySelectorAll('#tr-from .chip').forEach(x=>x.classList.remove('active')); c.classList.add('active');
  }));
  document.querySelectorAll('#tr-to .chip').forEach(c=>c.addEventListener('click',()=>{
    document.querySelectorAll('#tr-to .chip').forEach(x=>x.classList.remove('active')); c.classList.add('active');
    refreshTransferGoalSection();
  }));
  formatAmountInputLive(document.getElementById('tr-amount'));
  refreshTransferGoalSection();
}
function refreshTransferGoalSection(){
  const section = document.getElementById('tr-goal-section');
  if(!section) return;
  const toChip = document.querySelector('#tr-to .chip.active');
  const toAccount = toChip ? App.state.finance.accounts.find(a=>a.id===toChip.dataset.id) : null;
  const goals = App.state.finance.savings||[];
  if(!toAccount || toAccount.type!=='savings' || !goals.length){
    section.innerHTML='';
    return;
  }
  section.innerHTML = `<div class="field"><label>Mire teszed félre?</label><div class="chiprow" id="tr-goal">
    <div class="chip active" data-id="">Nincs konkrét cél / Egyéb</div>
    ${goals.map(g=>`<div class="chip" data-id="${escapeHtml(g.id)}">${escapeHtml(g.icon||'🏦')} ${escapeHtml(g.name)}</div>`).join('')}
  </div></div>`;
  document.querySelectorAll('#tr-goal .chip').forEach(c=>c.addEventListener('click',()=>{
    document.querySelectorAll('#tr-goal .chip').forEach(x=>x.classList.remove('active')); c.classList.add('active');
  }));
}
function saveTransfer(){
  const fromChip = document.querySelector('#tr-from .chip.active');
  const toChip = document.querySelector('#tr-to .chip.active');
  if(!fromChip || !toChip){ toast('Válassz számlát'); return; }
  const fromId = fromChip.dataset.id, toId = toChip.dataset.id;
  if(fromId===toId){ toast('A forrás és a cél számla nem lehet ugyanaz'); return; }
  const fromAcc = App.state.finance.accounts.find(a=>a.id===fromId);
  const toAcc = App.state.finance.accounts.find(a=>a.id===toId);
  if(!fromAcc || !toAcc){ toast('Számla nem található'); return; }
  const amount = parseAmountInput(document.getElementById('tr-amount').value);
  if(!amount || amount<=0){ toast('Adj meg egy érvényes összeget'); return; }
  if(amount > (fromAcc.balance||0)){ toast('Nincs elég egyenleg ezen a számlán'); return; }
  fromAcc.balance = (fromAcc.balance||0) - amount;
  toAcc.balance = (toAcc.balance||0) + amount;
  let goalName = null;
  if(toAcc.type==='savings'){
    const goalChip = document.querySelector('#tr-goal .chip.active');
    const goalId = goalChip ? goalChip.dataset.id : '';
    if(goalId){
      const goal = App.state.finance.savings.find(g=>g.id===goalId);
      if(goal){
        goal.saved = (goal.saved||0) + amount;
        checkSavingsGoalMilestone(goal); // parity a saveSavingsAdd()/saveSavingsEdits() hívásával
        goalName = goal.name;
      }
    }
  }
  saveState(); closeSheet();
  toast('Elutalva '+amount.toLocaleString('hu-HU')+' Ft: '+fromAcc.name+' → '+toAcc.name+(goalName?' (cél: '+goalName+')':''));
  RENDERERS.finance();
}

function renderNutHonap(c){
  const ref=new Date(App.ui.nutRef+'T00:00:00');
  const year=ref.getFullYear(), month=ref.getMonth();
  const monthNames=['Január','Február','Március','Április','Május','Június','Július','Augusztus','Szeptember','Október','November','December'];
  const daysInMonth=new Date(year,month+1,0).getDate();
  const n=App.state.nutrition;
  let totals=[], loggedDays=0, sum=0;
  for(let d=1;d<=daysInMonth;d++){
    const iso=year+'-'+pad(month+1)+'-'+pad(d);
    const k=n.log.filter(x=>x.date===iso).reduce((s,x)=>s+x.kcal,0);
    totals.push(k); if(k>0){ loggedDays++; sum+=k; }
  }
  const avg=loggedDays? Math.round(sum/loggedDays) : 0;
  c.innerHTML = `

  `;
  requestAnimationFrame(()=>{ const cv=document.getElementById('chart-nutmonth'); if(cv) drawKcalBars(cv, [], totals, n.targets.kcal, true); });
}
function drawKcalBars(canvas,labels,values,target,dense){
  const ctx=setupCanvas(canvas), w=canvas._cssW, h=canvas._cssH;
  ctx.clearRect(0,0,w,h);
  const max=Math.max(target||0,...values,1);
  const bw=w/values.length;
  if(target){
    const ty=h-16-(target/max)*(h-26);
    ctx.strokeStyle='#D9A441'; ctx.setLineDash([4,3]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,ty); ctx.lineTo(w,ty); ctx.stroke(); ctx.setLineDash([]);
  }
  values.forEach((v,i)=>{
    const bh=(v/max)*(h-26);
    ctx.fillStyle = v>0? '#4A85AC':'#242F29';
    roundRectPath(ctx, i*bw+bw*(dense?0.15:0.22), h-bh-16, bw*(dense?0.7:0.56), Math.max(bh,1), dense?1:4);
    ctx.fill();
    if(!dense){ ctx.fillStyle='#93A79A'; ctx.font='8px IBM Plex Mono'; ctx.textAlign='center'; ctx.fillText(labels[i]||'', i*bw+bw*0.5, h-6); }
  });
}

  /* schemaVersion/exportedAt: csak kiegészítő metaadat, az applyImportedJson()
     alapját adó defaultState()-re épülő betöltés ismeretlen mezőként
     figyelmen kívül hagyja őket, így a formátum visszafelé kompatibilis
     marad. Célja: egy jövőbeli (pl. APK-) verzió biztosan azonosítani
     tudja, milyen állapotból jött a mentés. */
  return Object.assign({schemaVersion:APP_VERSION, exportedAt:new Date().toISOString()}, App.state);
}
/* Visszatérési érték: sikerült-e ténylegesen elindítani a mentést (a natív ágon
   ez azt jelenti, hogy a window.AndroidBackup.exportJson hívás magát nem dobott
   kivételt - a tényleges fájlírás onnantól a natív "Mentés másként" dialóguson
   át aszinkron történik, saját natív Toast-tal). A hívónak (saveToFile()) ez
   alapján KELL eldöntenie, hogy mutat-e sikert jelző toast-ot: korábban
   saveToFile() ezt a visszatérési értéket figyelmen kívül hagyva mindig
   'Exportálva'-t jelzett, ami egy dobott kivétel esetén az itteni hibaüzenetet
   ugyanabban a szinkron blokkban felülírta (a toast() csak az utolsó hívást
   mutatja egy blokkon belül) - a felhasználó hamis sikerüzenetet látott,
   miközben a mentés valójában meg sem történt. */
function exportData(){
  const payload = buildExportPayload();
  const json = JSON.stringify(payload,null,2);
  const filename = 'motivapp-mentes-'+todayISO()+'.json';
  /* A natív Android WebView nem kezeli le a lenti <a download> blob-linket (nincs
     beépített letöltés-támogatása) - ott a natív AndroidBackup hidat használjuk,
     ami a rendszer "Mentés másként" ablakán keresztül tényleg fájlba írja.
     Böngészőben/telepített webes verzióban window.AndroidBackup nincs jelen, ott
     marad a lenti, eddig is működő blob-alapú letöltés. */
  if(typeof window.AndroidBackup!=='undefined' && window.AndroidBackup){
    try{ window.AndroidBackup.exportJson(json, filename); return true; }
    catch(e){ toast('Hiba az exportálás natív indításakor.'); return false; }
  }
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
  return true;
}
/* applyImportedJson: a betöltött fájl szövegéből a jelenlegi App.state-et
   építi fel (parse + a defaultState()-re épülő merge + a régi/hiányzó
   mezők pótlása). A klasszikus <input type=file> alapú importData()/
   confirmImportData() párost ÉS az új, File System Access API-s
   betöltési útvonalakat (confirmImportFromHandle()/pickAnotherFileForImport())
   is ez szolgálja ki, hogy a merge-logika egy helyen éljen. Hibás fájl
   esetén dob — a hívó felel a toast/closeSheet kezeléséért. */
function applyImportedJson(text){
  const parsed = JSON.parse(text);
  if(!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('invalid root');
  const d = defaultState();
  const next = Object.assign({}, d, parsed);
  /* Mélyebb ellenőrzés/pótlás a loadState() mintája alapján, kiterjesztve */
  if(!next.finance || typeof next.finance !== 'object' || !Array.isArray(next.finance.mandatory)){
    const oldIncome = (next.finance && next.finance.monthlyIncome) || 0;
    next.finance = d.finance;
    next.finance.monthlyIncome = oldIncome;
  }
  if(!Array.isArray(next.finance.discretionary)) next.finance.discretionary = d.finance.discretionary;
  if(!Array.isArray(next.finance.savings)) next.finance.savings = d.finance.savings;
  if(!Array.isArray(next.finance.foodOrders)) next.finance.foodOrders = d.finance.foodOrders;
  if(!Array.isArray(next.finance.spendLedger)) next.finance.spendLedger = d.finance.spendLedger;
  if(!Array.isArray(next.finance.accounts)) next.finance.accounts = d.finance.accounts;
  if(!Array.isArray(next.finance.incomeSources)){
    const legacyIncome = next.finance.monthlyIncome||0;
    next.finance.incomeSources = legacyIncome>0 ? [{id:'inc1',name:'Fizetés',amount:legacyIncome}] : d.finance.incomeSources;
  }
  for(const k of ['tasks','events','workouts','weightLog','healthLog','journeys','journal','aiChat','activities','customSports','customSkillNodes']){
    if(!Array.isArray(next[k])) next[k] = d[k];
  }
  if(!next.skills || typeof next.skills !== 'object') next.skills = {};
  if(!next.aiPerm || typeof next.aiPerm !== 'object') next.aiPerm = d.aiPerm;
  if(!next.healthConnect || typeof next.healthConnect !== 'object') next.healthConnect = d.healthConnect;
  if(!next.rpg || typeof next.rpg !== 'object') next.rpg = d.rpg;
  if(!next.rpg.meta || typeof next.rpg.meta !== 'object') next.rpg.meta = d.rpg.meta;
  if(!Array.isArray(next.rpg.weeks)) next.rpg.weeks = d.rpg.weeks;
  rpgMigrateToCycleWeeks(next.rpg, next.schedule && next.schedule.pattern);
  if(next.rpg.weeks.length !== (next.rpg.meta.weeksTotal||52)) next.rpg.weeks = Array.from({length:(next.rpg.meta.weeksTotal||52)}, ()=>({quests:[]}));
  next.rpg.weeks = next.rpg.weeks.map(w=> (w && Array.isArray(w.quests)) ? w : {quests:[]});
  if(!Array.isArray(next.rpg.quarterReflections) || next.rpg.quarterReflections.length !== 4) next.rpg.quarterReflections = ['','','',''];
  if(!Array.isArray(next.rpg.favorites)) next.rpg.favorites = [];
  if(!Array.isArray(next.rpg.bossNotified)) next.rpg.bossNotified = [];
  if(!Array.isArray(next.rpg.cycleSummaryNotified)) next.rpg.cycleSummaryNotified = [];
  if(typeof next.rpg.onboarded !== 'boolean') next.rpg.onboarded = false;
  if(!next.nutrition || typeof next.nutrition !== 'object'){
    next.nutrition = d.nutrition;
  } else {
    if(!next.nutrition.targets || typeof next.nutrition.targets !== 'object') next.nutrition.targets = d.nutrition.targets;
    if(!Array.isArray(next.nutrition.log)) next.nutrition.log = d.nutrition.log;
  }
  sanitizeImportedIdsAndIcons(next);
  App.state = next;
  saveState();
}
function importConfirmSheetHtml(onConfirmFn){
  return `<div class="sheet-head"><div class="sheet-title">Biztosan importálod?</div><button class="iconbtn" onclick="closeSheet()">✕</button></div>
    <div class="small muted" style="margin-bottom:16px;">Ez felülírja a jelenlegi adataidat a kiválasztott fájl tartalmával. A művelet nem vonható vissza.</div>
    <button class="btn btn-danger btn-block" onclick="${onConfirmFn}()">Igen, importálom</button>`;
}
let _pendingImportFile = null;
function importData(evt){
  const file=evt.target.files[0]; if(!file) return;
  _pendingImportFile = file;
  evt.target.value='';
  openSheet(importConfirmSheetHtml('confirmImportData'));
}
function confirmImportData(){
  const file = _pendingImportFile;
  _pendingImportFile = null;
  if(!file){ closeSheet(); return; }
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      applyImportedJson(e.target.result);
      closeSheet(); toast('Importálva'); renderApp();
    }catch(err){ closeSheet(); toast('Hibás fájl'); }
  };
  reader.readAsText(file);
}

/* ---- Mentés/betöltés fájlba (File System Access API, progresszív ráépülés) ----
   saveToFile(): ha van elmentett, írható handle -> közvetlenül ír bele
   (nincs fájlválasztó dialógus). Ha nincs handle, a permission nem
   adható meg, vagy az írás elszáll (pl. a fájlt időközben törölték) ->
   showSaveFilePicker()-rel kér új célfájlt, és azt jegyzi meg jövőre.
   Ha a File System Access API egyáltalán nem elérhető (pl. sok
   Android/TWA Chrome build), vagy bármi más okból elszáll a fenti (a
   felhasználó általi dialógus-megszakítás kivételével) -> visszaesik a
   megszokott exportData() letöltésre. A háromféle kimenetet (közvetlen
   írás / letöltéses fallback / sima letöltés FS Access nélkül) külön
   toast szöveg jelzi, hogy a felhasználó lássa, mi történt valójában. */
async function saveToFile(){
  if(hasFSAccess){
    let handle = null;
    try{ handle = await getStoredHandle(); }catch(e){ handle = null; }
    let granted = false;
    if(handle){
      try{
        let perm = await handle.queryPermission({mode:'readwrite'});
        if(perm !== 'granted') perm = await handle.requestPermission({mode:'readwrite'});
        granted = (perm === 'granted');
      }catch(e){ granted = false; }
    }
    if(handle && granted){
      try{
        const payload = buildExportPayload();
        const w = await handle.createWritable();
        await w.write(JSON.stringify(payload,null,2));
        await w.close();
        markBackupSaved('Mentve');
        return;
      }catch(e){ /* pl. a fájlt időközben törölték -> essünk vissza a választóra alább */ }
    }
    try{
      const newHandle = await window.showSaveFilePicker({suggestedName:'motivapp-mentes.json', types:[{description:'MotivApp mentés', accept:{'application/json':['.json']}}]});
      const payload = buildExportPayload();
      const w = await newHandle.createWritable();
      await w.write(JSON.stringify(payload,null,2));
      await w.close();
      await setStoredHandle(newHandle);
      markBackupSaved('Mentve');
    }catch(e){
      if(e && e.name === 'AbortError') return; // a felhasználó bezárta a fájlválasztót — nincs teendő
      // Csak akkor jelezzünk (a valós helyzethez képest túl derűlátó) fallback-sikert,
      // ha az exportData() alatti letöltés/natív hívás ténylegesen elindult - különben
      // ez a toast felülírná (és elrejtené) az exportData() saját hibaüzenetét.
      if(exportData()) markBackupSaved('Nem sikerült közvetlenül menteni — letöltés indult helyette');
    }
    return;
  }
  if(exportData()) markBackupSaved('Exportálva');
}
function markBackupSaved(msg){
  App.state.lastBackupAt = new Date().toISOString();
  saveState();
  toast(msg);
  const line = document.getElementById('backup-status-line');
  if(line) line.outerHTML = `<div id="backup-status-line">${backupStatusLineHtml()}</div>`;
}
function backupStatusLineHtml(){
  if(App.state.lastBackupAt){
    const d = new Date(App.state.lastBackupAt);
    const iso = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    return `<div class="small g" style="text-align:center;margin-top:8px;">Utolsó mentés: ${fmtDateHu(iso)} · ${fmtTime(d)}</div>`;
  }
  return `<div class="small g" style="text-align:center;margin-top:8px;">Még nem készült biztonsági mentés</div>`;
}
/* loadFromFile(): ha van elmentett, olvasható handle -> kis menüt ajánl fel
   (gyors betöltés a mentett fájlból, vagy másik fájl választása — mindkettő
   a megszokott "Ez felülírja..." megerősítő sheeten megy át, mielőtt az
   adatok tényleg felülíródnának). Ha nincs használható handle, de van File
   System Access API -> egyből natív fájlválasztót nyit (és megjegyzi az
   így választott fájlt jövőre). Ha nincs File System Access API -> a
   megszokott <input type=file> alapú folyamat fut, változatlanul. */
let _pendingImportHandle = null;
async function loadFromFile(){
  if(hasFSAccess){
    let handle = null;
    try{ handle = await getStoredHandle(); }catch(e){ handle = null; }
    let canReadDirect = false;
    if(handle){
      try{
        let perm = await handle.queryPermission({mode:'read'});
        if(perm !== 'granted') perm = await handle.requestPermission({mode:'read'});
        canReadDirect = (perm === 'granted');
      }catch(e){ canReadDirect = false; }
    }
    if(handle && canReadDirect){
      _pendingImportHandle = handle;
      openSheet(`<div class="sheet-head"><div class="sheet-title">Betöltés</div><button class="iconbtn" onclick="closeSheet()">✕</button></div>
        <div class="card" style="padding:2px 16px;">
          <div class="menurow" role="button" tabindex="0" onclick="confirmImportFromHandle()" onkeydown="kbActivate(event,()=>confirmImportFromHandle())"><span class="ic">📂</span><span class="lb">Betöltés a mentett fájlból</span></div>
          <div class="menurow" role="button" tabindex="0" onclick="pickAnotherFileForImport()" onkeydown="kbActivate(event,()=>pickAnotherFileForImport())"><span class="ic">📁</span><span class="lb">Másik fájl kiválasztása…</span></div>
        </div>`);
      return;
    }
    await pickAnotherFileForImport();
    return;
  }
  document.getElementById('import-file').click();
}
function confirmImportFromHandle(){
  if(!_pendingImportHandle){ closeSheet(); return; }
  openSheet(importConfirmSheetHtml('applyImportFromHandle'));
}
async function pickAnotherFileForImport(){
  closeSheet();
  if(!hasFSAccess){ document.getElementById('import-file').click(); return; }
  try{
    const [handle] = await window.showOpenFilePicker({types:[{description:'MotivApp mentés', accept:{'application/json':['.json']}}]});
    _pendingImportHandle = handle;
    await setStoredHandle(handle); // ez lesz a jövőbeli mentések/betöltések alapértelmezett célfájlja is
    openSheet(importConfirmSheetHtml('applyImportFromHandle'));
  }catch(e){
    if(e && e.name === 'AbortError') return; // a felhasználó bezárta a fájlválasztót — nincs teendő
    document.getElementById('import-file').click();
  }
}
async function applyImportFromHandle(){
  const handle = _pendingImportHandle;
  _pendingImportHandle = null;
  if(!handle){ closeSheet(); return; }
  try{
    const text = await (await handle.getFile()).text();
    applyImportedJson(text);
    closeSheet(); toast('Betöltve'); renderApp();
  }catch(err){ closeSheet(); toast('Hibás fájl'); }
}
function confirmReset(){
  openSheet(`<div class="sheet-head"><div class="sheet-title">Biztosan törlöd?</div><button class="iconbtn" onclick="closeSheet()">✕</button></div>
    <div class="small muted" style="margin-bottom:16px;">Ez minden feladatot, edzést, túrát és beállítást véglegesen töröl erről az eszközről.</div>
    <button class="btn btn-danger btn-block" onclick="resetAllData()">Igen, törlöm mindet</button>`);
}
function resetAllData(){ App.state=defaultState(); saveState(); closeSheet(); toast('Törölve'); renderApp(); }

/* ================= Health Connect natív híd (window.AndroidHealth) =================
   A natív Android WebView app (MainWebViewActivity.kt) betölti a window.AndroidHealth
   objektumot a WebView-ba, ha a lap natív alkalmazásban fut. Böngészőben / telepített
   webes (TWA) verzióban window.AndroidHealth marad undefined – ez a normális, elvárt
   eset, mindenhol ellenőrizve van, nem dob kivételt.
   Interfész-szerződés (a natív oldal, HealthConnectBridge.kt, ehhez illeszkedik, NE
   változtasd egyoldalúan):
     window.AndroidHealth.isAvailable()        -> SZINKRON boolean (van-e Health Connect a készüléken)
     window.AndroidHealth.requestPermissions() -> ASZINKRON, eredmény window.onAndroidHealthResult-on jön
     window.AndroidHealth.syncToday()          -> ASZINKRON, eredmény window.onAndroidHealthResult-on jön
     window.AndroidHealth.getPendingBackgroundResult() -> SZINKRON, a natív WorkManager-worker
       (HealthSyncWorker) által háttérben már lekért, még fel nem dolgozott eredmény JSON
       stringje, vagy null/üres string, ha nincs ilyen
   A natív oldal MINDIG window.onAndroidHealthResult(payload) hívásával válaszol:
     {type:'availability'|'permissions'|'data'|'error', available, granted, message,
      steps, sleepH, pulse, distanceKm, floorsClimbed, caloriesBurned, exerciseMin, weightKg}
   Minden mező opcionális – ha egy adattípusra nincs engedély, vagy a natív oldal nem
   tudta lekérni, egyszerűen hiányzik a payloadból.
   A lépés/alvás/pulzus/táv/szint/kalória/edzésidő UGYANABBA az App.state.healthLog
   bejegyzésbe kerül, amit a kézi quickLogSheet/saveQuickLog is használ (ld. ~1050. sor
   körül), így a "Ma" nézet Gyors napló kártyái pontosan úgy jelenítik meg őket, mintha
   kézzel írták volna be. A testsúly (weightKg) ehelyett a meglévő App.state.weightLog-ba
   kerül (ugyanaz a {date,kg} alak, mint a kézi testsúly-rögzítésnél). A kézi bevitel
   emiatt teljesen érintetlen és önmagában (natív híd/Health Connect nélkül, böngészőben
   is) működőképes marad. */
function androidHealthAvailable(){
  return typeof window!=='undefined' && typeof window.AndroidHealth!=='undefined' && !!window.AndroidHealth;
}
function syncHealthConnect(){
  if(!androidHealthAvailable()){
    toast('Ez a funkció csak a natív alkalmazásban érhető el.');
    return;
  }
  let available = false;
  try{ available = !!window.AndroidHealth.isAvailable(); }
  catch(e){ toast('Hiba a Health Connect elérhetőségének ellenőrzésekor.'); return; }
  if(!available){
    toast('Nincs telepítve Health Connect ezen a készüléken.');
    return;
  }
  try{ window.AndroidHealth.requestPermissions(); }
  catch(e){ toast('Hiba a Health Connect engedélykérés indításakor.'); }
}
/* window.AndroidNotifAccess (NotificationAccessBridge.kt): diagnosztikai/teszt híd a
   banki/Foodora értesítés-figyelőhöz (NotificationForwarderService). Azért kell, mert a
   natív oldal onListenerConnected()-alapú automatikus "pótold be a már ott ülő
   értesítéseket" logikája CSAK akkor fut le, amikor az OS ténylegesen (újra)csatlakoztatja
   a listenert (engedély megadásakor, újraindításnál, app-frissítésnél) - ezt a
   felhasználó nem tudja közvetlenül kikényszeríteni, és azt sem látja, hogy egyáltalán
   meg van-e adva az engedély / csatlakoztatva van-e épp a szolgáltatás. Ez a gomb erre ad
   módot: a jóváhagyás státuszát/beállítását, és a szolgáltatás kézi, azonnali
   újra-átvizsgálását a jelenleg is aktív (még el nem dobott) értesítésekre. */
function androidNotifAccessAvailable(){
  return typeof window!=='undefined' && typeof window.AndroidNotifAccess!=='undefined' && !!window.AndroidNotifAccess;
}
function notifAccessGranted(){
  if(!androidNotifAccessAvailable()) return false;
  try{ return !!window.AndroidNotifAccess.isAccessGranted(); }
  catch(e){ return false; }
}
function testNotificationAccess(){
  if(!androidNotifAccessAvailable()){ toast('Ez a funkció csak a natív alkalmazásban érhető el.'); return; }
  if(!notifAccessGranted()){
    toast('Nincs megadva az értesítés-hozzáférés — megnyitom a rendszerbeállítást, ott engedélyezd a MotivApp-ot.');
    try{ window.AndroidNotifAccess.openAccessSettings(); }
    catch(e){ toast('Hiba a beállítások megnyitásakor.'); }
    return;
  }
  let result;
  try{ result = JSON.parse(window.AndroidNotifAccess.testScanNow()); }
  catch(e){ toast('Hiba a teszt-ellenőrzés közben.'); return; }
  if(!result.listenerConnected){
    toast('Az értesítés-figyelő szolgáltatás jelenleg nincs csatlakoztatva az Androidhoz — próbáld pár másodperc múlva újra, vagy indítsd újra az appot.');
  }else if(result.savedCount>0){
    toast('✓ '+result.savedCount+' feldolgozható banki/Foodora értesítést találtam — mindjárt megjelenik a jóváhagyó lap.');
  }else if(result.candidatesFound>0){
    toast('Találtam '+result.candidatesFound+' banki/Foodora értesítést, de egyikben sem ismertem fel forint-összeget.');
  }else{
    toast('Nem találtam banki/Foodora értesítést az értesítési sávban jelenleg.');
  }
  RENDERERS.integrations();
}
/* A natív oldal ezt hívja meg globálisan, a fenti három AndroidHealth-hívás
   eredményeként. Böngészőben ezt soha senki nem hívja meg, de a függvénynek
   attól még biztonságosan léteznie kell (nem szabad kivételt dobnia semmilyen
   hiányzó/hibás payload mezőnél). */
window.onAndroidHealthResult = function(payload){
  try{
    payload = payload || {};
    switch(payload.type){
      case 'data': {
        const iso = todayISO();
        let entry = App.state.healthLog.find(h=>h.date===iso);
        if(!entry){ entry={date:iso}; App.state.healthLog.push(entry); }
        const parts = [];
        if(payload.steps!=null && !isNaN(payload.steps)){ entry.steps = payload.steps; parts.push(payload.steps+' lépés'); }
        if(payload.sleepH!=null && !isNaN(payload.sleepH)){ entry.sleepH = payload.sleepH; parts.push(payload.sleepH+' óra alvás'); }
        if(payload.pulse!=null && !isNaN(payload.pulse)){ entry.pulse = payload.pulse; parts.push(payload.pulse+' bpm pulzus'); }
        if(payload.distanceKm!=null && !isNaN(payload.distanceKm)){ entry.distanceKm = payload.distanceKm; parts.push(payload.distanceKm.toFixed(1)+' km'); }
        if(payload.floorsClimbed!=null && !isNaN(payload.floorsClimbed)){ entry.floorsClimbed = payload.floorsClimbed; parts.push(payload.floorsClimbed+' szint'); }
        if(payload.caloriesBurned!=null && !isNaN(payload.caloriesBurned)){ entry.caloriesBurned = Math.round(payload.caloriesBurned); parts.push(Math.round(payload.caloriesBurned)+' kcal elégetve'); }
        if(payload.exerciseMin!=null && !isNaN(payload.exerciseMin)){ entry.exerciseMin = payload.exerciseMin; parts.push(payload.exerciseMin+' perc edzés'); }
        // A testsúly nem a healthLog-ba, hanem a meglévő weightLog-ba kerül – ugyanaz
        // a {date,kg} alak, mint amit a kézi "Testsúly rögzítése" funkció ír. Ha aznapra
        // már van bejegyzés (pl. kézzel is beírták), azt frissítjük, nem duplikáljuk.
        if(payload.weightKg!=null && !isNaN(payload.weightKg)){
          let w = App.state.weightLog.find(x=>x.date===iso);
          if(w){ w.kg = payload.weightKg; } else { App.state.weightLog.push({date:iso,kg:payload.weightKg}); }
          parts.push(payload.weightKg.toFixed(1)+' kg');
        }
        App.state.healthConnect.lastSyncAt = Date.now();
        saveState();
        if(typeof renderApp==='function') renderApp();
        toast(parts.length ? ('Health Connect adatok szinkronizálva: '+parts.join(', ')) : 'Health Connect szinkron megtörtént, de nem érkezett adat.');
        break;
      }
      case 'permissions':
        App.state.healthConnect.granted = !!payload.granted;
        saveState();
        // A natív oldal (HealthConnectBridge.kt) engedélyezés után MAGA is azonnal
        // meghívja a syncToday()-t (nem kell 15 percet várni az első adatra) - itt
        // nem hívjuk meg újra, az csak egy felesleges dupla lekérdezést/toast-ot adna.
        if(!payload.granted){
          toast('A Health Connect hozzáférés nincs engedélyezve.');
        }
        break;
      case 'availability':
        if(payload.available===false){ toast('Nincs telepítve Health Connect ezen a készüléken.'); }
        break;
      case 'error':
        toast((payload.message && typeof payload.message==='string') ? ('Health Connect hiba: '+payload.message) : 'Hiba történt a Health Connect szinkron közben.');
        break;
      default:
        // Ismeretlen/hiányzó type – csendben figyelmen kívül hagyjuk, nem dobunk kivételt.
        break;
    }
  }catch(e){
    console.warn('onAndroidHealthResult feldolgozási hiba', e);
  }
};

/* ===== Health Connect automatikus időszakos szinkron (előtérben) =====
   Korábban a lépés/alvás/pulzus adat KIZÁRÓLAG kézi gombnyomásra ("Szinkronizálás
   Health Connect-ből") frissült volna. Az alábbi kód ezt egészíti ki egy csendes,
   automatikus lekérdezéssel – DE csak akkor, ha a felhasználó korábban már egyszer
   kézzel megadta az engedélyt (App.state.healthConnect.granted). Enélkül az
   automatikus hívás soha nem dob fel saját magától rendszer-engedélykérő ablakot – az
   mindig csak explicit felhasználói művelet (a fenti gomb) hatására jelenik meg.
   Ez a WebView csak előtérben fut ilyen gyakran; a natív WorkManager-worker
   (HealthSyncWorker, 15 percenként) egészíti ki ezt háttérben/becsukott app mellett. */
const HEALTH_AUTO_SYNC_INTERVAL_MS = 5*60*1000; // 5 percenként, amíg az app előtérben fut
const HEALTH_AUTO_SYNC_MIN_GAP_MS = 60*1000; // ennél sűrűbben (pl. gyors visibilitychange-váltásoknál) nem szinkronizálunk újra
let _healthAutoSyncTimer = null;
function autoSyncHealthConnect(){
  if(!androidHealthAvailable() || !App.state || !App.state.healthConnect || !App.state.healthConnect.granted) return;
  const last = App.state.healthConnect.lastSyncAt || 0;
  if(Date.now() - last < HEALTH_AUTO_SYNC_MIN_GAP_MS) return;
  try{ window.AndroidHealth.syncToday(); }
  catch(e){ /* csendben elnyeljük – automata próbálkozásnál nem akarunk hibaüzenettel zavarni, a következő időzített körben úgyis újrapróbálja */ }
}
function startHealthAutoSync(){
  if(_healthAutoSyncTimer) return;
  // Rövid késleltetés induláskor, hogy a WebView/natív híd (window.AndroidHealth)
  // biztosan betöltődjön, mielőtt az első automata szinkront megpróbálnánk.
  setTimeout(autoSyncHealthConnect, 3000);
  _healthAutoSyncTimer = setInterval(autoSyncHealthConnect, HEALTH_AUTO_SYNC_INTERVAL_MS);
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible') autoSyncHealthConnect();
});
/* A window.AndroidHealth.getPendingBackgroundResult() a natív WorkManager-worker
   (HealthSyncWorker) által, teljesen a WebView-tól/az app megnyitásától függetlenül,
   háttérben lekért, még fel nem dolgozott legutóbbi eredményt adja vissza JSON
   stringként (vagy null/üres stringet, ha nincs ilyen). A meglévő onAndroidHealthResult
   feldolgozóba küldjük, hogy a becsukott app közben natívan gyűjtött lépés/alvás/pulzus
   adat is megjelenjen, amint legközelebb megnyitod az appot – enélkül a natív
   háttér-worker eredménye elveszne. Szándékosan az init() -ből (App.state betöltése
   UTÁN) hívjuk, nem itt közvetlenül a szkript tetején – a natív oldal MINDIG szinkron
   window.onAndroidHealthResult()-tal válaszol, ami App.state-et olvas/ír, tehát ennek
   előbb be kell töltődnie. */
function pullPendingBackgroundHealthResult(){
  if(!androidHealthAvailable()) return;
  try{
    const pending = window.AndroidHealth.getPendingBackgroundResult();
    if(pending){ window.onAndroidHealthResult(JSON.parse(pending)); }
  }catch(e){ console.warn('pullPendingBackgroundHealthResult hiba', e); }
}

/* ================= B2) Böngésző-emlékeztető (Notification API) =================
   Önálló, a többi modultól független mechanizmus. Kizárólag OLVASSA az
   App.state.tasks / App.state.events adatokat, nem írja azokat. Csak addig
   működik, amíg ez a böngészőlap nyitva van a böngészőben – zárolt telefonon
   vagy bezárt appnál NEM érkezik értesítés (ahhoz szerver + Push API +
   Service Worker + telepített PWA kellene, ami jelenleg nincs). */
let _reminderTimer=null;
const _remindedIds=new Set();
function notificationsSupported(){ return typeof Notification!=='undefined'; }
function notificationStatusText(){
  if(!notificationsSupported()) return 'A böngésződ nem támogatja az értesítéseket.';
  if(Notification.permission==='granted') return 'Bekapcsolva – csak amíg ez a lap nyitva van.';
  if(Notification.permission==='denied') return 'Letiltva a böngésző beállításaiban.';
  return 'Még nincs bekapcsolva.';
}
function checkDueReminders(){
  if(!notificationsSupported() || Notification.permission!=='granted') return;
  const iso=todayISO();
  const now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
  (App.state.events||[]).forEach(e=>{
    if(e.date!==iso || !e.time || _remindedIds.has('e:'+e.id)) return;
    const parts=e.time.split(':'); const hh=parseInt(parts[0],10), mm=parseInt(parts[1],10);
    if(isNaN(hh)||isNaN(mm)) return;
    const evMin=hh*60+mm;
    if(nowMin>=evMin && nowMin-evMin<=5){
      _remindedIds.add('e:'+e.id);
      try{ new Notification('MotivApp emlékeztető', {body:e.title||'Esemény most kezdődik'}); }catch(err){}
    }
  });
  (App.state.tasks||[]).forEach(t=>{
    if(t.done || t.due!==iso || _remindedIds.has('t:'+t.id)) return;
    _remindedIds.add('t:'+t.id);
    try{ new Notification('MotivApp emlékeztető', {body:'Ma esedékes: '+(t.title||'feladat')}); }catch(err){}
  });
}
function startReminderTimer(){
  if(_reminderTimer) return;
  checkDueReminders();
  _reminderTimer=setInterval(checkDueReminders,60000);
}
function enableBrowserNotifications(){
  if(!notificationsSupported()){ toast('A böngésződ nem támogatja az értesítéseket.'); return; }
  Notification.requestPermission().then(perm=>{
    if(perm==='granted'){ startReminderTimer(); toast('Böngésző-emlékeztetők bekapcsolva'); }
    RENDERERS.integrations();
  }).catch(()=>{ RENDERERS.integrations(); });
}
if(notificationsSupported() && Notification.permission==='granted'){ startReminderTimer(); }

/* Hét/ciklus-hossz: a felhasználó saját munkarend-mintájához (App.state.schedule.pattern)
   igazítva, nem fix naptári 7 naphoz - pl. egy 3 munka+3 pihi+3 este+3 pihi (12 napos)
   ciklusnál minden Életkampány-"hét" pontosan egy teljes ciklust fed le. Ezt (és az
   ebből adódó teljes hetek számát, úgy méretezve, hogy a teljes kampány nagyjából 1
   évig tartson) EGYSZER, a kampány indulásakor/migrálásakor rögzítjük rpg.meta.cycleDays/
   weeksTotal mezőkben (ld. rpgMigrateToCycleWeeks + loadState()/applyImportedJson()) -
   ha valaki KÉSŐBB módosítja a munkarendjét, ez szándékosan NEM csúsztatja el újra a
   már elkezdett kampányt (csak egy Kampány újrakezdésekor vesszük figyelembe a friss
   mintát). A ||7/||52 alapértékek csak a migráció lefutása ELŐTTI, átmeneti állapotra
   vonatkoznak (pl. defaultState() még nem migrált rpg objektuma). */
function rpgCycleDays(){ return (App.state.rpg.meta && App.state.rpg.meta.cycleDays) || 7; }
function rpgWeeksTotal(){ return (App.state.rpg.meta && App.state.rpg.meta.weeksTotal) || 52; }
function rpgWeeksPerQuarter(){ return Math.ceil(rpgWeeksTotal()/4); }
// A qIndex-edik (0-3) negyedév UTOLSÓ hete - az utolsó negyedév rövidebb lehet, ha
// a weeksTotal nem osztható néggyel, ezért clamp-elve van weeksTotal-ra.
function rpgQuarterBoundary(qIndex){ return Math.min(rpgWeeksTotal(), rpgWeeksPerQuarter()*(qIndex+1)); }

/* Meglévő (naptári-heti) Életkampány-adat egyszeri átalakítása ciklus-alapúra: a már
   TELJESÍTETT küldetéseket a doneAt valós dátuma alapján soroljuk be az új ciklus-
   indexbe, a még nem teljesítetteket (nincs valós dátumuk, amihez igazodni lehetne)
   az éppen aktuális ciklusba - ez az egyetlen dátum nélkül is értelmes hely számukra.
   A bossNotified-et törli, mert a negyedév-határok is eltolódnak (különben egy már
   "értesítve" jelölt negyedév hamisan elnyomna egy valódi, új boss-legyőzés
   értesítést). Idempotens: ha rpg.meta.cycleDays már be van állítva, nem csinál
   semmit - ez teszi biztonságossá, hogy MINDEN loadState()/applyImportedJson()
   lefutáskor meghívjuk. */
function rpgMigrateToCycleWeeks(rpg, schedulePattern){
  if(rpg.meta && typeof rpg.meta.cycleDays === 'number') return;
  const cycleDays = Math.max(1, (schedulePattern && schedulePattern.length) || 7);
  const weeksTotal = Math.max(4, Math.round(365/cycleDays));
  const startDate = new Date((rpg.meta.startDate || todayISO()) + 'T00:00:00');
  const newWeeks = Array.from({length:weeksTotal}, ()=>({quests:[]}));
  const curIdx = Math.min(weeksTotal-1, Math.max(0, Math.floor((Date.now()-startDate.getTime())/86400000/cycleDays)));
  (rpg.weeks||[]).forEach(w=>{
    (w && Array.isArray(w.quests) ? w.quests : []).forEach(q=>{
      let idx = curIdx;
      if(q.done && q.doneAt){
        const doneDate = new Date(q.doneAt);
        if(!isNaN(doneDate.getTime())){
          idx = Math.floor((doneDate.getTime()-startDate.getTime())/86400000/cycleDays);
          idx = Math.min(weeksTotal-1, Math.max(0, idx));
        }
      }
      newWeeks[idx].quests.push(q);
    });
  });
  rpg.weeks = newWeeks;
  rpg.meta.cycleDays = cycleDays;
  rpg.meta.weeksTotal = weeksTotal;
  rpg.bossNotified = [];
  rpg.cycleSummaryNotified = []; // a ciklusindexek is újrasorszámozódnak, a régi jelölések értelmüket vesztik (ld. bossNotified fent)
}
