<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MotivApp 2.0</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12181A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ===== TOKENS ===== */
:root{
  --ink:#12181A;
  --surface:#1C2521;
  --surface-2:#242F29;
  --surface-3:#2C3830;
  --line:rgba(237,233,221,0.10);
  --line-strong:rgba(237,233,221,0.18);
  --paper:#EDE9DD;
  --muted:#93A79A;
  --muted-2:#6C8177;
  --trail-red:#C1432B;
  --trail-red-bg:rgba(193,67,43,0.16);
  --trail-blue:#4A85AC;
  --trail-blue-bg:rgba(74,133,172,0.16);
  --trail-yellow:#D9A441;
  --trail-yellow-bg:rgba(217,164,65,0.16);
  --trail-green:#5C8F62;
  --trail-green-bg:rgba(92,143,98,0.16);
  --trail-white:#EDE9DD;
  --trail-white-bg:rgba(237,233,221,0.14);
  --radius-s:8px;
  --radius:14px;
  --radius-l:20px;
  --font-display:'Archivo','Inter',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:var(--font-body);}
a{color:inherit;}
::selection{background:var(--trail-yellow);color:var(--ink);}
:focus-visible{outline:2px solid var(--trail-yellow);outline-offset:2px;}
@media(prefers-reduced-motion:reduce){*{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}}

/* ===== APP SHELL ===== */
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--ink);}
#topbar{
  position:relative;overflow:hidden;
  padding:calc(18px + var(--safe-top)) 20px 16px;
  background:linear-gradient(180deg,#161F1B 0%,var(--ink) 100%);
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}
#topbar .contour{position:absolute;inset:0;opacity:0.35;pointer-events:none;}
#topbar-inner{position:relative;z-index:1;}
#topbar .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;}
#topbar .headline{font-family:var(--font-display);font-size:23px;font-weight:800;margin-top:4px;}
#topbar .daytype{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;font-family:var(--font-mono);}
.aifab{position:absolute;top:calc(16px + var(--safe-top));right:16px;z-index:3;width:42px;height:42px;border-radius:50%;background:var(--surface-2);border:1px solid var(--trail-yellow);color:var(--paper);font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 14px rgba(217,164,65,0.28);}
.aifab:active{transform:scale(0.93);}
#view-root{flex:1;overflow-y:auto;padding:16px 16px calc(96px + var(--safe-bottom));-webkit-overflow-scrolling:touch;}
.view{display:none;animation:fadein 0.18s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

#bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  max-width:560px;margin:0 auto;
  display:flex;background:rgba(28,37,33,0.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:8px 4px calc(8px + var(--safe-bottom));
}
.navbtn{flex:1;min-width:0;background:none;border:none;color:var(--muted-2);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 1px;border-radius:var(--radius-s);cursor:pointer;transition:color .15s;}
.navbtn .ic{font-size:18px;line-height:1;}
.navbtn .lb{font-size:9px;font-weight:600;letter-spacing:0.01em;font-family:var(--font-mono);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.navbtn.active{color:var(--paper);}
.navbtn.active .ic{filter:drop-shadow(0 0 6px rgba(217,164,65,0.5));}

/* ===== TYPOGRAPHY HELPERS ===== */
.sectiontitle{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;}
.sectiontitle:first-child{margin-top:0;}
.big{font-family:var(--font-display);font-weight:800;}
.mono{font-family:var(--font-mono);}
.muted{color:var(--muted);}
.small{font-size:12.5px;}

/* ===== CARDS ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.card-title{font-weight:700;font-size:15px;margin-bottom:2px;}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.card.tap{cursor:pointer;transition:border-color .15s,transform .1s;}
.card.tap:active{transform:scale(0.985);}
.card.tap:hover{border-color:var(--line-strong);}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;border-radius:var(--radius-s);padding:11px 16px;border:1px solid transparent;cursor:pointer;transition:opacity .15s,transform .1s;font-family:var(--font-body);}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--trail-yellow);color:#1A1408;}
.btn-secondary{background:var(--surface-3);color:var(--paper);border-color:var(--line-strong);}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--line);}
.btn-danger{background:var(--trail-red-bg);color:#F0A895;border-color:rgba(193,67,43,0.3);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);color:var(--paper);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0;touch-action:manipulation;}

/* ===== BADGES / PILLS ===== */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;font-family:var(--font-mono);white-space:nowrap;}
.pill-blue{background:var(--trail-blue-bg);color:var(--trail-blue);}
.pill-red{background:var(--trail-red-bg);color:#E17A63;}
.pill-yellow{background:var(--trail-yellow-bg);color:var(--trail-yellow);}
.pill-green{background:var(--trail-green-bg);color:#82B788;}
.pill-white{background:var(--trail-white-bg);color:var(--trail-white);}
.pill-muted{background:var(--surface-3);color:var(--muted);}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot-blue{background:var(--trail-blue);}.dot-red{background:var(--trail-red);}.dot-yellow{background:var(--trail-yellow);}.dot-green{background:var(--trail-green);}.dot-white{background:var(--trail-white);}

/* ===== SUBTABS ===== */
.subtabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;-webkit-mask-image:linear-gradient(to right, transparent 0, black 16px, black calc(100% - 16px), transparent 100%);mask-image:linear-gradient(to right, transparent 0, black 16px, black calc(100% - 16px), transparent 100%);}
.subtab{flex-shrink:0;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;}
.subtab.active{background:var(--paper);color:var(--ink);border-color:var(--paper);}

/* ===== PROGRESS ===== */
.progwrap{background:var(--surface-3);border-radius:999px;height:8px;overflow:hidden;}
.progbar{height:100%;background:linear-gradient(90deg,var(--trail-green),var(--trail-yellow));border-radius:999px;transition:width .4s ease;}
.devbar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.devbar-label{width:64px;flex-shrink:0;font-size:12.5px;color:var(--muted);}
.devbar-track{flex:1;background:var(--surface-3);border-radius:999px;height:10px;overflow:hidden;}
.devbar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--trail-blue),var(--trail-green));}
.devbar-val{width:30px;text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--muted);flex-shrink:0;}

/* ===== FORMS ===== */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=time],.field select,.field textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--paper);
  border-radius:var(--radius-s);padding:11px 12px;font-size:14.5px;font-family:var(--font-body);
}
.field textarea{resize:vertical;min-height:60px;}
.slidefield{margin-bottom:16px;}
.slidefield .sf-head{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
.slidefield .sf-val{font-family:var(--font-mono);color:var(--trail-yellow);font-weight:700;}
.slidefield input[type=range]{width:100%;accent-color:var(--trail-yellow);}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--trail-yellow);}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:8px 13px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--muted);font-size:13px;cursor:pointer;font-weight:600;}
.chip.active{background:var(--trail-yellow);color:#1A1408;border-color:var(--trail-yellow);}
.switch{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .slider{position:absolute;inset:0;background:var(--surface-3);border-radius:999px;transition:.15s;border:1px solid var(--line-strong);}
.switch .slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:var(--muted);border-radius:50%;transition:.15s;}
.switch input:checked + .slider{background:rgba(217,164,65,0.35);border-color:var(--trail-yellow);}
.switch input:checked + .slider:before{transform:translateX(18px);background:var(--trail-yellow);}

/* ===== LIST ROWS ===== */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.row-check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;}
.row-check.done{background:var(--trail-green);border-color:var(--trail-green);color:var(--ink);}
.row-main{flex:1;min-width:0;}
.row-title{font-weight:600;font-size:14.5px;}
.row-title.done{text-decoration:line-through;color:var(--muted-2);}
.row-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.menurow{display:flex;align-items:center;gap:14px;padding:15px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
.menurow:last-child{border-bottom:none;}
.menurow .ic{font-size:20px;width:26px;text-align:center;}
.menurow .lb{flex:1;font-weight:600;font-size:14.5px;}
.menurow .arrow{color:var(--muted-2);}

/* ===== EMPTY STATE ===== */
.empty{text-align:center;padding:36px 16px;color:var(--muted);}
.empty .ic{font-size:30px;margin-bottom:8px;opacity:0.7;}
.empty .t{font-weight:600;color:var(--paper);margin-bottom:4px;}
.empty .d{font-size:13px;}

/* ===== BODY SVG ===== */
.bodywrap{display:flex;justify-content:center;align-items:flex-start;gap:10px;padding:10px 0 4px;}
.bodysvg .fig-part path,.bodysvg .fig-part ellipse{fill:url(#bodygrad);stroke:var(--line-strong);stroke-width:1.5;}
.bodysvg .figdetail path{fill:none;stroke:var(--line-strong);stroke-width:1;opacity:0.6;pointer-events:none;}
.bodysvg .muscledef path,.bodysvg .muscledef rect{fill:rgba(74,133,172,0.16);stroke:rgba(74,133,172,0.4);stroke-width:0.75;pointer-events:none;}
.bodysvg .region{fill:transparent;stroke:transparent;stroke-width:2;cursor:pointer;transition:fill .2s,stroke .2s;}
.bodysvg .region:hover{fill:rgba(217,164,65,0.10);}
.bodysvg .region.sel{fill:rgba(217,164,65,0.22);stroke:var(--trail-yellow);}

/* ===== SKILL TREE (branching) ===== */
.treescroll{overflow-x:auto;overflow-y:hidden;margin:0 -4px;padding:2px 4px 12px;-webkit-overflow-scrolling:touch;}
.treecanvas{position:relative;margin:0 auto;}
.treenode{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;}
.treenode .tn-ic{width:38px;height:38px;border-radius:11px;background:var(--surface-2);border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:16px;}
.treenode .tn-lb{font-size:10.5px;text-align:center;line-height:1.15;color:var(--muted);font-weight:600;max-width:60px;}
.treenode.unlocked .tn-ic{background:var(--trail-green-bg);border-color:var(--trail-green);}
.treenode.unlocked .tn-lb{color:var(--paper);}
.treenode.available .tn-ic{border-color:var(--trail-yellow);}
.treenode.root .tn-ic{border-color:var(--trail-yellow);box-shadow:0 0 0 3px rgba(217,164,65,0.18);background:var(--trail-yellow-bg);}
.treenode.root .tn-lb{color:var(--trail-yellow);font-weight:700;}
.treenode.locked{opacity:0.4;}

/* ===== CALENDAR ===== */
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px;}
.daycell{min-height:70px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;padding:5px 4px;cursor:pointer;gap:2px;overflow:hidden;}
.daycell .dn{font-weight:700;font-family:var(--font-mono);font-size:10px;color:var(--muted);align-self:flex-start;}
.daycell.today{border-color:var(--trail-yellow);}
.daycell.today .dn{color:var(--trail-yellow);}
.daycell .tp{width:100%;height:2.5px;border-radius:2px;margin:1px 0 3px;flex-shrink:0;}
.daycell .tp-ico{font-size:8px;line-height:1;margin:-2px 0 2px;flex-shrink:0;}
.daycell .evtxt{font-size:8.5px;line-height:1.3;color:var(--paper);background:var(--surface-3);border-radius:3px;padding:1.5px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
.daycell .evmore{font-size:8px;color:var(--muted-2);padding-left:2px;flex-shrink:0;}

/* ===== CHAT (AI) ===== */
.chatlog{display:flex;flex-direction:column;gap:10px;padding-bottom:8px;}
.bubble{max-width:86%;padding:11px 13px;border-radius:var(--radius);font-size:14px;line-height:1.5;}
.bubble.ai{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;}
.bubble.user{background:var(--trail-blue-bg);color:var(--paper);align-self:flex-end;border-bottom-right-radius:4px;}
.bubble .role{font-family:var(--font-mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px;}
.suggestcard{background:var(--trail-yellow-bg);border:1px solid rgba(217,164,65,0.35);border-radius:var(--radius);padding:12px;margin-top:6px;}
.suggestcard .st{font-family:var(--font-mono);font-size:10.5px;color:var(--trail-yellow);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;}
.typing span{display:inline-block;width:5px;height:5px;background:var(--muted);border-radius:50%;margin-right:3px;animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:0.2s;}.typing span:nth-child(3){animation-delay:0.4s;}
@keyframes blink{0%,60%,100%{opacity:0.25;}30%{opacity:1;}}
.chatinput{position:sticky;bottom:0;display:flex;gap:8px;padding-top:10px;background:linear-gradient(0deg,var(--ink) 60%,transparent);}
.chatinput input{flex:1;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--paper);border-radius:999px;padding:12px 16px;font-size:14.5px;}
.aipermrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);}
.aipermrow:last-child{border-bottom:none;}

/* ===== MAP / TRACK ===== */
#leafletmap{width:100%;height:260px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);}
.trackstat{text-align:center;}
.trackstat .v{font-family:var(--font-mono);font-size:22px;font-weight:600;}
.trackstat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;}
.trackstats{display:flex;justify-content:space-around;padding:16px 0;}
.pulsedot{width:10px;height:10px;border-radius:50%;background:var(--trail-red);animation:pulse 1.4s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(193,67,43,0.5);}70%{box-shadow:0 0 0 8px rgba(193,67,43,0);}100%{box-shadow:0 0 0 0 rgba(193,67,43,0);}}

/* ===== MODAL / SHEET ===== */
.sheetbg{position:fixed;inset:0;background:rgba(10,14,12,0.6);backdrop-filter:blur(2px);z-index:90;display:none;align-items:flex-end;justify-content:center;}
.sheetbg.open{display:flex;}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 18px calc(24px + var(--safe-bottom));animation:sheetup .2s ease;border-top:1px solid var(--line-strong);}
@keyframes sheetup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sheet-title{font-family:var(--font-display);font-weight:800;font-size:17px;}

/* ===== HELYI UJJLENYOMATOS ZÁROLÁS (WebAuthn) ===== */
/* Magasabb z-index, mint a .sheetbg (90) - ez a réteg MINDENT eltakar,
   induláskor, MIELŐTT a felhasználó eloldaná ujjlenyomattal/jelszóval,
   ld. az index.html script "HELYI UJJLENYOMATOS GYORSBELÉPÉS" szekcióját. */
.webauthn-lock-overlay{position:fixed;inset:0;background:var(--ink);z-index:200;display:none;align-items:center;justify-content:center;padding:24px;}
.webauthn-lock-overlay.open{display:flex;}
.webauthn-lock-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-l);padding:26px 22px;animation:sheetup .2s ease;}

/* ===== TOAST ===== */
#toast{position:fixed;bottom:calc(90px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--paper);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:600;font-size:13px;z-index:99;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== CHARTS ===== */
.chartcard canvas{width:100%;display:block;}

/* ===== MISC ===== */
.hr{height:1px;background:var(--line);margin:14px 0;}
.flex{display:flex;}
.between{justify-content:space-between;}
.center{align-items:center;}
.gap8{gap:8px;}
.g{color:var(--muted-2);}
.integ-row{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
.integ-row:last-child{border-bottom:none;}
.integ-row .ic{font-size:18px;}
.integ-row .t{font-weight:700;font-size:13.5px;}
.integ-row .d{font-size:12.5px;color:var(--muted);margin-top:2px;}

/* ===== RPG (Életkampány) ===== */
.rpg-track-card{border-left:4px solid var(--tc,var(--trail-yellow));}
.rpg-lvl-badge{background:var(--surface-3);border:1px solid var(--line);border-radius:8px;padding:2px 9px;font-size:12px;font-weight:700;color:var(--trail-yellow);white-space:nowrap;flex-shrink:0;}
.rpg-xpbar{height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden;}
.rpg-xpbar>i{display:block;height:100%;background:var(--tc,var(--trail-yellow));}
.rpg-quest-row{align-items:center;}
.rpg-tier-stage{flex:1;min-width:64px;text-align:center;}
.rpg-weekgrid{display:grid;grid-template-columns:repeat(13,1fr);gap:5px;margin:10px 0;}
.rpg-weekcell{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);cursor:pointer;}
.rpg-weekcell.current{outline:2px solid var(--trail-yellow);}

/* ===== ROBUSZTUS HELYI TÁROLÁS =====
   A korábbi verzió window.storage-ra támaszkodott, ami letöltött HTML-ként
   Android böngészőben nem létezik. Ilyenkor localStorage-ra váltunk.
*/
const storageAdapter = {
  async get(key){
    if(window.storage && typeof window.storage.get === 'function'){
      return await window.storage.get(key);
    }
    return {value: localStorage.getItem(key)};
  },
  async set(key, value){
    if(window.storage && typeof window.storage.set === 'function'){
      return await window.storage.set(key, value);
    }
    localStorage.setItem(key, value);
    return true;
  }
};

   helyi betöltés - így a két forrásból (localStorage / Firestore) érkező
   állapot azonos módon lesz normalizálva. */
function normalizeAppState(){
  if(!App.state.finance || !Array.isArray(App.state.finance.mandatory)){
    const oldIncome = (App.state.finance && App.state.finance.monthlyIncome) || 0;
    App.state.finance = defaultState().finance;
    App.state.finance.monthlyIncome = oldIncome;
  }
  /* Régi/hiányzó tömbök biztonságos pótlása */
  const d = defaultState();
  for(const k of ['tasks','events','workouts','weightLog','healthLog','journeys','journal','aiChat']){
    if(!Array.isArray(App.state[k])) App.state[k] = d[k];
  }
  if(!Array.isArray(App.state.finance.discretionary)) App.state.finance.discretionary = d.finance.discretionary;
  if(!Array.isArray(App.state.finance.savings)) App.state.finance.savings = d.finance.savings;
  if(!Array.isArray(App.state.finance.foodOrders)) App.state.finance.foodOrders = d.finance.foodOrders;
  if(!Array.isArray(App.state.finance.spendLedger)) App.state.finance.spendLedger = d.finance.spendLedger;
  /* finance.accounts (SZÁMLÁK): meglévő felhasználóknál (akiknek elmentett
     állapotában ez a mező még nem létezett) 0 egyenlegű alap-számlapárral
     töltjük fel - a VALÓS egyenleget nem ismerjük, azt a felhasználó a
     manageAccountSheet()-en állítja be kézzel. */
  if(!Array.isArray(App.state.finance.accounts)) App.state.finance.accounts = d.finance.accounts;
  /* finance.incomeSources: meglévő felhasználóknál, akiknek elmentett állapotában ez a mező
     még nem létezett (csak a régi flat finance.monthlyIncome), a MÁR BEÁLLÍTOTT bevétel-számot
     az első ("Fizetés") bevételi forrássá alakítjuk át, hogy ne vesszen el - ld. a feature-leírást.
     Ha a felhasználó sosem állított be bevételt (monthlyIncome 0), a defaultState() ugyanolyan
     "Fizetés" alapértelmezett forrást ad (0 összeggel), mint egy vadonatúj felhasználónak - NEM
     egy külön/bogus 0-s tétel, hanem pontosan a defaultState() sablonja. */
  if(!Array.isArray(App.state.finance.incomeSources)){
    const legacyIncome = App.state.finance.monthlyIncome||0;
    App.state.finance.incomeSources = legacyIncome>0 ? [{id:'inc1',name:'Fizetés',amount:legacyIncome}] : d.finance.incomeSources;
  }
  if(!App.state.skills || typeof App.state.skills !== 'object') App.state.skills = {};
  if(!App.state.aiPerm || typeof App.state.aiPerm !== 'object') App.state.aiPerm = d.aiPerm;
  if(!App.state.healthConnect || typeof App.state.healthConnect !== 'object') App.state.healthConnect = d.healthConnect;
  if(!App.state.rpg || typeof App.state.rpg !== 'object') App.state.rpg = d.rpg;
  if(!App.state.rpg.meta || typeof App.state.rpg.meta !== 'object') App.state.rpg.meta = d.rpg.meta;
  if(!Array.isArray(App.state.rpg.weeks)) App.state.rpg.weeks = d.rpg.weeks;
  rpgMigrateToCycleWeeks(App.state.rpg, App.state.schedule && App.state.schedule.pattern);
  if(App.state.rpg.weeks.length !== (App.state.rpg.meta.weeksTotal||52)) App.state.rpg.weeks = Array.from({length:(App.state.rpg.meta.weeksTotal||52)}, ()=>({quests:[]}));
  App.state.rpg.weeks = App.state.rpg.weeks.map(w=> (w && Array.isArray(w.quests)) ? w : {quests:[]});
  if(!Array.isArray(App.state.rpg.quarterReflections) || App.state.rpg.quarterReflections.length !== 4) App.state.rpg.quarterReflections = ['','','',''];
  if(!Array.isArray(App.state.rpg.favorites)) App.state.rpg.favorites = [];
  if(!Array.isArray(App.state.rpg.bossNotified)) App.state.rpg.bossNotified = [];
  if(!Array.isArray(App.state.rpg.cycleSummaryNotified)) App.state.rpg.cycleSummaryNotified = [];
  if(!Array.isArray(App.state.rpg.workoutStreakQuestSuggestedDates)) App.state.rpg.workoutStreakQuestSuggestedDates = [];
  if(typeof App.state.rpg.onboarded !== 'boolean') App.state.rpg.onboarded = false;

}
async function loadState(){
  try{
    const res = await storageAdapter.get(STORAGE_KEY);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      App.state = Object.assign(defaultState(), parsed);
      normalizeAppState();
    } else {
      App.state = defaultState();
    }
  }catch(e){
    console.warn('MotivApp: helyi adatok betöltése sikertelen, alapállapot indul.', e);
    App.state = defaultState();
  }
}

function saveState(){
  clearTimeout(_saveTimer);
  if(App.state.aiChat && App.state.aiChat.length>40){ App.state.aiChat = App.state.aiChat.slice(-40); }
  _saveTimer = setTimeout(async ()=>{

        ok=true;

/* CLOUD_DEVICE_ID: amivel a Firestore-ba írt dokumentumon megjelöljük, MELYIK

   újra (ld. attachCloudSnapshotListener).

   + egy csak MEMÓRIÁBAN élő, oldalbetöltésenkénti véletlen utótag
   kombinációja. Az utótag azért kell, mert a localStorage egy origin MINDEN
   egyidejűleg nyitva lévő tabján/ablakán OSZTOZIK - ez az app pedig
   egyszerre PWA ÉS TWA-csomagolt (ugyanaz az origin), tehát egy telefonon
   simán lehet egyszerre nyitva egy böngésző-tab ÉS a telepített app is.

const CLOUD_DEVICE_ID = (function(){
  let base;
  try{
    base = localStorage.getItem('motivapp2:deviceId');
    if(!base){
      base = (window.crypto && typeof window.crypto.randomUUID === 'function') ? crypto.randomUUID() : (uid()+uid());
      localStorage.setItem('motivapp2:deviceId', base);
    }
  }catch(e){ base = uid()+uid(); }
  const tabSuffix = (window.crypto && typeof window.crypto.randomUUID === 'function') ? crypto.randomUUID().slice(0,8) : String(Math.random()).slice(2,10);
  return base+':'+tabSuffix;
})();

/* loadFirebaseSdkScripts(): a Firebase COMPAT SDK-t SZÁNDÉKOSAN NEM statikus
   <script src> tag-ekkel töltjük be a <head>-ben, hanem csak IGÉNY SZERINT,
   dinamikusan - ld. ensureCloudInit() hívási helyeit (Beállítások megnyitása
   / már bejelentkezett eszköz induláskori újracsatlakozása). Ennek oka: egy
   sikertelen hálózati erőforrás-betöltés a böngésző MAGA (nem az app kódja)
   ír egy "Failed to load resource" console hibát, amit semmilyen JS-oldali
   try/catch nem tud elnyomni - ha ez MINDEN oldalbetöltéskor megtörténne
   (statikus tag-ekkel), az a runRegressionChecks() CI-futtatását (ld.
   scripts/ci-regression-check.js) hálózat/Firebase-korlátozás esetén
   HIBÁSAN buktatná el, annak ellenére, hogy maguk az app-önteszek mind
   PASS-olnak. Mivel a CI regresszió futtatása (és a felhasználók túlnyomó
   többsége, aki sosem használja a fiók/szinkron funkciót) SOHA nem nyitja
   meg a Beállítások "Fiók és szinkronizáció" szekcióját és nincs korábban
   mentett bejelentkezés-jelző (ld. CLOUD_LOGIN_FLAG_KEY), ez a betöltés a
   gyakorlatban legtöbbször EGYÁLTALÁN meg sem történik - nulla hálózati
   kísérlet, nulla kockázat. */
let _fbSdkLoadPromise = null;
function loadFirebaseSdkScripts(){
  if(_fbSdkLoadPromise) return _fbSdkLoadPromise;
  _fbSdkLoadPromise = new Promise((resolve)=>{
    if(typeof firebase !== 'undefined'){ resolve(true); return; }
    let i = 0, anyFailed = false;
    function loadNext(){
      if(i >= FIREBASE_SDK_URLS.length){ resolve(!anyFailed); return; }
      const s = document.createElement('script');
      s.src = FIREBASE_SDK_URLS[i];
      s.onload = ()=>{ i++; loadNext(); };
      s.onerror = ()=>{ anyFailed = true; i++; loadNext(); };
      document.head.appendChild(s);
    }
    loadNext();
  });
  return _fbSdkLoadPromise;
}

let _fbInitAttempted = false, _fbInitInFlight = false;
/* ensureCloudInit(): idempotens belépési pont - biztonságosan hívható
   többször is (pl. minden Beállítások-megnyitáskor), csak az ELSŐ hívás
   indít tényleges betöltést/inicializálást. */
function ensureCloudInit(){
  if(_fbInitAttempted || _fbInitInFlight) return;
  _fbInitInFlight = true;
  fbInit().finally(()=>{
    _fbInitInFlight = false;
    _fbInitAttempted = true;
    refreshCloudSection();
  });
}
async function fbInit(){
  let loaded = false;
  try{
    loaded = await loadFirebaseSdkScripts();
  }catch(e){
    console.warn('MotivApp: Firebase SDK betöltése sikertelen.', e);
  }
  if(!loaded || typeof firebase === 'undefined'){
    console.warn('MotivApp: a Firebase SDK nem töltődött be (nincs internet, vagy a CDN nem elérhető) - a Fiók és szinkronizáció funkció inaktív marad, az app többi része helyben tovább működik.');
    fbAvailable = false;
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    fbAvailable = true;
    fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e=>{
      console.warn('MotivApp: Firebase Auth LOCAL persistence beállítása sikertelen - a munkamenet böngészőbezáráskor elveszhet.', e);
    });
    try{
      const persistPromise = fbDb.enablePersistence ? fbDb.enablePersistence({synchronizeTabs:true}) : null;
      if(persistPromise && typeof persistPromise.catch === 'function'){
        persistPromise.catch(e=>{
          // 'failed-precondition' = már engedélyezve egy másik nyitott tabon;
          // 'unimplemented' = a böngésző/kontextus nem támogatja. Mindkettő
          // várt, ártalmatlan eset - offline persistence nélkül folytatunk.
          console.warn('MotivApp: Firestore offline persistence nem engedélyezhető ('+(e&&e.code)+') - a szinkron továbbra is működik, csak offline írás-sorbaállítás nélkül.', e);
        });
      }
    }catch(e){
      console.warn('MotivApp: Firestore offline persistence beállítása közben hiba történt - folytatás nélküle.', e);
    }
    fbAuth.onAuthStateChanged(onFbAuthStateChanged, e=>{
      console.warn('MotivApp: Firebase Auth állapotfigyelő hiba.', e);
    });
  }catch(e){
    console.warn('MotivApp: Firebase inicializálás sikertelen (nincs internet / SDK hiba) - a Fiók és szinkronizáció funkció inaktív marad.', e);
    fbAvailable = false;
  }
}

/* isLocalStateTrivial(): heurisztika arra, hogy ezen az eszközön van-e már
   ÉRDEMI, elveszíteni nem akart helyi adat, vagy még csak az alapállapot
   áll fenn (üres profil, nincs feladat/edzés/napló stb.) - ez dönti el,
   hogy egy felhő-eltérés esetén szükséges-e megkérdezni a felhasználót,
   vagy biztonságosan, csendben lehet a felhő/helyi oldalt alkalmazni. */
function isLocalStateTrivial(){
  const s = App.state;
  if(!s) return true;
  if(s.profile && s.profile.name) return false;
  const nonEmptyArrays = ['tasks','events','workouts','activities','journeys','journal','weightLog','healthLog','customSports','customSkillNodes'];
  for(const k of nonEmptyArrays){ if(Array.isArray(s[k]) && s[k].length) return false; }
  if(s.finance && Array.isArray(s.finance.foodOrders) && s.finance.foodOrders.length) return false;
  /* Korábban ez az ellenőrzés NEM nézte a kötelező/egyéb kiadás/megtakarítás
     tételeket (finance.mandatory/discretionary/savings) - egy felhasználó,
     aki KIZÁRÓLAG ezeket szabta testre (átnevezett egy kategóriát, valódi
     keretet/célösszeget állított be, vagy elköltött/félretett összeget
     rögzített a #60/#61 szerkesztő lapokon anélkül, hogy feladatot/eseményt/
     edzést stb. is felvett volna) "trivial"-nak (biztonságosan felülírhatónak)
     tűnt - a meglévő felhő-adat ekkor CSENDBEN, megerősítés nélkül felülírta
     a testre szabását (ld. onFbAuthStateChanged). Az alapértelmezett
     tételekhez (defaultState()) képesti BÁRMILYEN eltérés (átnevezés, keret/
     célösszeg módosítás, elköltött/félretett összeg, hozzáadott/törölt tétel,
     sorrend) mostantól nem-triviálisnak számít. */
  const d0 = defaultState();
  if(s.finance){
    if(JSON.stringify(s.finance.mandatory||[]) !== JSON.stringify(d0.finance.mandatory)) return false;
    if(JSON.stringify(s.finance.discretionary||[]) !== JSON.stringify(d0.finance.discretionary)) return false;
    if(JSON.stringify(s.finance.savings||[]) !== JSON.stringify(d0.finance.savings)) return false;
    if(JSON.stringify(s.finance.accounts||[]) !== JSON.stringify(d0.finance.accounts)) return false;
    if(JSON.stringify(s.finance.incomeSources||[]) !== JSON.stringify(d0.finance.incomeSources)) return false;
  }
  if(s.rpg && s.rpg.meta && s.rpg.meta.name) return false;
  if(s.rpg && Array.isArray(s.rpg.weeks) && s.rpg.weeks.some(w=>w && Array.isArray(w.quests) && w.quests.length)) return false;
  if(s.skills && Object.values(s.skills).some(v=>v)) return false;
  if(s.nutrition && Array.isArray(s.nutrition.log) && s.nutrition.log.length) return false;
  return true;
}

/* normalizedCloudStateJson(): visszaadja, MI lenne az eredmény, ha egy adott
   Firestore-dokumentumot alkalmaznánk applyCloudData()-val (ugyanaz a
   defaultState()+normalizeAppState() lépés), tényleges alkalmazás/mellékhatás
   NÉLKÜL - App.state-et ideiglenesen kicseréli, majd visszaállítja. Ezt
   használja onFbAuthStateChanged() annak eldöntésére, hogy a helyi állapot
   TARTALMILAG megegyezik-e már a felhővel (ld. lentebb a "már szinkronban
   vagyunk" ágat) - JS egyszálú, szinkron végrehajtású, ezért ez a csere/
   visszaállítás biztonságos, nem szakíthatja meg semmi. */
function normalizedCloudStateJson(cloudData){
  const clone = Object.assign({}, cloudData);
  delete clone.updatedAt;
  delete clone._lastWriterDevice;
  const backup = App.state;
  App.state = Object.assign(defaultState(), clone);
  normalizeAppState();
  const json = JSON.stringify(App.state);
  App.state = backup;
  return json;
}

async function onFbAuthStateChanged(user){
  if(App.cloud.unsub){ try{ App.cloud.unsub(); }catch(e){ /* no-op */ } App.cloud.unsub = null; }
  if(!user){
    App.cloud.user = null;
    App.cloud.status = 'idle';
    App.cloud.migrationPending = false;
    App.cloud.conflictPending = false;
    App.cloud.pendingCloudData = null;
    _lastSyncedStateJson = null;
    try{ localStorage.removeItem(CLOUD_LOGIN_FLAG_KEY); }catch(e){ /* no-op */ }
    refreshCloudSection();
    return;
  }
  // CLOUD_LOGIN_FLAG_KEY: könnyű, saját jelző (NEM a Firebase SDK sajátja) -
  // ez teszi lehetővé, hogy a jövőbeli oldalbetöltések ensureCloudInit()-en
  // keresztül TUDJÁK, hogy ezen az eszközön érdemes proaktívan, induláskor
  // betölteni a Firebase SDK-t (ld. init() a fájl végén), fiók nélküli
  // eszközökön viszont EGYÁLTALÁN ne próbálkozzanak vele.
  try{ localStorage.setItem(CLOUD_LOGIN_FLAG_KEY, '1'); }catch(e){ /* no-op */ }
  App.cloud.user = {uid:user.uid, email:user.email};
  App.cloud.status = 'syncing';
  refreshCloudSection();
  try{
    const snap = await fbDb.collection('users').doc(user.uid).get();
    if(!snap.exists){
      if(isLocalStateTrivial()){
        await pushLocalToCloud();
      } else {
        App.cloud.migrationPending = true;
        openCloudMigrationSheet('no-cloud');
      }
    } else {
      const cloudData = snap.data();
      /* "Már szinkronban vagyunk" gyors-út: korábban EZ az ellenőrzés
         hiányzott, ezért egy már szinkronizált eszköz MINDEN egyes
         újratöltése/visszatérése (nem csak egy valódi új bejelentkezés/új
         eszköz) is lefuttatta a trivial/nem-trivial döntést, és egy
         visszatérő, érdemi adattal rendelkező felhasználónál MINDIG az
         "ütköző adatok" sheet-et dobta fel - még akkor is, ha a helyi és a
         felhő-állapot ténylegesen megegyezett. Ez feleslegesen szoktatta a
         felhasználót arra, hogy reflexből a "Felhő adatok betöltése (helyi
         felülírása)" gombra kattintson - pont akkor téve ezt veszélyessé
         megszokásból, amikor egyszer tényleg lett volna mentendő, egyedi
         helyi változás. Ha a normalizált tartalom megegyezik, nincs teendő:
         se prompt, se újraalkalmazás, csak a szinkron-állapot frissül. */
      const localJson = JSON.stringify(App.state);
      if(localJson === normalizedCloudStateJson(cloudData)){
        _lastSyncedStateJson = localJson;
        App.cloud.status = 'synced';
        App.cloud.lastSyncAt = new Date();
      } else if(isLocalStateTrivial()){
        applyCloudData(cloudData);
      } else {
        App.cloud.conflictPending = true;
        App.cloud.pendingCloudData = cloudData;
        openCloudMigrationSheet('conflict');
      }
    }
  }catch(e){
    // Offline / hálózati hiba - nem crash, csak "offline" állapot jelzés.
    // A user itt bejelentkezettnek számít (LOCAL persistence), csak a
    // kezdeti egyeztetés vár a következő kapcsolódásra.
    console.warn('MotivApp: a felhő-adat kezdeti ellenőrzése sikertelen (valószínűleg offline).', e);
    App.cloud.status = 'offline';
  }
  attachCloudSnapshotListener(user.uid);
  refreshCloudSection();
}

function attachCloudSnapshotListener(uidVal){
  App.cloud.unsub = fbDb.collection('users').doc(uidVal).onSnapshot(snap=>{
    if(App.cloud.migrationPending || App.cloud.conflictPending) return; // előbb a felhasználónak döntenie kell
    if(!snap.exists) return;
    const data = snap.data();
    if(snap.metadata.hasPendingWrites){
      // A saját, még szerver által nem igazolt írásunk optimista visszhangja.
      App.cloud.status = 'syncing';
      refreshCloudSection();
      return;
    }
    if(data._lastWriterDevice === CLOUD_DEVICE_ID){
      // A saját írásunk szerver által visszaigazolt verziója - nem kell újra alkalmazni.
      App.cloud.status = 'synced';
      App.cloud.lastSyncAt = new Date();
      App.cloud.error = null;
      refreshCloudSection();
      return;
    }
    // Másik eszközről érkezett, valódi távoli változás.
    applyCloudData(data);
  }, err=>{
    console.warn('MotivApp: felhő-szinkron figyelő hiba (kapcsolat megszakadt?).', err);
    App.cloud.status = navigator.onLine ? 'error' : 'offline';
    App.cloud.error = err && err.message;
    refreshCloudSection();
  });
}

/* applyCloudData(): a Firestore-ból érkező (vagy induló egyeztetéskor
   lekért) teljes állapot-blobot alkalmazza App.state-re, UGYANAZZAL a
   normalizáló lépéssel, mint a helyi betöltés (ld. normalizeAppState()),
   majd elmenti helyben és újrarajzol. A _lastSyncedStateJson frissítése
   ELŐZI MEG, hogy a nyomában induló saveState() -> queueCloudPush()
   visszaküldje ugyanezt az adatot a felhőbe (visszaír-hurok elkerülése). */
function applyCloudData(data){
  const clone = Object.assign({}, data);
  delete clone.updatedAt;
  delete clone._lastWriterDevice;
  App.state = Object.assign(defaultState(), clone);
  normalizeAppState();
  _lastSyncedStateJson = JSON.stringify(App.state);
  saveState();
  App.cloud.status = 'synced';
  App.cloud.lastSyncAt = new Date();
  App.cloud.error = null;
  App.cloud.migrationPending = false;
  App.cloud.conflictPending = false;
  App.cloud.pendingCloudData = null;
  renderApp();
  refreshCloudSection();
}

/* queueCloudPush(): a saveState() SIKERES helyi mentés ágából hívva (ld.
   fentebb). Csak akkor ütemez tényleges felhő-írást, ha (a) van
   bejelentkezett user, (b) nincs függőben migrációs/ütközési döntés, és
   (c) az App.state ténylegesen eltér attól, amit legutóbb szinkronizáltunk
   (elküldtünk VAGY beérkezett) - ez zárja ki, hogy egy épp alkalmazott
   távoli változás visszaírja önmagát a felhőbe. */
function queueCloudPush(){
  if(!fbAvailable || !fbAuth || !fbAuth.currentUser || !fbDb) return;
  if(App.cloud.migrationPending || App.cloud.conflictPending) return;
  let json;
  try{ json = JSON.stringify(App.state); }catch(e){ return; }
  if(json === _lastSyncedStateJson) return;
  clearTimeout(_cloudPushTimer);
  _cloudPushTimer = setTimeout(()=>{ pushLocalToCloud(); }, 2000);
}

async function pushLocalToCloud(){
  if(!fbAvailable || !fbAuth || !fbAuth.currentUser || !fbDb) return;
  const uidVal = fbAuth.currentUser.uid;
  let json;
  try{ json = JSON.stringify(App.state); }catch(e){ return; }
  App.cloud.status = 'syncing';
  refreshCloudSection();
  try{
    const payload = Object.assign({}, App.state, {
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      _lastWriterDevice: CLOUD_DEVICE_ID,
    });
    _lastSyncedStateJson = json;
    await fbDb.collection('users').doc(uidVal).set(payload);
    App.cloud.migrationPending = false;
    App.cloud.conflictPending = false;
    App.cloud.error = null;
    // A "Szinkronizálva" állapot/időbélyeg frissítését az onSnapshot
    // visszaigazoló ága végzi (data._lastWriterDevice === CLOUD_DEVICE_ID ág) -
    // amíg offline vagyunk, ott marad "syncing"/"offline", amíg a Firestore
    // offline persistence a kapcsolat helyreállása után nem véglegesíti az írást.
  }catch(e){
    console.warn('MotivApp: felhő-mentés sikertelen (valószínűleg offline vagy jogosultsági hiba) - a helyi adatok megvannak, később újrapróbálja.', e);
    App.cloud.status = navigator.onLine ? 'error' : 'offline';
    App.cloud.error = e && e.message;
    refreshCloudSection();
  }
}

/* ---- Bejelentkező/regisztrációs UI (Beállítások -> Fiók és szinkronizáció) ---- */
function refreshCloudSection(){
  const el = document.getElementById('cloud-sync-section');
  if(el) el.outerHTML = `<div id="cloud-sync-section">${cloudSyncSectionHtml()}</div>`;
}
function cloudSetAuthMode(mode){
  App.cloud.authMode = mode;
  App.cloud.authError = null;
  refreshCloudSection();
}
function cloudAuthErrorMessage(e){
  const code = e && e.code;
  const map = {
    'auth/email-already-in-use':'Ez az e-mail cím már regisztrálva van. Válaszd a Bejelentkezés fület.',
    'auth/invalid-email':'Érvénytelen e-mail cím formátum.',
    'auth/weak-password':'A jelszó túl gyenge — legalább 6 karakter szükséges.',
    'auth/user-not-found':'Nincs ilyen e-mail címmel regisztrált fiók.',
    'auth/wrong-password':'Hibás jelszó.',
    'auth/invalid-credential':'Hibás e-mail cím vagy jelszó.',
    'auth/too-many-requests':'Túl sok sikertelen próbálkozás — kérlek, próbáld újra egy kicsit később.',
    'auth/network-request-failed':'Nincs internetkapcsolat — bejelentkezés/regisztráció most nem lehetséges.',
    'auth/user-disabled':'Ez a fiók le van tiltva.',
  };
  if(code && map[code]) return map[code];
  if(typeof navigator!=='undefined' && navigator.onLine===false) return 'Nincs internetkapcsolat — próbáld újra, ha újra van net.';
  return 'Váratlan hiba történt'+(code?(' ('+code+')'):'')+'. Próbáld újra.';
}
async function cloudSubmitAuth(){
  const emailEl = document.getElementById('cloud-email');
  const passEl = document.getElementById('cloud-password');
  const email = (emailEl && emailEl.value || '').trim();
  const password = (passEl && passEl.value) || '';
  App.cloud.formEmail = email;
  const mode = App.cloud.authMode || 'login';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    App.cloud.authError = 'Adj meg egy érvényes e-mail címet.';
    refreshCloudSection();
    return;
  }
  if(mode==='register' && password.length<6){
    App.cloud.authError = 'A jelszónak legalább 6 karakter hosszúnak kell lennie.';
    refreshCloudSection();
    return;
  }
  if(mode==='login' && !password){
    App.cloud.authError = 'Add meg a jelszavad.';
    refreshCloudSection();
    return;
  }
  if(!fbAvailable || !fbAuth){
    App.cloud.authError = 'A Fiók és szinkronizáció funkció jelenleg nem elérhető (nincs internetkapcsolat, vagy a szolgáltatás nem tölthető be).';
    refreshCloudSection();
    return;
  }
  App.cloud.authBusy = true;
  App.cloud.authError = null;
  refreshCloudSection();
  try{
    if(mode==='register'){
      await fbAuth.createUserWithEmailAndPassword(email, password);
    } else {
      await fbAuth.signInWithEmailAndPassword(email, password);
    }
    // A sikeres eredményt onFbAuthStateChanged() dolgozza fel.
  }catch(e){
    App.cloud.authError = cloudAuthErrorMessage(e);
  }
  App.cloud.authBusy = false;
  refreshCloudSection();
}
/* cloudSignOut(): kijelentkezéskor a HELYI App.state-et is vissza kell
   állítani defaultState()-re - enélkül egy közös/kölcsönzött eszközön
   (pl. családi telefon) az "A" fiók kijelentkezése után, ha "B" fiók
   jelentkezik be UGYANOTT (oldal-újratöltés nélkül), "B" az "A" még
   mindig App.state-ben lévő NAPLÓJÁT/PÉNZÜGYEIT látta volna a saját
   döntése (migráció/ütközés sheet) ELŐTT is megjelenítve, és "B" "Igen,
   feltöltöm" választása esetén "A" magánadatai véglegesen bekerültek
   volna "B" felhő-dokumentumába. A sorrend fontos: ELŐSZÖR fejezze be a
   tényleges Firebase kijelentkezést (await), és CSAK UTÁNA nullázzuk/
   mentsük a helyi állapotot - ha fordítva tennénk, a saveState() által
   kiváltott queueCloudPush() még a RÉGI (épp kijelentkező) fiók
   currentUser-ét látva a kiürült defaultState()-et pusholná fel "A"
   valódi felhő-dokumentumába, VÉGLEGESEN törölve "A" szinkronizált
   adatait. A signOut() Promise-a garantáltan csak azután oldódik fel,
   hogy a Firebase SDK a currentUser-t már nullázta, ezért ez a sorrend
   biztonságos. */
async function cloudSignOut(){
  clearTimeout(_cloudPushTimer);
  if(App.cloud.unsub){ try{ App.cloud.unsub(); }catch(e){ /* no-op */ } App.cloud.unsub = null; }
  if(fbAuth){
    try{ await fbAuth.signOut(); }catch(e){ console.warn('MotivApp: kijelentkezés sikertelen.', e); }
  }
  if(typeof webauthnClearEnrollmentFlagOnSignOut==='function') webauthnClearEnrollmentFlagOnSignOut();
  App.state = defaultState();
  saveState();
  renderApp();
}
function cloudSyncStatusText(){
  const c = App.cloud;
  const online = (typeof navigator==='undefined') || navigator.onLine!==false;
  if((c.status==='offline') || (c.status==='syncing' && !online)) return 'Nincs internetkapcsolat, később szinkronizál';
  if(c.status==='syncing') return 'Szinkronizálás…';
  if(c.status==='error') return 'Szinkronizálási hiba'+(c.error?(': '+c.error):'')+' — a helyi adatok biztonságban vannak.';
  if(c.status==='synced' && c.lastSyncAt){
    const d = c.lastSyncAt;
    const iso = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    return 'Szinkronizálva: '+fmtDateHu(iso)+' '+fmtTime(d);
  }
  return 'Szinkronizálás előkészítése…';
}
function cloudAuthFormHtml(){
  const mode = App.cloud.authMode || 'login';
  const err = App.cloud.authError;
  return `
    <div class="chiprow" style="margin-bottom:12px;">
      <div class="chip${mode==='login'?' active':''}" id="cloud-tab-login" onclick="cloudSetAuthMode('login')">Bejelentkezés</div>
      <div class="chip${mode==='register'?' active':''}" id="cloud-tab-register" onclick="cloudSetAuthMode('register')">Regisztráció</div>
    </div>
    <div class="field"><label>E-mail cím</label><input type="email" id="cloud-email" autocomplete="email" placeholder="pelda@email.hu" value="${escapeHtml(App.cloud.formEmail||'')}"></div>
    <div class="field"><label>Jelszó</label><input type="password" id="cloud-password" autocomplete="${mode==='register'?'new-password':'current-password'}" placeholder="${mode==='register'?'legalább 6 karakter':'jelszó'}"></div>
    ${err ? `<div class="small" id="cloud-auth-error" style="color:var(--trail-red);margin-bottom:10px;">${escapeHtml(err)}</div>` : ''}
    <button class="btn btn-primary btn-block" id="cloud-submit-btn" ${App.cloud.authBusy?'disabled':''} onclick="cloudSubmitAuth()">${App.cloud.authBusy?'Kérlek várj…':(mode==='register'?'Regisztráció':'Bejelentkezés')}</button>
    <div class="small muted" style="text-align:center;margin-top:10px;">Ez a lépés opcionális — az app fiók nélkül, helyben is teljesen működik. Csak akkor van rá szükség, ha több eszköz között szeretnéd szinkronizálni az adataidat.</div>
  `;
}
function cloudSyncSectionHtml(){
  if(_fbInitInFlight || (!_fbInitAttempted && !fbAvailable)){
    return `<div class="sectiontitle">Fiók és szinkronizáció</div>
      <div class="card"><div class="small muted">Betöltés…</div></div>`;
  }
  if(!fbAvailable){
    return `<div class="sectiontitle">Fiók és szinkronizáció</div>
      <div class="card"><div class="small muted">A fiók/felhő-szinkronizáció funkció jelenleg nem elérhető (nincs internetkapcsolat, vagy a szükséges szolgáltatás nem töltődött be). Az app minden más funkciója ettől függetlenül, helyben teljesen működik - ez a rész csak opcionális kiegészítő a több eszköz közötti szinkronizáláshoz.</div></div>`;
  }
  const user = App.cloud.user;
  if(!user){
    return `<div class="sectiontitle">Fiók és szinkronizáció</div>
      <div class="card" id="cloud-auth-card">${cloudAuthFormHtml()}</div>`;
  }
  return `<div class="sectiontitle">Fiók és szinkronizáció</div>
    <div class="card">
      <div class="row"><div class="row-main"><div class="row-title" id="cloud-account-email">${escapeHtml(user.email||'')}</div><div class="row-sub" id="cloud-sync-status">${cloudSyncStatusText()}</div></div></div>
      <button class="btn btn-block" id="cloud-signout-btn" style="margin-top:10px;" onclick="cloudSignOut()">Kijelentkezés</button>
    </div>
    ${webauthnEnrollSectionHtml()}`;
}

/* ---- Első bejelentkezés / új eszköz - migráció/ütközés megerősítő sheet ----
   SOHA nem ír felül automatikusan egyik oldalt sem: amíg a felhasználó nem
   dönt (vagy "Most nem döntök"-öt választ), sem push, sem a bejövő
   onSnapshot-alkalmazás nem történik meg (ld. a migrationPending/
   conflictPending ellenőrzéseket fentebb) - "Most nem döntök" esetén a
   döntés a következő bejelentkezéskor/app-indításkor újra felajánlásra
   kerül, amíg a user ténylegesen nem választ. */
function openCloudMigrationSheet(kind){
  if(kind==='no-cloud'){
    openSheet(`<div class="sheet-head"><div class="sheet-title">Kezdő felhő-másolat</div></div>
      <div class="small muted" style="margin-bottom:16px;">Ehhez a fiókhoz még nem tartozik felhőben tárolt adat, de ezen az eszközön már van helyi adatod. Feltöltöd ezt, hogy ez legyen a fiókod kiinduló, több eszközzel is szinkronizálódó másolata?</div>
      <button class="btn btn-primary btn-block" id="cloud-migrate-upload" onclick="resolveCloudMigration('upload')">Igen, feltöltöm a helyi adataimat</button>
      <button class="btn btn-block" id="cloud-migrate-later" style="margin-top:8px;" onclick="resolveCloudMigration('later')">Most nem döntök</button>`);
  } else {
    openSheet(`<div class="sheet-head"><div class="sheet-title">Ütköző adatok</div></div>
      <div class="small muted" style="margin-bottom:16px;">Ehhez a fiókhoz már tartozik felhőben tárolt adat, DE ezen az eszközön is van már helyi adat. Melyiket szeretnéd megtartani? (A nem választott oldal adatai elvesznek/felülíródnak ezen az eszközön.)</div>
      <button class="btn btn-primary btn-block" id="cloud-migrate-download" onclick="resolveCloudMigration('download')">Felhő adatok betöltése (helyi adatok felülírása)</button>
      <button class="btn btn-block" id="cloud-migrate-later" style="margin-top:8px;" onclick="resolveCloudMigration('later')">Most nem döntök</button>`);
  }
}
function resolveCloudMigration(choice){
  if(choice==='upload'){
    App.cloud.migrationPending = false;
    pushLocalToCloud();
    closeSheet();
    toast('Feltöltés elindítva');
  } else if(choice==='download'){
    const data = App.cloud.pendingCloudData;
    App.cloud.conflictPending = false;
    App.cloud.pendingCloudData = null;
    if(data) applyCloudData(data);
    closeSheet();
    toast('Felhő adatok betöltve');
  } else {
    closeSheet();
  }
  refreshCloudSection();
}

window.addEventListener('online', ()=>{ if(App.cloud.user) refreshCloudSection(); });
window.addEventListener('offline', ()=>{ if(App.cloud.user){ refreshCloudSection(); } });
/* fbInit() hívása SZÁNDÉKOSAN NEM itt, hanem a fájl végi init() IIFE-ben,
   await loadState() UTÁN történik - így egy már bejelentkezett (LOCAL
   persistence) felhasználó onAuthStateChanged-visszahívása sosem előzheti
   meg App.state betöltését (ami null/félkész állapotot pusholna a felhőbe). */


/* ================= HELYI UJJLENYOMATOS GYORSBELÉPÉS (WebAuthn, OPCIONÁLIS) =================
   FONTOS BIZTONSÁGI KERETEZÉS - ez NEM egy szerver által kriptográfiailag
   ellenőrzött második hitelesítési faktor ("valódi" FIDO2/WebAuthn login),
   mert ennek az appnak nincs saját backendje, ami egy WebAuthn-aláírást
   szerveroldalon ellenőrizni tudna (ez lenne a "valódi" garancia egy normál
   WebAuthn bejelentkezésnél). Ehelyett ez egy HELYI, eszköz-feloldó "kapu" a
   Phase A által már megőrzött Firebase-munkamenet FÖLÖTT (ld. fentebb:
   firebase.auth.Auth.Persistence.LOCAL - a fiók ebből a szempontból már
   "be van jelentkezve" ezen az eszközön, itt nincs szükség újbóli
   szerver-hitelesítésre minden feloldáskor).
   - A "biztonsági" garancia forrása KIZÁRÓLAG a navigator.credentials.get()
     böngésző-API saját promise feloldása/elutasítása: a userVerification:
     "required" opcióval csak akkor oldódik fel sikeresen, ha a platform
     hitelesítő (Android ujjlenyomat, Windows Hello, Touch ID) TÉNYLEGESEN
     ellenőrizte a jelenlévő személyt - ezt a böngésző/OS kényszeríti ki,
     NEM ez a JS kód.
   - SZÁNDÉKOSAN NINCS kézzel megírt WebAuthn-aláírás-ellenőrzés
     (SubtleCrypto/WebCrypto a tárolt publikus kulcs ellen) - ez valódi
     kriptográfia lenne, amit könnyű finoman elrontani, jelentős
     bonyolultságot adna hozzá, és nem javítaná érdemben a biztonsági modellt
     ebben a kontextusban (a "mi van, ha nem az ujjlenyomat-tulajdonos/nem
     működik az ujjlenyomat" esetre a VALÓDI hátsó védelmi vonal a lenti
     jelszavas B opció, ami TÉNYLEGESEN szerver-oldali ellenőrzést végez a
     fbAuth.currentUser.reauthenticateWithCredential()-lel).
   - Ez tehát olyan, mint egy telefon saját képernyőzára - NEM olyan, mint
     egy banki bejelentkezés. Ez egy TUDATOS, indokolt terjedelem-döntés,
     nem hiányosság.

   Tárolás: a `credential.id`-t (base64url) ESZKÖZENKÉNT, `uid`-hez kötve
   tároljuk localStorage-ban (motivapp2:webauthnCred:<uid>) - ez SOSEM
   szinkronizálódik Firestore-ba (más eszközön értelmezhetetlen lenne).
   Emellett egy könnyű, tetején lévő `motivapp2:webauthnEnrolledUid` jelzőt is
   tartunk (az aktuálisan beregisztrált uid), hogy induláskor, MIELŐTT a
   Firebase visszaigazolná, KI a bejelentkezett felhasználó, a boot-kód olcsón
   el tudja dönteni, hogy kell-e zároló overlay-t mutatnia.

   CI-biztonság: az overlay CSAK akkor jelenik meg induláskor, ha (a)
   CLOUD_LOGIN_FLAG_KEY==='1' (korábbi, valódi bejelentkezés ezen az
   eszközön) ÉS (b) van ehhez tárolt WebAuthn credential - a runRegressionChecks()
   CI-futása mindig teljesen tiszta localStorage-ból indul, tehát ez a blokk
   ott sosem aktiválódik (ld. scripts/test-webauthn-lock.js 1. tesztje). */

const WEBAUTHN_CRED_PREFIX = 'motivapp2:webauthnCred:'; // + uid -> credential.id (base64url)
const WEBAUTHN_ENROLLED_UID_KEY = 'motivapp2:webauthnEnrolledUid'; // az aktuálisan beregisztrált uid, vagy nincs kulcs

function webauthnCredIdForUid(uidVal){
  if(!uidVal) return null;
  try{ return localStorage.getItem(WEBAUTHN_CRED_PREFIX+uidVal); }catch(e){ return null; }
}
function webauthnIsEnrolledForUid(uidVal){
  return !!webauthnCredIdForUid(uidVal);
}
/* webauthnLockShouldShow(): induláskori, OLCSÓ (csak localStorage-ot olvasó)
   döntés arról, kell-e a zároló overlay-t azonnal megmutatni - ld. init()
   a fájl végén, pontosan ott, ahol az ensureCloudInit() induló hívása is
   történik. */
function webauthnLockShouldShow(){
  try{
    if(localStorage.getItem(CLOUD_LOGIN_FLAG_KEY)!=='1') return false;
    const enrolledUid = localStorage.getItem(WEBAUTHN_ENROLLED_UID_KEY);
    if(!enrolledUid) return false;
    return webauthnIsEnrolledForUid(enrolledUid);
  }catch(e){ return false; }
}

/* Base64url <-> ArrayBuffer segédek a WebAuthn API bináris mezőihez
   (credential.id/rawId, challenge, user.id). */
function webauthnBufToBase64Url(buf){
  const bytes = new Uint8Array(buf);
  let bin = '';
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function webauthnBase64UrlToBuf(b64url){
  let b64 = String(b64url).replace(/-/g,'+').replace(/_/g,'/');
  while(b64.length % 4) b64 += '=';
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

/* ---- Feature-detect (platform hitelesítő elérhetősége) ----
   Aszinkron API, ezért NEM lehet szinkron sztring-építő függvényben
   (cloudSyncSectionHtml()) meghívni - ugyanaz az idempotens "ellenőrizd
   egyszer, cache-eld, majd frissítsd a szekciót" minta, mint
   ensureCloudInit()/_fbInitAttempted-nél. */
let _webauthnPlatformAvailable = null; // null=még nem ismert, true/false=ismert eredmény
function ensureWebauthnAvailabilityCheck(){
  if(_webauthnPlatformAvailable !== null) return;
  if(!window.PublicKeyCredential || typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable !== 'function'){
    _webauthnPlatformAvailable = false;
    return;
  }
  PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(avail=>{
    _webauthnPlatformAvailable = !!avail;
    refreshCloudSection();
  }).catch(e=>{
    console.warn('MotivApp: platform hitelesítő elérhetőségének ellenőrzése sikertelen.', e);
    _webauthnPlatformAvailable = false;
    refreshCloudSection();
  });
}

   bejelentkezett fiók-kártya alatt) ---- */
function webauthnEnrollSectionHtml(){
  if(_webauthnPlatformAvailable !== true) return ''; // nem támogatott/ismeretlen -> NINCS UI (nem hiba)
  const user = App.cloud.user;
  if(!user) return ''; // csak már bejelentkezett felhasználónak
  if(webauthnIsEnrolledForUid(user.uid)){
    return `<div class="card" id="webauthn-enroll-card" style="margin-top:10px;">
      <div class="row"><div class="row-main"><div class="row-title">🔓 Ujjlenyomatos gyorsbelépés</div><div class="row-sub">Be van kapcsolva ezen az eszközön</div></div></div>
      <button class="btn btn-block" style="margin-top:10px;" onclick="webauthnDisenroll()">Kikapcsolás ezen az eszközön</button>
    </div>`;
  }
  return `<div class="card" id="webauthn-enroll-card" style="margin-top:10px;">
    <div class="row-title" style="margin-bottom:4px;">🔒 Ujjlenyomatos gyorsbelépés</div>
    <div class="small muted" style="margin-bottom:12px;">Bejelentkezés után ujjlenyomattal is feloldhatod az appot ezen az eszközön — ha nem működik, jelszóval mindig be tudsz lépni.</div>
    <button class="btn btn-primary btn-block" id="webauthn-enroll-btn" onclick="webauthnEnroll()">Ujjlenyomatos gyorsbelépés bekapcsolása</button>
  </div>`;
}
async function webauthnEnroll(){
  const user = App.cloud.user;
  if(!user){ toast('Előbb jelentkezz be.'); return; }
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const userIdBytes = crypto.getRandomValues(new Uint8Array(16));
    const cred = await navigator.credentials.create({
      publicKey:{
        challenge,
        rp:{ id: location.hostname, name:'MotivApp 2.0' },
        user:{ id:userIdBytes, name:user.email||'motivapp-felhasznalo', displayName:user.email||'MotivApp felhasználó' },
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
        authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required' },
        timeout:60000,
        attestation:'none',
      }
    });
    if(!cred || !cred.rawId) throw new Error('Nem érkezett credential.');
    const credId = webauthnBufToBase64Url(cred.rawId);
    localStorage.setItem(WEBAUTHN_CRED_PREFIX+user.uid, credId);
    localStorage.setItem(WEBAUTHN_ENROLLED_UID_KEY, user.uid);
    toast('Ujjlenyomatos gyorsbelépés bekapcsolva ezen az eszközön.');
  }catch(e){
    // Felhasználó megszakította / nincs hardver / időtúllépés stb. - NEM
    // fatális, az app többi része (és maga a fiók/szinkron) változatlanul
    // működik, csak a toast jelzi a felhasználónak.
    console.warn('MotivApp: WebAuthn regisztráció sikertelen vagy megszakítva.', e);
    toast('Nem sikerült beállítani az ujjlenyomatos gyorsbelépést. Próbáld újra, vagy folytasd jelszóval.');
  }
  refreshCloudSection();
}
function webauthnDisenroll(){
  const user = App.cloud.user;
  try{
    if(user) localStorage.removeItem(WEBAUTHN_CRED_PREFIX+user.uid);
    localStorage.removeItem(WEBAUTHN_ENROLLED_UID_KEY);
  }catch(e){ /* no-op */ }
  toast('Ujjlenyomatos gyorsbelépés kikapcsolva ezen az eszközön.');
  refreshCloudSection();
}
/* Kijelentkezéskor a jelenlegi eszköz enrollment-jelzőjét is töröljük - egy
   kijelentkezett/más fiókkal újra belépő felhasználó ne találkozzon egy

   automatikusan zárolásként, amíg a felhasználó újra be nem kapcsolja). */
function webauthnClearEnrollmentFlagOnSignOut(){
  try{ localStorage.removeItem(WEBAUTHN_ENROLLED_UID_KEY); }catch(e){ /* no-op */ }
}

/* ---- A zároló overlay maga (induláskori "eszköz-feloldó kapu") ---- */

      <button class="btn btn-block" style="margin-top:8px;" onclick="webauthnLockSwitchMode('biometric')">Vissza az ujjlenyomathoz</button>
    </div>`;
  }

    <div style="font-size:40px;text-align:center;margin-bottom:6px;">🔒</div>
    <div style="font-weight:700;font-size:17px;text-align:center;margin-bottom:6px;">Alkalmazás zárolva</div>
    <div class="small muted" style="text-align:center;margin-bottom:16px;">Oldd fel ujjlenyomattal a folytatáshoz.</div>
    ${st.error ? `<div class="small" id="webauthn-lock-error" style="color:var(--trail-red);margin-bottom:12px;text-align:center;">${escapeHtml(st.error)}</div>` : ''}
    <button class="btn btn-primary btn-block" id="webauthn-lock-biometric-btn" ${st.busy?'disabled':''} onclick="webauthnLockTryBiometric()">${st.busy?'Kérlek várj…':'Feloldás ujjlenyomattal'}</button>
    <button class="btn btn-block" id="webauthn-lock-password-link" style="margin-top:8px;" onclick="webauthnLockSwitchMode('password')">Jelszóval</button>
