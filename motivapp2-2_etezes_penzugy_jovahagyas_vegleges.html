function selectMapJourney(id){ App.ui.selectedJourney = App.ui.selectedJourney===id? null : id; renderMapView(document.getElementById('terkep-content')); }
function renderRouteSvg(journeys){
  const withPts = (journeys||[]).filter(j=>j.points && j.points.length>1);
  if(!withPts.length){
    return `<div class="empty"><div class="ic">🗺️</div><div class="t">Még nincs megjeleníthető útvonal</div><div class="d">Rögzíts egy túrát a KÖVETÉS fülön.</div></div>`;
  }
  let minLat=90,maxLat=-90,minLng=180,maxLng=-180;
  withPts.forEach(j=>j.points.forEach(p=>{
    if(p.lat<minLat)minLat=p.lat; if(p.lat>maxLat)maxLat=p.lat;
    if(p.lng<minLng)minLng=p.lng; if(p.lng>maxLng)maxLng=p.lng;
  }));
  const spanLat=(maxLat-minLat)||0.004, spanLng=(maxLng-minLng)||0.004;
  minLat-=spanLat*0.12; maxLat+=spanLat*0.12; minLng-=spanLng*0.12; maxLng+=spanLng*0.12;
  const W=320,H=260;
  const proj=(p)=>[ ((p.lng-minLng)/(maxLng-minLng))*W, H-((p.lat-minLat)/(maxLat-minLat))*H ];
  const colors=['#D9A441','#4A85AC','#5C8F62','#C1432B','#93A79A'];
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;border-radius:10px;background:var(--surface-2);"><g stroke="#2C3830" stroke-width="1">`;
  for(let i=1;i<5;i++){ const gx=(W/5*i).toFixed(1); svg+=`<line x1="${gx}" y1="0" x2="${gx}" y2="${H}"/>`; }
  for(let i=1;i<4;i++){ const gy=(H/4*i).toFixed(1); svg+=`<line x1="0" y1="${gy}" x2="${W}" y2="${gy}"/>`; }
  svg += `</g>`;
  withPts.forEach((j,i)=>{
    const pts = j.points.map(proj);
    const d = pts.map((p,k)=>(k===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const col = colors[i%colors.length];
    svg += `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    svg += `<circle cx="${pts[0][0].toFixed(1)}" cy="${pts[0][1].toFixed(1)}" r="4.5" fill="${col}"/>`;
    svg += `<circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="4.5" fill="var(--ink)" stroke="${col}" stroke-width="2"/>`;
  });
  svg += `</svg>`;
  const legend = withPts.map((j,i)=>`<div class="flex gap8 center" style="margin-top:7px;"><span class="dot" style="background:${colors[i%colors.length]}"></span><span class="small">${escapeHtml(j.name)} · ${(j.distanceKm||0).toFixed(1)} km</span></div>`).join('');
  return svg + `<div style="margin-top:10px;">${legend}</div><div class="small g" style="margin-top:10px;">Saját rajzolt útvonalnézet, utcatérkép-csempék nélkül — ez mindig betölt, hálózati/CSP-korlátozástól függetlenül. Valódi utcatérkép a natív Android verzióval jön.</div>`;
}

/* ================= ÚTVONAL-JAVÍTÓ (kézi GPS-pont korrekció) =================
   Ha a GPS rosszul trackelt (kiugró pont, hurok, hiányzó szakasz), itt
   javítható: pontok húzása/áthelyezése, törlése, új pont felvétele egy
   koppintással. A munkapéldány (_journeyEditDraft) NEM az App.state-ben él -
   csak Mentéskor írjuk vissza a kiválasztott túra points tömbjét és újra-
   számoljuk a distanceKm-et (haversine() - ld. fent), Mégsénél/backdrop-
   zárásnál egyszerűen eldobjuk. Ugyanaz a saját, csempementes SVG-vetítés,
   mint renderRouteSvg()-ben (ne törd össze az ottani, már auditált nézetet -
   ezért külön, saját projekcióval dolgozik, nem megosztott kóddal). */
let _journeyEditDraft = null;
function openJourneyEditor(id){
  const j = App.state.journeys.find(x=>x.id===id);
  if(!j || !Array.isArray(j.points) || j.points.length<2) return;
  _journeyEditDraft = { journeyId:id, points:j.points.map(p=>({lat:p.lat,lng:p.lng})), selectedIndex:null, insertMode:false, dragIndex:null, proj:null, unproj:null, W:320, H:300 };
  renderJourneyEditSheet();
}
function closeJourneyEditor(){ _journeyEditDraft=null; closeSheet(); }
function journeyEditorProjection(points){
  let minLat=90,maxLat=-90,minLng=180,maxLng=-180;
  points.forEach(p=>{ if(p.lat<minLat)minLat=p.lat; if(p.lat>maxLat)maxLat=p.lat; if(p.lng<minLng)minLng=p.lng; if(p.lng>maxLng)maxLng=p.lng; });
  const spanLat=(maxLat-minLat)||0.004, spanLng=(maxLng-minLng)||0.004;
  minLat-=spanLat*0.15; maxLat+=spanLat*0.15; minLng-=spanLng*0.15; maxLng+=spanLng*0.15;
  const latSpan=(maxLat-minLat)||0.0001, lngSpan=(maxLng-minLng)||0.0001;
  const W=320,H=300;
  return {
    W,H,
    proj:(p)=>[ ((p.lng-minLng)/lngSpan)*W, H-((p.lat-minLat)/latSpan)*H ],
    unproj:(x,y)=>({ lat: minLat+((H-y)/H)*latSpan, lng: minLng+(x/W)*lngSpan })
  };
}
function journeyEditorPathD(pts){
  return pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
}
function renderJourneyEditSheet(){
  const d = _journeyEditDraft; if(!d) return;
  const pr = journeyEditorProjection(d.points);
  d.proj=pr.proj; d.unproj=pr.unproj; d.W=pr.W; d.H=pr.H;
  const pts = d.points.map(d.proj);
  const pathD = journeyEditorPathD(pts);
  let circles = '';
  pts.forEach((p,i)=>{
    const isSel = d.selectedIndex===i;
    const isStart = i===0, isEnd = i===pts.length-1;
    const r = isSel ? 9 : (isStart||isEnd ? 5 : 3.2);
    const fill = isSel ? 'var(--trail-yellow)' : (isStart ? 'var(--trail-green)' : (isEnd ? 'var(--ink)' : 'var(--muted)'));
    const strokeAttr = (isSel||isEnd) ? `stroke="var(--paper)" stroke-width="2"` : '';
    circles += `<circle data-pt-idx="${i}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" fill="${fill}" ${strokeAttr}/>`;
  });
  const canDelete = d.selectedIndex!=null && d.points.length>2;
  const hint = d.insertMode
    ? 'Koppints az útvonalra, ahova az új pontot fel szeretnéd venni.'
    : (d.selectedIndex!=null
        ? `${d.selectedIndex+1}. / ${d.points.length}. pont kijelölve — húzással áthelyezheted.`
        : 'Koppints egy pontra a kijelöléshez és húzáshoz.');
  openSheet(`
    <div class="sheet-head"><div class="sheet-title">🥾 Útvonal javítása</div><button class="iconbtn" onclick="closeJourneyEditor()">✕</button></div>
    <svg id="journey-edit-svg" viewBox="0 0 ${d.W} ${d.H}" width="100%" style="display:block;touch-action:none;border-radius:10px;background:var(--surface-2);">
      <g stroke="#2C3830" stroke-width="1">
        ${[1,2,3,4].map(i=>{const gx=(d.W/5*i).toFixed(1); return `<line x1="${gx}" y1="0" x2="${gx}" y2="${d.H}"/>`;}).join('')}
        ${[1,2,3].map(i=>{const gy=(d.H/4*i).toFixed(1); return `<line x1="0" y1="${gy}" x2="${d.W}" y2="${gy}"/>`;}).join('')}
      </g>
      <path id="journey-edit-path" d="${pathD}" fill="none" stroke="var(--trail-yellow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${circles}
    </svg>
    <div class="small muted" style="margin-top:8px;">${hint}</div>
    <div class="chiprow" style="margin-top:10px;">
      <div class="chip ${d.insertMode?'active':''}" onclick="journeyEditorToggleInsertMode()">➕ Pont felvétele</div>
      <div class="chip" onclick="journeyEditorReset()">↺ Visszaállítás</div>
    </div>
    <button class="btn btn-danger btn-block" style="margin-top:12px;${canDelete?'':'opacity:0.35;cursor:not-allowed;'}" ${canDelete?'':'disabled'} onclick="journeyEditorDeleteSelected()">🗑️ Kijelölt pont törlése</button>
    <div class="flex gap8" style="margin-top:12px;">
      <button class="btn btn-ghost btn-block" onclick="closeJourneyEditor()">Mégse</button>
      <button class="btn btn-primary btn-block" onclick="journeyEditorSave()">Mentés</button>
    </div>
  `);
  journeyEditorBindSvgEvents();
}
function journeyEditorToggleInsertMode(){
  const d=_journeyEditDraft; if(!d) return;
  d.insertMode = !d.insertMode;
  d.selectedIndex = null;
  renderJourneyEditSheet();
}
function journeyEditorReset(){
  const d=_journeyEditDraft; if(!d) return;
  const j = App.state.journeys.find(x=>x.id===d.journeyId);
  if(!j) return;
  d.points = j.points.map(p=>({lat:p.lat,lng:p.lng}));
  d.selectedIndex=null; d.insertMode=false;
  renderJourneyEditSheet();
}
function journeyEditorDeleteSelected(){
  const d=_journeyEditDraft; if(!d || d.selectedIndex==null || d.points.length<=2) return;
  d.points.splice(d.selectedIndex,1);
  d.selectedIndex=null;
  renderJourneyEditSheet();
}
function journeyEditorSave(){
  const d=_journeyEditDraft; if(!d) return;
  if(d.points.length<2){ toast('Legalább 2 pont szükséges'); return; }
  const j = App.state.journeys.find(x=>x.id===d.journeyId);
  if(!j){ closeJourneyEditor(); return; }
  j.points = d.points.map(p=>({lat:p.lat,lng:p.lng}));
  let totalM=0;
  for(let i=1;i<j.points.length;i++) totalM += haversine(j.points[i-1], j.points[i]);
  j.distanceKm = totalM/1000;
  saveState();
  _journeyEditDraft = null;
  closeSheet();
  toast('Útvonal frissítve');
  RENDERERS.terkep();
}
function svgEventPoint(svg, evt, W, H){
  const rect = svg.getBoundingClientRect();
  const scaleX = rect.width>0 ? W/rect.width : 1;
  const scaleY = rect.height>0 ? H/rect.height : 1;
  return [ (evt.clientX-rect.left)*scaleX, (evt.clientY-rect.top)*scaleY ];
}
function journeyEditorNearestPointIndex(pts, x, y, maxDistSq){
  let best=-1, bestD=maxDistSq;
  pts.forEach((p,i)=>{ const dx=p[0]-x, dy=p[1]-y, dd=dx*dx+dy*dy; if(dd<=bestD){ bestD=dd; best=i; } });
  return best;
}
function journeyEditorNearestSegmentIndex(pts, x, y){
  let best=-1, bestD=Infinity;
  for(let i=0;i<pts.length-1;i++){
    const x1=pts[i][0], y1=pts[i][1], x2=pts[i+1][0], y2=pts[i+1][1];
    const dx=x2-x1, dy=y2-y1, lenSq=dx*dx+dy*dy;
    let t = lenSq>0 ? ((x-x1)*dx+(y-y1)*dy)/lenSq : 0;
    t = Math.max(0,Math.min(1,t));
    const px=x1+t*dx, py=y1+t*dy;
    const dd=(x-px)*(x-px)+(y-py)*(y-py);
    if(dd<bestD){ bestD=dd; best=i; }
  }
  return best;
}
/* Húzás közben (pointermove) NEM hívunk teljes renderJourneyEditSheet()-et -
   az openSheet() minden hívásnál lecseréli a #sheet innerHTML-jét, ami a
   folyamatban lévő pointer-capture-t tartó svg elemet is megsemmisítené és
   megszakítaná a húzást. Ehelyett a húzás alatt közvetlenül a kör/path DOM
   attribútumait módosítjuk, és csak pointerup/pointercancel után (amikor a
   gesztus már lezárult) hívunk teljes újrarajzolást. */
function journeyEditorBindSvgEvents(){
  const d = _journeyEditDraft; if(!d) return;
  const svg = document.getElementById('journey-edit-svg'); if(!svg) return;
  svg.addEventListener('pointerdown', (evt)=>{
    evt.preventDefault();
    const [x,y] = svgEventPoint(svg, evt, d.W, d.H);
    const pts = d.points.map(d.proj);
    if(d.insertMode){
      const afterIdx = journeyEditorNearestSegmentIndex(pts, x, y);
      if(afterIdx===-1) return;
      d.points.splice(afterIdx+1, 0, d.unproj(x,y));
      d.insertMode = false;
      d.selectedIndex = afterIdx+1;
      renderJourneyEditSheet();
      return;
    }
    const hitRadiusSq = Math.pow(d.W*0.06, 2);
    const idx = journeyEditorNearestPointIndex(pts, x, y, hitRadiusSq);
    if(idx===-1){
      d.selectedIndex = null;
      renderJourneyEditSheet();
      return;
    }
    d.selectedIndex = idx;
    d.dragIndex = idx;
    svg.setPointerCapture(evt.pointerId);
    const circleEl = svg.querySelector(`[data-pt-idx="${idx}"]`);
    if(circleEl){ circleEl.setAttribute('r','9'); circleEl.setAttribute('fill','var(--trail-yellow)'); circleEl.setAttribute('stroke','var(--paper)'); circleEl.setAttribute('stroke-width','2'); }
  });
  svg.addEventListener('pointermove', (evt)=>{
    if(d.dragIndex==null) return;
    evt.preventDefault();
    const [x,y] = svgEventPoint(svg, evt, d.W, d.H);
    const circleEl = svg.querySelector(`[data-pt-idx="${d.dragIndex}"]`);
    if(circleEl){ circleEl.setAttribute('cx', x.toFixed(1)); circleEl.setAttribute('cy', y.toFixed(1)); }
    const livePts = d.points.map(d.proj);
    livePts[d.dragIndex] = [x,y];
    const pathEl = svg.querySelector('#journey-edit-path');
    if(pathEl) pathEl.setAttribute('d', journeyEditorPathD(livePts));
  });
  const commitDrag = (evt)=>{
    if(d.dragIndex==null) return;
    const [x,y] = svgEventPoint(svg, evt, d.W, d.H);
    d.points[d.dragIndex] = d.unproj(x,y);
    d.dragIndex = null;
    try{ svg.releasePointerCapture(evt.pointerId); }catch(e){}
    renderJourneyEditSheet();
  };
  svg.addEventListener('pointerup', commitDrag);
  svg.addEventListener('pointercancel', commitDrag);
}

function parseAiResponse(raw){
  let m = raw.match(/```json\s*([\s\S]*?)```/i);
  let jsonStr = m ? m[1] : null, cutIdx = m ? m.index : -1;
  if(!jsonStr){
    const m2 = raw.match(/(\{[\s\S]*"suggestions"[\s\S]*\})\s*$/);
    if(m2){ jsonStr = m2[1]; cutIdx = m2.index; }
  }
  if(!jsonStr) return {text:raw.trim(), suggestions:[]};
  let suggestions=[];
  try{ const parsed=JSON.parse(jsonStr); suggestions = Array.isArray(parsed.suggestions) ? parsed.suggestions : []; }
  catch(e){ console.error('suggestion JSON parse failed', e, jsonStr); }
  // A "workout" AI_SYSTEM leírása szerint a felhő-AI kihagyhatja az energyBefore/
  // energyAfter mezőket mai edzésnél, ha a felhasználó nem közölt konkrét
  // energiahatást - a promptban ígért 60→50 alapértelmezett becslést itt kell
  // pótolni, mert a helyi parancs-parser (parseLocalWorkoutCommand) ugyanezt
  // közvetlenül, magától teszi meg mai edzésnél; e nélkül a felhő-AI-s
  // javaslatkártyán nem jelenne meg az energiamező, ellentétben az ígérttel.
  suggestions.forEach(s=>{
    if(s && s.type==='workout' && (!s.date || s.date===todayISO()) && s.energyBefore==null){
      s.energyBefore = 60; s.energyAfter = 50;
    }
  });
  return {text: raw.slice(0,cutIdx).trim(), suggestions};
}
/* ===== HELYI AI PARANCSOK =====
   Az egyszerű adatbeviteli parancsokat nem küldjük fel az AI szolgáltatásnak.
   Így pl. a "Adj hozzá 450k Ft bevételt" akkor is működik, ha az AI kvótája
   elfogyott vagy az API átmenetileg nem elérhető.
*/
function normalizeHU(str){
  return (str||'').toLowerCase().normalize('NFD').replace(new RegExp('[\\u0300-\\u036f]','g'),'').replace(/\s+/g,' ').trim();
}
function parseHUFAmount(text){
  const s=(text||'').toLowerCase().replace(/\u00a0/g,' ');
  let m=s.match(/(\d+(?:[.,]\d+)?)\s*(k|ezer)\b/);
  if(m){
    const n=parseFloat(m[1].replace(',','.'));
    return Math.round(n*1000);
  }
  m=s.match(/(\d{1,3}(?:[ .]\d{3})+|\d{4,9})(?:\s*(?:ft|forint))?\b/);
  if(m) return parseInt(m[1].replace(/[ .]/g,''),10);
  // 1-3 jegyű összeg "k"/"ezer" toldalék NÉLKÜL (pl. "Kávé 450 ft"): itt KÖTELEZŐ a
  // "ft"/"forint" mértékegység jelenléte, különben pl. egy "3 feladat"-ból tévesen 3
  // Ft-ot olvasnánk be. A fenti 4-9 jegyű/ezres-tagolt ág marad a jelenlegi, opcionális
  // mértékegységes viselkedésén (azt a hívási helyek finance-kontextusa már gate-eli).
  m=s.match(/\b(\d{1,3})\s*(?:ft|forint)\b/);
  if(m) return parseInt(m[1],10);
  return null;
}

function parseLocalMealCommand(text){
  const raw=(text||'').trim(), n=normalizeHU(raw);
  const hints=['ettem','reggeliztem','ebedeltem','vacsoraztam','uzsonnaztam'];
  // Felszólító alak is elfogadott, pl. "Rögzíts étkezést. 1db hamburger" — itt a kulcsszó
  // nem közvetlenül az étel neve előtt áll, ezért ezt külön ág kezeli (lásd lentebb).
  const imperativeHint = /rogzit\w*\s+(?:egy\s+)?etkez\w*/.test(n) || /etkez\w*\s+rogzit\w*/.test(n);
  // Szóhatáros illesztés (\b), NEM substring-keresés: a normalizeHU kimenete csak
  // ASCII betűket/számokat tartalmaz (az ékezetek NFD-bontás után eltávolítva), így a
  // \b JS word-boundary helyesen működik rajta. Substring-keresés esetén a rövid
  // "ettem" hint hamisan illeszkedne minden "-ettem" végű igére is (pl. "fizettem"),
  // ezért itt kizárólag teljes szóra illesztünk.
  // "meg-" igekötős alakok (pl. "Megettem egy tojást") is felismerendők: a normalizált
  // szövegben az igekötő az ige TÖVÉHEZ tapad (nincs szóhatár közöttük, pl. "megettem"),
  // ezért egy opcionális "meg" előtagot engedünk meg a kezdő \b ÉS a hint-szó között — a
  // záró \b (a hint-szó UTÁN) továbbra is véd a fenti "fizettem"-szerű álpozitívok ellen.
  const hintRe = new RegExp('\\b(?:meg)?(?:' + hints.join('|') + ')\\b');
  if(!hintRe.test(n) && !imperativeHint) return null;
  const mm=raw.match(/(?:meg)?(?:ettem|reggeliztem|ebedeltem|vacsoraztam|uzsonnaztam)\s+(?:egy\s+)?(.+?)(?:[.!?]|$)/i);
  let name=null;
  if(mm){
    name=mm[1].trim();
  }else if(imperativeHint){
    // A trigger-mondat ("rögzíts étkezést" / "étkezés rögzítése") utáni rész az étel neve,
    // pl. "Rögzíts étkezést. 1db hamburger" -> "1db hamburger".
    // Megj.: sima \w nem illeszkedik az ékezetes magyar betűkre (pl. "étkezést" ->
    // \w* megállna az "é"-nél), ezért itt kibővített betűkészletet használunk, hogy
    // a teljes "étkezést" szót (és hasonló toldalékos alakokat) levágja a mintából.
    name=raw.replace(/^.*?[eé]tkez[a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ]*\s*[:.,!?-]*\s*/i,'').trim();
  }
  if(!name) return null;
  const f=normalizeHU(name);
  let kcal=500,protein=20,carbs=45,fat=22;
  if(f.includes('hamburger')||f.includes('burger')) [kcal,protein,carbs,fat]=[550,25,45,28];
  else if(f.includes('pizza')) [kcal,protein,carbs,fat]=[700,30,75,28];
  else if(f.includes('csirkemell')) [kcal,protein,carbs,fat]=[300,45,0,10];
  else if(f.includes('tojas')) [kcal,protein,carbs,fat]=[150,13,1,10];
  let mealType='snack';
  if(n.includes('reggel')) mealType='breakfast';
  else if(n.includes('ebed')) mealType='lunch';
  else if(n.includes('vacsor')) mealType='dinner';
  return {type:'meal',name,mealType,kcal,protein,carbs,fat};
}

/* parsePastRelativeDateHU: parseRelativeDateHU (lentebb) csak JÖVŐBELI relatív
   dátumokat ismer fel (ma/holnap/holnapután/hétnapnevek) - az feladatok/
   események határidejéhez van hangolva, ahol egy MÚLTBELI dátum nem
   értelmezhető. Az edzésnaplózás viszont tipikusan MÚLT idejű ("Tegnap
   voltam edzeni..."), ezért ehhez külön, szűkebb hatókörű helper kell -
   szándékosan nem bővítjük ki a megosztott parseRelativeDateHU-t erre, hogy
   a task/event felismerést ne érintse. */
function parsePastRelativeDateHU(normSeg){
  if(normSeg.includes('tegnapelott')){ const d=new Date(); d.setDate(d.getDate()-2); return toLocalISO(d); }
  if(normSeg.includes('tegnap')){ const d=new Date(); d.setDate(d.getDate()-1); return toLocalISO(d); }
  if(/\bma\b/.test(normSeg)) return todayISO();
  return '';
}
/* parseLocalWorkoutCommand: a parseLocalMealCommand pontos mintáját követi
   (hint-szavak MÚLT időben + felszólító alak külön ágon), hogy az edzés
   naplózása API kulcs nélkül, helyben is működjön - ugyanúgy, ahogy az
   étkezés/feladat/esemény felismerés is API nélkül működik (ld. a fájl eleji
   HELYI AI PARANCSOK megjegyzést). A kategória-szöveget (pl. "Street
   workoutot") NEM próbáljuk lemmatizálni/toldalék nélkülire vágni - a
   jóváhagyó kártyán úgyis szabadon szerkeszthető (ugyanaz a minta, mint a
   meal-parser étel-nevénél). */
function parseLocalWorkoutCommand(text){
  const raw=(text||'').trim(), n=normalizeHU(raw);
  const imperativeHint = /rogzit\w*\s+(?:egy\s+)?edz\w*/.test(n) || /edz\w*\s+rogzit\w*/.test(n);
  const hintRe = /\bedzettem\b|\bvoltam\s+edzeni\b|\bedzeni\s+voltam\b/;
  if(!hintRe.test(n) && !imperativeHint) return null;
  const mm = raw.match(/(?:edzettem|voltam\s+edzeni|edzeni\s+voltam)\s+(.+?)(?:[.!?]|$)/i);
  let category=null;
  if(mm){
    category=mm[1].trim();
  }else if(imperativeHint){
    category=raw.replace(/^.*?edz[a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ]*\s*[:.,!?-]*\s*/i,'').trim();
  }
  if(!category) category='Edzés';
  // Ha a category ténylegesen csak egy időtartam-kifejezés (pl. "30 percet"), az nem
  // valódi edzéstípus-név - ilyenkor essünk vissza az általános 'Edzés' címkére
  // (a durationMin-t a durMatch külön amúgy is kinyeri, nem veszik el semmi infó).
  if(/^\d{1,3}\s*perc(?:et)?\.?$/i.test(category.trim())) category='Edzés';
  const durMatch = n.match(/(\d{1,3})\s*perc/);
  const durationMin = durMatch ? parseInt(durMatch[1],10) : null;
  const date = parsePastRelativeDateHU(n) || todayISO();
  const result = {type:'workout', category, durationMin, date, muscleGroups:[], notes:''};
  if(date === todayISO()){ result.energyBefore = 60; result.energyAfter = 50; }
  return result;
}

/* parseLocalWeightCommand / parseLocalJournalCommand / parseLocalDiscretionarySpendCommand /
   parseLocalSavingsAddCommand: ugyanazt a célt szolgálják, mint a fenti meal/workout
   parserek - hogy minél több gyakori MotivAI-parancs API kulcs (fizetős Anthropic
   hívás) NÉLKÜL, helyben is működjön. A discretionary/savings parsereknél a
   kategórianevet NEM próbáljuk szabad szövegből kitalálni - ehelyett a TÉNYLEGESEN
   létező (App.state.finance.discretionary/savings) kategórianevekhez illesztjük
   substring-alapon, ami egyúttal a magyar ragozott alakokat (pl. "szórakozásra" a
   "szórakozás" tő prefixeként) is helyesen kezeli, és nem igényel toldalék-levágást. */
function parseLocalWeightCommand(text){
  const raw=(text||'').trim(), n=normalizeHU(raw);
  let mm = n.match(/(\d{2,3}(?:[.,]\d)?)\s*kg\s+vagyok\b/);
  if(!mm && /\b(sulyom|testsulyom)\w*\b/.test(n)) mm = n.match(/(\d{2,3}(?:[.,]\d)?)\s*kg\b/);
  if(!mm && /\b(lemertem|megmertem)\w*\s+magam/.test(n)) mm = n.match(/(\d{2,3}(?:[.,]\d)?)\s*kg\b/);
  if(!mm) return null;
  const kg = parseFloat(mm[1].replace(',','.'));
  if(!(kg>0)) return null;
  const date = parsePastRelativeDateHU(n) || todayISO();
  return {type:'weight', kg, date};
}
function parseLocalJournalCommand(text){
  const raw=(text||'').trim(), n=normalizeHU(raw);
  const startsWithLabel = /^naplo\w*\s*(?:bejegyzes\w*)?\s*[:\-]/.test(n);
  const imperative = /\bnaplozd\b/.test(n) || /jegyezd fel.*naplo\w*/.test(n);
  if(!startsWithLabel && !imperative) return null;
  const content = raw.replace(/^.*?naplo\w*\s*(?:bejegyzes\w*)?\s*[:.,!?-]*\s*(?:a naploba\s*[:.,!?-]*\s*)?/i,'').trim();
  const moodMatch = n.match(/\b([1-5])\s*\/\s*5\b/) || n.match(/hangulat\w*\s*[: ]?\s*([1-5])\b/);
  const mood = moodMatch ? parseInt(moodMatch[1],10) : null;
  if(!content && !mood) return null;
  return {type:'journal', mood, text: content||''};
}
function parseLocalDiscretionarySpendCommand(text){
  const raw=(text||'').trim(), n=normalizeHU(raw);
  if(!/\b(elkoltottem|koltottem|kiadtam)\w*\b/.test(n)) return null;
  const amount = parseHUFAmount(raw);
  if(!amount) return null;
  const hit = (App.state.finance.discretionary||[]).find(c=>n.includes(normalizeHU(c.name)));
  if(!hit) return null;
  return {type:'discretionary_spend', name:hit.name, amount};
}
function parseLocalSavingsAddCommand(text){
  const raw=(text||'').trim(), n=normalizeHU(raw);
  if(!/\b(felretettem|megtakaritottam|takarekoskodtam)\w*\b/.test(n)) return null;
  const amount = parseHUFAmount(raw);
  if(!amount) return null;
  const hit = (App.state.finance.savings||[]).find(c=>n.includes(normalizeHU(c.name)));
  if(!hit) return null;
  return {type:'savings_add', name:hit.name, amount};
}

/* parseLocalCycleQuestionCommand: egyszerű, közvetlen KÉRDÉSEKre válaszol a
   felhasználó aktuális munkarend-ciklusáról (App.state.schedule.pattern/
   startDate), API-hívás NÉLKÜL — a dayTypeFor/scheduleDayIndex meglévő
   modulo-aritmetikáját újrahasználva (ld. scheduleDayIndex doksija fentebb).
   A többi helyi paranccsal ELLENTÉTBEN ez NEM ad vissza jóváhagyandó javaslatot
   (nincs addLocalAiSuggestions-hívás) — egy csak-olvasás jellegű kérdésnél
   nincs mit jóváhagyni, ezért handleLocalAiCommand ezt közvetlenül aiChat-be
   írja, sima assistant-üzenetként.
   Kontextus-kizárás (FEJLESZTŐI IRÁNYELVEK #2, ld. financeContextExclude
   mintája): feladat/emlékeztető-jellegű mondatok (pl. "Emlékeztess a következő
   pihenőnapomon...") NEM helyi kérdésként értelmezendők, még ha tartalmazzák is
   a "következő pihenőnap" kifejezést — ezeket parseLocalTaskEventCommand-nak
   kell felismernie (jövőbeli feladatként/eseményként), ezért itt explicit
   kizárjuk őket, mielőtt bármelyik mintát megpróbálnánk illeszteni. */
const CYCLE_QUESTION_CONTEXT_EXCLUDE = ['feladat','emlekezt','naplozz','koltottem','felretettem','bevetel','fizettem'];
function parseLocalCycleQuestionCommand(text){
  const n = normalizeHU(text);
  if(!n) return null;
  if(CYCLE_QUESTION_CONTEXT_EXCLUDE.some(x=>n.includes(x))) return null;

  const hasCiklus = /\bciklus\w*\b/.test(n);
  const today = todayISO();
  const pat = App.state.schedule.pattern;
  const len = (pat && pat.length) || 0;

  // 1) "Hányadik napja vagyok a ciklusnak?" / "Melyik napon vagyok a ciklusban?"
  if(hasCiklus && (/\bhanyadik\b/.test(n) || (/\bmelyik\b/.test(n) && /\bnap\w*\b/.test(n)))){
    if(!len) return null;
    const dayNum = scheduleDayIndex(today) + 1;
    return dayNum+'. napja vagy a mostani '+len+' napos ciklusnak.';
  }

  // 2) "Meddig tart a mostani ciklusom?" / "Mikor ér véget a ciklusom?"
  if(hasCiklus && ((/\bmeddig\b/.test(n) && /\btart\w*\b/.test(n)) || (/\bmikor\b/.test(n) && (/\ber\s+veget\b/.test(n) || /\bvegzodik\w*\b/.test(n))))){
    if(!len) return null;
    const idx = scheduleDayIndex(today);
    const d = new Date(today+'T00:00:00');
    d.setDate(d.getDate() + (len-1-idx));
    const endIso = toLocalISO(d);
    return 'A mostani ciklusod '+fmtDateHu(endIso)+' napon ér véget.';
  }

  // 3) "Mikor van a következő éjszakás (műszakom)?" / "Mikor van a következő pihenőnapom?"
  if(/\bkovetkezo\b/.test(n) && /\bmikor\b/.test(n)){
    const DAYTYPE_HINTS = [
      {type:'ejszaka', re:/\bejszak\w*\b/},
      {type:'nappal', re:/\bnappal\w*\b/},
      {type:'pihen', re:/\bpihen\w*\b/},
      {type:'szabi', re:/\b(szabi\w*|szabadsag\w*)\b/},
      {type:'egyeb', re:/\begyeb\w*\b/}
    ];
    const hit = DAYTYPE_HINTS.find(h=>h.re.test(n));
    if(hit && len){
      const label = ((DAY_TYPES[hit.type] && DAY_TYPES[hit.type].label) || hit.type).toLowerCase();
      let d = new Date(today+'T00:00:00');
      d.setDate(d.getDate()+1);
      let found = null;
      for(let i=0;i<370;i++){
        const iso = toLocalISO(d);
        if(dayTypeFor(iso)===hit.type){ found = iso; break; }
        d.setDate(d.getDate()+1);
      }
      if(found) return 'A következő '+label+': '+fmtDateHu(found);
      return 'A jelenlegi beosztásodban nem találtam '+label+' napot a következő évben.';
    }
  }

  return null;
}

/* parseRelativeDateHU / parseTimeHU: csak EGYÉRTELMŰ relatív dátum- és időpont-
   kifejezéseket ismernek fel (ma/holnap/holnapután, ill. "16 óra"/"16:30"/
   "délután 4"). Minden más esetben üres stringet adnak vissza — NEM találgatunk,
   a jóváhagyó kártyán a mező úgyis szerkeszthető marad (lásd renderAiChat). */
// getDay() index szerint: 0=vasárnap, 1=hétfő, ..., 6=szombat.
const WEEKDAYS_HU = ['vasarnap','hetfo','kedd','szerda','csutortok','pentek','szombat'];
function parseRelativeDateHU(normSeg){
  if(normSeg.includes('holnaputan')){ const d=new Date(); d.setDate(d.getDate()+2); return toLocalISO(d); }
  if(normSeg.includes('holnap')){ const d=new Date(); d.setDate(d.getDate()+1); return toLocalISO(d); }
  if(/\bma\b/.test(normSeg)) return todayISO();
  // Hétnapnevek (ragozott alakokkal is, pl. "hétfőn", "kedden") -> a legközelebbi
  // JÖVŐBELI előfordulásra ugrunk (1-7 nap múlva). Ha ma épp az adott nap, akkor a
  // KÖVETKEZŐ hétre (ma NEM jó találat, mert "hétfőn" nem ugyanaz mint "ma").
  // Szándékosan NEM ismerünk fel "jövő hét(en)"-t napnév nélkül -- az bizonytalan,
  // marad üres string (a mező szerkeszthető marad a jóváhagyó kártyán).
  for(let i=0;i<WEEKDAYS_HU.length;i++){
    if(new RegExp('\\b'+WEEKDAYS_HU[i]+'\\w*\\b').test(normSeg)){
      const d=new Date();
      const todayDow=d.getDay();
      let diff=(i-todayDow+7)%7;
      if(diff===0) diff=7;
      d.setDate(d.getDate()+diff);
      return toLocalISO(d);
    }
  }
  return '';
}
function parseTimeHU(normSeg){
  let m=normSeg.match(/\b(\d{1,2})[:.](\d{2})\b/);
  if(m) return pad(parseInt(m[1],10))+':'+m[2];
  m=normSeg.match(/\bdelutan\s+(\d{1,2})\b/);
  if(m){ let h=parseInt(m[1],10); if(h<12) h+=12; return pad(h)+':00'; }
  m=normSeg.match(/\b(\d{1,2})\s*ora\b/);
  if(m) return pad(parseInt(m[1],10))+':00';
  return '';
}
/* ORDINAL_DAY_FROM_HU / ORDINAL_DAY_TO_HU: a hónap napjainak kiírt sorszámneve
   "-tól/-től" (kezdő nap) és "-ig" (záró nap) ragozott alakban, 1-31. A magyar
   magánhangzó-harmónia (a/e) miatt számonként külön fel kell sorolni (nem
   generálható egyszerű képlettel), ezért ÉKEZETESEN vannak megadva - a normalizált
   (ékezet nélküli) alakot futáskor a normalizeHU()-val számoljuk, hogy garantáltan
   ugyanazt a szabályt kövesse, mint a fájl többi illesztése. Az ékezetes alakok a
   címből való eltávolításnál (parseLocalTaskEventCommand) is kellenek. */
const ORDINAL_DAY_FROM_HU = {1:'elsejétől',2:'másodikától',3:'harmadikától',4:'negyedikétől',5:'ötödikétől',6:'hatodikától',7:'hetedikétől',8:'nyolcadikától',9:'kilencedikétől',10:'tizedikétől',11:'tizenegyedikétől',12:'tizenkettedikétől',13:'tizenharmadikától',14:'tizennegyedikétől',15:'tizenötödikétől',16:'tizenhatodikától',17:'tizenhetedikétől',18:'tizennyolcadikától',19:'tizenkilencedikétől',20:'huszadikától',21:'huszonegyedikétől',22:'huszonkettedikétől',23:'huszonharmadikától',24:'huszonnegyedikétől',25:'huszonötödikétől',26:'huszonhatodikától',27:'huszonhetedikétől',28:'huszonnyolcadikától',29:'huszonkilencedikétől',30:'harmincadikától',31:'harmincegyedikétől'};
const ORDINAL_DAY_TO_HU = {1:'elsejéig',2:'másodikáig',3:'harmadikáig',4:'negyedikéig',5:'ötödikéig',6:'hatodikáig',7:'hetedikéig',8:'nyolcadikáig',9:'kilencedikéig',10:'tizedikéig',11:'tizenegyedikéig',12:'tizenkettedikéig',13:'tizenharmadikáig',14:'tizennegyedikéig',15:'tizenötödikéig',16:'tizenhatodikáig',17:'tizenhetedikéig',18:'tizennyolcadikáig',19:'tizenkilencedikéig',20:'huszadikáig',21:'huszonegyedikéig',22:'huszonkettedikéig',23:'huszonharmadikáig',24:'huszonnegyedikéig',25:'huszonötödikéig',26:'huszonhatodikáig',27:'huszonhetedikéig',28:'huszonnyolcadikáig',29:'huszonkilencedikéig',30:'harmincadikáig',31:'harmincegyedikéig'};
const MAX_DATE_RANGE_DAYS = 14; // ennél hosszabb (feltehetően félreértett) tartományt inkább nem találgatunk

/* parseDateRangeHU: több napra kiterjedő "X-tól/-től Y-ig" dátumtartományt ismer
   fel - kiírt sorszámnévvel ("kilencedikétől tizenegyedikéig") VAGY számjeggyel
   ("9-től 11-ig"). A találatot a szóhatáros (\b) illesztés védi az olyan
   substring-ütközésektől, mint pl. "harmadikától" (3.) benne van a
   "tizenharmadikától" (13.) szó VÉGÉN - mivel a magyar összetett számnevek
   elválasztójel nélkül kapcsolódnak, a \b csak a teljes szó elején/végén illeszkedik,
   a szó belsejében nem, így a hosszabb (helyes) szám nyer. Ha a hónap adott napja(i)
   már elmúltak ebben a hónapban, a KÖVETKEZŐ hónapra tolja (jövőbeli értelmezés,
   ugyanaz az elv, mint a parseRelativeDateHU hétnapneveinél). Visszatérési érték
   null, ha nincs egyértelmű tartomány, vagy az ésszerűtlenül hosszú (> MAX_DATE_RANGE_DAYS). */
function parseDateRangeHU(normSeg){
  let fromDay=null, toDay=null;
  for(const num of Object.keys(ORDINAL_DAY_FROM_HU)){
    const re=new RegExp('\\b'+normalizeHU(ORDINAL_DAY_FROM_HU[num])+'\\b');
    if(re.test(normSeg)){ fromDay=parseInt(num,10); break; }
  }
  if(fromDay==null){
    const m=normSeg.match(/\b(\d{1,2})\s*-?\s*tol\b/);
    if(m && +m[1]>=1 && +m[1]<=31) fromDay=parseInt(m[1],10);
  }
  for(const num of Object.keys(ORDINAL_DAY_TO_HU)){
    const re=new RegExp('\\b'+normalizeHU(ORDINAL_DAY_TO_HU[num])+'\\b');
    if(re.test(normSeg)){ toDay=parseInt(num,10); break; }
  }
  if(toDay==null){
    const m=normSeg.match(/\b(\d{1,2})\s*-?\s*ig\b/);
    if(m && +m[1]>=1 && +m[1]<=31) toDay=parseInt(m[1],10);
  }
  if(fromDay==null || toDay==null) return null;

  const today=new Date(); today.setHours(0,0,0,0);
  let start=new Date(today.getFullYear(), today.getMonth(), fromDay);
  if(start<today) start=new Date(today.getFullYear(), today.getMonth()+1, fromDay);
  let end=new Date(start.getFullYear(), start.getMonth(), toDay);
  if(toDay<fromDay) end=new Date(start.getFullYear(), start.getMonth()+1, toDay); // hónapváltós tartomány

  const dates=[];
  const cur=new Date(start);
  while(cur<=end && dates.length<=MAX_DATE_RANGE_DAYS){
    dates.push(toLocalISO(cur));
    cur.setDate(cur.getDate()+1);
  }
  if(!dates.length || dates.length>MAX_DATE_RANGE_DAYS) return null;
  return {dates, fromNum:fromDay, toNum:toDay};
}
// taskOccursOn: igaz, ha a feladat határideje (due/dueEnd tartomány) érinti az adott
// napot. Szándékosan HAMIS, ha a feladatnak egyáltalán nincs határideje (!t.due) - a
// "nincs határidő -> minden nap látszik" viselkedés a HÍVÓ oldalon marad explicit
// `!t.due || taskOccursOn(t,iso)` formában, mindenhol ahol eddig is megvolt (pl. a MA
// nézet és az AI-kontextus) - a naptár-rácsban (dayCell/openDaySheet/renderNapView)
// viszont egy határidő nélküli feladat változatlanul NEM jelenik meg, ez a jelenlegi
// (nem módosítandó) viselkedés.
function taskOccursOn(t, iso){
  if(!t.due) return false;
  const end = t.dueEnd || t.due;
  return iso >= t.due && iso <= end;
}
function eventOccursOn(e, iso){
  const end = e.endDate || e.date;
  return iso >= e.date && iso <= end;
}
/* parseLocalTaskEventCommand: EGY szövegből TÖBB feladat/esemény-jelöltet is
   kigyűjt (lásd handleLocalAiCommand). A finance-ág mondatokra-bontós mintáját
   követi: a szöveget mondatokra/tagmondatokra bontjuk ('.', '!', '?' mentén), és
   minden szegmensben feladat/esemény-jelző szavakat keresünk. Egy "csak jelző"
   szegmens (pl. "Rögzíts két feladatot." vagy "Rögzíts eseményt holnapra.")
   önmagában NEM hoz létre javaslatot (nincs érdemi cím-tartalma), de kijelöli a
   módot (task/event) a rá következő, érdemi tartalmú szegmensek számára — így egy
   üzenetben több tétel is felismerhető, pl.:
   "Rögzíts két feladatot. Holnap vidd be a autót szervizbe. Pénteken hívd fel
   Pétert." -> 2 db 'task' javaslat.
   Egy "csak jelző" szegmensben talált dátum öröklődik a rá következő tartalom-
   szegmensekre, HA azoknak nincs saját dátumuk (pl. "Rögzíts eseményt holnapra.
   Fogászat, 16 óra" -> az esemény dátuma a holnapi lesz, mert a "Fogászat, 16 óra"
   szegmensnek nincs saját dátumjelölése, csak a trigger-mondatnak). */
function stripKnownTaskEventWords(seg){
  return seg
    .replace(/\brogzit\w*\b/g,' ')
    .replace(/\bfeladat\w*\b/g,' ')
    .replace(/\bemlekeztet\w*\b/g,' ')
    .replace(/\besemeny\w*\b/g,' ')
    .replace(/\btalalkoz\w*\b/g,' ')
    .replace(/\bholnaputan\w*\b/g,' ')
    .replace(/\bholnap\w*\b/g,' ')
    .replace(/\bma\b/g,' ')
    .replace(/\bket\b|\bharom\b/g,' ')
    .replace(/\d{1,2}[:.]\d{2}\b/g,' ')
    .replace(/\bdelutan\s+\d{1,2}\b/g,' ')
    .replace(/\b\d{1,2}\s*orakor\b/g,' ')
    .replace(/\b\d{1,2}\s*ora\b/g,' ')
    .replace(/[:,\-–]/g,' ')
    .replace(/\s+/g,' ').trim();
}

function classifyTaskEventSegments(normSegs){
  const taskKW=['feladat','emlekeztet'];
  const eventKW=['esemeny','talalkoz'];
  return normSegs.map((seg,i)=>{
    const hasTaskKW=taskKW.some(k=>seg.includes(k));
    const hasEventKW=eventKW.some(k=>seg.includes(k));
    const stripped=stripKnownTaskEventWords(seg);
    const isTriggerOnly=(hasTaskKW||hasEventKW)&&stripped.length<3;
    const triggerMode=hasEventKW?'event':(hasTaskKW?'task':null);
    return {i,hasTaskKW,hasEventKW,isTriggerOnly,triggerMode};
  });
}

function determineTaskEventMode(meta){
  if(meta.some(m=>m.hasEventKW)) return 'event';
  if(meta.some(m=>m.hasTaskKW)) return 'task';
  return null;
}

// BUGFIX (pozíció-alapú jelölt-eligibilitás): egy kulcsszó NÉLKÜLI, nem-trigger-only
// szegmens csak akkor legyen jelölt-eligibilis, ha egy KORÁBBI (alacsonyabb indexű)
// szegmens ugyanabban az üzenetben trigger-only volt ÉS a globális móddal megegyező
// módhoz tartozott. A régi kód a globális `mode`-ot alkalmazta MINDEN nem-trigger-only
// szegmensre, a pozíció figyelembevétele nélkül — emiatt egy, a trigger-mondat ELŐTT
// álló, kulcsszó nélküli, múlt idejű kijelentés (pl. "Befizetett számlák: áram 17k ft,
// Víz 5k ft. Feladat rögzítése holnapra: garázs befizetni 16k ft") tévesen jelöltté
// vált, csak azért, mert az üzenet VALAHOL (egy KÉSŐBBI szegmensben) tartalmazott
// feladat/esemény-jelzőt. Egy szegmens, ami MAGA tartalmaz feladat/esemény-jelző szót,
// mindig eligibilis, a pozíciótól függetlenül (ez tartja meg a láncolt felismerést,
// lásd a funkció-fejléc kommentjét).
function computeTaskEventSegmentEligibility(meta, mode){
  let precededByTrigger=false;
  return meta.map(m=>{
    const ownEligible=m.hasTaskKW||m.hasEventKW;
    const isEligible=ownEligible||precededByTrigger;
    if(m.isTriggerOnly && m.triggerMode===mode) precededByTrigger=true;
    return isEligible;
  });
}

function computeInheritedTaskEventDate(meta, normSegs){
  let inheritedDate='';
  meta.forEach(m=>{ if(m.isTriggerOnly){ const d=parseRelativeDateHU(normSegs[m.i]); if(d) inheritedDate=d; } });
  return inheritedDate;
}

// Defense-in-depth: befejezett/múlt idejű kijelentésekre utaló szavak — egy ilyet
// tartalmazó szegmens SOSE váljon task/event-jelöltté, még akkor sem, ha egyébként a
// pozíció vagy saját kulcsszó alapján eligibilis lenne. Ez arra az esetre is véd, ha a
// múlt idejű mondat a trigger-mondat UTÁN áll (a fenti pozíció-alapú javítás önmagában
// csak a trigger ELŐTTI eseteket védené ki). Stílus-referencia: financeContextExclude
// a handleLocalAiCommand-ban.
const TASK_EVENT_CONTEXT_EXCLUDE=['befizetett','kifizettem','fizettem','elintez','megcsinal','elkuldtem','megvettem','elvegez','elkeszult','kesz van'];

function buildTaskEventSuggestionFromSegment(mode, rawSeg, normSeg, inheritedDate){
  if(TASK_EVENT_CONTEXT_EXCLUDE.some(x=>normSeg.includes(x))) return null; // múlt idejű/befejezett kijelentés
  const dateRange=parseDateRangeHU(normSeg);
  const ownDate=dateRange?'':parseRelativeDateHU(normSeg);
  const time=parseTimeHU(normSeg);
  // Megj.: sima \w NEM illeszkedik az ékezetes magyar betűkre (pl. "rögzítése" -> \w*
  // megállna az "é"-nél és "ése" beragadna a címbe), ezért itt - a parseLocalMealCommand
  // imperativeHint-jéhez hasonlóan - kibővített betűkészletet használunk a toldalékokhoz.
  const HUW='[a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ]*';
  let title=rawSeg
    .replace(new RegExp('\\brögzít'+HUW+'\\b','gi'),' ')
    .replace(new RegExp('\\bfeladat'+HUW+'\\b','gi'),' ')
    .replace(new RegExp('\\bemlékeztet'+HUW+'\\b','gi'),' ')
    .replace(new RegExp('\\besemény'+HUW+'\\b','gi'),' ')
    .replace(new RegExp('\\btalálkoz'+HUW+'\\b','gi'),' ')
    .replace(new RegExp('\\bholnapután'+HUW+'\\b','gi'),' ')
    .replace(new RegExp('\\bholnap'+HUW+'\\b','gi'),' ')
    .replace(/\bma\b/gi,' ')
    .replace(/\d{1,2}[:.]\d{2}\b/g,' ')
    .replace(/\bdélután\s+\d{1,2}(\s*órakor|\s*óra)?\b/gi,' ')
    .replace(/\b\d{1,2}\s*órakor\b/gi,' ')
    .replace(/\b\d{1,2}\s*óra\b/gi,' ');
  if(dateRange){
    // Az ékezetes sorszónevet (ha az illett) ÉS az általános számjegyes mintát
    // (ha az illett) is eltávolítjuk - a kettő közül úgyis csak az egyik van
    // ténylegesen jelen a szövegben, a másik illesztés ártalmatlan no-op.
    title=title
      .replace(new RegExp('\\b'+ORDINAL_DAY_FROM_HU[dateRange.fromNum]+'\\b','gi'),' ')
      .replace(new RegExp('\\b'+ORDINAL_DAY_TO_HU[dateRange.toNum]+'\\b','gi'),' ')
      .replace(/\b\d{1,2}\s*-?\s*t[oóő]l\b/gi,' ')
      .replace(/\b\d{1,2}\s*-?\s*ig\b/gi,' ');
  }
  title=title
    .replace(/^[\s,:;.\-–]+|[\s,:;.\-–]+$/g,'')
    .replace(/\s+/g,' ').trim();
  if(!title) return null; // cím nélkül nem hozunk létre javaslatot
  if(dateRange){
    // Több napot átívelő megbízás/esemény: a feladat/esemény adatmodellje mostantól
    // valódi dátumTARTOMÁNYt támogat (due/dueEnd, ill. date/endDate - lásd
    // taskOccursOn/eventOccursOn), így egyetlen javaslat-kártya jön létre a tartomány
    // első és utolsó napjával, nem pedig egy-egy kártya minden érintett napra.
    const start=dateRange.dates[0], end=dateRange.dates[dateRange.dates.length-1];
    if(mode==='event'){
      const eventType=normSeg.includes('edzes')?'edzes':'esemeny';
      return {type:'event',title,date:start,endDate:end,time,eventType};
    }else{
      return {type:'task',title,due:start,dueEnd:end};
    }
  }else{
    const date=ownDate||inheritedDate||'';
    if(mode==='event'){
      const eventType=normSeg.includes('edzes')?'edzes':'esemeny';
      return {type:'event',title,date,time,eventType};
    }else{
      return {type:'task',title,due:date};
    }
  }
}

function parseLocalTaskEventCommand(text){
  const raw=(text||'').trim();
  if(!raw) return [];
  const n=normalizeHU(raw);
  const rawSegs=raw.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);
  const normSegs=n.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);
  // Biztonsági guard: normalizeHU nem nyúl a mondatvégi '.','!','?' jelekhez, így a
  // nyers és normalizált szegmentálásnak egyeznie kell. Ha mégsem, inkább nem
  // ismerünk fel semmit, mint hogy rossz szegmenshez rendeljünk címet.
  if(!rawSegs.length || rawSegs.length!==normSegs.length) return [];

  const meta=classifyTaskEventSegments(normSegs);
  const mode=determineTaskEventMode(meta);
  if(!mode) return [];

  const eligible=computeTaskEventSegmentEligibility(meta, mode);
  const inheritedDate=computeInheritedTaskEventDate(meta, normSegs);

  const results=[];
  meta.forEach((m,idx)=>{
    if(m.isTriggerOnly) return;
    if(!eligible[idx]) return; // sem saját kulcsszava, sem megelőző trigger-only szegmense nincs
    const normSeg=normSegs[m.i];
    const rawSeg=rawSegs[m.i];
    const suggestion=buildTaskEventSuggestionFromSegment(mode, rawSeg, normSeg, inheritedDate);
    if(suggestion) results.push(suggestion);
  });
  return results;
}

/* ===== EGYSÉGES AI-JAVASLAT REVIEW-FLOW =====
   Korábban két párhuzamos jóváhagyó rendszer létezett: a helyi parancsokból
   (handleLocalAiCommand) érkező pendingAiActions/openAiActionConfirm sheet,
   és az AI válaszból érkező App.state.aiChat[].suggestions kártyák
   (acceptAiSuggestion/rejectAiSuggestion). Ez utóbbi maradt meg, mert
   perzisztál chat-újratöltés után is — a helyi parancsok mostantól ugyanide
   írnak, ugyanazon a szerkeszthető kártya-UI-n (lásd renderAiChat) és
   ugyanazon acceptAiSuggestion/applyAiSuggestion logikán mennek keresztül. */
function addLocalAiSuggestions(actions){
  actions = Array.isArray(actions) ? actions : [actions];
  if(!actions.length) return;
  // aiPerm.auto: bizonyos napló-jellegű bejegyzések jóváhagyás nélkül mehetnek automatikusan.
  // A 'meal' (étkezés) típus EXPLICIT ki van véve ez alól (PM-döntés): egy automatikusan
  // felismert étkezés SOSE naplózódjon jóváhagyás nélkül, mindig a szerkeszthető jóváhagyó
  // kártyán landoljon, FÜGGETLENÜL az aiPerm.auto beállítástól. Jövőben bevezetett egyéb
  // típusokra az aiPerm.auto viselkedés továbbra is érvényes maradhat.
  const autoOn = !!(App.state.aiPerm && App.state.aiPerm.auto);
  const autoTypes=[];
  const toConfirm=[], appliedMsgs=[];
  actions.forEach(a=>{
    if(autoOn && autoTypes.includes(a.type)) appliedMsgs.push(applyAiSuggestion(a));
    else toConfirm.push(a);
  });
  if(appliedMsgs.length){
    App.state.aiChat.push({role:'assistant',content:'✓ Automatikusan naplózva (Beállítások → Automatikus napló bekapcsolva):\n'+appliedMsgs.join('\n'),suggestions:[]});
  }
  if(toConfirm.length){
    App.state.aiChat.push({role:'assistant',content:'Ezt észleltem, ellenőrizd és hagyd jóvá:',suggestions:toConfirm});
  }
  saveState();
  if(appliedMsgs.length && typeof renderApp==='function') renderApp();
}

function handleLocalAiCommand(text){
  const meal=parseLocalMealCommand(text);
  if(meal){ addLocalAiSuggestions([meal]); return true; }

  const workout=parseLocalWorkoutCommand(text);
  if(workout){ addLocalAiSuggestions([workout]); return true; }

  const weight=parseLocalWeightCommand(text);
  if(weight){ addLocalAiSuggestions([weight]); return true; }

  const journal=parseLocalJournalCommand(text);
  if(journal){ addLocalAiSuggestions([journal]); return true; }

  const discSpend=parseLocalDiscretionarySpendCommand(text);
  if(discSpend){ addLocalAiSuggestions([discSpend]); return true; }

  const savingsAdd=parseLocalSavingsAddCommand(text);
  if(savingsAdd){ addLocalAiSuggestions([savingsAdd]); return true; }

  // Ciklus-kérdés: olvasás-jellegű Q&A, NINCS jóváhagyandó javaslat (ld.
  // parseLocalCycleQuestionCommand doksija) — ezért ez közvetlenül aiChat-be
  // ír, nem addLocalAiSuggestions-on keresztül megy.
  const cycleAnswer=parseLocalCycleQuestionCommand(text);
  if(cycleAnswer){
    App.state.aiChat.push({role:'assistant', content:cycleAnswer, suggestions:[]});
    saveState();
    return true;
  }

  const raw=(text||'').trim(), n=normalizeHU(raw);

  const cats=[
    {keys:['berleti dij','berleti dijat'],name:'Bérleti díj',icon:'🏠'},
    {keys:['aram','villany'],name:'Áram',icon:'⚡'},
    {keys:['viz'],name:'Víz',icon:'💧'},
    {keys:['futes','gaz'],name:'Fűtés',icon:'🔥'},
    {keys:['internet','net'],name:'Internet',icon:'🌐'},
    {keys:['telefon','mobil'],name:'Telefon',icon:'📱'},
    {keys:['garazs'],name:'Garázs',icon:'🚗'}
  ];
  // Bevétel-kulcsszavak: SZÓHATÁROS prefix-illesztéssel (\b...\w*\b), NEM substring-
  // kereséssel — ugyanaz a hibaosztály, amit a cats-ág ellen már kivédtünk lentebb
  // (financeContextExclude + segments). Substring-kereséssel a "fizetes" kulcsszó
  // hamisan illeszkedne a "befizetes" szóra is (pl. "Garázs befizetés 16k ft" egy
  // feladat címében), mert a "fizetes" mint substring benne van a "befizetes"-ben.
  // \b-vel ez nem illeszkedik, mert az 'e' (befiz-E-tes) és 'f' (b-E-F-izetes) között
  // nincs szóhatár. A \w* a toldalékolt alakokat fedi le (pl. "fizetést" -> "fizetest").
  const incomeKeys=['bevetel','fizetes','kereset','jovedelem'];
  const incomeRe=new RegExp('\\b(?:'+incomeKeys.join('|')+')\\w*\\b');
  // Mondatokra bontva keresünk (csak '.', '!', '?' mentén — a ':'-t szándékosan NEM
  // választjuk el, mert olyan mondatokban, mint "Feladat rögzítése holnapra: garázs
  // befizetni 16k ft", a kontextusjelző szó ("feladat", "holnapra") és a tényleges
  // kulcsszó/összeg ugyanabban a mondatban van, csak kettősponttal elválasztva —
  // ha itt is vágnánk, a jelző éppen a releváns résztől szakadna el).
  // Az a mondat, amiben feladat/emlékeztető-jellegű kontextusjelző szerepel, ki van
  // zárva a pénzügyi (finance ÉS income) felismerésből, hogy pl. egy holnapra szóló
  // feladat ("garázs befizetés 16k ft") ne kerüljön be tévesen számlaként vagy
  // bevételként.
  const financeContextExclude=['feladat','emlekeztet','holnapra','kesobb'];
  const segments=n.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);
  const actions=[],seen=new Set();
  let incomeFound=false;
  segments.forEach(seg=>{
    if(financeContextExclude.some(x=>seg.includes(x))) return;
    // Szóhatáros kulcsszó-illesztés, NEM substring — de a rövid (<=3 betűs) kulcsszavaknál
    // ("viz","gaz","net") a záró \b is kötelező (nincs \w* toldalék-engedmény), mert ezek
    // gyakran előfordulnak MÁS szavak elején is (pl. "viz"->"vizsga", "net"->"netto",
    // "gaz"->"gazda/gazdag"), és a \bviz\w*\b még ezekre a teljes, más jelentésű szóra is
    // illeszkedne (a \b csak a szó ELEJÉN véd, a végén a mohó \w* bármeddig továbbmegy).
    // A hosszabb kulcsszavaknál (pl. "aram") viszont MEGTARTJUK a \w* toldalék-illesztést,
    // mert ott gyakori és jogos a ragozott alak (pl. "aramot", "telefonom") felismerése,
    // és ütközés-kockázatuk lényegesen alacsonyabb.
    const hits=[];
    cats.forEach(c=>c.keys.forEach(k=>{
      const esc=k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const re=new RegExp('\\b'+esc+(k.length<=3?'\\b':'\\w*'),'g');
      let m;
      while((m=re.exec(seg))){ hits.push({c,k,p:m.index,len:m[0].length}); }
    }));
    hits.sort((a,b)=>a.p-b.p);
    hits.forEach(h=>{
      if(seen.has(h.c.name)) return;
      const next=hits.find(x=>x.p>h.p);
      const segment=seg.slice(h.p+h.len,next?next.p:seg.length);
      const a=parseHUFAmount(segment);
      if(a){seen.add(h.c.name);actions.push({type:'finance',name:h.c.name,icon:h.c.icon,amount:a});}
    });
    // Bevétel: az összeget a TALÁLATOT TARTALMAZÓ SZEGMENSBŐL vesszük (nem a teljes
    // nyers szövegből), ugyanúgy, ahogy a cats-ág teszi — a kulcsszó a számösszeg
    // előtt ("Bevétel 470k ft") és után is állhat ("Kaptam 300k fizetést"), ezért a
    // teljes szegmensen futtatjuk parseHUFAmount-ot, nem csak a kulcsszó utáni részen.
    if(!incomeFound && incomeRe.test(seg)){
      const a=parseHUFAmount(seg);
      if(a){incomeFound=true;actions.push({type:'income',amount:a});}
    }
  });

  // Feladat/esemény felismerés helyben, API kulcs nélkül — lásd parseLocalTaskEventCommand.
  // Egy üzenetben több tétel is felismerésre kerülhet, ezek az actions tömbhöz adódnak
  // hozzá a finance-találatok mellé, egyetlen addLocalAiSuggestions hívással.
  const taskEventActions=parseLocalTaskEventCommand(raw);
  if(taskEventActions.length) actions.push(...taskEventActions);

  if(actions.length){addLocalAiSuggestions(actions);return true;}
  return false;
}

// Re-entrancy guard: sendAiMessage async, és nincs semmi, ami megvédené ismételt/
// egymást átfedő hívás ellen (pl. Enter lenyomás + küldés gomb, mobil virtuális
// billentyűzet duplán tüzelő Enter/Go eseménye). Enélkül elméletileg ugyanaz a
// szöveg kétszer is elküldhető, két "TE" buborékot és két AI-választ eredményezve.
let _aiSending=false;
async function sendAiMessage(){
  if(_aiSending) return;
  const input=document.getElementById('ai-input');
  const text=input.value.trim();
  if(!text) return;

  _aiSending=true;
  App.state.aiChat.push({role:'user',content:text,suggestions:[]});
  input.value='';
  saveState();
  renderAiChat();
  showAiTyping(true);

  try{
    // Egyszerű pénzügyi/étkezési/feladat/esemény adatbevitel helyben működik, API nélkül is
    // (lásd handleLocalAiCommand / parseLocalTaskEventCommand).
    if(handleLocalAiCommand(text)) return;

    const history=App.state.aiChat.slice(-10).map(m=>({role:m.role,content:m.content}));
    const data = await callMotivAI({
      model:'claude-haiku-4-5-20251001',
      max_tokens:1000,
      system:AI_SYSTEM+'\n\nAktuális kontextus:\n'+buildAiContext(),
      messages:history
    });

    const raw=(data.content||[]).map(b=>b.text||'').join('\n') || 'Nem sikerült választ kapni, próbáld újra.';
    const parsed=parseAiResponse(raw);
    App.state.aiChat.push({role:'assistant',content:parsed.text,suggestions:parsed.suggestions});
  }catch(e){
    let msg=e&&e.message?e.message:'ismeretlen hiba';
    if(/Failed to fetch|NetworkError|Load failed/i.test(msg)){
      msg='A MotivAI szerver nem érhető el. Az egyszerű pénzügyi parancsok (például „Adj hozzá 450k Ft bevételt”) API nélkül is működnek.';
    }else if(/API kulcs/i.test(msg)){
      msg='Ehhez az üzenethez API kulcs szükséges (ezt kérte a rendszer, de nem adtál meg érvényeset) — ezt a szöveget nem sikerült helyben felismerni. Sok feladat/esemény/pénzügyi/étkezési parancs (például „Holnap 16 órakor fogorvos”, „Bevétel 470k ft” vagy „Ettem egy hamburgert”) API kulcs nélkül, helyben is működik.';
    }
    App.state.aiChat.push({role:'assistant',content:'⚠️ '+msg,suggestions:[]});
  }finally{
    _aiSending=false;
    saveState();
    showAiTyping(false);
    renderAiChat();
  }
}

function normFin(str){ return (str||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,''); }
function matchActivityTypeId(label){
  const hit = ACTIVITY_TYPES.find(t=>normFin(t.name)===normFin(label));
  return hit ? hit.id : 'egyeb';
}
function applyDayTypeTemplateForward(dayType, days){
  const tpl = App.state.dayTypeTemplates[dayType]; if(!tpl) return 0;
  let count=0;
  for(let i=1;i<=days;i++){
    const d=new Date(); d.setDate(d.getDate()+i);
    const iso=toLocalISO(d);
    if(dayTypeFor(iso)!==dayType) continue;
    if(App.state.activities.some(a=>a.date===iso && a.type===tpl.type)) continue;
    App.state.activities.push(Object.assign({},tpl,{id:uid(),date:iso,note:'',autoTemplate:true}));
    count++;
  }
  return count;
}
/* pushWorkoutFollowUp: terület-független "összefüggés" felismerés edzés
   naplózása UTÁN - a most edzett izomcsoportokhoz (MUSCLE_GROUPS) tartozó,
   allSkillNodes().muscles mezőn keresztül kapcsolódó, már "elérhető" (szülője
   feloldva, ő maga még nem) skilleket ajánlja fel.
   (Az energiahatás - App.state.activities bejegyzés - mára nem itt, hanem
   közvetlenül a workout-javaslat kártyáján/saveNewWorkout-ban kerül rögzítésre,
   lásd applyAiSuggestion 's.type===workout' ága - egyetlen jóváhagyással.)
   MEGERŐSÍTENDŐ javaslatként landol egy új MotivAI üzenetben, nem automatikusan
   alkalmazva — a skill-elérés szubjektív, önbevallásos adat, amit a
   felhasználónak kell megerősítenie.
   Ugyanez a hívás mind az AI-mediált (applyAiSuggestion 'workout' ága), mind
   a kézi "Új edzés" sheet (saveNewWorkout) útján érkező edzésre lefut, hogy a
   két belépési pont között ne legyen eltérés. */
function pushWorkoutFollowUp(workout){
  const suggestions = [];
  const musclesTrained = Array.isArray(workout.muscleGroups) ? workout.muscleGroups : [];
  const relatedSkills = musclesTrained.length
    ? allSkillNodes().filter(sk=>skillState(sk)==='available' && (sk.muscles||[]).some(m=>musclesTrained.includes(m)))
    : [];
  relatedSkills.slice(0,3).forEach(sk=>{ suggestions.push({type:'skill_unlock', skillName:sk.name}); });
  if(!suggestions.length) return;
  App.state.aiChat.push({role:'assistant', content:'💪 Naplózva! Még egy dolog, amit ez érinthet: elérted-e valamelyik kapcsolódó skillt (jelöld lent, ha igen).', suggestions});
}
/* checkWorkoutStreakQuest: Ötlet #35 (pénzügyi/egészség célokból automatikus
   Kaland-küldetés) egészség-ága — ha az elmúlt WORKOUT_STREAK_TARGET naptári
   napon MINDEGYIKEN volt naplózott edzés (App.state.workouts, dátum szerint,
   MAI naptól visszafelé), egy "fizikai" Kaland-küldetést ajánlunk fel
   rpg_quest_add javaslatként — MEGERŐSÍTENDŐ kártyaként, ugyanúgy, mint minden
   más AI-javaslat (ld. pushWorkoutFollowUp fenti mintáját). Jelenleg csak a
   kézi edzés-mentésből (saveNewWorkout) hívjuk, új edzés MENTÉSE után, nem egy
   külön időzítővel/pollerrel — az applyAiSuggestion 's.type===workout' ágát
   (ahonnan pushWorkoutFollowUp fenti MÁSIK hívása is fut) SZÁNDÉKOSAN nem
   módosítottuk itt, hogy ne ütközzön egy párhuzamosan futó applyAiSuggestion-
   refaktorral - emiatt egy AI-chat/helyi-parancson át naplózott (nem a
   kézi lapon rögzített) edzés egyelőre NEM számít bele ebbe a sorozat-
   figyelésbe. Ha ez zavaró, egy követő módosítás hozzáadhatja ugyanezt a
   hívást oda is, a refaktor lezárása után.
   Duplikáció-védelem: App.state.rpg.workoutStreakQuestSuggestedDates — a már
   felajánlott sorozat ZÁRÓ napjait tárolja, ugyanúgy, ahogy bossNotified a már
   értesített negyedév-indexeket (ld. ott) — így ugyanaz a lezárt sorozat nem
   ajánlja fel magát újra minden egyes aznapi edzésnaplózásnál. */
function checkWorkoutStreakQuest(){
  if(!App.state.rpg || !App.state.rpg.onboarded) return;
  const WORKOUT_STREAK_TARGET = 5;
  const workoutDates = new Set(App.state.workouts.map(w=>w.date));
  let streak = 0;
  const cursor = new Date();
  for(let i=0;i<WORKOUT_STREAK_TARGET;i++){
    if(!workoutDates.has(toLocalISO(cursor))) break;
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  if(streak < WORKOUT_STREAK_TARGET) return;
  const streakEndIso = todayISO();
  if(!Array.isArray(App.state.rpg.workoutStreakQuestSuggestedDates)) App.state.rpg.workoutStreakQuestSuggestedDates = [];
  if(App.state.rpg.workoutStreakQuestSuggestedDates.includes(streakEndIso)) return;
  App.state.rpg.workoutStreakQuestSuggestedDates.push(streakEndIso);
  App.state.aiChat.push({role:'assistant', content:'🔥 '+WORKOUT_STREAK_TARGET+' egymást követő napon mozogtál! Ezt is bevihetjük az Életkampányba:',
    suggestions:[{type:'rpg_quest_add', trackId:'physical', text:WORKOUT_STREAK_TARGET+' napos mozgás-sorozat tartása', xp:25}]});
}
/* checkSavingsGoalMilestone: Ötlet #35 (pénzügyi cél -> Kaland-küldetés) és
   Ötlet #39 (megtakarítási cél teljesítése -> skill-feloldás javaslat) közös
   belépési pontja — mindkettő ugyanahhoz az eseményhez (egy megtakarítási cél
   eléri a 100%-ot) kötődik, ezért egyetlen MotivAI-üzenetben, egyszerre két
   javaslat-kártyaként ajánljuk fel őket, ugyanúgy, ahogy pushWorkoutFollowUp is
   több skill_unlock javaslatot tehet egy üzenetbe. Csak a KÉZI befizetés-mentés
   (saveSavingsAdd) hívja - az applyAiSuggestion 's.type===savings_add' ágát
   szándékosan NEM módosítjuk itt (azt egy másik ágon párhuzamosan
   refaktorálják, ld. dev-jegyzet a repó tetején).
   A skill_unlock javaslathoz: a SKILL_DEFS-ben (ld. ott) jelenleg nincs
   kifejezetten "finance" témájú/track-cimkével ellátott skill-csomópont (mind a
   4 sport - kondi/futás/kajak/streetwo - fizikai jellegű), ezért a legjobb
   elérhető közelítés a legelső, jelenleg "elérhető" (skillState()==='available')
   skill felajánlása - így a felhasználó egy pénzügyi mérföldkövet egy olyan
   fejlődési lépéssel ünnepelhet meg, ami épp esedékes, még ha nem is
   pénzügy-specifikus. */
function checkSavingsGoalMilestone(goal){
  if(!App.state.rpg || !App.state.rpg.onboarded) return;
  if(!goal || !(goal.target>0) || (goal.saved||0) < goal.target) return;
  if(goal._questSuggested100) return;
  goal._questSuggested100 = true;
  const suggestions = [{type:'rpg_quest_add', trackId:'finance', text:'Ünnepeld meg a(z) "'+goal.name+'" cél elérését, és tűzz ki egy újat', xp:20}];
  const availableSkill = allSkillNodes().find(sk=>skillState(sk)==='available');
  if(availableSkill) suggestions.push({type:'skill_unlock', skillName:availableSkill.name});
  App.state.aiChat.push({role:'assistant', content:'🏦 "'+goal.name+'" megtakarítási cél 100%-on! Ezt is érdemes lehet ehhez kapcsolni:', suggestions});
}
/* checkDiscretionaryUnderBudget: Ötlet #35 pénzügyi ága, "egyéb kiadás"
   kategória. A hónap VÉGE felé (az utolsó 5 napban, hogy ne egy még csak
   félig lezajlott hónapot értékeljünk korainak "sikerként") megnézi, hogy egy
   kategória jól a kerete alatt maradt-e (spent <= limit*0.6) - ha igen, egy
   pénzügyi Kaland-küldetést ajánl fel. Ugyanazokból a helyekről hívjuk, ahol a
   kategória spent mezője ténylegesen nő (saveSpend, saveBankNotification,
   saveFoodoraOrder) - a mentés PILLANATÁBAN, nem egy külön időzítővel.
   Duplikáció-védelem: cat._questSuggestedMonths - a már felajánlott hónapok
   "ÉÉÉÉ-HH" kulcsait tárolja a kategória-tételen (ugyanaz a "csak egyszer"
   minta, mint a bossNotified/workoutStreakQuestSuggestedDates tömböknél, csak
   a cél/kategória objektumon tárolva, mert az esemény ahhoz az egy tételhez
   kötődik - ld. checkSavingsGoalMilestone goal._questSuggested100 mezőjét is). */
function checkDiscretionaryUnderBudget(cat){
  if(!App.state.rpg || !App.state.rpg.onboarded) return;
  if(!cat || !(cat.limit>0)) return;
  const now = new Date();
  const lastDayOfMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  if(now.getDate() < lastDayOfMonth - 5) return;
  if((cat.spent||0) > cat.limit*0.6) return;
  const monthKey = now.getFullYear()+'-'+pad(now.getMonth()+1);
  if(!Array.isArray(cat._questSuggestedMonths)) cat._questSuggestedMonths = [];
  if(cat._questSuggestedMonths.includes(monthKey)) return;
  cat._questSuggestedMonths.push(monthKey);
  App.state.aiChat.push({role:'assistant', content:'💸 "'+cat.name+'" kategóriában ebben a hónapban jól a kereten belül maradtál! Ezt is bevihetjük az Életkampányba:',
    suggestions:[{type:'rpg_quest_add', trackId:'finance', text:'Tartsd a(z) "'+cat.name+'" keretet jövő hónapban is', xp:15}]});
}
/* maybeSuggestCycleAwareWorkout: Ötlet #36 - a műszakciklus (dayTypeFor) és a
   korábbi edzések energiahatása (App.state.activities, type:'edzes',
   energyAfter - ld. saveNewWorkout/applyAiSuggestion 's.type===workout' ága,
   ahol MAI edzésnél egy ilyen bejegyzés is készül ugyanazzal a dátummal) közti
   összefüggést nézi meg: éjszakai műszak UTÁNI napokon átlagosan alacsonyabb-e
   a záró energiaszint, mint pihenő/szabi napokon. Ha igen, és a MAI vagy a
   HOLNAPI nap ilyen típusú, egy tájékoztató MotivAI-üzenetet ad - NEM
   rpg_quest_add vagy más megerősítendő javaslat-kártyaként, mert ez nem egy
   már megtörtént dolog naplózása (mint a 'workout' suggestion-típus), hanem
   egy előretekintő edzés-TIPP, amin nincs mit "jóváhagyni" - ezért suggestions
   nélküli, sima szöveges assistant-üzenet (ld. a feladatleírás indoklását).
   Trigger: a Fejlődés nézet (RENDERERS.fejlodes) megnyitásakor fut le - ez a
   természetes hely, ahol a felhasználó úgyis az edzéseivel/energiájával
   foglalkozik, és nem igényel új időzítőt/pollert.
   Duplikáció-védelem: App.state.cycleCoach.lastSuggestedDate - naponta
   legfeljebb egyszer ajánl fel tippet (a mai dátumra állítva, amint felajánlott
   egyet - a felhasználó a nézet többszöri megnyitásakor nem kap újra ugyanazt). */
function maybeSuggestCycleAwareWorkout(){
  if(!App.state.cycleCoach) App.state.cycleCoach = {lastSuggestedDate:null};
  const today = todayISO();
  if(App.state.cycleCoach.lastSuggestedDate === today) return;
  const energyAfterByDate = {};
  App.state.activities.forEach(a=>{ if(a.type==='edzes' && a.energyAfter!=null) energyAfterByDate[a.date]=a.energyAfter; });
  const postNightSamples=[], restDaySamples=[];
  App.state.workouts.forEach(w=>{
    if(!w.date || energyAfterByDate[w.date]==null) return;
    const prevDay = toLocalISO(new Date(new Date(w.date+'T00:00:00').getTime()-86400000));
    if(dayTypeFor(prevDay)==='ejszaka') postNightSamples.push(energyAfterByDate[w.date]);
    else if(dayTypeFor(w.date)==='pihen' || dayTypeFor(w.date)==='szabi') restDaySamples.push(energyAfterByDate[w.date]);
  });
  if(postNightSamples.length<3 || restDaySamples.length<3) return; // kevés adat még megbízható mintához
  const avg = arr => arr.reduce((sum,v)=>sum+v,0)/arr.length;
  const avgPostNight = avg(postNightSamples), avgRestDay = avg(restDaySamples);
  if(avgRestDay - avgPostNight < 15) return; // nincs egyértelmű, tanulságos különbség
  const tomorrow = toLocalISO(new Date(Date.now()+86400000));
  const upcoming = [{iso:today, label:'Ma'}, {iso:tomorrow, label:'Holnap'}];
  const postNightDay = upcoming.find(u=>dayTypeFor(toLocalISO(new Date(new Date(u.iso+'T00:00:00').getTime()-86400000)))==='ejszaka');
  const restDay = !postNightDay && upcoming.find(u=>dayTypeFor(u.iso)==='pihen' || dayTypeFor(u.iso)==='szabi');
  let content = null;
  if(postNightDay){
    content = '🌙 '+postNightDay.label+' éjszakai műszak utáni nap — eddigi adataid szerint ilyenkor átlagosan '+Math.round(avgPostNight)+'%-os energiával zártad az edzéseket (pihenőnapon inkább '+Math.round(avgRestDay)+'%-kal). Most egy rövidebb, könnyebb edzés fér bele jobban.';
  } else if(restDay){
    content = '💪 '+restDay.label+' pihenő/szabi nap — eddig ilyenkor jellemzően jobb energiával (~'+Math.round(avgRestDay)+'%) zártad az edzéseket, mint műszak után (~'+Math.round(avgPostNight)+'%). Ez egy jó alkalom egy intenzívebb edzésre.';
  }
  if(!content) return;
  App.state.cycleCoach.lastSuggestedDate = today;
  App.state.aiChat.push({role:'assistant', content});
  saveState();
}
/* applyAiSuggestion: a tényleges állapotmódosítás egy jóváhagyott javaslatra.
   Ezt hívja mind az AI-válaszból, mind a helyi parancsból (handleLocalAiCommand
   -> addLocalAiSuggestions) származó javaslatok elfogadása — lásd az egységes
   review-flow megjegyzést handleLocalAiCommand előtt. Visszaadja a toast-üzenetet. */
function _applyFinanceSuggestion(s){
  App.state.finance = App.state.finance || defaultState().finance;
  App.state.finance.mandatory = Array.isArray(App.state.finance.mandatory) ? App.state.finance.mandatory : [];
  const target = normFin(s.name);
  let item = App.state.finance.mandatory.find(x=>normFin(x.name)===target)
    || App.state.finance.mandatory.find(x=>normFin(x.name).includes(target)||target.includes(normFin(x.name)));
  if(!item){ item={id:uid(),name:s.name,icon:sanitizeIcon(s.icon)||'💳',amount:0,type:'valtozo'}; App.state.finance.mandatory.push(item); }
  item.amount = Number(s.amount)||0;
  return item.name+': '+item.amount.toLocaleString('hu-HU')+' Ft mentve a Pénzügyekbe ✓';
}

function _applyActivityTemplateSuggestion(s){
  const validTypes=['nappal','ejszaka','pihen','szabi','egyeb'];
  if(!validTypes.includes(s.dayType) || !s.activity) return 'Nem sikerült értelmezni a mintát';
  const a=s.activity;
  const typeId = matchActivityTypeId(a.label);
  const tpl = {type:typeId, label:a.label||'Aktivitás', icon:sanitizeIcon(a.icon)||(ACTIVITY_TYPES.find(t=>t.id===typeId)||{}).icon||'⭐',
    durationMin:parseInt(a.durationMin)||0, physical:parseInt(a.physical)||5, mental:parseInt(a.mental)||5,
    experience:parseInt(a.experience)||5, energyBefore:parseInt(a.energyBefore)||60, energyAfter:parseInt(a.energyAfter)||50};
  App.state.dayTypeTemplates[s.dayType] = tpl;
  const applied = applyDayTypeTemplateForward(s.dayType, 60);
  return 'Minta mentve · '+applied+' jövőbeli '+(DAY_TYPE_SHORT[s.dayType]||s.dayType)+' napra felkerült ✓';
}

/* _applyIncomeSuggestion: a "Havi bevétel/fizetés beállítása X Ft-ra" AI-javaslatot mostantól a
   kanonikus "Fizetés" nevű finance.incomeSources tételre alkalmazza (find-or-create névre, ugyanazzal
   a normFin()-alapú mintával, mint _applyFinanceSuggestion() a mandatory tételeknél) - NEM a vestigiális
   finance.monthlyIncome mezőt írja többé. Ha a felhasználó átnevezte/törölte az alapértelmezett
   "Fizetés" forrást, egy új jön létre ugyanezzel a névvel. */
function _applyIncomeSuggestion(s){
  App.state.finance = App.state.finance || defaultState().finance;
  App.state.finance.incomeSources = Array.isArray(App.state.finance.incomeSources) ? App.state.finance.incomeSources : [];
  const target = normFin('Fizetés');
  let item = App.state.finance.incomeSources.find(x=>normFin(x.name)===target);
  if(!item){ item={id:uid(),name:'Fizetés',amount:0}; App.state.finance.incomeSources.push(item); }
  item.amount = Number(s.amount)||0;
  const totalIncome = App.state.finance.incomeSources.reduce((sum,x)=>sum+(x.amount||0),0);
  return 'Havi bevétel frissítve: '+item.name+' '+item.amount.toLocaleString('hu-HU')+' Ft (összesen '+totalIncome.toLocaleString('hu-HU')+' Ft) ✓';
}

function _applySchedulePatternSuggestion(s){
  const validTypes=['nappal','ejszaka','pihen','szabi','egyeb'];
  if(!Array.isArray(s.pattern) || !s.pattern.length || !s.pattern.every(p=>validTypes.includes(p)) || !s.startDate){
    return 'Nem sikerült értelmezni a műszakrendet';
  }
  App.state.schedule.pattern = s.pattern;
  App.state.schedule.startDate = s.startDate;
  return 'Műszakrend beállítva ('+s.pattern.length+' napos ciklus) ✓';
}

function _applyMealSuggestion(s){
  // App.state.nutrition.log a valódi étkezésnapló (lásd saveMeal / renderNutNap),
  // 'meal' kulccsal — NEM egy külön 'meals' tömb 'name' kulccsal.

function _applyTaskSuggestion(s){
  // Ugyanaz a mezőkészlet, mint a manuális "Új feladat" sheet (saveNewTask) —
  // due lehet üres string is, ha a szövegből nem volt egyértelmű dátum
  // (lásd parseLocalTaskEventCommand), a felhasználó a naptárban utólag beállíthatja.
  const newTask={id:uid(),title:s.title,due:s.due||'',priority:'med',type:'checkbox',done:false,progress:0};

function _applyEventSuggestion(s){

  // App.state.events.push) — date lehet üres, ha a szövegből nem volt egyértelmű
  // dátum, ekkor a mai napra kerül (a naptárban utólag áthelyezhető).
  const newEvent={id:uid(),date:s.date||todayISO(),title:s.title,time:s.time||'',type:s.eventType||'esemeny'};
  if(s.endDate) newEvent.endDate=s.endDate; // több napos esemény - lásd eventOccursOn

function _applyWorkoutSuggestion(s){
  // Ugyanaz a mezőkészlet, mint a manuális "Új edzés" sheet (saveNewWorkout, lásd
  // App.state.workouts.push).
  const muscleGroups = Array.isArray(s.muscleGroups) ? s.muscleGroups.filter(m=>MUSCLE_GROUPS.some(mg=>mg.id===m)) : [];
  const entry = {id:uid(),category:s.category||'Edzés',date:s.date||todayISO(),durationMin:parseInt(s.durationMin)||null,notes:s.notes||'',muscleGroups};
  App.state.workouts.push(entry);
  // Ha a kártyán energiahatás is meg lett adva (mindig a mai edzésnél kínáljuk fel,
  // lásd renderAiChat/parseLocalWorkoutCommand), egyetlen jóváhagyással a
  // App.state.activities-be is felkerül ugyanaz az edzés - így nem kell egy MÁSODIK
  // "⚡ ... naplózása" kártyát is jóváhagyni ugyanahhoz az edzéshez.
  if(s.energyBefore!=null && s.energyAfter!=null){
    App.state.activities.push({id:uid(), type:'edzes', label:s.category||'Edzés', icon:'🏋️',
      date:s.date||todayISO(), durationMin:parseInt(s.durationMin)||30,
      physical:6, mental:4, experience:6,
      energyBefore:s.energyBefore, energyAfter:s.energyAfter, note:''});
  }
  pushWorkoutFollowUp(entry);
  return '💪 '+(s.category||'Edzés')+' naplózva'+(s.date?' ('+fmtDateHu(s.date)+')':'')+' ✓';
}

function _applyRpgQuestAddSuggestion(s){
  // Ugyanaz a mezőkészlet, mint a manuális küldetés-hozzáadás (rpgAddQuest) - azt
  // hívjuk, hogy a natív streak-mirroring stb. mellékhatásai (ha lennének a
  // jövőben) egy helyen éljenek, ne duplikálódjanak itt.
  if(!App.state.rpg || !App.state.rpg.onboarded) return 'Még nincs elindítva az Életkampány.';

  if(!track || !s.text) return 'Nem sikerült értelmezni a küldetést ✗';
  const cur = rpgGetCurrentWeekIndex();
  rpgAddQuest(cur, s.trackId, s.text, Number(s.xp)||10);
  return '⚔️ '+s.text+' hozzáadva ('+track.name+', +'+(Number(s.xp)||10)+' XP) ✓';
}

function _applyRpgQuestCompleteSuggestion(s){
  // A text mezőt (normFin-nel normalizálva, mindkét irányú substring-illesztéssel -
  // ugyanaz a minta, mint a finance-javaslat meglévő-tétel keresésénél feljebb) a
  // JELENLEGI ciklus még nem teljesített küldetéseihez illesztjük - lásd
  // buildAiContext(), ami pontosan ezt a listát adja át kontextusként az AI-nak.
  if(!App.state.rpg || !App.state.rpg.onboarded) return 'Még nincs elindítva az Életkampány.';
  const cur = rpgGetCurrentWeekIndex();
  const week = App.state.rpg.weeks[cur-1];
  const norm = normFin(s.text||'');
  let q = null;
  if(norm && week){
    q = week.quests.find(x=>!x.done && (!s.trackId || x.trackId===s.trackId) && (normFin(x.text).includes(norm) || norm.includes(normFin(x.text))));
    if(!q) q = week.quests.find(x=>!x.done && (normFin(x.text).includes(norm) || norm.includes(normFin(x.text))));
  }
  if(!q) return 'Nem találtam ehhez illő, még nem teljesített küldetést ebben a ciklusban ✗';
  rpgToggleQuest(cur, q.id);
  return null; // rpgToggleQuest saját (XP/szintlépés) toast-ot mutat, ne írjuk felül
}

function _applyActivityLogSuggestion(s){
  // Ugyanaz a mezőkészlet, mint a manuális "Aktivitás rögzítése" sheet
  // (saveActivity, lásd App.state.activities.push) - EZ táplálja a
  // todayEnergyLevel()-t és a tanult energia-átlagokat, NEM a workouts tömb.
  const type = ACTIVITY_TYPES.find(t=>t.id===s.activityType) || ACTIVITY_TYPES.find(t=>t.id==='egyeb');
  App.state.activities.push({id:uid(), type:type.id, label:s.label||type.name, icon:type.icon,
    date:todayISO(), durationMin:parseInt(s.durationMin)||0,
    physical:parseInt(s.physical)||5, mental:parseInt(s.mental)||5, experience:parseInt(s.experience)||5,
    energyBefore:parseInt(s.energyBefore)||60, energyAfter:parseInt(s.energyAfter)||50, note:s.note||''});
  return '⚡ '+(s.label||type.name)+' naplózva (energia '+(parseInt(s.energyBefore)||60)+'→'+(parseInt(s.energyAfter)||50)+') ✓';
}

function _applyWeightSuggestion(s){
  // Ugyanaz a mezőkészlet, mint a manuális "Testsúly mérés" sheet (saveWeight,
  // lásd App.state.weightLog.push) - mindig új bejegyzést ad hozzá, ahogy a
  // kézi flow is teszi (nem upsertel dátum szerint).
  if(!(Number(s.kg)>0)) return 'Nem sikerült értelmezni a testsúlyt ✗';
  App.state.weightLog.push({date:s.date||todayISO(), kg:Number(s.kg)});
  return '⚖️ '+Number(s.kg)+' kg elmentve ✓';
}

function _applyHealthLogSuggestion(s){
  // Ugyanaz az upsert-minta, mint a kézi gyors-bevitel (saveQuickLog): a mai
  // (vagy megadott) napi healthLog bejegyzést keresi/hozza létre, és csak a
  // ténylegesen megadott mezőket írja felül.
  const iso = s.date||todayISO();
  let entry = App.state.healthLog.find(h=>h.date===iso);
  if(!entry){ entry={date:iso}; App.state.healthLog.push(entry); }
  const parts=[];
  if(s.sleepH!=null && !isNaN(s.sleepH)){ entry.sleepH=Number(s.sleepH); parts.push(Number(s.sleepH)+' óra alvás'); }
  if(s.steps!=null && !isNaN(s.steps)){ entry.steps=Number(s.steps); parts.push(Number(s.steps)+' lépés'); }
  if(s.pulse!=null && !isNaN(s.pulse)){ entry.pulse=Number(s.pulse); parts.push(Number(s.pulse)+' pulzus'); }
  if(!parts.length) return 'Nem volt megadott egészségadat ✗';
  return '🩺 '+parts.join(', ')+' elmentve ✓';
}

function _applyDiscretionarySpendSuggestion(s){
  // Csak MEGLÉVŐ kategória terhére könyvel (saveSpend mintája) - egy nem
  // létező kategóriához nem talál ki keretet/limitet, azt a felhasználónak
  // kell előbb létrehoznia a Pénzügyek fülön.
  const target = normFin(s.name||'');
  const item = (App.state.finance.discretionary||[]).find(x=>normFin(x.name)===target)
    || (App.state.finance.discretionary||[]).find(x=>normFin(x.name).includes(target)||target.includes(normFin(x.name)));
  if(!item) return 'Nincs ilyen egyéb kiadás kategória — vedd fel előbb a Pénzügyek fülön ✗';
  const amount = Number(s.amount)||0;
  item.spent = (item.spent||0) + amount;
  const dupWarning = recordSpendAndCheckDup(item.id, amount, todayISO(), 'ai');
  return '🛍️ '+item.name+': +'+amount.toLocaleString('hu-HU')+' Ft költés rögzítve ✓' + (dupWarning ? ' ⚠️ '+dupWarning : '');
}

function _applySavingsAddSuggestion(s){
  const target = normFin(s.name||'');
  const item = (App.state.finance.savings||[]).find(x=>normFin(x.name)===target)
    || (App.state.finance.savings||[]).find(x=>normFin(x.name).includes(target)||target.includes(normFin(x.name)));
  if(!item) return 'Nincs ilyen megtakarítási cél — vedd fel előbb a Pénzügyek fülön ✗';
  item.saved = (item.saved||0) + (Number(s.amount)||0);
  return '🏦 '+item.name+': +'+(Number(s.amount)||0).toLocaleString('hu-HU')+' Ft megtakarítás rögzítve ✓';
}

function _applyJournalSuggestion(s){
  if(!s.mood && !s.text) return 'Adj meg hangulatot vagy szöveget ✗';
  App.state.journal.unshift({id:uid(), date:todayISO(), mood:s.mood||null, text:s.text||''});
  return '📓 Napló bejegyzés mentve ✓';
}

function _applySkillUnlockSuggestion(s){
  // Csak akkor old fel, ha a skill "elérhető" (a szülője már fel van oldva,
  // ő maga még nem) - lásd skillState(). Ez szubjektív, önbevallásos adat
  // (a felhasználó dönti el, hogy valóban elérte-e), ezért itt sincs
  // automatikus "elég edzés -> feloldva" számítás.
  const norm = normFin(s.skillName||'');
  const node = allSkillNodes().find(n=>normFin(n.name)===norm)
    || allSkillNodes().find(n=>normFin(n.name).includes(norm)||norm.includes(normFin(n.name)));
  if(!node) return 'Nem találtam ilyen nevű skillt ✗';
  if(App.state.skills[node.id]) return node.name+' már fel van oldva.';
  if(skillState(node)!=='available') return node.name+' még nem érhető el (előbb a szülő skillt kell feloldani).';
  App.state.skills[node.id] = true;
  return '🌟 '+node.name+' feloldva! 🎉';
}
