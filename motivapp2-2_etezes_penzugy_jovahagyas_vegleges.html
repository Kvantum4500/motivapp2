<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MotivApp 2.0</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12181A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ===== TOKENS ===== */
:root{
  --ink:#12181A;
  --surface:#1C2521;
  --surface-2:#242F29;
  --surface-3:#2C3830;
  --line:rgba(237,233,221,0.10);
  --line-strong:rgba(237,233,221,0.18);
  --paper:#EDE9DD;
  --muted:#93A79A;
  --muted-2:#6C8177;
  --trail-red:#C1432B;
  --trail-red-bg:rgba(193,67,43,0.16);
  --trail-blue:#4A85AC;
  --trail-blue-bg:rgba(74,133,172,0.16);
  --trail-yellow:#D9A441;
  --trail-yellow-bg:rgba(217,164,65,0.16);
  --trail-green:#5C8F62;
  --trail-green-bg:rgba(92,143,98,0.16);
  --trail-white:#EDE9DD;
  --trail-white-bg:rgba(237,233,221,0.14);
  --radius-s:8px;
  --radius:14px;
  --radius-l:20px;
  --font-display:'Archivo','Inter',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:var(--font-body);}
a{color:inherit;}
::selection{background:var(--trail-yellow);color:var(--ink);}
:focus-visible{outline:2px solid var(--trail-yellow);outline-offset:2px;}
@media(prefers-reduced-motion:reduce){*{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}}

/* ===== APP SHELL ===== */
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--ink);}
#topbar{
  position:relative;overflow:hidden;
  padding:calc(18px + var(--safe-top)) 20px 16px;
  background:linear-gradient(180deg,#161F1B 0%,var(--ink) 100%);
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}
#topbar .contour{position:absolute;inset:0;opacity:0.35;pointer-events:none;}
#topbar-inner{position:relative;z-index:1;}
#topbar .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;}
#topbar .headline{font-family:var(--font-display);font-size:23px;font-weight:800;margin-top:4px;}
#topbar .daytype{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;font-family:var(--font-mono);}
.aifab{position:absolute;top:calc(16px + var(--safe-top));right:16px;z-index:3;width:42px;height:42px;border-radius:50%;background:var(--surface-2);border:1px solid var(--trail-yellow);color:var(--paper);font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 14px rgba(217,164,65,0.28);}
.aifab:active{transform:scale(0.93);}
#view-root{flex:1;overflow-y:auto;padding:16px 16px calc(96px + var(--safe-bottom));-webkit-overflow-scrolling:touch;}
.view{display:none;animation:fadein 0.18s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

#bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  max-width:560px;margin:0 auto;
  display:flex;background:rgba(28,37,33,0.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:8px 4px calc(8px + var(--safe-bottom));
}
.navbtn{flex:1;min-width:0;background:none;border:none;color:var(--muted-2);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 1px;border-radius:var(--radius-s);cursor:pointer;transition:color .15s;}
.navbtn .ic{font-size:18px;line-height:1;}
.navbtn .lb{font-size:9px;font-weight:600;letter-spacing:0.01em;font-family:var(--font-mono);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.navbtn.active{color:var(--paper);}
.navbtn.active .ic{filter:drop-shadow(0 0 6px rgba(217,164,65,0.5));}

/* ===== TYPOGRAPHY HELPERS ===== */
.sectiontitle{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;}
.sectiontitle:first-child{margin-top:0;}
.big{font-family:var(--font-display);font-weight:800;}
.mono{font-family:var(--font-mono);}
.muted{color:var(--muted);}
.small{font-size:12.5px;}

/* ===== CARDS ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.card-title{font-weight:700;font-size:15px;margin-bottom:2px;}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.card.tap{cursor:pointer;transition:border-color .15s,transform .1s;}
.card.tap:active{transform:scale(0.985);}
.card.tap:hover{border-color:var(--line-strong);}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;border-radius:var(--radius-s);padding:11px 16px;border:1px solid transparent;cursor:pointer;transition:opacity .15s,transform .1s;font-family:var(--font-body);}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--trail-yellow);color:#1A1408;}
.btn-secondary{background:var(--surface-3);color:var(--paper);border-color:var(--line-strong);}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--line);}
.btn-danger{background:var(--trail-red-bg);color:#F0A895;border-color:rgba(193,67,43,0.3);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.iconbtn{width:36px;height:36px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);color:var(--paper);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0;touch-action:manipulation;}

/* ===== BADGES / PILLS ===== */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;font-family:var(--font-mono);white-space:nowrap;}
.pill-blue{background:var(--trail-blue-bg);color:var(--trail-blue);}
.pill-red{background:var(--trail-red-bg);color:#E17A63;}
.pill-yellow{background:var(--trail-yellow-bg);color:var(--trail-yellow);}
.pill-green{background:var(--trail-green-bg);color:#82B788;}
.pill-white{background:var(--trail-white-bg);color:var(--trail-white);}
.pill-muted{background:var(--surface-3);color:var(--muted);}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot-blue{background:var(--trail-blue);}.dot-red{background:var(--trail-red);}.dot-yellow{background:var(--trail-yellow);}.dot-green{background:var(--trail-green);}.dot-white{background:var(--trail-white);}

/* ===== SUBTABS ===== */
.subtabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;}
.subtab{flex-shrink:0;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;}
.subtab.active{background:var(--paper);color:var(--ink);border-color:var(--paper);}

/* ===== PROGRESS ===== */
.progwrap{background:var(--surface-3);border-radius:999px;height:8px;overflow:hidden;}
.progbar{height:100%;background:linear-gradient(90deg,var(--trail-green),var(--trail-yellow));border-radius:999px;transition:width .4s ease;}
.devbar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.devbar-label{width:64px;flex-shrink:0;font-size:12.5px;color:var(--muted);}
.devbar-track{flex:1;background:var(--surface-3);border-radius:999px;height:10px;overflow:hidden;}
.devbar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--trail-blue),var(--trail-green));}
.devbar-val{width:30px;text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--muted);flex-shrink:0;}

/* ===== FORMS ===== */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=time],.field select,.field textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--paper);
  border-radius:var(--radius-s);padding:11px 12px;font-size:14.5px;font-family:var(--font-body);
}
.field textarea{resize:vertical;min-height:60px;}
.slidefield{margin-bottom:16px;}
.slidefield .sf-head{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
.slidefield .sf-val{font-family:var(--font-mono);color:var(--trail-yellow);font-weight:700;}
.slidefield input[type=range]{width:100%;accent-color:var(--trail-yellow);}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--trail-yellow);}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:8px 13px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--muted);font-size:13px;cursor:pointer;font-weight:600;}
.chip.active{background:var(--trail-yellow);color:#1A1408;border-color:var(--trail-yellow);}
.switch{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .slider{position:absolute;inset:0;background:var(--surface-3);border-radius:999px;transition:.15s;border:1px solid var(--line-strong);}
.switch .slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:var(--muted);border-radius:50%;transition:.15s;}
.switch input:checked + .slider{background:rgba(217,164,65,0.35);border-color:var(--trail-yellow);}
.switch input:checked + .slider:before{transform:translateX(18px);background:var(--trail-yellow);}

/* ===== LIST ROWS ===== */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.row-check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;}
.row-check.done{background:var(--trail-green);border-color:var(--trail-green);color:var(--ink);}
.row-main{flex:1;min-width:0;}
.row-title{font-weight:600;font-size:14.5px;}
.row-title.done{text-decoration:line-through;color:var(--muted-2);}
.row-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.menurow{display:flex;align-items:center;gap:14px;padding:15px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
.menurow:last-child{border-bottom:none;}
.menurow .ic{font-size:20px;width:26px;text-align:center;}
.menurow .lb{flex:1;font-weight:600;font-size:14.5px;}
.menurow .arrow{color:var(--muted-2);}

/* ===== EMPTY STATE ===== */
.empty{text-align:center;padding:36px 16px;color:var(--muted);}
.empty .ic{font-size:30px;margin-bottom:8px;opacity:0.7;}
.empty .t{font-weight:600;color:var(--paper);margin-bottom:4px;}
.empty .d{font-size:13px;}

/* ===== BODY SVG ===== */
.bodywrap{display:flex;justify-content:center;align-items:flex-start;gap:10px;padding:10px 0 4px;}
.bodysvg .fig-part path,.bodysvg .fig-part ellipse{fill:url(#bodygrad);stroke:var(--line-strong);stroke-width:1.5;}
.bodysvg .figdetail path{fill:none;stroke:var(--line-strong);stroke-width:1;opacity:0.6;pointer-events:none;}
.bodysvg .muscledef path,.bodysvg .muscledef rect{fill:rgba(74,133,172,0.16);stroke:rgba(74,133,172,0.4);stroke-width:0.75;pointer-events:none;}
.bodysvg .region{fill:transparent;stroke:transparent;stroke-width:2;cursor:pointer;transition:fill .2s,stroke .2s;}
.bodysvg .region:hover{fill:rgba(217,164,65,0.10);}
.bodysvg .region.sel{fill:rgba(217,164,65,0.22);stroke:var(--trail-yellow);}

/* ===== SKILL TREE (branching) ===== */
.treescroll{overflow-x:auto;overflow-y:hidden;margin:0 -4px;padding:2px 4px 12px;-webkit-overflow-scrolling:touch;}
.treecanvas{position:relative;margin:0 auto;}
.treenode{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;}
.treenode .tn-ic{width:38px;height:38px;border-radius:11px;background:var(--surface-2);border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:16px;}
.treenode .tn-lb{font-size:10.5px;text-align:center;line-height:1.15;color:var(--muted);font-weight:600;max-width:60px;}
.treenode.unlocked .tn-ic{background:var(--trail-green-bg);border-color:var(--trail-green);}
.treenode.unlocked .tn-lb{color:var(--paper);}
.treenode.available .tn-ic{border-color:var(--trail-yellow);}
.treenode.root .tn-ic{border-color:var(--trail-yellow);box-shadow:0 0 0 3px rgba(217,164,65,0.18);background:var(--trail-yellow-bg);}
.treenode.root .tn-lb{color:var(--trail-yellow);font-weight:700;}
.treenode.locked{opacity:0.4;}

/* ===== CALENDAR ===== */
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px;}
.daycell{min-height:70px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;padding:5px 4px;cursor:pointer;gap:2px;overflow:hidden;}
.daycell .dn{font-weight:700;font-family:var(--font-mono);font-size:10px;color:var(--muted);align-self:flex-start;}
.daycell.today{border-color:var(--trail-yellow);}
.daycell.today .dn{color:var(--trail-yellow);}
.daycell .tp{width:100%;height:2.5px;border-radius:2px;margin:1px 0 3px;flex-shrink:0;}
.daycell .tp-ico{font-size:8px;line-height:1;margin:-2px 0 2px;flex-shrink:0;}
.daycell .evtxt{font-size:8.5px;line-height:1.3;color:var(--paper);background:var(--surface-3);border-radius:3px;padding:1.5px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
.daycell .evmore{font-size:8px;color:var(--muted-2);padding-left:2px;flex-shrink:0;}

/* ===== CHAT (AI) ===== */
.chatlog{display:flex;flex-direction:column;gap:10px;padding-bottom:8px;}
.bubble{max-width:86%;padding:11px 13px;border-radius:var(--radius);font-size:14px;line-height:1.5;}
.bubble.ai{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;}
.bubble.user{background:var(--trail-blue-bg);color:var(--paper);align-self:flex-end;border-bottom-right-radius:4px;}
.bubble .role{font-family:var(--font-mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px;}
.suggestcard{background:var(--trail-yellow-bg);border:1px solid rgba(217,164,65,0.35);border-radius:var(--radius);padding:12px;margin-top:6px;}
.suggestcard .st{font-family:var(--font-mono);font-size:10.5px;color:var(--trail-yellow);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;}
.typing span{display:inline-block;width:5px;height:5px;background:var(--muted);border-radius:50%;margin-right:3px;animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:0.2s;}.typing span:nth-child(3){animation-delay:0.4s;}
@keyframes blink{0%,60%,100%{opacity:0.25;}30%{opacity:1;}}
.chatinput{position:sticky;bottom:0;display:flex;gap:8px;padding-top:10px;background:linear-gradient(0deg,var(--ink) 60%,transparent);}
.chatinput input{flex:1;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--paper);border-radius:999px;padding:12px 16px;font-size:14.5px;}
.aipermrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);}
.aipermrow:last-child{border-bottom:none;}

/* ===== MAP / TRACK ===== */
#leafletmap{width:100%;height:260px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);}
.trackstat{text-align:center;}
.trackstat .v{font-family:var(--font-mono);font-size:22px;font-weight:600;}
.trackstat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;}
.trackstats{display:flex;justify-content:space-around;padding:16px 0;}
.pulsedot{width:10px;height:10px;border-radius:50%;background:var(--trail-red);animation:pulse 1.4s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(193,67,43,0.5);}70%{box-shadow:0 0 0 8px rgba(193,67,43,0);}100%{box-shadow:0 0 0 0 rgba(193,67,43,0);}}

/* ===== MODAL / SHEET ===== */
.sheetbg{position:fixed;inset:0;background:rgba(10,14,12,0.6);backdrop-filter:blur(2px);z-index:90;display:none;align-items:flex-end;justify-content:center;}
.sheetbg.open{display:flex;}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 18px calc(24px + var(--safe-bottom));animation:sheetup .2s ease;border-top:1px solid var(--line-strong);}
@keyframes sheetup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sheet-title{font-family:var(--font-display);font-weight:800;font-size:17px;}

/* ===== TOAST ===== */
#toast{position:fixed;bottom:calc(90px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--paper);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:600;font-size:13px;z-index:99;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== CHARTS ===== */
.chartcard canvas{width:100%;display:block;}

/* ===== MISC ===== */
.hr{height:1px;background:var(--line);margin:14px 0;}
.flex{display:flex;}
.between{justify-content:space-between;}
.center{align-items:center;}
.gap8{gap:8px;}
.g{color:var(--muted-2);}
.integ-row{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
.integ-row:last-child{border-bottom:none;}
.integ-row .ic{font-size:18px;}
.integ-row .t{font-weight:700;font-size:13.5px;}
.integ-row .d{font-size:12.5px;color:var(--muted);margin-top:2px;}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <svg class="contour" viewBox="0 0 400 140" preserveAspectRatio="none">
      <path d="M-10,40 C60,10 100,70 180,45 C260,20 300,60 410,30" fill="none" stroke="#4A85AC" stroke-width="1"/>
      <path d="M-10,65 C70,40 110,95 190,68 C270,42 310,82 410,55" fill="none" stroke="#5C8F62" stroke-width="1"/>
      <path d="M-10,90 C80,68 120,118 200,92 C280,66 320,104 410,80" fill="none" stroke="#D9A441" stroke-width="1"/>
      <path d="M-10,115 C90,95 130,138 210,115 C290,92 330,124 410,104" fill="none" stroke="#C1432B" stroke-width="0.8"/>
    </svg>
    <button id="ai-fab" class="aifab" onclick="openSub('ai')" aria-label="MotivAI">🤖</button>
    <div id="topbar-inner">
      <div class="eyebrow" id="tb-eyebrow">MOTIVAPP 2.0</div>
      <div class="headline" id="tb-headline">Szia!</div>
      <div class="daytype" id="tb-daytype"></div>
    </div>
  </div>

  <main id="view-root">
    <div class="view" id="view-ma"></div>
    <div class="view" id="view-schedule"></div>
    <div class="view" id="view-fejlodes"></div>
    <div class="view" id="view-terkep"></div>
    <div class="view" id="view-ai"></div>
    <div class="view" id="view-tovabb"></div>
    <div class="view" id="view-finance"></div>
    <div class="view" id="view-nutrition"></div>
    <div class="view" id="view-achievements"></div>
    <div class="view" id="view-settings"></div>
    <div class="view" id="view-integrations"></div>
    <div class="view" id="view-profile"></div>
  </main>

  <nav id="bottomnav">

/* ================= FEJLESZTŐI IRÁNYELVEK ================= *
 * 1) Timezone-konvenció (dátum-építés):
 *    Az egész kódbázisban EGYETLEN dokumentált mintát használunk helyi dátum

 *       hanem a `toLocalISO()`/`todayISO()` mintát követi.

 * 3) renderApp() vs. célzott RENDERERS.x() vs. közvetlen DOM-patch:
 *    - `renderApp()` (kb. 564. sor): TELJES újrarenderelés — topbar, aktív
 *      view/tab classok ÉS az aktuális nézet RENDERERS-hívása egyben. Csak
 *      akkor hívjuk, ha a tab/subview MAGA változik, vagy olyan globális
 *      állapot cserélődik le, ami több nézetet is érint (pl. `setTab()`

 *    - Célzott `RENDERERS.x()`: ha CSAK egy adott, épp látható nézet

 *      renderer-ét újrahívni — nem kell topbart/tabokat is újraszámolni.
 *      Példa: `removeFinanceItem()` (kb. 2694. sor) `saveState()` után
 *      csak `RENDERERS.finance()`-t hívja, nem `renderApp()`-ot.
 *    - Közvetlen DOM-patch (`document.getElementById(...)` + kézi
 *      manipuláció): ha egyetlen elem állapota/szövege változik, és egy
 *      teljes RENDERERS-újrahívás (a nézet teljes innerHTML-jének
 *      újraépítése) felesleges overhead lenne. Példa: a `toast()` (kb.
 *      503. sor) csak a #toast elem textContent-jét és class-át

 * ============================================================ */

/* ===== ROBUSZTUS HELYI TÁROLÁS =====
   A korábbi verzió window.storage-ra támaszkodott, ami letöltött HTML-ként
   Android böngészőben nem létezik. Ilyenkor localStorage-ra váltunk.
*/
const storageAdapter = {
  async get(key){
    if(window.storage && typeof window.storage.get === 'function'){
      return await window.storage.get(key);
    }
    return {value: localStorage.getItem(key)};
  },
  async set(key, value){
    if(window.storage && typeof window.storage.set === 'function'){
      return await window.storage.set(key, value);
    }
    localStorage.setItem(key, value);
    return true;
  }
};

async function loadState(){
  try{
    const res = await storageAdapter.get(STORAGE_KEY);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      App.state = Object.assign(defaultState(), parsed);
      if(!App.state.finance || !Array.isArray(App.state.finance.mandatory)){
        const oldIncome = (App.state.finance && App.state.finance.monthlyIncome) || 0;
        App.state.finance = defaultState().finance;
        App.state.finance.monthlyIncome = oldIncome;
      }
      /* Régi/hiányzó tömbök biztonságos pótlása */
      const d = defaultState();
      for(const k of ['tasks','events','workouts','weightLog','healthLog','journeys','journal','aiChat']){
        if(!Array.isArray(App.state[k])) App.state[k] = d[k];
      }
      if(!Array.isArray(App.state.finance.foodOrders)) App.state.finance.foodOrders = d.finance.foodOrders;
      if(!App.state.skills || typeof App.state.skills !== 'object') App.state.skills = {};
      if(!App.state.aiPerm || typeof App.state.aiPerm !== 'object') App.state.aiPerm = d.aiPerm;
      if(!App.state.healthConnect || typeof App.state.healthConnect !== 'object') App.state.healthConnect = d.healthConnect;
    } else {
      App.state = defaultState();
    }
  }catch(e){
    console.warn('MotivApp: helyi adatok betöltése sikertelen, alapállapot indul.', e);
    App.state = defaultState();
  }
}

function saveState(){
  clearTimeout(_saveTimer);
  if(App.state.aiChat && App.state.aiChat.length>40){ App.state.aiChat = App.state.aiChat.slice(-40); }
  _saveTimer = setTimeout(async ()=>{
    let ok=false;
    for(let attempt=0; attempt<3 && !ok; attempt++){
      try{
        await storageAdapter.set(STORAGE_KEY, JSON.stringify(App.state));
        ok=true;
      }catch(e){
        if(attempt<2) await new Promise(r=>setTimeout(r, 400*(attempt+1)));
      }
    }
    if(ok){ _saveFailStreak=0; }
    else{ _saveFailStreak++; }
    const badge = document.getElementById('save-status-badge');
    if(badge) badge.outerHTML = saveStatusBadgeHtml();

/* ===== FÁJLBA MENTÉS/BETÖLTÉS (File System Access API, opcionális) =====
   A hasFSAccess feature-detect eldönti, hogy a böngésző tudja-e a
   showSaveFilePicker/showOpenFilePicker API-t — ez Android/TWA alatt
   Chrome-verziótól függően hiányozhat, ezért ez a funkció mindenhol csak
   progresszív ráépülés a meglévő letöltés/fájlválasztó folyamatra, SOHA
   nem kötelező előfeltétel (ld. saveToFile()/loadFromFile()).
   A kiválasztott FileSystemFileHandle-t az oldal-újratöltések között egy
   minimális, saját IndexedDB store-ban tartjuk meg (a localStorage csak
   szöveget tud, a handle nem szerializálható stringgé, de structured
   clone-nal IndexedDB-be igen). Minden IndexedDB hívás try/catch-elve
   van: bármilyen hiba esetén úgy viselkedünk, mintha nem lenne elmentett
   handle — ez sosem dobhat el nem kapott hibát, és sosem akaszthatja meg
   a mentést/betöltést. */
const hasFSAccess = typeof window.showSaveFilePicker === 'function' && typeof window.showOpenFilePicker === 'function';
const FS_DB_NAME = 'motivapp-fs', FS_STORE_NAME = 'handles', FS_HANDLE_KEY = 'backupFile';
function _openFsDb(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(FS_DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(FS_STORE_NAME); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function getStoredHandle(){
  try{
    const db = await _openFsDb();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(FS_STORE_NAME,'readonly');
      const req = tx.objectStore(FS_STORE_NAME).get(FS_HANDLE_KEY);
      req.onsuccess = ()=>resolve(req.result||null);
      req.onerror = ()=>reject(req.error);
    });
  }catch(e){ return null; }
}
async function setStoredHandle(handle){
  try{
    const db = await _openFsDb();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(FS_STORE_NAME,'readwrite');
      tx.objectStore(FS_STORE_NAME).put(handle, FS_HANDLE_KEY);
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){ /* nem kritikus — ha nem sikerül elmenteni a handle-t, a következő
                mentés/betöltés egyszerűen újra fájlválasztót fog nyitni */ }
}

/* ---------- utils ---------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad(n){ return n<10?'0'+n:''+n; }
/* Helyi naptári komponensekből építi az ISO dátumot, NEM toISOString()-tal (ami UTC-re
   konvertál és pozitív UTC-eltolású időzónában — pl. Magyarország — hajnalban egy
   nappal korábbi dátumot adna vissza "ma"-ként). */
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtTime(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDateHu(iso){
  const d=new Date(iso+'T00:00:00');
  const days=['Vasárnap','Hétfő','Kedd','Szerda','Csütörtök','Péntek','Szombat'];
  const months=['jan.','febr.','márc.','ápr.','máj.','jún.','júl.','aug.','szept.','okt.','nov.','dec.'];
  return days[d.getDay()]+' · '+months[d.getMonth()]+' '+d.getDate()+'.';
}
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function dayTypeFor(iso){
  const ov = App.state.schedule.overrides[iso];
  if(ov) return ov;
  const pat = App.state.schedule.pattern;
  if(!pat || !pat.length) return 'pihen';
  const idx = ((daysBetween(App.state.schedule.startDate, iso) % pat.length)+pat.length)%pat.length;
  return pat[idx];
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Kerekít és levágja a felesleges tizedeseket (pl. 6.133333333333334 -> 6.1,
// 6.0 -> 6) - egészségügyi mérőszámokhoz (alvás óra, lépés, pulzus stb.),
// amik osztásból vagy külső szinkronból (pl. jövőbeli Health Connect import)
// származhatnak, nem csak kézi bevitelből.
function fmtHealthNum(v, decimals){
  if(typeof v!=='number' || !isFinite(v)) return '—';
  const f = Math.pow(10, decimals||0);
  return String(Math.round(v*f)/f);
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2200);
}
/* toastUndo: egységes "visszavonható törlés" minta. A #toast pill-stílusát
   követi (ugyanazok a --paper/--ink/--radius tokenek), de a natív #toast
   elemtől külön, JS-ből felépített elemet használ, hogy ne kelljen a
   megosztott #toast DOM/CSS-t (más csapattagok is szerkesztik a fájlt)
   módosítani. A "Visszavonás" gomb néhány másodpercig aktív; lejárat után
   (vagy kattintás után) eltűnik, és a törlés véglegessé válik. */
let _toastUndoEl = null;
function toastUndo(msg, undoFn){
  let t = _toastUndoEl;
  if(!t){
    t = document.createElement('div');
    t.id = 'toast-undo';
    t.setAttribute('role','status'); t.setAttribute('aria-live','polite');
    t.style.cssText = 'position:fixed;bottom:calc(90px + var(--safe-bottom));left:50%;'
      +'transform:translateX(-50%) translateY(20px);background:var(--paper);color:var(--ink);'
      +'padding:9px 9px 9px 18px;border-radius:999px;font-weight:600;font-size:13px;z-index:100;'
      +'opacity:0;transition:.2s;pointer-events:none;display:flex;align-items:center;gap:10px;'
      +'max-width:calc(100vw - 32px);box-shadow:0 6px 20px rgba(0,0,0,.28);';
    document.body.appendChild(t);
    _toastUndoEl = t;
  }
  clearTimeout(t._tm);
  t.innerHTML = '';
  const label = document.createElement('span');
  label.textContent = msg;
  label.style.cssText = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
  const btn = document.createElement('button');
  btn.type = 'button'; btn.textContent = 'Visszavonás';
  btn.style.cssText = 'background:var(--trail-yellow);color:var(--ink);border:none;'
    +'border-radius:999px;padding:6px 14px;font-weight:700;font-size:12.5px;cursor:pointer;flex-shrink:0;';
  const hide = ()=>{ t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(20px)'; t.style.pointerEvents='none'; };
  btn.onclick = ()=>{ clearTimeout(t._tm); hide(); if(typeof undoFn==='function') undoFn(); };
  t.appendChild(label); t.appendChild(btn);
  t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)'; t.style.pointerEvents='auto';
  t._tm = setTimeout(hide, 5000);
}

function haversine(a,b){
  const R=6371000, toRad=x=>x*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}

function weekVolumeForMuscle(muscleId){
  const cutoff = Date.now()-28*86400000;
  let score=0;
  App.state.workouts.filter(w=>new Date(w.date).getTime()>cutoff).forEach(w=>{
    const daysAgo=(Date.now()-new Date(w.date).getTime())/86400000;
    const recency = Math.max(0.25, 1-(daysAgo/28));
    (w.muscleGroups||[]).forEach(m=>{ if(m===muscleId) score += 10*recency; });
  });
  Object.keys(App.state.skills).forEach(sid=>{
    const sk = allSkillNodes().find(s=>s.id===sid);
    if(sk && App.state.skills[sid]) (sk.muscles||[]).forEach(m=>{ if(m===muscleId) score+=6; });
  });
  return Math.max(0, Math.min(100, Math.round(score)));
}

const EVENT_COLORS = {munka:'blue',edzes:'red',pihenes:'green',esemeny:'blue',hatarido:'yellow',ai:'yellow'};

function taskRowHtml(t, afterToggle){
  if(t.type==='percent'){
    return `<div class="row" style="align-items:flex-start;">
      <div class="row-main">
        <div class="row-title" style="font-size:14px;">${escapeHtml(t.title)}</div>
        <div class="progwrap" style="margin:7px 0 4px;"><div class="progbar" style="width:${t.progress||0}%"></div></div>
        <div class="small muted">${t.progress||0}% kész</div>
      </div>
      <span class="g" style="cursor:pointer;padding-top:2px;" onclick="editTaskProgress('${t.id}')">✏️</span>
    </div>`;
  }
  if(t.type==='steps'){
    const steps = t.steps||[];
    const done = steps.filter(s=>s.done).length;
    const total = steps.length;
    const pct = total? Math.round(done/total*100) : 0;
    return `<div class="row" style="align-items:flex-start;cursor:pointer;" onclick="openStepsChecklistSheet('${t.id}')">
      <div class="row-main">
        <div class="row-title" style="font-size:14px;">${escapeHtml(t.title)}</div>
        <div class="progwrap" style="margin:7px 0 4px;"><div class="progbar" style="width:${pct}%"></div></div>
        <div class="small muted">${done}/${total} lépés kész</div>
      </div>
      <span class="g" style="padding-top:2px;">📋</span>
    </div>`;
  }
  return `<div class="row">
    <div class="row-check ${t.done?'done':''}" onclick="toggleTask('${t.id}');${afterToggle||''}">${t.done?'✓':''}</div>
    <div class="row-main"><div class="row-title ${t.done?'done':''}">${escapeHtml(t.title)}</div>
    ${t.priority? `<div class="row-sub">${t.priority==='high'?'🔴 magas prioritás':t.priority==='low'?'⚪ alacsony prioritás':'🟡 közepes prioritás'}</div>`:''}
    </div>
  </div>`;
}
function editTaskProgress(id){
  const t = App.state.tasks.find(x=>x.id===id); if(!t) return;
  openSheet(`<div class="sheet-head"><div class="sheet-title">${escapeHtml(t.title)}</div><button class="iconbtn" onclick="closeSheet()">✕</button></div>
    <div class="mono" id="tp-val" style="text-align:center;font-size:28px;margin-bottom:10px;font-weight:700;">${t.progress||0}%</div>
    <div class="field"><input type="range" id="tp-range" min="0" max="100" step="5" value="${t.progress||0}" style="width:100%;" oninput="document.getElementById('tp-val').textContent=this.value+'%'"></div>
    <button class="btn btn-primary btn-block" onclick="saveTaskProgress('${id}')">Mentés</button>`);
}
function saveTaskProgress(id){
  const t = App.state.tasks.find(x=>x.id===id); if(!t) return;
  t.progress = parseInt(document.getElementById('tp-range').value)||0;
  saveState(); closeSheet(); toast('Frissítve'); renderApp();
}

function toggleTask(id){
  const t = App.state.tasks.find(x=>x.id===id);
  if(t){ t.done=!t.done; saveState(); RENDERERS.ma(); }
}
function openAddTaskSheet(presetDate){
  openSheet(`
    <div class="sheet-head"><div class="sheet-title">Új feladat</div><button class="iconbtn" onclick="closeSheet()">✕</button></div>
    <div class="field"><label>Mi a feladat?</label><input type="text" id="nt-title" placeholder="Pl. kampervan zsanér beszerzés"></div>
    <div class="field"><label>Határidő</label><input type="date" id="nt-due" value="${presetDate||todayISO()}"></div>
    <div class="field"><label>Típus</label>
      <div class="chiprow" id="nt-type">
        <div class="chip active" data-v="checkbox">✓ Pipálható</div><div class="chip" data-v="percent">% Százalékos</div><div class="chip" data-v="steps">📋 Lépéssor</div>
      </div>
    </div>
    <div class="field"><label>Prioritás</label>
      <div class="chiprow" id="nt-prio">
        <div class="chip active" data-v="med">Közepes</div><div class="chip" data-v="high">Magas</div><div class="chip" data-v="low">Alacsony</div>
      </div>
    </div>
    <button class="btn btn-primary btn-block" onclick="saveNewTask()">Mentés</button>
  `);
  document.querySelectorAll('#nt-prio .chip').forEach(c=>c.addEventListener('click',()=>{
    document.querySelectorAll('#nt-prio .chip').forEach(x=>x.classList.remove('active')); c.classList.add('active');
  }));
  document.querySelectorAll('#nt-type .chip').forEach(c=>c.addEventListener('click',()=>{
    document.querySelectorAll('#nt-type .chip').forEach(x=>x.classList.remove('active')); c.classList.add('active');
  }));
}
function saveNewTask(){
  const title = document.getElementById('nt-title').value.trim();
  if(!title){ toast('Adj meg egy címet'); return; }
  const due = document.getElementById('nt-due').value;
  const prio = document.querySelector('#nt-prio .chip.active').dataset.v;
  const type = document.querySelector('#nt-type .chip.active').dataset.v;
  const task = {id:uid(),title,due,priority:prio,type,done:false};
  if(type==='steps') task.steps=[]; else task.progress=0;
  App.state.tasks.push(task);
  saveState();
  if(type==='steps'){
    toast('Feladat hozzáadva'); renderApp(); renderFeladatokSub();
    openEditStepsSheet(task.id);
  } else {
    closeSheet(); toast('Feladat hozzáadva'); renderApp(); renderFeladatokSub();
  }
}
/* Feladatkezelő - lépéssoros feladatok (type:'steps'): a tasks tömb elemei
   ilyenkor steps:[{id,text,done}] tömböt kapnak progress helyett.
   openEditStepsSheet()/saveEditedSteps() a lépések listáját szerkeszti
   (új lépéssoros feladatnál saveNewTask() ezt nyitja meg folytatásként,
   meglévőnél a pipálható nézet ✏️ gombja), openStepsChecklistSheet()/
   toggleStepDone() a pipálható nézetet adja. feladatokSubBodyHtml()/
   renderFeladatokSub() a teljes Feladatkezelő nézetet adja - ezt a két
   nevet egy másik ág már a nevük alapján hívja, ezért a nevük nem
   változtatható. */
let _stepsDraft = null;
function openEditStepsSheet(id){
  const t = App.state.tasks.find(x=>x.id===id); if(!t) return;
  _stepsDraft = {taskId:id, steps:(t.steps||[]).map(s=>({id:s.id,text:s.text}))};
  renderStepsEditSheet();
}
function renderStepsEditSheet(){
  const d = _stepsDraft; if(!d) return;
  const t = App.state.tasks.find(x=>x.id===d.taskId);
  openSheet(`
    <div class="sheet-head"><div class="sheet-title">Lépések${t?': '+escapeHtml(t.title):''}</div><button class="iconbtn" onclick="closeSheet()">✕</button></div>
    <div class="card" style="padding:4px 16px;margin-bottom:12px;">
      ${d.steps.length? d.steps.map((s,i)=>`<div class="row"><div class="row-main"><div class="row-title" style="font-size:14px;">${i+1}. ${escapeHtml(s.text)}</div></div><span class="g" style="cursor:pointer;" onclick="removeStepDraft(${i})">✕</span></div>`).join('') : `<div class="small muted" style="padding:12px 0;">Még nincs lépés hozzáadva.</div>`}
    </div>
    <div class="field"><label>Új lépés</label><input type="text" id="sd-text" placeholder="Pl. hagymát megdinsztelni" onkeydown="if(event.key==='Enter'){event.preventDefault();addStepDraft();}"></div>
    <button class="btn btn-secondary btn-block" style="margin-bottom:10px;" onclick="addStepDraft()">+ Lépés hozzáadása</button>
    <button class="btn btn-primary btn-block" onclick="saveEditedSteps()">Kész</button>
  `);
  document.getElementById('sd-text')?.focus();
}
function addStepDraft(){
  const inp = document.getElementById('sd-text'); if(!inp) return;
  const text = inp.value.trim();
  if(!text) return;
  _stepsDraft.steps.push({id:uid(),text});
  renderStepsEditSheet();
}
function removeStepDraft(idx){
  _stepsDraft.steps.splice(idx,1);
  renderStepsEditSheet();
}
function saveEditedSteps(){
  const d = _stepsDraft; if(!d) return;
  const t = App.state.tasks.find(x=>x.id===d.taskId);
  if(!t){ _stepsDraft=null; closeSheet(); return; }
  const prevDone = {}; (t.steps||[]).forEach(s=>{ prevDone[s.id]=s.done; });
  t.steps = d.steps.map(s=>({id:s.id, text:s.text, done:prevDone[s.id]||false}));
  _stepsDraft = null;
  saveState(); closeSheet(); toast('Lépések mentve'); renderApp(); renderFeladatokSub();
}
function openStepsChecklistSheet(id){
  const t = App.state.tasks.find(x=>x.id===id); if(!t) return;
  openSheet(`
    <div class="sheet-head"><div class="sheet-title">${escapeHtml(t.title)}</div><div class="flex gap8"><span class="g" style="cursor:pointer;" onclick="openEditStepsSheet('${id}')">✏️</span><button class="iconbtn" onclick="closeSheet()">✕</button></div></div>
    <div id="steps-checklist-list"></div>
  `);
  renderStepsChecklistList(id);
}
function renderStepsChecklistList(id){
  const c = document.getElementById('steps-checklist-list'); if(!c) return;
  const t = App.state.tasks.find(x=>x.id===id); if(!t) return;
  const steps = t.steps||[];
  c.innerHTML = steps.length? steps.map(s=>`
    <div class="row">
      <div class="row-check ${s.done?'done':''}" onclick="toggleStepDone('${id}','${s.id}')">${s.done?'✓':''}</div>
      <div class="row-main"><div class="row-title ${s.done?'done':''}">${escapeHtml(s.text)}</div></div>
    </div>`).join('') : `<div class="empty"><div class="ic">📋</div><div class="t">Még nincs lépés</div><div class="d">Add hozzá a fejlécben lévő ✏️ gombbal.</div></div>`;
}
function toggleStepDone(taskId, stepId){
  const t = App.state.tasks.find(x=>x.id===taskId); if(!t) return;
  const s = (t.steps||[]).find(x=>x.id===stepId); if(!s) return;
  s.done = !s.done;
  saveState();
  renderStepsChecklistList(taskId);
  renderFeladatokSub();
}
function _feladatokListHtml(){
  const all = App.state.tasks.slice().sort((a,b)=>(a.due||'').localeCompare(b.due||''));
  const plain = all.filter(t=>t.type!=='steps');
  const steps = all.filter(t=>t.type==='steps');
  return `
    <div class="sectiontitle">Feladatok</div>
    <div class="card" style="padding:4px 16px;">${plain.length? plain.map(t=>taskRowHtml(t,'renderFeladatokSub();')).join('') : `<div class="empty"><div class="ic">📋</div><div class="t">Nincs feladat</div></div>`}</div>
    <div class="sectiontitle">Lépéssoros feladatok</div>
    <div class="card" style="padding:4px 16px;">${steps.length? steps.map(t=>taskRowHtml(t)).join('') : `<div class="empty"><div class="ic">📋</div><div class="t">Nincs lépéssoros feladat</div></div>`}</div>
  `;
}
function feladatokSubBodyHtml(){
  return `
    <div class="sectiontitle">Feladatkezelő <span class="g small" style="cursor:pointer;" onclick="openAddTaskSheet()">+ Új feladat</span></div>
    <div id="feladatok-sub-content">${_feladatokListHtml()}</div>
  `;
}
function renderFeladatokSub(){
  const c = document.getElementById('feladatok-sub-content'); if(!c) return;
  c.innerHTML = _feladatokListHtml();
}
function quickLogSheet(field,label,icon){

    <button class="btn btn-primary btn-block" onclick="saveQuickLog('${field}')">Mentés</button>
  `);
}
function saveQuickLog(field){

  saveState(); closeSheet(); toast('Mentve'); renderApp();
}

function openCalViewSheet(){

function renderCalContent(){
  const c = document.getElementById('cal-content'); if(!c) return;
  if(App.ui.calView==='nap') renderNapView(c);
  else if(App.ui.calView==='het') renderHetView(c);
  else if(App.ui.calView==='honap') renderHonapView(c);
  else renderEvView(c);
}
function toLocalISO(d){
  // Helyi naptári komponensekből építi az ISO dátumot (NEM toISOString(), ami UTC-re
  // konvertál és pozitív UTC-eltolású időzónában (pl. HU) 1 nappal korábbra csúsztat).
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function shiftCalRef(dir){
  const d = new Date(App.ui.calRef+'T00:00:00');
  if(App.ui.calView==='nap') d.setDate(d.getDate()+dir);
  else if(App.ui.calView==='het') d.setDate(d.getDate()+dir*7);
  else if(App.ui.calView==='honap') d.setMonth(d.getMonth()+dir);
  else d.setFullYear(d.getFullYear()+dir);
  App.ui.calRef = toLocalISO(d);
  renderCalContent();
}
function fmtShort(iso){
  const d=new Date(iso+'T00:00:00');
  const months=['jan.','febr.','márc.','ápr.','máj.','jún.','júl.','aug.','szept.','okt.','nov.','dec.'];
  return months[d.getMonth()]+' '+d.getDate()+'.';
}
function dayCell(iso,todayIso,compact){
  const dtKey=dayTypeFor(iso);
  const dt=DAY_TYPES[dtKey]||DAY_TYPES.egyeb;
  const dnum=new Date(iso+'T00:00:00').getDate();
  const items=[...App.state.events.filter(e=>e.date===iso).map(e=>e.title), ...App.state.tasks.filter(t=>t.due===iso).map(t=>t.title)];
  const maxShow = compact?1:2;
  const shown = items.slice(0,maxShow);
  const extra = items.length-shown.length;
  const dtIco = (DAY_TYPE_SHORT[dtKey]||'').split(' ')[0];
  return `<div class="daycell ${iso===todayIso?'today':''}" onclick="openDaySheet('${iso}')">
    <div class="dn">${dnum}</div><div class="tp" style="background:var(--trail-${dt.color})"></div><div class="tp-ico" title="${escapeHtml(dt.label)}">${dtIco}</div>
    ${shown.map(t=>`<div class="evtxt">${escapeHtml(t)}</div>`).join('')}
    ${extra>0?`<div class="evmore">+${extra}</div>`:''}
  </div>`;
}

function renderNapView(c){

      </div>

    </div>

    </div>
  `;
}
function renderHetView(c){
  const base = new Date(App.ui.calRef+'T00:00:00');
  base.setDate(base.getDate()-base.getDay());
  const days = [...Array(7)].map((_,i)=>{ const d=new Date(base); d.setDate(base.getDate()+i); return toLocalISO(d); });
  const todayIso = todayISO();
  c.innerHTML = `
    <div class="flex between center" style="margin-bottom:10px;">
      <button class="iconbtn" onclick="shiftCalRef(-1)">‹</button>
      <div style="font-weight:700;">${fmtShort(days[0])} – ${fmtShort(days[6])}</div>
      <button class="iconbtn" onclick="shiftCalRef(1)">›</button>
    </div>
    <div class="weekgrid">${days.map(iso=>dayCell(iso,todayIso,false)).join('')}</div>
  `;
}
function renderHonapView(c){
  const ref = new Date(App.ui.calRef+'T00:00:00');
  const year=ref.getFullYear(), month=ref.getMonth();
  const monthNames=['Január','Február','Március','Április','Május','Június','Július','Augusztus','Szeptember','Október','November','December'];
  const startOffset = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const todayIso = todayISO();
  let cells=[]; for(let i=0;i<startOffset;i++) cells.push(null); for(let d=1;d<=daysInMonth;d++) cells.push(d); while(cells.length%7!==0) cells.push(null);
  c.innerHTML = `
    <div class="flex between center" style="margin-bottom:10px;">
      <button class="iconbtn" onclick="shiftCalRef(-1)">‹</button>
      <div style="font-weight:700;">${monthNames[month]} ${year}</div>
      <button class="iconbtn" onclick="shiftCalRef(1)">›</button>
    </div>
    <div class="weekgrid" style="margin-bottom:4px;">${['V','H','K','Sz','Cs','P','Sz'].map(d=>`<div class="small muted" style="text-align:center;font-weight:700;">${d}</div>`).join('')}</div>
    <div class="weekgrid">${cells.map(d=> d? dayCell(year+'-'+pad(month+1)+'-'+pad(d),todayIso,true) : '<div></div>').join('')}</div>
  `;
}
function renderEvView(c){
  const year = new Date(App.ui.calRef+'T00:00:00').getFullYear();
  const monthNames=['Január','Február','Március','Április','Május','Június','Július','Augusztus','Szeptember','Október','November','December'];
  c.innerHTML = `
    <div class="flex between center" style="margin-bottom:10px;">
      <button class="iconbtn" onclick="shiftCalRef(-1)">‹</button>
      <div style="font-weight:700;">${year}</div>
      <button class="iconbtn" onclick="shiftCalRef(1)">›</button>
    </div>
    <div class="card" style="padding:2px 16px;">
      ${monthNames.map((mn,mi)=>{
        const daysInM = new Date(year,mi+1,0).getDate();
        const ym = year+'-'+pad(mi+1);
        const taskCount = App.state.tasks.filter(t=>t.due && t.due.slice(0,7)===ym).length;
        const evCount = App.state.events.filter(e=>e.date && e.date.slice(0,7)===ym).length;
        let strip='';
        for(let d=1;d<=daysInM;d++){
          const dt=DAY_TYPES[dayTypeFor(ym+'-'+pad(d))]||DAY_TYPES.egyeb;
          strip+=`<span style="flex:1;background:var(--trail-${dt.color});opacity:0.65;"></span>`;
        }
        return `<div class="row tap" style="cursor:pointer;flex-direction:column;align-items:stretch;gap:6px;padding:12px 0;" onclick="jumpToMonth(${year},${mi})">
          <div class="flex between center"><span class="row-title" style="font-size:14px;">${mn}</span><span class="small muted">${taskCount} feladat · ${evCount} esemény</span></div>
          <div style="display:flex;height:6px;border-radius:4px;overflow:hidden;">${strip}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}
function jumpToMonth(year,monthIdx){ App.ui.calRef=year+'-'+pad(monthIdx+1)+'-01'; App.ui.calView='honap'; RENDERERS.schedule(); }

const DAY_TYPE_SHORT = {nappal:'☀️ Nappal',ejszaka:'🌙 Éjszaka',pihen:'💤 Pihenő',szabi:'🏖️ Szabi',egyeb:'· Egyéb'};
const DAY_TYPE_CYCLE = ['nappal','ejszaka','pihen','szabi','egyeb'];

function cyclePatternDay(i){
  const cur = App.state.schedule.pattern[i];
  const next = DAY_TYPE_CYCLE[(DAY_TYPE_CYCLE.indexOf(cur)+1)%DAY_TYPE_CYCLE.length];
  App.state.schedule.pattern[i]=next; saveState(); RENDERERS.schedule();
}
function addPatternDay(){ App.state.schedule.pattern.push('pihen'); saveState(); RENDERERS.schedule(); }
function removeLastPatternDay(){ if(App.state.schedule.pattern.length>1){ App.state.schedule.pattern.pop(); saveState(); RENDERERS.schedule(); } }

function openDaySheet(iso){
  const evs = App.state.events.filter(e=>e.date===iso);

      </div>`).join('') : `<div class="small muted" style="padding:10px 0;">Nincs feladat.</div>`}

      </div>`).join('') : `<div class="small muted" style="padding:10px 0;">Nincs esemény.</div>`}
  `);
}
function deleteTask(id,iso){
  const idx=App.state.tasks.findIndex(t=>t.id===id);
  if(idx===-1) return;
  const removed=App.state.tasks[idx];
  App.state.tasks.splice(idx,1);
  saveState();
  if(iso) openDaySheet(iso); else closeSheet();
  renderApp();
  toastUndo('Feladat törölve', ()=>{
    App.state.tasks.splice(Math.min(idx,App.state.tasks.length),0,removed);
    saveState();
    if(iso) openDaySheet(iso);
    renderApp();
  });
}
function setDayOverride(iso,type){ App.state.schedule.overrides[iso]=type; saveState(); closeSheet(); toast('Frissítve'); renderApp(); }
function clearDayOverride(iso){ delete App.state.schedule.overrides[iso]; saveState(); closeSheet(); toast('Felülírás törölve'); renderApp(); }
function openAddEventSheet(iso){
  openSheet(`
    <div class="sheet-head"><div class="sheet-title">Új esemény</div><button class="iconbtn" onclick="closeSheet()">✕</button></div>

function saveNewEvent(iso){
  const title=document.getElementById('ne-title').value.trim();

function deleteEvent(id){
  const idx=App.state.events.findIndex(e=>e.id===id);

  toastUndo('Esemény törölve', ()=>{
    App.state.events.splice(Math.min(idx,App.state.events.length),0,removed);
    saveState();
    renderApp();
  });
}

function layoutTree(nodes){
  const children={}; nodes.forEach(n=>children[n.id]=[]);
  nodes.forEach(n=>{ if(n.parent && children[n.parent]) children[n.parent].push(n.id); });
  const roots = nodes.filter(n=>!n.parent).map(n=>n.id);
  let leafCounter=0; const col={}, row={};
  function assign(id,depth){
    row[id]=depth;
    const kids=children[id];
    if(!kids.length){ col[id]=leafCounter++; return col[id]; }
    kids.forEach(k=>assign(k,depth+1));
    col[id]=kids.reduce((s,k)=>s+col[k],0)/kids.length;
    return col[id];
  }
  roots.forEach(r=>assign(r,0));
  return nodes.map(n=>({...n,col:col[n.id]||0,row:row[n.id]||0}));
}

function saveActivity(){

  App.state.activities.push({
    id:uid(), type:typeId, label: otherLabel||type.name, icon:type.icon,
    date: todayISO(), durationMin,
    physical: parseInt(document.getElementById('ac-phys').value),
    mental: parseInt(document.getElementById('ac-ment').value),

const TREE_SLOT=70, TREE_ROWH=90, TREE_PADX=16, TREE_PADY=18, TREE_ICON=38, TREE_NODEW=60;
function allSports(){ return SPORTS.concat(App.state.customSports||[]); }
function allSkillNodes(){ return SKILL_DEFS.concat(App.state.customSkillNodes||[]); }
function skillState(n){
  if(!n.parent) return 'root';
  if(App.state.skills[n.id]) return 'unlocked';
  const p = allSkillNodes().find(x=>x.id===n.parent);
  const parentReady = p && (!p.parent || !!App.state.skills[p.id]);
  return parentReady ? 'available' : 'locked';
}

function setSkillSport(id){ App.ui.skillSport=id; renderFejlContent(); }
function renderSportTree(nodes){
  const laid = layoutTree(nodes);
  const maxCol = Math.max(...laid.map(n=>n.col));
  const maxRow = Math.max(...laid.map(n=>n.row));
  const W = TREE_PADX*2 + maxCol*TREE_SLOT + TREE_NODEW;
  const H = TREE_PADY*2 + maxRow*TREE_ROWH + TREE_ICON + 46;
  const pos={}; laid.forEach(n=>{ pos[n.id]={x:TREE_PADX+n.col*TREE_SLOT+TREE_NODEW/2, y:TREE_PADY+n.row*TREE_ROWH}; });
  let lines='';
  laid.forEach(n=>{
    if(n.parent && pos[n.parent]){
      const p=pos[n.parent], ch=pos[n.id];
      const x1=p.x,y1=p.y+TREE_ICON,x2=ch.x,y2=ch.y,midY=(y1+y2)/2;
      const active = skillState(n)!=='locked';
      lines += `<path d="M${x1},${y1} C${x1},${midY} ${x2},${midY} ${x2},${y2}" fill="none" stroke="${active?'#D9A441':'#33413A'}" stroke-width="2" stroke-dasharray="5,5"/>`;
    }
  });
  let nodesHtml='';
  laid.forEach(n=>{
    const p=pos[n.id], st=skillState(n);
    nodesHtml += `<div class="treenode ${st}" style="left:${(p.x-TREE_NODEW/2).toFixed(1)}px;top:${p.y}px;width:${TREE_NODEW}px;" onclick="onSkillTap('${n.id}')">
      <div class="tn-ic">${escapeHtml(n.icon)}</div>
      <div class="tn-lb">${escapeHtml(n.name)}</div>
    </div>`;
  });
  return `<div class="treescroll"><div class="treecanvas" style="width:${W}px;height:${H}px;">
    <svg width="${W}" height="${H}" style="position:absolute;left:0;top:0;">${lines}</svg>
    ${nodesHtml}
  </div></div>`;
}
function onSkillTap(id){
  const s = allSkillNodes().find(x=>x.id===id);
  const st = skillState(s);
  if(st==='root'){ toast((allSports().find(sp=>sp.id===s.sport)||{}).name+' ág kezdőpontja'); return; }

    const dependentsWarning = dependents.length

    openSheet(`<div class="sheet-head"><div class="sheet-title">🔒 ${escapeHtml(s.name)}</div><button class="iconbtn" onclick="closeSheet()">✕</button></div>
      <div class="small muted">Előbb oldd fel: <b>${escapeHtml(parentName)}</b></div>`);

    <button class="btn btn-primary btn-block" onclick="App.state.skills['${id}']=true;saveState();closeSheet();toast('Feloldva! 🎉');RENDERERS.fejlodes();">Feloldom ✓</button>`);
}
/* Az `id` skilltől lefelé, a `.parent` láncot rekurzívan bejárva, az ÖSSZES
   leszármazott skill-node (feloldott állapottól függetlenül). */
function skillDescendants(id){
  const nodes = allSkillNodes();
  const out = [];
  const stack = [id];
  while(stack.length){
    const cur = stack.pop();
    nodes.filter(n=>n.parent===cur).forEach(ch=>{ out.push(ch); stack.push(ch.id); });
  }
  return out;
}
/* Egy feloldott skill visszavonása CASCADE-dal: minden tőle függő, jelenleg
   feloldott leszármazott skillt is visszavon, hogy a skillfa állapota
   (szülő feloldva <= gyerek feloldva) mindig konzisztens maradjon. */
function revokeSkillCascade(id){
  const s = allSkillNodes().find(x=>x.id===id);
  const dependents = skillDescendants(id).filter(n=>App.state.skills[n.id]);
  App.state.skills[id] = false;
  dependents.forEach(n=>{ App.state.skills[n.id] = false; });
  saveState(); closeSheet();
  toast(dependents.length
    ? `Visszavonva: ${s?s.name:''} + ${dependents.length} függő skill`
    : 'Visszavonva');
  RENDERERS.fejlodes();
}

/* requestApiKeySheet: a natív window.prompt() helyett az openSheet() mintát
   követő, stílusos beviteli ablak az Anthropic API kulcshoz. Promise-t ad
   vissza, ami a "Mentés" gombra kattintáskor a beírt (trimmelt) kulccsal,
   bármilyen egyéb bezárási úton (✕ gomb, "Mégse", háttérre kattintás, Esc)
   üres string-gel oldódik fel — így a hívó (callMotivAI) mindig kap egy
   választ, és soha nem akad be egy le nem zárt Promise-on. A #sheetbg elem
   'open' class-ának megfigyelésével (MutationObserver) minden bezárási útvonalat
   lefed anélkül, hogy a megosztott closeSheet()/globális event listenerekhez
   (503-515. sor körül, más csapattagok is szerkeszthetik) hozzá kellene nyúlni. */
let _apiKeySheetSave = null;
function requestApiKeySheet(){
  return new Promise((resolve)=>{
    let settled=false;
    const bg=document.getElementById('sheetbg');
    let observer;
    const finish=(val)=>{
      if(settled) return;
      settled=true;
      if(observer) observer.disconnect();
      _apiKeySheetSave=null;
      resolve(val);
    };
    _apiKeySheetSave=function(){
      const el=document.getElementById('apikey-input');
      const v=(el&&el.value)||'';
      finish(v.trim());
      closeSheet();
    };
    openSheet(`
      <div class="sheet-head"><div class="sheet-title">🔑 Anthropic API kulcs szükséges</div><button class="iconbtn" onclick="closeSheet()">✕</button></div>
      <div class="small g" style="line-height:1.55;margin-bottom:14px;">Ez egyszemélyes app, szerver-proxy nélkül — a MotivAI funkciókhoz saját Anthropic API kulcs kell. A kulcsot kizárólag ezen az eszközön, a böngésző localStorage-ában tároljuk el, sehova máshova nem küldjük.</div>
      <div class="field"><label>API kulcs</label><input type="password" id="apikey-input" placeholder="sk-ant-..." autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();_apiKeySheetSave();}"></div>
      <button class="btn btn-primary btn-block" onclick="_apiKeySheetSave()">Mentés</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="closeSheet()">Mégse</button>
    `);
    observer=new MutationObserver(()=>{ if(!bg.classList.contains('open')) finish(''); });
    observer.observe(bg,{attributes:true,attributeFilter:['class']});
  });
}
/* ===== callMotivAI: közös helper minden Anthropic Messages API hívásra =====
   Ez egyszemélyes, nem publikus app — nincs szerver-proxy, ezért az MVP-
   megoldás egy futásidejű, localStorage-ban tárolt API-kulcs, amit első
   használatkor egyszer bekérünk (lásd requestApiKeySheet). A hívó kód csak
   callMotivAI({...})-t hív, a modellnevet és a payloadot változatlanul hagyva;
   a hitelesítési fejlécek és a hibakezelés (hiányzó/érvénytelen kulcs, HTTP
   hiba, limit-hiba) itt központosított. */
async function callMotivAI(payload){
  let apiKey = localStorage.getItem('motivai:apikey');
  if(!apiKey){
    apiKey = (await requestApiKeySheet()).trim();
    if(!apiKey) throw new Error('Nincs megadva API kulcs, az AI-hívás nem indítható el.');
    localStorage.setItem('motivai:apikey', apiKey);
  }
  const resp = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify(payload)
  });
  let data;
  try{ data=await resp.json(); }
  catch(parseErr){ throw new Error('Válasz-feldolgozási hiba (HTTP '+resp.status+')'); }

  if(!resp.ok){
    if(resp.status===401){
      localStorage.removeItem('motivai:apikey');
      throw new Error('Érvénytelen vagy lejárt API kulcs (401). Próbáld újra, és add meg a kulcsot ismét.');
    }
    const err=data&&data.error?data.error:{};
    if(err.type==='exceeded_limit' || err.status==='exceeded_limit' || /limit/i.test(err.message||'')){
      throw new Error('Az AI használati kerete jelenleg elérte a limitet. A pénzügyi adatbevitel továbbra is működik helyben, az általános AI-kérdéseket a keret visszaállása után lehet újra elküldeni.');
    }
    throw new Error(err.message||('HTTP '+resp.status));
  }
  return data;
}

/* validateGeneratedSkillTree: az AI által visszaadott skillfa-JSON ellenőrzése,
   mielőtt bekerül a state-be. Duplikált id vagy ismeretlen/ciklikus parent
   hivatkozás a layoutTree() rekurzív assign(id,depth) függvényét végtelen
   rekurzióba (böngésző-fagyás / stack overflow) vihetné. */
function validateGeneratedSkillTree(gen){
  const ids = new Set();
  gen.forEach(n=>{
    if(!n || typeof n.id!=='string' || !n.id) throw new Error('invalid-node');
    if(ids.has(n.id)) throw new Error('duplicate-id: '+n.id);
    ids.add(n.id);
  });
  const byId={}; gen.forEach(n=>{ byId[n.id]=n; });
  gen.forEach(n=>{
    if(n.parent!=null && !ids.has(n.parent)) throw new Error('unknown-parent: '+n.parent);
  });
  const maxSteps = gen.length + 1;
  gen.forEach(n=>{
    let cur=n, steps=0;
    while(cur && cur.parent!=null){
      steps++;
      if(steps>maxSteps) throw new Error('cyclic-parent chain at '+n.id);
      cur = byId[cur.parent];
    }
  });
}

async function generateCustomSport(){
  const name=document.getElementById('sp-name').value.trim();
  if(!name){ toast('Adj meg egy nevet'); return; }
  const icon=document.querySelector('#sp-icon .chip.active').dataset.v;
  const slug='c'+uid();
  openSheet(`<div class="sheet-head"><div class="sheet-title">${icon} ${escapeHtml(name)}</div></div><div class="small muted" style="text-align:center;padding:26px 0;">MotivAI generálja a skillfát…</div>`);
  try{
    const prompt = 'Készíts elágazó skill-fát (haladási rendszert) ehhez a sporthoz/tevékenységhez: "'+name+'". Kizárólag egy JSON tömböt adj vissza, más szöveg vagy magyarázat nélkül, pontosan ilyen formában: [{"id":"n1","name":"...","icon":"emoji","parent":null},{"id":"n2","name":"...","icon":"emoji","parent":"n1"}]. Szabályok: 14-20 elem, PONTOSAN egy gyökér elem (parent:null, ez legyen a sportág neve/kezdőpontja), utána 2-4 párhuzamos ág, mindegyik alaptól haladóig/elitig haladva. Minden id egyedi, rövid, csak a-z0-9 karakterek. A name magyarul, tömören (max 4 szó). Az icon egyetlen, a lépéshez illő emoji legyen.';
    const data = await callMotivAI({model:'claude-sonnet-4-6',max_tokens:1500,messages:[{role:'user',content:prompt}]});
    const raw=(data.content||[]).map(b=>b.text||'').join('');
    const m=raw.match(/\[[\s\S]*\]/);
    if(!m) throw new Error('no-json');
    const gen=JSON.parse(m[0]);
    if(!Array.isArray(gen)||!gen.length) throw new Error('empty');
    validateGeneratedSkillTree(gen);
    const idMap={}; gen.forEach(n=>{ idMap[n.id]=slug+'_'+n.id; });
    const newNodes=gen.map(n=>({id:idMap[n.id],sport:slug,name:n.name||'?',icon:n.icon||'⭐',parent:n.parent?(idMap[n.parent]||null):null,muscles:[]}));
    App.state.customSports.push({id:slug,name,icon});
    App.state.customSkillNodes=(App.state.customSkillNodes||[]).concat(newNodes);
    App.ui.skillSport=slug;
    saveState(); closeSheet(); toast('Skillfa elkészült 🎉'); renderApp();
  }catch(e){
    console.error('sport generation failed',e);
    closeSheet(); toast('Nem sikerült generálni, próbáld újra');
  }
}

function drawFreqChart(canvas){
  if(!canvas) return;
  const ctx = setupCanvas(canvas);
  const w=canvas._cssW,h=canvas._cssH;
  const weeks=[...Array(8)].map((_,i)=>7-i).reverse();
  const counts = weeks.map(wAgo=>{
    const from = Date.now()-wAgo*7*86400000, to = from+7*86400000;
    return App.state.workouts.filter(w=>{const t=new Date(w.date).getTime();return t>=from&&t<to;}).length;
  });
  const max = Math.max(1,...counts);
  const bw = w/counts.length;
  ctx.clearRect(0,0,w,h);
  counts.forEach((v,i)=>{
    const bh = (v/max)*(h-18);
    ctx.fillStyle = i===counts.length-1? '#D9A441':'#3E5A4E';
    ctx.beginPath();
    roundRectPath(ctx, i*bw+bw*0.22, h-bh-16, bw*0.56, bh, 4);
    ctx.fill();
    ctx.fillStyle='#93A79A'; ctx.font='10px IBM Plex Mono'; ctx.textAlign='center';
    ctx.fillText(v, i*bw+bw*0.5, h-bh-20<10?12:h-bh-20);
  });
}
function drawWeightChart(canvas){
  if(!canvas) return;
  const ctx = setupCanvas(canvas);
  const w=canvas._cssW,h=canvas._cssH;
  ctx.clearRect(0,0,w,h);
  const log = App.state.weightLog.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-14);
  if(log.length<2){ ctx.fillStyle='#6C8177'; ctx.font='12px Inter'; ctx.textAlign='center'; ctx.fillText('Legalább 2 mérés kell a trendhez', w/2, h/2); return; }
  const vals = log.map(l=>l.kg);
  const min=Math.min(...vals)-0.5, max=Math.max(...vals)+0.5;
  const stepX = w/(vals.length-1);
  ctx.beginPath();
  vals.forEach((v,i)=>{
    const x=i*stepX, y=h-16-((v-min)/(max-min))*(h-30);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle='#5C8F62'; ctx.lineWidth=2; ctx.stroke();
  vals.forEach((v,i)=>{
    const x=i*stepX, y=h-16-((v-min)/(max-min))*(h-30);
    ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fillStyle='#D9A441'; ctx.fill();
  });
  ctx.fillStyle='#93A79A'; ctx.font='10px IBM Plex Mono'; ctx.textAlign='left';
  ctx.fillText(vals[0]+' kg', 0, h-2);
  ctx.textAlign='right';
  ctx.fillText(vals[vals.length-1]+' kg', w, h-2);
}
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function setupCanvas(canvas){
  const cssW = canvas.parentElement.clientWidth;
  const cssH = parseInt(canvas.getAttribute('height'))||130;
  const dpr = window.devicePixelRatio||1;
  canvas.width = cssW*dpr; canvas.height = cssH*dpr;
  canvas.style.width=cssW+'px'; canvas.style.height=cssH+'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas._cssW=cssW; canvas._cssH=cssH;
  return ctx;
}

function testGpsDiag(){

    err=>{ App.ui.trackError=`Hiba (kód ${err.code}): ${err.message||'ismeretlen'}. 1=engedély megtagadva, 2=pozíció nem elérhető, 3=időtúllépés.`; renderTrackView(); },
    {enableHighAccuracy:true,timeout:10000}

let _trackTimer=null;
let _wakeLock=null;
let _trackDraftLastSave=0;
const TRACK_DRAFT_POINT_INTERVAL = 10; // draft-mentés minden N. GPS-ponthoz
const TRACK_DRAFT_MS_INTERVAL = 60000; // ...VAGY legfeljebb ennyi másodpercenként, amelyik előbb jön
/* Időszakos draft-mentés App.state-be (és onnan localStorage-ba, saveState()
   révén), hogy egy oldal-újratöltés / összeomlás ne vigye el a teljes,
   még el nem mentett túrát. Csak az aktuális felvétel pillanatképét tárolja;
   sikeres végleges mentéskor / elvetéskor törlődik (ld. saveJourney,
   discardTrack, stopTracking). */
function saveTrackDraft(){
  if(!App.ui.trackPoints || App.ui.trackPoints.length<2) return;
  App.state.trackDraft = { points: App.ui.trackPoints, start: App.ui.trackStart, savedAt: Date.now() };
  saveState();
}
/* A natív TrackingForegroundService (ld. Kotlin oldal, TrackingBridge.kt) a
   WebView-tól/JS-től teljesen függetlenül, zárolt kijelzőnél/háttérbe küldött
   appnál is gyűjti a GPS-pontokat, natívan eltárolva őket. Ez a függvény kérdezi
   le és üríti ki ezt a natív tárolót, és ugyanúgy fűzi az App.ui.trackPoints
   tömbhöz, mint az élő, watchPosition-ből érkező pontokat (ld. lent) - a
   projektnek jelenleg nincs külön GPS-zajszűrő rétege (shouldAcceptTrackPoint),
   ezért a natív pontok is ugyanazt a szűretlen kezelést kapják. Böngészőben/
   telepített webes verzióban window.AndroidTracking nincs jelen, ott ez no-op. */
function pullNativeTrackPoints(){
  if(typeof window.AndroidTracking==='undefined' || !window.AndroidTracking) return;
  try{
    const json = window.AndroidTracking.takePendingPointsJson();
    if(!json) return;
    const points = JSON.parse(json);
    if(!Array.isArray(points) || !points.length) return;
    for(const p of points){
      if(p && typeof p.lat==='number' && typeof p.lng==='number' && typeof p.t==='number'){
        App.ui.trackPoints.push({lat:p.lat,lng:p.lng,t:p.t});
      }
    }
    if(App.ui.trackPoints.length % TRACK_DRAFT_POINT_INTERVAL === 0){ saveTrackDraft(); _trackDraftLastSave=Date.now(); }
    renderTrackView();
  }catch(e){ console.warn('pullNativeTrackPoints hiba', e); }
}
function startTracking(resumeDraft){
  if(!navigator.geolocation){ App.ui.trackError='A böngésző/környezet nem támogatja a helymeghatározást.'; renderTrackView(); return; }
  if(resumeDraft && App.state.trackDraft && App.state.trackDraft.points && App.state.trackDraft.points.length>=2){
    App.ui.trackPoints = App.state.trackDraft.points.slice();
    App.ui.trackStart = App.state.trackDraft.start || Date.now();
  } else {
    App.ui.trackPoints=[]; App.ui.trackStart=Date.now();
    App.state.trackDraft=null; saveState();
  }
  App.ui.tracking=true; App.ui.trackError=null;
  App.ui.watchId = navigator.geolocation.watchPosition(
    pos=>{
      App.ui.trackError=null;
      App.ui.trackPoints.push({lat:pos.coords.latitude,lng:pos.coords.longitude,t:Date.now()});
      if(App.ui.trackPoints.length % TRACK_DRAFT_POINT_INTERVAL === 0){ saveTrackDraft(); _trackDraftLastSave=Date.now(); }
    },
    err=>{ App.ui.trackError=`GPS hiba (kód ${err.code}): ${err.message||'nem elérhető'}. 1=engedély megtagadva, 2=pozíció nem elérhető, 3=időtúllépés.`; renderTrackView(); },
    {enableHighAccuracy:true,maximumAge:2000,timeout:15000}
  );
  clearInterval(_trackTimer);
  _trackDraftLastSave=Date.now();
  // A natív túrakövető foreground service indítása (ld. TrackingBridge/
  // TrackingForegroundService, Kotlin oldal) - böngészőben/webes verzióban
  // window.AndroidTracking nincs jelen, ott ez no-op. Natív appban, ha a
  // helymeghatározás engedélye még nincs megadva, a natív oldal csendben
  // kihagyja az indítást (nem omlik össze) - a lenti időzítő minden
  // másodpercben újrapróbálja, tehát amint a felhasználó megadja az
  // engedélyt (a fenti watchPosition kéri ki), a következő ütésre elindul.
  if(typeof window.AndroidTracking!=='undefined' && window.AndroidTracking){
    try{ window.AndroidTracking.start(); }catch(e){}
  }
  _trackTimer=setInterval(()=>{
    if(App.ui.terkepView==='track') renderTrackView();
    if(App.ui.tracking && Date.now()-_trackDraftLastSave>=TRACK_DRAFT_MS_INTERVAL){ saveTrackDraft(); _trackDraftLastSave=Date.now(); }
    if(App.ui.tracking && typeof window.AndroidTracking!=='undefined' && window.AndroidTracking){
      try{ window.AndroidTracking.start(); }catch(e){} // idempotens újrapróbálkozás, ld. fent
      pullNativeTrackPoints();
    }
  },1000);
  if('wakeLock' in navigator){
    navigator.wakeLock.request('screen').then(wl=>{ _wakeLock=wl; }).catch(err=>{ /* nem támogatott / megtagadva – csendben figyelmen kívül hagyjuk, ez csak kijelző-ébrentartás előtérben */ });
  }
  renderTrackView();
}
function stopTracking(){
  if(App.ui.watchId!=null) navigator.geolocation.clearWatch(App.ui.watchId);
  clearInterval(_trackTimer);
  pullNativeTrackPoints(); // utolsó, még fel nem dolgozott natív pontok bevétele lezárás előtt
  if(typeof window.AndroidTracking!=='undefined' && window.AndroidTracking){
    try{ window.AndroidTracking.stop(); }catch(e){}
  }
  App.ui.tracking=false;
  if(_wakeLock){ _wakeLock.release().catch(()=>{}); _wakeLock=null; }
  if(App.ui.trackPoints.length>=2){ saveTrackDraft(); openSaveJourneySheet(); }
  else { App.ui.trackPoints=[]; App.ui.trackStart=null; App.state.trackDraft=null; saveState(); renderTrackView(); toast('Túl kevés GPS-pont a mentéshez, próbáld tovább követni a túrát.'); }
}

   Ha App.state.trackDraft egy korábbi, nem lezárt felvételt tartalmaz

function fmtElapsed(ms){ const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60; return h>0? h+':'+pad(m)+':'+pad(sec) : pad(m)+':'+pad(sec); }

function fmtDuration(min){ if(!min) return '?'; const h=Math.floor(min/60),m=Math.round(min%60); return h? h+'ó '+m+'p' : m+'p'; }

function renderRouteSvg(journeys){
  const withPts = (journeys||[]).filter(j=>j.points && j.points.length>1);
  if(!withPts.length){
    return `<div class="empty"><div class="ic">🗺️</div><div class="t">Még nincs megjeleníthető útvonal</div><div class="d">Rögzíts egy túrát a KÖVETÉS fülön.</div></div>`;
  }
  let minLat=90,maxLat=-90,minLng=180,maxLng=-180;
  withPts.forEach(j=>j.points.forEach(p=>{
    if(p.lat<minLat)minLat=p.lat; if(p.lat>maxLat)maxLat=p.lat;
    if(p.lng<minLng)minLng=p.lng; if(p.lng>maxLng)maxLng=p.lng;
  }));
  const spanLat=(maxLat-minLat)||0.004, spanLng=(maxLng-minLng)||0.004;
  minLat-=spanLat*0.12; maxLat+=spanLat*0.12; minLng-=spanLng*0.12; maxLng+=spanLng*0.12;
  const W=320,H=260;
  const proj=(p)=>[ ((p.lng-minLng)/(maxLng-minLng))*W, H-((p.lat-minLat)/(maxLat-minLat))*H ];
  const colors=['#D9A441','#4A85AC','#5C8F62','#C1432B','#93A79A'];
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;border-radius:10px;background:var(--surface-2);"><g stroke="#2C3830" stroke-width="1">`;
  for(let i=1;i<5;i++){ const gx=(W/5*i).toFixed(1); svg+=`<line x1="${gx}" y1="0" x2="${gx}" y2="${H}"/>`; }
  for(let i=1;i<4;i++){ const gy=(H/4*i).toFixed(1); svg+=`<line x1="0" y1="${gy}" x2="${W}" y2="${gy}"/>`; }
  svg += `</g>`;
  withPts.forEach((j,i)=>{
    const pts = j.points.map(proj);
    const d = pts.map((p,k)=>(k===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const col = colors[i%colors.length];
    svg += `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    svg += `<circle cx="${pts[0][0].toFixed(1)}" cy="${pts[0][1].toFixed(1)}" r="4.5" fill="${col}"/>`;
    svg += `<circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="4.5" fill="var(--ink)" stroke="${col}" stroke-width="2"/>`;
  });
  svg += `</svg>`;
  const legend = withPts.map((j,i)=>`<div class="flex gap8 center" style="margin-top:7px;"><span class="dot" style="background:${colors[i%colors.length]}"></span><span class="small">${escapeHtml(j.name)} · ${(j.distanceKm||0).toFixed(1)} km</span></div>`).join('');
  return svg + `<div style="margin-top:10px;">${legend}</div><div class="small g" style="margin-top:10px;">Saját rajzolt útvonalnézet, utcatérkép-csempék nélkül — ez mindig betölt, hálózati/CSP-korlátozástól függetlenül. Valódi utcatérkép a natív Android verzióval jön.</div>`;
}
