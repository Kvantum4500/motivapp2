function parseAiResponse(raw){
  let m = raw.match(/```json\s*([\s\S]*?)```/i);
  let jsonStr = m ? m[1] : null, cutIdx = m ? m.index : -1;
  if(!jsonStr){
    const m2 = raw.match(/(\{[\s\S]*"suggestions"[\s\S]*\})\s*$/);
    if(m2){ jsonStr = m2[1]; cutIdx = m2.index; }
  }
  if(!jsonStr) return {text:raw.trim(), suggestions:[]};
  let suggestions=[];
  try{ const parsed=JSON.parse(jsonStr); suggestions = Array.isArray(parsed.suggestions) ? parsed.suggestions : []; }
  catch(e){ console.error('suggestion JSON parse failed', e, jsonStr); }
  return {text: raw.slice(0,cutIdx).trim(), suggestions};
}
/* ===== HELYI AI PARANCSOK =====
   Az egyszerű adatbeviteli parancsokat nem küldjük fel az AI szolgáltatásnak.
   Így pl. a "Adj hozzá 450k Ft bevételt" akkor is működik, ha az AI kvótája
   elfogyott vagy az API átmenetileg nem elérhető.
*/
function normalizeHU(str){
  return (str||'').toLowerCase().normalize('NFD').replace(new RegExp('[\\u0300-\\u036f]','g'),'').replace(/\s+/g,' ').trim();
}
function parseHUFAmount(text){
  const s=(text||'').toLowerCase().replace(/\u00a0/g,' ');
  let m=s.match(/(\d+(?:[.,]\d+)?)\s*(k|ezer)\b/);
  if(m){
    const n=parseFloat(m[1].replace(',','.'));
    return Math.round(n*1000);
  }
  m=s.match(/(\d{1,3}(?:[ .]\d{3})+|\d{4,9})(?:\s*(?:ft|forint))?\b/);
  if(m) return parseInt(m[1].replace(/[ .]/g,''),10);
  // 1-3 jegyű összeg "k"/"ezer" toldalék NÉLKÜL (pl. "Kávé 450 ft"): itt KÖTELEZŐ a
  // "ft"/"forint" mértékegység jelenléte, különben pl. egy "3 feladat"-ból tévesen 3
  // Ft-ot olvasnánk be. A fenti 4-9 jegyű/ezres-tagolt ág marad a jelenlegi, opcionális
  // mértékegységes viselkedésén (azt a hívási helyek finance-kontextusa már gate-eli).
  m=s.match(/\b(\d{1,3})\s*(?:ft|forint)\b/);
  if(m) return parseInt(m[1],10);
  return null;
}

function parseLocalMealCommand(text){
  const raw=(text||'').trim(), n=normalizeHU(raw);
  const hints=['ettem','reggeliztem','ebedeltem','vacsoraztam','uzsonnaztam'];
  // Felszólító alak is elfogadott, pl. "Rögzíts étkezést. 1db hamburger" — itt a kulcsszó
  // nem közvetlenül az étel neve előtt áll, ezért ezt külön ág kezeli (lásd lentebb).
  const imperativeHint = /rogzit\w*\s+(?:egy\s+)?etkez\w*/.test(n) || /etkez\w*\s+rogzit\w*/.test(n);
  // Szóhatáros illesztés (\b), NEM substring-keresés: a normalizeHU kimenete csak
  // ASCII betűket/számokat tartalmaz (az ékezetek NFD-bontás után eltávolítva), így a
  // \b JS word-boundary helyesen működik rajta. Substring-keresés esetén a rövid
  // "ettem" hint hamisan illeszkedne minden "-ettem" végű igére is (pl. "fizettem"),
  // ezért itt kizárólag teljes szóra illesztünk.
  // "meg-" igekötős alakok (pl. "Megettem egy tojást") is felismerendők: a normalizált
  // szövegben az igekötő az ige TÖVÉHEZ tapad (nincs szóhatár közöttük, pl. "megettem"),
  // ezért egy opcionális "meg" előtagot engedünk meg a kezdő \b ÉS a hint-szó között — a
  // záró \b (a hint-szó UTÁN) továbbra is véd a fenti "fizettem"-szerű álpozitívok ellen.
  const hintRe = new RegExp('\\b(?:meg)?(?:' + hints.join('|') + ')\\b');
  if(!hintRe.test(n) && !imperativeHint) return null;
  const mm=raw.match(/(?:meg)?(?:ettem|reggeliztem|ebedeltem|vacsoraztam|uzsonnaztam)\s+(?:egy\s+)?(.+?)(?:[.!?]|$)/i);
  let name=null;
  if(mm){
    name=mm[1].trim();
  }else if(imperativeHint){
    // A trigger-mondat ("rögzíts étkezést" / "étkezés rögzítése") utáni rész az étel neve,
    // pl. "Rögzíts étkezést. 1db hamburger" -> "1db hamburger".
    // Megj.: sima \w nem illeszkedik az ékezetes magyar betűkre (pl. "étkezést" ->
    // \w* megállna az "é"-nél), ezért itt kibővített betűkészletet használunk, hogy
    // a teljes "étkezést" szót (és hasonló toldalékos alakokat) levágja a mintából.
    name=raw.replace(/^.*?[eé]tkez[a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ]*\s*[:.,!?-]*\s*/i,'').trim();
  }
  if(!name) return null;
  const f=normalizeHU(name);
  let kcal=500,protein=20,carbs=45,fat=22;
  if(f.includes('hamburger')||f.includes('burger')) [kcal,protein,carbs,fat]=[550,25,45,28];
  else if(f.includes('pizza')) [kcal,protein,carbs,fat]=[700,30,75,28];
  else if(f.includes('csirkemell')) [kcal,protein,carbs,fat]=[300,45,0,10];
  else if(f.includes('tojas')) [kcal,protein,carbs,fat]=[150,13,1,10];
  let mealType='snack';
  if(n.includes('reggel')) mealType='breakfast';
  else if(n.includes('ebed')) mealType='lunch';
  else if(n.includes('vacsor')) mealType='dinner';
  return {type:'meal',name,mealType,kcal,protein,carbs,fat};
}

/* parseRelativeDateHU / parseTimeHU: csak EGYÉRTELMŰ relatív dátum- és időpont-
   kifejezéseket ismernek fel (ma/holnap/holnapután, ill. "16 óra"/"16:30"/
   "délután 4"). Minden más esetben üres stringet adnak vissza — NEM találgatunk,
   a jóváhagyó kártyán a mező úgyis szerkeszthető marad (lásd renderAiChat). */
// getDay() index szerint: 0=vasárnap, 1=hétfő, ..., 6=szombat.
const WEEKDAYS_HU = ['vasarnap','hetfo','kedd','szerda','csutortok','pentek','szombat'];
function parseRelativeDateHU(normSeg){
  if(normSeg.includes('holnaputan')){ const d=new Date(); d.setDate(d.getDate()+2); return toLocalISO(d); }
  if(normSeg.includes('holnap')){ const d=new Date(); d.setDate(d.getDate()+1); return toLocalISO(d); }
  if(/\bma\b/.test(normSeg)) return todayISO();
  // Hétnapnevek (ragozott alakokkal is, pl. "hétfőn", "kedden") -> a legközelebbi
  // JÖVŐBELI előfordulásra ugrunk (1-7 nap múlva). Ha ma épp az adott nap, akkor a
  // KÖVETKEZŐ hétre (ma NEM jó találat, mert "hétfőn" nem ugyanaz mint "ma").
  // Szándékosan NEM ismerünk fel "jövő hét(en)"-t napnév nélkül -- az bizonytalan,
  // marad üres string (a mező szerkeszthető marad a jóváhagyó kártyán).
  for(let i=0;i<WEEKDAYS_HU.length;i++){
    if(new RegExp('\\b'+WEEKDAYS_HU[i]+'\\w*\\b').test(normSeg)){
      const d=new Date();
      const todayDow=d.getDay();
      let diff=(i-todayDow+7)%7;
      if(diff===0) diff=7;
      d.setDate(d.getDate()+diff);
      return toLocalISO(d);
    }
  }
  return '';
}
function parseTimeHU(normSeg){
  let m=normSeg.match(/\b(\d{1,2})[:.](\d{2})\b/);
  if(m) return pad(parseInt(m[1],10))+':'+m[2];
  m=normSeg.match(/\bdelutan\s+(\d{1,2})\b/);
  if(m){ let h=parseInt(m[1],10); if(h<12) h+=12; return pad(h)+':00'; }
  m=normSeg.match(/\b(\d{1,2})\s*ora\b/);
  if(m) return pad(parseInt(m[1],10))+':00';
  return '';
}
/* parseLocalTaskEventCommand: EGY szövegből TÖBB feladat/esemény-jelöltet is
   kigyűjt (lásd handleLocalAiCommand). A finance-ág mondatokra-bontós mintáját
   követi: a szöveget mondatokra/tagmondatokra bontjuk ('.', '!', '?' mentén), és
   minden szegmensben feladat/esemény-jelző szavakat keresünk. Egy "csak jelző"
   szegmens (pl. "Rögzíts két feladatot." vagy "Rögzíts eseményt holnapra.")
   önmagában NEM hoz létre javaslatot (nincs érdemi cím-tartalma), de kijelöli a
   módot (task/event) a rá következő, érdemi tartalmú szegmensek számára — így egy
   üzenetben több tétel is felismerhető, pl.:
   "Rögzíts két feladatot. Holnap vidd be a autót szervizbe. Pénteken hívd fel
   Pétert." -> 2 db 'task' javaslat.
   Egy "csak jelző" szegmensben talált dátum öröklődik a rá következő tartalom-
   szegmensekre, HA azoknak nincs saját dátumuk (pl. "Rögzíts eseményt holnapra.
   Fogászat, 16 óra" -> az esemény dátuma a holnapi lesz, mert a "Fogászat, 16 óra"
   szegmensnek nincs saját dátumjelölése, csak a trigger-mondatnak). */
function parseLocalTaskEventCommand(text){
  const raw=(text||'').trim();
  if(!raw) return [];
  const n=normalizeHU(raw);
  const rawSegs=raw.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);
  const normSegs=n.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);
  // Biztonsági guard: normalizeHU nem nyúl a mondatvégi '.','!','?' jelekhez, így a
  // nyers és normalizált szegmentálásnak egyeznie kell. Ha mégsem, inkább nem
  // ismerünk fel semmit, mint hogy rossz szegmenshez rendeljünk címet.
  if(!rawSegs.length || rawSegs.length!==normSegs.length) return [];

  const taskKW=['feladat','emlekeztet'];
  const eventKW=['esemeny','talalkoz'];
  function stripKnownWords(seg){
    return seg
      .replace(/\brogzit\w*\b/g,' ')
      .replace(/\bfeladat\w*\b/g,' ')
      .replace(/\bemlekeztet\w*\b/g,' ')
      .replace(/\besemeny\w*\b/g,' ')
      .replace(/\btalalkoz\w*\b/g,' ')
      .replace(/\bholnaputan\w*\b/g,' ')
      .replace(/\bholnap\w*\b/g,' ')
      .replace(/\bma\b/g,' ')
      .replace(/\bket\b|\bharom\b/g,' ')
      .replace(/\d{1,2}[:.]\d{2}\b/g,' ')
      .replace(/\bdelutan\s+\d{1,2}\b/g,' ')
      .replace(/\b\d{1,2}\s*orakor\b/g,' ')
      .replace(/\b\d{1,2}\s*ora\b/g,' ')
      .replace(/[:,\-–]/g,' ')
      .replace(/\s+/g,' ').trim();
  }
  const meta=normSegs.map((seg,i)=>{
    const hasTaskKW=taskKW.some(k=>seg.includes(k));
    const hasEventKW=eventKW.some(k=>seg.includes(k));
    const stripped=stripKnownWords(seg);
    const isTriggerOnly=(hasTaskKW||hasEventKW)&&stripped.length<3;
    const triggerMode=hasEventKW?'event':(hasTaskKW?'task':null);
    return {i,hasTaskKW,hasEventKW,isTriggerOnly,triggerMode};
  });

  let mode=null;
  if(meta.some(m=>m.hasEventKW)) mode='event';
  else if(meta.some(m=>m.hasTaskKW)) mode='task';
  if(!mode) return [];

  // BUGFIX (pozíció-alapú jelölt-eligibilitás): egy kulcsszó NÉLKÜLI, nem-trigger-only
  // szegmens csak akkor legyen jelölt-eligibilis, ha egy KORÁBBI (alacsonyabb indexű)
  // szegmens ugyanabban az üzenetben trigger-only volt ÉS a globális móddal megegyező
  // módhoz tartozott. A régi kód a globális `mode`-ot alkalmazta MINDEN nem-trigger-only
  // szegmensre, a pozíció figyelembevétele nélkül — emiatt egy, a trigger-mondat ELŐTT
  // álló, kulcsszó nélküli, múlt idejű kijelentés (pl. "Befizetett számlák: áram 17k ft,
  // Víz 5k ft. Feladat rögzítése holnapra: garázs befizetni 16k ft") tévesen jelöltté
  // vált, csak azért, mert az üzenet VALAHOL (egy KÉSŐBBI szegmensben) tartalmazott
  // feladat/esemény-jelzőt. Egy szegmens, ami MAGA tartalmaz feladat/esemény-jelző szót,
  // mindig eligibilis, a pozíciótól függetlenül (ez tartja meg a láncolt felismerést,
  // lásd a funkció-fejléc kommentjét).
  let precededByTrigger=false;
  const eligible=meta.map(m=>{
    const ownEligible=m.hasTaskKW||m.hasEventKW;
    const isEligible=ownEligible||precededByTrigger;
    if(m.isTriggerOnly && m.triggerMode===mode) precededByTrigger=true;
    return isEligible;
  });

  // Defense-in-depth: befejezett/múlt idejű kijelentésekre utaló szavak — egy ilyet
  // tartalmazó szegmens SOSE váljon task/event-jelöltté, még akkor sem, ha egyébként a
  // pozíció vagy saját kulcsszó alapján eligibilis lenne. Ez arra az esetre is véd, ha a
  // múlt idejű mondat a trigger-mondat UTÁN áll (a fenti pozíció-alapú javítás önmagában
  // csak a trigger ELŐTTI eseteket védené ki). Stílus-referencia: financeContextExclude
  // a handleLocalAiCommand-ban.
  const taskEventContextExclude=['befizetett','kifizettem','fizettem','elintez','megcsinal','elkuldtem','megvettem','elvegez','elkeszult','kesz van'];

  let inheritedDate='';
  meta.forEach(m=>{ if(m.isTriggerOnly){ const d=parseRelativeDateHU(normSegs[m.i]); if(d) inheritedDate=d; } });

  const results=[];
  meta.forEach((m,idx)=>{
    if(m.isTriggerOnly) return;
    if(!eligible[idx]) return; // sem saját kulcsszava, sem megelőző trigger-only szegmense nincs
    const normSeg=normSegs[m.i];
    if(taskEventContextExclude.some(x=>normSeg.includes(x))) return; // múlt idejű/befejezett kijelentés
    const rawSeg=rawSegs[m.i];
    const ownDate=parseRelativeDateHU(normSeg);
    const time=parseTimeHU(normSeg);
    // Megj.: sima \w NEM illeszkedik az ékezetes magyar betűkre (pl. "rögzítése" -> \w*
    // megállna az "é"-nél és "ése" beragadna a címbe), ezért itt - a parseLocalMealCommand
    // imperativeHint-jéhez hasonlóan - kibővített betűkészletet használunk a toldalékokhoz.
    const HUW='[a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ]*';
    let title=rawSeg
      .replace(new RegExp('\\brögzít'+HUW+'\\b','gi'),' ')
      .replace(new RegExp('\\bfeladat'+HUW+'\\b','gi'),' ')
      .replace(new RegExp('\\bemlékeztet'+HUW+'\\b','gi'),' ')
      .replace(new RegExp('\\besemény'+HUW+'\\b','gi'),' ')
      .replace(new RegExp('\\btalálkoz'+HUW+'\\b','gi'),' ')
      .replace(new RegExp('\\bholnapután'+HUW+'\\b','gi'),' ')
      .replace(new RegExp('\\bholnap'+HUW+'\\b','gi'),' ')
      .replace(/\bma\b/gi,' ')
      .replace(/\d{1,2}[:.]\d{2}\b/g,' ')
      .replace(/\bdélután\s+\d{1,2}(\s*órakor|\s*óra)?\b/gi,' ')
      .replace(/\b\d{1,2}\s*órakor\b/gi,' ')
      .replace(/\b\d{1,2}\s*óra\b/gi,' ')
      .replace(/^[\s,:;.\-–]+|[\s,:;.\-–]+$/g,'')
      .replace(/\s+/g,' ').trim();
    if(!title) return; // cím nélkül nem hozunk létre javaslatot
    const date=ownDate||inheritedDate||'';
    if(mode==='event'){
      const eventType=normSeg.includes('edzes')?'edzes':'esemeny';
      results.push({type:'event',title,date,time,eventType});
    }else{
      results.push({type:'task',title,due:date});
    }
  });
  return results;
}

/* ===== EGYSÉGES AI-JAVASLAT REVIEW-FLOW =====
   Korábban két párhuzamos jóváhagyó rendszer létezett: a helyi parancsokból
   (handleLocalAiCommand) érkező pendingAiActions/openAiActionConfirm sheet,
   és az AI válaszból érkező App.state.aiChat[].suggestions kártyák
   (acceptAiSuggestion/rejectAiSuggestion). Ez utóbbi maradt meg, mert
   perzisztál chat-újratöltés után is — a helyi parancsok mostantól ugyanide
   írnak, ugyanazon a szerkeszthető kártya-UI-n (lásd renderAiChat) és
   ugyanazon acceptAiSuggestion/applyAiSuggestion logikán mennek keresztül. */
function addLocalAiSuggestions(actions){
  actions = Array.isArray(actions) ? actions : [actions];
  if(!actions.length) return;
  // aiPerm.auto: bizonyos napló-jellegű bejegyzések jóváhagyás nélkül mehetnek automatikusan.
  // A 'meal' (étkezés) típus EXPLICIT ki van véve ez alól (PM-döntés): egy automatikusan
  // felismert étkezés SOSE naplózódjon jóváhagyás nélkül, mindig a szerkeszthető jóváhagyó
  // kártyán landoljon, FÜGGETLENÜL az aiPerm.auto beállítástól. Jövőben bevezetett egyéb
  // típusokra az aiPerm.auto viselkedés továbbra is érvényes maradhat.
  const autoOn = !!(App.state.aiPerm && App.state.aiPerm.auto);
  const autoTypes=[];
  const toConfirm=[], appliedMsgs=[];
  actions.forEach(a=>{
    if(autoOn && autoTypes.includes(a.type)) appliedMsgs.push(applyAiSuggestion(a));
    else toConfirm.push(a);
  });
  if(appliedMsgs.length){
    App.state.aiChat.push({role:'assistant',content:'✓ Automatikusan naplózva (Beállítások → Automatikus napló bekapcsolva):\n'+appliedMsgs.join('\n'),suggestions:[]});
  }
  if(toConfirm.length){
    App.state.aiChat.push({role:'assistant',content:'Ezt észleltem, ellenőrizd és hagyd jóvá:',suggestions:toConfirm});
  }
  saveState();
  if(appliedMsgs.length && typeof renderApp==='function') renderApp();
}

function handleLocalAiCommand(text){
  const meal=parseLocalMealCommand(text);
  if(meal){ addLocalAiSuggestions([meal]); return true; }

  const raw=(text||'').trim(), n=normalizeHU(raw);

  const cats=[
    {keys:['berleti dij','berleti dijat'],name:'Bérleti díj',icon:'🏠'},
    {keys:['aram','villany'],name:'Áram',icon:'⚡'},
    {keys:['viz'],name:'Víz',icon:'💧'},
    {keys:['futes','gaz'],name:'Fűtés',icon:'🔥'},
    {keys:['internet','net'],name:'Internet',icon:'🌐'},
    {keys:['telefon','mobil'],name:'Telefon',icon:'📱'},
    {keys:['garazs'],name:'Garázs',icon:'🚗'}
  ];
  // Bevétel-kulcsszavak: SZÓHATÁROS prefix-illesztéssel (\b...\w*\b), NEM substring-
  // kereséssel — ugyanaz a hibaosztály, amit a cats-ág ellen már kivédtünk lentebb
  // (financeContextExclude + segments). Substring-kereséssel a "fizetes" kulcsszó
  // hamisan illeszkedne a "befizetes" szóra is (pl. "Garázs befizetés 16k ft" egy
  // feladat címében), mert a "fizetes" mint substring benne van a "befizetes"-ben.
  // \b-vel ez nem illeszkedik, mert az 'e' (befiz-E-tes) és 'f' (b-E-F-izetes) között
  // nincs szóhatár. A \w* a toldalékolt alakokat fedi le (pl. "fizetést" -> "fizetest").
  const incomeKeys=['bevetel','fizetes','kereset','jovedelem'];
  const incomeRe=new RegExp('\\b(?:'+incomeKeys.join('|')+')\\w*\\b');
  // Mondatokra bontva keresünk (csak '.', '!', '?' mentén — a ':'-t szándékosan NEM
  // választjuk el, mert olyan mondatokban, mint "Feladat rögzítése holnapra: garázs
  // befizetni 16k ft", a kontextusjelző szó ("feladat", "holnapra") és a tényleges
  // kulcsszó/összeg ugyanabban a mondatban van, csak kettősponttal elválasztva —
  // ha itt is vágnánk, a jelző éppen a releváns résztől szakadna el).
  // Az a mondat, amiben feladat/emlékeztető-jellegű kontextusjelző szerepel, ki van
  // zárva a pénzügyi (finance ÉS income) felismerésből, hogy pl. egy holnapra szóló
  // feladat ("garázs befizetés 16k ft") ne kerüljön be tévesen számlaként vagy
  // bevételként.
  const financeContextExclude=['feladat','emlekeztet','holnapra','kesobb'];
  const segments=n.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);
  const actions=[],seen=new Set();
  let incomeFound=false;
  segments.forEach(seg=>{
    if(financeContextExclude.some(x=>seg.includes(x))) return;
    // Szóhatáros kulcsszó-illesztés, NEM substring — de a rövid (<=3 betűs) kulcsszavaknál
    // ("viz","gaz","net") a záró \b is kötelező (nincs \w* toldalék-engedmény), mert ezek
    // gyakran előfordulnak MÁS szavak elején is (pl. "viz"->"vizsga", "net"->"netto",
    // "gaz"->"gazda/gazdag"), és a \bviz\w*\b még ezekre a teljes, más jelentésű szóra is
    // illeszkedne (a \b csak a szó ELEJÉN véd, a végén a mohó \w* bármeddig továbbmegy).
    // A hosszabb kulcsszavaknál (pl. "aram") viszont MEGTARTJUK a \w* toldalék-illesztést,
    // mert ott gyakori és jogos a ragozott alak (pl. "aramot", "telefonom") felismerése,
    // és ütközés-kockázatuk lényegesen alacsonyabb.
    const hits=[];
    cats.forEach(c=>c.keys.forEach(k=>{
      const esc=k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const re=new RegExp('\\b'+esc+(k.length<=3?'\\b':'\\w*'),'g');
      let m;
      while((m=re.exec(seg))){ hits.push({c,k,p:m.index,len:m[0].length}); }
    }));
    hits.sort((a,b)=>a.p-b.p);
    hits.forEach(h=>{
      if(seen.has(h.c.name)) return;
      const next=hits.find(x=>x.p>h.p);
      const segment=seg.slice(h.p+h.len,next?next.p:seg.length);
      const a=parseHUFAmount(segment);
      if(a){seen.add(h.c.name);actions.push({type:'finance',name:h.c.name,icon:h.c.icon,amount:a});}
    });
    // Bevétel: az összeget a TALÁLATOT TARTALMAZÓ SZEGMENSBŐL vesszük (nem a teljes
    // nyers szövegből), ugyanúgy, ahogy a cats-ág teszi — a kulcsszó a számösszeg
    // előtt ("Bevétel 470k ft") és után is állhat ("Kaptam 300k fizetést"), ezért a
    // teljes szegmensen futtatjuk parseHUFAmount-ot, nem csak a kulcsszó utáni részen.
    if(!incomeFound && incomeRe.test(seg)){
      const a=parseHUFAmount(seg);
      if(a){incomeFound=true;actions.push({type:'income',amount:a});}
    }
  });

  // Feladat/esemény felismerés helyben, API kulcs nélkül — lásd parseLocalTaskEventCommand.
  // Egy üzenetben több tétel is felismerésre kerülhet, ezek az actions tömbhöz adódnak
  // hozzá a finance-találatok mellé, egyetlen addLocalAiSuggestions hívással.
  const taskEventActions=parseLocalTaskEventCommand(raw);
  if(taskEventActions.length) actions.push(...taskEventActions);

  if(actions.length){addLocalAiSuggestions(actions);return true;}
  return false;
}

// Re-entrancy guard: sendAiMessage async, és nincs semmi, ami megvédené ismételt/
// egymást átfedő hívás ellen (pl. Enter lenyomás + küldés gomb, mobil virtuális
// billentyűzet duplán tüzelő Enter/Go eseménye). Enélkül elméletileg ugyanaz a
// szöveg kétszer is elküldhető, két "TE" buborékot és két AI-választ eredményezve.
let _aiSending=false;
async function sendAiMessage(){
  if(_aiSending) return;
  const input=document.getElementById('ai-input');
  const text=input.value.trim();
  if(!text) return;

  _aiSending=true;
  App.state.aiChat.push({role:'user',content:text,suggestions:[]});
  input.value='';
  saveState();
  renderAiChat();
  showAiTyping(true);

  try{
    // Egyszerű pénzügyi/étkezési/feladat/esemény adatbevitel helyben működik, API nélkül is
    // (lásd handleLocalAiCommand / parseLocalTaskEventCommand).
    if(handleLocalAiCommand(text)) return;

    const history=App.state.aiChat.slice(-10).map(m=>({role:m.role,content:m.content}));
    const data = await callMotivAI({
      model:'claude-sonnet-4-6',
      max_tokens:1000,
      system:AI_SYSTEM+'\n\nAktuális kontextus:\n'+buildAiContext(),
      messages:history
    });

    const raw=(data.content||[]).map(b=>b.text||'').join('\n') || 'Nem sikerült választ kapni, próbáld újra.';
    const parsed=parseAiResponse(raw);
    App.state.aiChat.push({role:'assistant',content:parsed.text,suggestions:parsed.suggestions});
  }catch(e){
    let msg=e&&e.message?e.message:'ismeretlen hiba';
    if(/Failed to fetch|NetworkError|Load failed/i.test(msg)){
      msg='A MotivAI szerver nem érhető el. Az egyszerű pénzügyi parancsok (például „Adj hozzá 450k Ft bevételt”) API nélkül is működnek.';
    }else if(/API kulcs/i.test(msg)){
      msg='Ehhez az üzenethez API kulcs szükséges (ezt kérte a rendszer, de nem adtál meg érvényeset) — ezt a szöveget nem sikerült helyben felismerni. Sok feladat/esemény/pénzügyi/étkezési parancs (például „Holnap 16 órakor fogorvos”, „Bevétel 470k ft” vagy „Ettem egy hamburgert”) API kulcs nélkül, helyben is működik.';
    }
    App.state.aiChat.push({role:'assistant',content:'⚠️ '+msg,suggestions:[]});
  }finally{
    _aiSending=false;
    saveState();
    showAiTyping(false);
    renderAiChat();
  }
}
function renderAiChat(){
  const log = document.getElementById('ai-log'); if(!log) return;
  if(!App.state.aiChat.length){
    log.innerHTML = `<div class="empty"><div class="ic">🤖</div><div class="t">Szia, én vagyok a MotivAI</div><div class="d">Kérdezd meg pl.: „Mit érdemes ma edzenem?”</div></div>`;
    return;
  }
  log.innerHTML = App.state.aiChat.map((m,i)=>`
    <div class="bubble ${m.role==='user'?'user':'ai'}">
      <div class="role">${m.role==='user'?'TE':'MOTIVAI'}</div>
      ${escapeHtml(m.content).replace(/\n/g,'<br>')}
      ${(m.suggestions&&m.suggestions.length)? m.suggestions.map((s,si)=>`
        <div class="suggestcard">
          <div class="st">🟡 Javaslat — megerősítést kér</div>
          <div style="font-size:13.5px;font-weight:600;">${s.type==='finance'? escapeHtml(s.name)+' — kötelező kiadás' : s.type==='activity_template'? (DAY_TYPE_SHORT[s.dayType]||s.dayType)+' napok mintája: '+escapeHtml((s.activity||{}).label||'') : s.type==='income'? 'Havi bevétel beállítása' : s.type==='schedule_pattern'? 'Műszakrend beállítása ('+(s.pattern||[]).length+' napos ciklus)' : s.type==='meal'? '🍽️ '+escapeHtml(s.name||'Étkezés') : s.type==='task'? '📋 '+escapeHtml(s.title||'Feladat') : s.type==='event'? '🗓️ '+escapeHtml(s.title||'Esemény') : escapeHtml(s.title||'')}</div>
          ${s.type==='schedule_pattern'? `<div class="small muted" style="margin-top:2px;">Kezdés: ${s.startDate||'?'} — ${(s.pattern||[]).map(p=>DAY_TYPE_SHORT[p]||p).join(' → ')}</div>`:''}
          ${s.type==='activity_template'? `<div class="small muted" style="margin-top:2px;">${(s.activity||{}).durationMin||0} perc · 💪${(s.activity||{}).physical||'?'} 🧠${(s.activity||{}).mental||'?'} · energia ${(s.activity||{}).energyBefore||'?'}→${(s.activity||{}).energyAfter||'?'} — jövőbeli hasonló napokra is felkerül</div>`:''}
          ${(s.type==='finance'||s.type==='income')? `<label class="small muted" style="display:block;margin-top:6px;">Összeg (Ft)<input id="ai-sugg-amount-${i}-${si}" type="number" value="${Number(s.amount)||0}" style="width:100%;margin-top:2px;"></label>` : ''}
          ${s.type==='meal'? `<div class="small muted" style="margin-top:2px;">Helyesek ezek az értékek? Ellenőrizd, és írd át, ha nem.</div>
            <label class="small muted" style="display:block;margin-top:6px;">Kalória (kcal)<input id="ai-sugg-kcal-${i}-${si}" type="number" value="${Number(s.kcal)||0}" style="width:100%;margin-top:2px;"></label>
            <label class="small muted" style="display:block;margin-top:6px;">Fehérje (g)<input id="ai-sugg-protein-${i}-${si}" type="number" value="${Number(s.protein)||0}" style="width:100%;margin-top:2px;"></label>
            <label class="small muted" style="display:block;margin-top:6px;">Szénhidrát (g)<input id="ai-sugg-carbs-${i}-${si}" type="number" value="${Number(s.carbs)||0}" style="width:100%;margin-top:2px;"></label>
            <label class="small muted" style="display:block;margin-top:6px;">Zsír (g)<input id="ai-sugg-fat-${i}-${si}" type="number" value="${Number(s.fat)||0}" style="width:100%;margin-top:2px;"></label>` : ''}
          ${s.type==='task'? `<div class="small muted" style="margin-top:2px;">Helyben felismert feladat — jóváhagyás előtt módosítható</div>
            <label class="small muted" style="display:block;margin-top:6px;">Cím<input id="ai-sugg-title-${i}-${si}" type="text" value="${escapeHtml(s.title||'')}" style="width:100%;margin-top:2px;"></label>
            <label class="small muted" style="display:block;margin-top:6px;">Határidő<input id="ai-sugg-date-${i}-${si}" type="date" value="${s.due||''}" style="width:100%;margin-top:2px;"></label>` : ''}
          ${s.type==='event'? `<div class="small muted" style="margin-top:2px;">Helyben felismert esemény — jóváhagyás előtt módosítható</div>
            <label class="small muted" style="display:block;margin-top:6px;">Cím<input id="ai-sugg-title-${i}-${si}" type="text" value="${escapeHtml(s.title||'')}" style="width:100%;margin-top:2px;"></label>
            <label class="small muted" style="display:block;margin-top:6px;">Dátum<input id="ai-sugg-date-${i}-${si}" type="date" value="${s.date||''}" style="width:100%;margin-top:2px;"></label>
            <label class="small muted" style="display:block;margin-top:6px;">Időpont<input id="ai-sugg-time-${i}-${si}" type="time" value="${s.time||''}" style="width:100%;margin-top:2px;"></label>` : ''}
          <div class="flex gap8" style="margin-top:8px;">
            <button class="btn btn-primary btn-sm" onclick="acceptAiSuggestion(${i},${si})">Elfogadom ✓</button>
            <button class="btn btn-ghost btn-sm" onclick="rejectAiSuggestion(${i},${si})">Mégse</button>
          </div>
        </div>`).join('') : ''}
    </div>`).join('');
  log.scrollTop = log.scrollHeight;
}
function normFin(str){ return (str||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,''); }
function matchActivityTypeId(label){
  const hit = ACTIVITY_TYPES.find(t=>normFin(t.name)===normFin(label));
  return hit ? hit.id : 'egyeb';
}
function applyDayTypeTemplateForward(dayType, days){
  const tpl = App.state.dayTypeTemplates[dayType]; if(!tpl) return 0;
  let count=0;
  for(let i=1;i<=days;i++){
    const d=new Date(); d.setDate(d.getDate()+i);
    const iso=toLocalISO(d);
    if(dayTypeFor(iso)!==dayType) continue;
    if(App.state.activities.some(a=>a.date===iso && a.type===tpl.type)) continue;
    App.state.activities.push(Object.assign({},tpl,{id:uid(),date:iso,note:'',autoTemplate:true}));
    count++;
  }
  return count;
}
/* applyAiSuggestion: a tényleges állapotmódosítás egy jóváhagyott javaslatra.
   Ezt hívja mind az AI-válaszból, mind a helyi parancsból (handleLocalAiCommand
   -> addLocalAiSuggestions) származó javaslatok elfogadása — lásd az egységes
   review-flow megjegyzést handleLocalAiCommand előtt. Visszaadja a toast-üzenetet. */
function applyAiSuggestion(s){
  if(s.type==='finance'){
    App.state.finance = App.state.finance || defaultState().finance;
    App.state.finance.mandatory = Array.isArray(App.state.finance.mandatory) ? App.state.finance.mandatory : [];
    const target = normFin(s.name);
    let item = App.state.finance.mandatory.find(x=>normFin(x.name)===target)
      || App.state.finance.mandatory.find(x=>normFin(x.name).includes(target)||target.includes(normFin(x.name)));
    if(!item){ item={id:uid(),name:s.name,icon:s.icon||'💳',amount:0,type:'valtozo'}; App.state.finance.mandatory.push(item); }
    item.amount = Number(s.amount)||0;
    return item.name+': '+item.amount.toLocaleString('hu-HU')+' Ft mentve a Pénzügyekbe ✓';
  }
  if(s.type==='activity_template'){
    const validTypes=['nappal','ejszaka','pihen','szabi','egyeb'];
    if(!validTypes.includes(s.dayType) || !s.activity) return 'Nem sikerült értelmezni a mintát';
    const a=s.activity;
    const typeId = matchActivityTypeId(a.label);
    const tpl = {type:typeId, label:a.label||'Aktivitás', icon:a.icon||(ACTIVITY_TYPES.find(t=>t.id===typeId)||{}).icon||'⭐',
      durationMin:parseInt(a.durationMin)||0, physical:parseInt(a.physical)||5, mental:parseInt(a.mental)||5,
      experience:parseInt(a.experience)||5, energyBefore:parseInt(a.energyBefore)||60, energyAfter:parseInt(a.energyAfter)||50};
    App.state.dayTypeTemplates[s.dayType] = tpl;
    const applied = applyDayTypeTemplateForward(s.dayType, 60);
    return 'Minta mentve · '+applied+' jövőbeli '+(DAY_TYPE_SHORT[s.dayType]||s.dayType)+' napra felkerült ✓';
  }
  if(s.type==='income'){
    App.state.finance = App.state.finance || defaultState().finance;
    App.state.finance.monthlyIncome = Number(s.amount)||0;
    return 'Havi bevétel frissítve: '+App.state.finance.monthlyIncome.toLocaleString('hu-HU')+' Ft ✓';
  }
  if(s.type==='schedule_pattern'){
    const validTypes=['nappal','ejszaka','pihen','szabi','egyeb'];
    if(!Array.isArray(s.pattern) || !s.pattern.length || !s.pattern.every(p=>validTypes.includes(p)) || !s.startDate){
      return 'Nem sikerült értelmezni a műszakrendet';
    }
    App.state.schedule.pattern = s.pattern;
    App.state.schedule.startDate = s.startDate;
    return 'Műszakrend beállítva ('+s.pattern.length+' napos ciklus) ✓';
  }
  if(s.type==='meal'){
    // App.state.nutrition.log a valódi étkezésnapló (lásd saveMeal / renderNutNap),
    // 'meal' kulccsal — NEM egy külön 'meals' tömb 'name' kulccsal.
    App.state.nutrition = App.state.nutrition || {targets:{kcal:0,protein:0,carbs:0,fat:0},log:[]};
    App.state.nutrition.log = Array.isArray(App.state.nutrition.log) ? App.state.nutrition.log : [];
    App.state.nutrition.log.push({id:uid(),date:todayISO(),meal:s.name,
      kcal:Number(s.kcal)||0,protein:Number(s.protein)||0,carbs:Number(s.carbs)||0,fat:Number(s.fat)||0});
    return '🍽️ '+(s.name||'Étkezés')+' naplózva ('+(Number(s.kcal)||0)+' kcal) ✓';
  }
  if(s.type==='task'){
    // Ugyanaz a mezőkészlet, mint a manuális "Új feladat" sheet (saveNewTask) —
    // due lehet üres string is, ha a szövegből nem volt egyértelmű dátum
    // (lásd parseLocalTaskEventCommand), a felhasználó a naptárban utólag beállíthatja.
    App.state.tasks.push({id:uid(),title:s.title,due:s.due||'',priority:'med',type:'checkbox',done:false,progress:0});
    return '📋 '+(s.title||'Feladat')+' hozzáadva'+(s.due?' ('+fmtDateHu(s.due)+')':'')+' ✓';
  }
  if(s.type==='event'){
    // Ugyanaz a mezőkészlet, mint a manuális "Új esemény" sheet (saveNewEvent, lásd
    // App.state.events.push) — date lehet üres, ha a szövegből nem volt egyértelmű
    // dátum, ekkor a mai napra kerül (a naptárban utólag áthelyezhető).
    App.state.events.push({id:uid(),date:s.date||todayISO(),title:s.title,time:s.time||'',type:s.eventType||'esemeny'});
    return '🗓️ '+(s.title||'Esemény')+' hozzáadva'+(s.date?' ('+fmtDateHu(s.date)+(s.time?', '+s.time:'')+')':'')+' ✓';
  }
  // Ismeretlen javaslat-típus: NEM mentünk semmit "találgatva" (korábban minden fel
  // nem ismert type itt hibásan feladatként mentődött, ami 'event' javaslatra téves
  // volt) — inkább jelezzük, hogy nem sikerült feldolgozni.
  return 'Nem sikerült feldolgozni a javaslatot (ismeretlen típus) ✗';
}
function acceptAiSuggestion(mi,si){
  const s = App.state.aiChat[mi].suggestions[si];
  // Szerkeszthető mezők beolvasása a kártyáról jóváhagyás előtt (lásd renderAiChat).
  if(s.type==='finance' || s.type==='income'){
    const el = document.getElementById('ai-sugg-amount-'+mi+'-'+si);
    if(el) s.amount = Number(el.value)||0;
  } else if(s.type==='meal'){
    const kcalEl=document.getElementById('ai-sugg-kcal-'+mi+'-'+si);
    const proteinEl=document.getElementById('ai-sugg-protein-'+mi+'-'+si);
    const carbsEl=document.getElementById('ai-sugg-carbs-'+mi+'-'+si);
    const fatEl=document.getElementById('ai-sugg-fat-'+mi+'-'+si);
    if(kcalEl) s.kcal=Number(kcalEl.value)||0;
    if(proteinEl) s.protein=Number(proteinEl.value)||0;
    if(carbsEl) s.carbs=Number(carbsEl.value)||0;
    if(fatEl) s.fat=Number(fatEl.value)||0;
  } else if(s.type==='task'){
    const titleEl=document.getElementById('ai-sugg-title-'+mi+'-'+si);
    const dueEl=document.getElementById('ai-sugg-date-'+mi+'-'+si);
    if(titleEl && titleEl.value.trim()) s.title=titleEl.value.trim();
    if(dueEl) s.due=dueEl.value||'';
  } else if(s.type==='event'){
    const titleEl=document.getElementById('ai-sugg-title-'+mi+'-'+si);
    const dateEl=document.getElementById('ai-sugg-date-'+mi+'-'+si);
    const timeEl=document.getElementById('ai-sugg-time-'+mi+'-'+si);
    if(titleEl && titleEl.value.trim()) s.title=titleEl.value.trim();
    if(dateEl) s.date=dateEl.value||'';
    if(timeEl) s.time=timeEl.value||'';
  }
  const msg = applyAiSuggestion(s);
  toast(msg);
  App.state.aiChat[mi].suggestions.splice(si,1);
  saveState(); renderAiChat(); renderApp();
}
function rejectAiSuggestion(mi,si){ App.state.aiChat[mi].suggestions.splice(si,1); saveState(); renderAiChat(); }

function renderExpenseDistribution(f){
  const items=[...f.mandatory.map(x=>({name:x.name,icon:x.icon,val:x.amount||0})),
    ...f.discretionary.map(x=>({name:x.name,icon:x.icon,val:x.spent||0})),

    <span style="font-size:14px;width:18px;">${i.icon||'•'}</span>

    <span class="mono small" style="width:64px;text-align:right;flex-shrink:0;">${i.val.toLocaleString('hu-HU')} Ft</span>
  </div>`).join('');
}
function drawDonutChart(canvas,segments,centerLabel,centerValue){
  const ctx=setupCanvas(canvas), w=canvas._cssW, h=canvas._cssH;
  ctx.clearRect(0,0,w,h);
  const cx=w/2, cy=h/2, r=Math.min(w,h)/2-6, rInner=r*0.62;
  const total=segments.reduce((s,x)=>s+Math.max(0,x.value),0)||1;
  let start=-Math.PI/2;
  segments.forEach(seg=>{
    const angle=(Math.max(0,seg.value)/total)*Math.PI*2;
    if(angle<=0.001) return;
    ctx.beginPath(); ctx.arc(cx,cy,r,start,start+angle); ctx.arc(cx,cy,rInner,start+angle,start,true); ctx.closePath();
    ctx.fillStyle=seg.color; ctx.fill();
    start+=angle;
  });
  ctx.fillStyle='#93A79A'; ctx.font='10px IBM Plex Mono'; ctx.textAlign='center';
  ctx.fillText(centerLabel, cx, cy-4);
  ctx.fillStyle='#EDE9DD'; ctx.font='bold 14px IBM Plex Mono';
  ctx.fillText(centerValue, cx, cy+14);
}

function renderNutHonap(c){
  const ref=new Date(App.ui.nutRef+'T00:00:00');
  const year=ref.getFullYear(), month=ref.getMonth();

  const daysInMonth=new Date(year,month+1,0).getDate();
  const n=App.state.nutrition;
  let totals=[], loggedDays=0, sum=0;
  for(let d=1;d<=daysInMonth;d++){

  `;

function drawKcalBars(canvas,labels,values,target,dense){
  const ctx=setupCanvas(canvas), w=canvas._cssW, h=canvas._cssH;
  ctx.clearRect(0,0,w,h);
  const max=Math.max(target||0,...values,1);
  const bw=w/values.length;
  if(target){
    const ty=h-16-(target/max)*(h-26);
    ctx.strokeStyle='#D9A441'; ctx.setLineDash([4,3]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,ty); ctx.lineTo(w,ty); ctx.stroke(); ctx.setLineDash([]);
  }
  values.forEach((v,i)=>{
    const bh=(v/max)*(h-26);
    ctx.fillStyle = v>0? '#4A85AC':'#242F29';
    roundRectPath(ctx, i*bw+bw*(dense?0.15:0.22), h-bh-16, bw*(dense?0.7:0.56), Math.max(bh,1), dense?1:4);
    ctx.fill();
    if(!dense){ ctx.fillStyle='#93A79A'; ctx.font='8px IBM Plex Mono'; ctx.textAlign='center'; ctx.fillText(labels[i]||'', i*bw+bw*0.5, h-6); }
  });
}

function buildExportPayload(){
  /* schemaVersion/exportedAt: csak kiegészítő metaadat, az applyImportedJson()
     alapját adó defaultState()-re épülő betöltés ismeretlen mezőként
     figyelmen kívül hagyja őket, így a formátum visszafelé kompatibilis
     marad. Célja: egy jövőbeli (pl. APK-) verzió biztosan azonosítani
     tudja, milyen állapotból jött a mentés. */
  return Object.assign({schemaVersion:APP_VERSION, exportedAt:new Date().toISOString()}, App.state);
}
function exportData(){
  const payload = buildExportPayload();
  const json = JSON.stringify(payload,null,2);
  const filename = 'motivapp-mentes-'+todayISO()+'.json';
  /* A natív Android WebView nem kezeli le a lenti <a download> blob-linket (nincs
     beépített letöltés-támogatása) - ott a natív AndroidBackup hidat használjuk,
     ami a rendszer "Mentés másként" ablakán keresztül tényleg fájlba írja.
     Böngészőben/telepített webes verzióban window.AndroidBackup nincs jelen, ott
     marad a lenti, eddig is működő blob-alapú letöltés. */
  if(typeof window.AndroidBackup!=='undefined' && window.AndroidBackup){
    try{ window.AndroidBackup.exportJson(json, filename); return; }
    catch(e){ toast('Hiba az exportálás natív indításakor.'); return; }
  }
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
}
/* applyImportedJson: a betöltött fájl szövegéből a jelenlegi App.state-et
   építi fel (parse + a defaultState()-re épülő merge + a régi/hiányzó
   mezők pótlása). A klasszikus <input type=file> alapú importData()/
   confirmImportData() párost ÉS az új, File System Access API-s
   betöltési útvonalakat (confirmImportFromHandle()/pickAnotherFileForImport())
   is ez szolgálja ki, hogy a merge-logika egy helyen éljen. Hibás fájl
   esetén dob — a hívó felel a toast/closeSheet kezeléséért. */
function applyImportedJson(text){
  const parsed = JSON.parse(text);
  if(!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('invalid root');
  const d = defaultState();
  const next = Object.assign(d, parsed);
  /* Mélyebb ellenőrzés/pótlás a loadState() mintája alapján, kiterjesztve */
  if(!next.finance || typeof next.finance !== 'object' || !Array.isArray(next.finance.mandatory)){
    const oldIncome = (next.finance && next.finance.monthlyIncome) || 0;
    next.finance = d.finance;
    next.finance.monthlyIncome = oldIncome;
  }
  if(!Array.isArray(next.finance.discretionary)) next.finance.discretionary = d.finance.discretionary;
  if(!Array.isArray(next.finance.savings)) next.finance.savings = d.finance.savings;
  if(!Array.isArray(next.finance.foodOrders)) next.finance.foodOrders = d.finance.foodOrders;
  for(const k of ['tasks','events','workouts','weightLog','healthLog','journeys','journal','aiChat']){
    if(!Array.isArray(next[k])) next[k] = d[k];
  }
  if(!next.skills || typeof next.skills !== 'object') next.skills = {};
  if(!next.aiPerm || typeof next.aiPerm !== 'object') next.aiPerm = d.aiPerm;
  if(!next.healthConnect || typeof next.healthConnect !== 'object') next.healthConnect = d.healthConnect;
  if(!next.nutrition || typeof next.nutrition !== 'object'){
    next.nutrition = d.nutrition;
  } else {
    if(!next.nutrition.targets || typeof next.nutrition.targets !== 'object') next.nutrition.targets = d.nutrition.targets;
    if(!Array.isArray(next.nutrition.log)) next.nutrition.log = d.nutrition.log;
  }
  App.state = next;
  saveState();
}

/* ---- Mentés/betöltés fájlba (File System Access API, progresszív ráépülés) ----
   saveToFile(): ha van elmentett, írható handle -> közvetlenül ír bele
   (nincs fájlválasztó dialógus). Ha nincs handle, a permission nem
   adható meg, vagy az írás elszáll (pl. a fájlt időközben törölték) ->
   showSaveFilePicker()-rel kér új célfájlt, és azt jegyzi meg jövőre.
   Ha a File System Access API egyáltalán nem elérhető (pl. sok
   Android/TWA Chrome build), vagy bármi más okból elszáll a fenti (a
   felhasználó általi dialógus-megszakítás kivételével) -> visszaesik a
   megszokott exportData() letöltésre. A háromféle kimenetet (közvetlen
   írás / letöltéses fallback / sima letöltés FS Access nélkül) külön
   toast szöveg jelzi, hogy a felhasználó lássa, mi történt valójában. */
async function saveToFile(){
  if(hasFSAccess){
    let handle = null;
    try{ handle = await getStoredHandle(); }catch(e){ handle = null; }
    let granted = false;
    if(handle){
      try{
        let perm = await handle.queryPermission({mode:'readwrite'});
        if(perm !== 'granted') perm = await handle.requestPermission({mode:'readwrite'});
        granted = (perm === 'granted');
      }catch(e){ granted = false; }
    }
    if(handle && granted){
      try{
        const payload = buildExportPayload();
        const w = await handle.createWritable();
        await w.write(JSON.stringify(payload,null,2));
        await w.close();
        markBackupSaved('Mentve');
        return;
      }catch(e){ /* pl. a fájlt időközben törölték -> essünk vissza a választóra alább */ }
    }
    try{
      const newHandle = await window.showSaveFilePicker({suggestedName:'motivapp-mentes.json', types:[{description:'MotivApp mentés', accept:{'application/json':['.json']}}]});
      const payload = buildExportPayload();
      const w = await newHandle.createWritable();
      await w.write(JSON.stringify(payload,null,2));
      await w.close();
      await setStoredHandle(newHandle);
      markBackupSaved('Mentve');
    }catch(e){
      if(e && e.name === 'AbortError') return; // a felhasználó bezárta a fájlválasztót — nincs teendő
      exportData();
      markBackupSaved('Nem sikerült közvetlenül menteni — letöltés indult helyette');
    }
    return;
  }
  exportData();
  markBackupSaved('Exportálva');
}

  App.state.lastBackupAt = new Date().toISOString();
  saveState();

  if(line) line.outerHTML = `<div id="backup-status-line">${backupStatusLineHtml()}</div>`;
}

  }

/* loadFromFile(): ha van elmentett, olvasható handle -> kis menüt ajánl fel
   (gyors betöltés a mentett fájlból, vagy másik fájl választása — mindkettő
   a megszokott "Ez felülírja..." megerősítő sheeten megy át, mielőtt az
   adatok tényleg felülíródnának). Ha nincs használható handle, de van File
   System Access API -> egyből natív fájlválasztót nyit (és megjegyzi az
   így választott fájlt jövőre). Ha nincs File System Access API -> a
   megszokott <input type=file> alapú folyamat fut, változatlanul. */
let _pendingImportHandle = null;
async function loadFromFile(){
  if(hasFSAccess){
    let handle = null;
    try{ handle = await getStoredHandle(); }catch(e){ handle = null; }
    let canReadDirect = false;
    if(handle){
      try{
        let perm = await handle.queryPermission({mode:'read'});
        if(perm !== 'granted') perm = await handle.requestPermission({mode:'read'});
        canReadDirect = (perm === 'granted');
      }catch(e){ canReadDirect = false; }
    }
    if(handle && canReadDirect){
      _pendingImportHandle = handle;
      openSheet(`<div class="sheet-head"><div class="sheet-title">Betöltés</div><button class="iconbtn" onclick="closeSheet()">✕</button></div>
        <div class="card" style="padding:2px 16px;">
          <div class="menurow" role="button" tabindex="0" onclick="confirmImportFromHandle()" onkeydown="kbActivate(event,()=>confirmImportFromHandle())"><span class="ic">📂</span><span class="lb">Betöltés a mentett fájlból</span></div>
          <div class="menurow" role="button" tabindex="0" onclick="pickAnotherFileForImport()" onkeydown="kbActivate(event,()=>pickAnotherFileForImport())"><span class="ic">📁</span><span class="lb">Másik fájl kiválasztása…</span></div>
        </div>`);
      return;
    }
    await pickAnotherFileForImport();
    return;
  }
  document.getElementById('import-file').click();
}
function confirmImportFromHandle(){
  if(!_pendingImportHandle){ closeSheet(); return; }
  openSheet(importConfirmSheetHtml('applyImportFromHandle'));
}
async function pickAnotherFileForImport(){
  closeSheet();
  if(!hasFSAccess){ document.getElementById('import-file').click(); return; }
  try{
    const [handle] = await window.showOpenFilePicker({types:[{description:'MotivApp mentés', accept:{'application/json':['.json']}}]});
    _pendingImportHandle = handle;
    await setStoredHandle(handle); // ez lesz a jövőbeli mentések/betöltések alapértelmezett célfájlja is
    openSheet(importConfirmSheetHtml('applyImportFromHandle'));
  }catch(e){
    if(e && e.name === 'AbortError') return; // a felhasználó bezárta a fájlválasztót — nincs teendő
    document.getElementById('import-file').click();
  }
}
async function applyImportFromHandle(){
  const handle = _pendingImportHandle;
  _pendingImportHandle = null;
  if(!handle){ closeSheet(); return; }
  try{
    const text = await (await handle.getFile()).text();
    applyImportedJson(text);
    closeSheet(); toast('Betöltve'); renderApp();
  }catch(err){ closeSheet(); toast('Hibás fájl'); }
}

}

/* ================= Health Connect natív híd (window.AndroidHealth) =================
   A natív Android WebView app (MainWebViewActivity.kt) betölti a window.AndroidHealth
   objektumot a WebView-ba, ha a lap natív alkalmazásban fut. Böngészőben / telepített
   webes (TWA) verzióban window.AndroidHealth marad undefined – ez a normális, elvárt
   eset, mindenhol ellenőrizve van, nem dob kivételt.
   Interfész-szerződés (a natív oldal, HealthConnectBridge.kt, ehhez illeszkedik, NE
   változtasd egyoldalúan):
     window.AndroidHealth.isAvailable()        -> SZINKRON boolean (van-e Health Connect a készüléken)
     window.AndroidHealth.requestPermissions() -> ASZINKRON, eredmény window.onAndroidHealthResult-on jön
     window.AndroidHealth.syncToday()          -> ASZINKRON, eredmény window.onAndroidHealthResult-on jön
     window.AndroidHealth.getPendingBackgroundResult() -> SZINKRON, a natív WorkManager-worker
       (HealthSyncWorker) által háttérben már lekért, még fel nem dolgozott eredmény JSON
       stringje, vagy null/üres string, ha nincs ilyen
   A natív oldal MINDIG window.onAndroidHealthResult(payload) hívásával válaszol:
     {type:'availability'|'permissions'|'data'|'error', available, granted, message,
      steps, sleepH, pulse, distanceKm, floorsClimbed, caloriesBurned, exerciseMin, weightKg}
   Minden mező opcionális – ha egy adattípusra nincs engedély, vagy a natív oldal nem
   tudta lekérni, egyszerűen hiányzik a payloadból.
   A lépés/alvás/pulzus/táv/szint/kalória/edzésidő UGYANABBA az App.state.healthLog
   bejegyzésbe kerül, amit a kézi quickLogSheet/saveQuickLog is használ (ld. ~1050. sor
   körül), így a "Ma" nézet Gyors napló kártyái pontosan úgy jelenítik meg őket, mintha
   kézzel írták volna be. A testsúly (weightKg) ehelyett a meglévő App.state.weightLog-ba
   kerül (ugyanaz a {date,kg} alak, mint a kézi testsúly-rögzítésnél). A kézi bevitel
   emiatt teljesen érintetlen és önmagában (natív híd/Health Connect nélkül, böngészőben
   is) működőképes marad. */
function androidHealthAvailable(){
  return typeof window!=='undefined' && typeof window.AndroidHealth!=='undefined' && !!window.AndroidHealth;
}
function syncHealthConnect(){
  if(!androidHealthAvailable()){
    toast('Ez a funkció csak a natív alkalmazásban érhető el.');
    return;
  }
  let available = false;
  try{ available = !!window.AndroidHealth.isAvailable(); }
  catch(e){ toast('Hiba a Health Connect elérhetőségének ellenőrzésekor.'); return; }
  if(!available){
    toast('Nincs telepítve Health Connect ezen a készüléken.');
    return;
  }
  try{ window.AndroidHealth.requestPermissions(); }
  catch(e){ toast('Hiba a Health Connect engedélykérés indításakor.'); }
}
/* A natív oldal ezt hívja meg globálisan, a fenti három AndroidHealth-hívás
   eredményeként. Böngészőben ezt soha senki nem hívja meg, de a függvénynek
   attól még biztonságosan léteznie kell (nem szabad kivételt dobnia semmilyen
   hiányzó/hibás payload mezőnél). */
window.onAndroidHealthResult = function(payload){
  try{
    payload = payload || {};
    switch(payload.type){
      case 'data': {
        const iso = todayISO();
        let entry = App.state.healthLog.find(h=>h.date===iso);
        if(!entry){ entry={date:iso}; App.state.healthLog.push(entry); }
        const parts = [];
        if(payload.steps!=null && !isNaN(payload.steps)){ entry.steps = payload.steps; parts.push(payload.steps+' lépés'); }
        if(payload.sleepH!=null && !isNaN(payload.sleepH)){ entry.sleepH = payload.sleepH; parts.push(payload.sleepH+' óra alvás'); }
        if(payload.pulse!=null && !isNaN(payload.pulse)){ entry.pulse = payload.pulse; parts.push(payload.pulse+' bpm pulzus'); }
        if(payload.distanceKm!=null && !isNaN(payload.distanceKm)){ entry.distanceKm = payload.distanceKm; parts.push(payload.distanceKm.toFixed(1)+' km'); }
        if(payload.floorsClimbed!=null && !isNaN(payload.floorsClimbed)){ entry.floorsClimbed = payload.floorsClimbed; parts.push(payload.floorsClimbed+' szint'); }
        if(payload.caloriesBurned!=null && !isNaN(payload.caloriesBurned)){ entry.caloriesBurned = Math.round(payload.caloriesBurned); parts.push(Math.round(payload.caloriesBurned)+' kcal elégetve'); }
        if(payload.exerciseMin!=null && !isNaN(payload.exerciseMin)){ entry.exerciseMin = payload.exerciseMin; parts.push(payload.exerciseMin+' perc edzés'); }
        // A testsúly nem a healthLog-ba, hanem a meglévő weightLog-ba kerül – ugyanaz
        // a {date,kg} alak, mint amit a kézi "Testsúly rögzítése" funkció ír. Ha aznapra
        // már van bejegyzés (pl. kézzel is beírták), azt frissítjük, nem duplikáljuk.
        if(payload.weightKg!=null && !isNaN(payload.weightKg)){
          let w = App.state.weightLog.find(x=>x.date===iso);
          if(w){ w.kg = payload.weightKg; } else { App.state.weightLog.push({date:iso,kg:payload.weightKg}); }
          parts.push(payload.weightKg.toFixed(1)+' kg');
        }
        App.state.healthConnect.lastSyncAt = Date.now();
        saveState();
        if(typeof renderApp==='function') renderApp();
        toast(parts.length ? ('Health Connect adatok szinkronizálva: '+parts.join(', ')) : 'Health Connect szinkron megtörtént, de nem érkezett adat.');
        break;
      }
      case 'permissions':
        App.state.healthConnect.granted = !!payload.granted;
        saveState();
        if(payload.granted){
          try{ androidHealthAvailable() && window.AndroidHealth.syncToday(); }
          catch(e){ toast('Hiba a Health Connect szinkron indításakor.'); }
        } else {
          toast('A Health Connect hozzáférés nincs engedélyezve.');
        }
        break;
      case 'availability':
        if(payload.available===false){ toast('Nincs telepítve Health Connect ezen a készüléken.'); }
        break;
      case 'error':
        toast((payload.message && typeof payload.message==='string') ? ('Health Connect hiba: '+payload.message) : 'Hiba történt a Health Connect szinkron közben.');
        break;
      default:
        // Ismeretlen/hiányzó type – csendben figyelmen kívül hagyjuk, nem dobunk kivételt.
        break;
    }
  }catch(e){
    console.warn('onAndroidHealthResult feldolgozási hiba', e);
  }
};

/* ===== Health Connect automatikus időszakos szinkron (előtérben) =====
   Korábban a lépés/alvás/pulzus adat KIZÁRÓLAG kézi gombnyomásra ("Szinkronizálás
   Health Connect-ből") frissült volna. Az alábbi kód ezt egészíti ki egy csendes,
   automatikus lekérdezéssel – DE csak akkor, ha a felhasználó korábban már egyszer
   kézzel megadta az engedélyt (App.state.healthConnect.granted). Enélkül az
   automatikus hívás soha nem dob fel saját magától rendszer-engedélykérő ablakot – az
   mindig csak explicit felhasználói művelet (a fenti gomb) hatására jelenik meg.
   Ez a WebView csak előtérben fut ilyen gyakran; a natív WorkManager-worker
   (HealthSyncWorker, 15 percenként) egészíti ki ezt háttérben/becsukott app mellett. */
const HEALTH_AUTO_SYNC_INTERVAL_MS = 5*60*1000; // 5 percenként, amíg az app előtérben fut
const HEALTH_AUTO_SYNC_MIN_GAP_MS = 60*1000; // ennél sűrűbben (pl. gyors visibilitychange-váltásoknál) nem szinkronizálunk újra
let _healthAutoSyncTimer = null;
function autoSyncHealthConnect(){
  if(!androidHealthAvailable() || !App.state || !App.state.healthConnect || !App.state.healthConnect.granted) return;
  const last = App.state.healthConnect.lastSyncAt || 0;
  if(Date.now() - last < HEALTH_AUTO_SYNC_MIN_GAP_MS) return;
  try{ window.AndroidHealth.syncToday(); }
  catch(e){ /* csendben elnyeljük – automata próbálkozásnál nem akarunk hibaüzenettel zavarni, a következő időzített körben úgyis újrapróbálja */ }
}
function startHealthAutoSync(){
  if(_healthAutoSyncTimer) return;
  // Rövid késleltetés induláskor, hogy a WebView/natív híd (window.AndroidHealth)
  // biztosan betöltődjön, mielőtt az első automata szinkront megpróbálnánk.
  setTimeout(autoSyncHealthConnect, 3000);
  _healthAutoSyncTimer = setInterval(autoSyncHealthConnect, HEALTH_AUTO_SYNC_INTERVAL_MS);
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible') autoSyncHealthConnect();
});
/* A window.AndroidHealth.getPendingBackgroundResult() a natív WorkManager-worker
   (HealthSyncWorker) által, teljesen a WebView-tól/az app megnyitásától függetlenül,
   háttérben lekért, még fel nem dolgozott legutóbbi eredményt adja vissza JSON
   stringként (vagy null/üres stringet, ha nincs ilyen). A meglévő onAndroidHealthResult
   feldolgozóba küldjük, hogy a becsukott app közben natívan gyűjtött lépés/alvás/pulzus
   adat is megjelenjen, amint legközelebb megnyitod az appot – enélkül a natív
   háttér-worker eredménye elveszne. Szándékosan az init() -ből (App.state betöltése
   UTÁN) hívjuk, nem itt közvetlenül a szkript tetején – a natív oldal MINDIG szinkron
   window.onAndroidHealthResult()-tal válaszol, ami App.state-et olvas/ír, tehát ennek
   előbb be kell töltődnie. */
function pullPendingBackgroundHealthResult(){
  if(!androidHealthAvailable()) return;
  try{
    const pending = window.AndroidHealth.getPendingBackgroundResult();
    if(pending){ window.onAndroidHealthResult(JSON.parse(pending)); }
  }catch(e){ console.warn('pullPendingBackgroundHealthResult hiba', e); }
}

/* ================= B2) Böngésző-emlékeztető (Notification API) =================
   Önálló, a többi modultól független mechanizmus. Kizárólag OLVASSA az
   App.state.tasks / App.state.events adatokat, nem írja azokat. Csak addig
   működik, amíg ez a böngészőlap nyitva van a böngészőben – zárolt telefonon
   vagy bezárt appnál NEM érkezik értesítés (ahhoz szerver + Push API +
   Service Worker + telepített PWA kellene, ami jelenleg nincs). */
let _reminderTimer=null;
const _remindedIds=new Set();
function notificationsSupported(){ return typeof Notification!=='undefined'; }
function notificationStatusText(){
  if(!notificationsSupported()) return 'A böngésződ nem támogatja az értesítéseket.';
  if(Notification.permission==='granted') return 'Bekapcsolva – csak amíg ez a lap nyitva van.';
  if(Notification.permission==='denied') return 'Letiltva a böngésző beállításaiban.';
  return 'Még nincs bekapcsolva.';
}
function checkDueReminders(){
  if(!notificationsSupported() || Notification.permission!=='granted') return;
  const iso=todayISO();
  const now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
  (App.state.events||[]).forEach(e=>{
    if(e.date!==iso || !e.time || _remindedIds.has('e:'+e.id)) return;
    const parts=e.time.split(':'); const hh=parseInt(parts[0],10), mm=parseInt(parts[1],10);
    if(isNaN(hh)||isNaN(mm)) return;
    const evMin=hh*60+mm;
    if(nowMin>=evMin && nowMin-evMin<=5){
      _remindedIds.add('e:'+e.id);
      try{ new Notification('MotivApp emlékeztető', {body:e.title||'Esemény most kezdődik'}); }catch(err){}
    }
  });
  (App.state.tasks||[]).forEach(t=>{
    if(t.done || t.due!==iso || _remindedIds.has('t:'+t.id)) return;
    _remindedIds.add('t:'+t.id);
    try{ new Notification('MotivApp emlékeztető', {body:'Ma esedékes: '+(t.title||'feladat')}); }catch(err){}
  });
}
function startReminderTimer(){
  if(_reminderTimer) return;
  checkDueReminders();
  _reminderTimer=setInterval(checkDueReminders,60000);
}
function enableBrowserNotifications(){
  if(!notificationsSupported()){ toast('A böngésződ nem támogatja az értesítéseket.'); return; }
  Notification.requestPermission().then(perm=>{
    if(perm==='granted'){ startReminderTimer(); toast('Böngésző-emlékeztetők bekapcsolva'); }
    RENDERERS.integrations();
  }).catch(()=>{ RENDERERS.integrations(); });
}
if(notificationsSupported() && Notification.permission==='granted'){ startReminderTimer(); }

/* ================= REGRESSIÓS DIAGNOSZTIKA (golden-set) =================
   Console-ból hívható: runRegressionChecks(). Kizárólag a MEGLÉVŐ, éles
   függvényeket hívja meg (handleLocalAiCommand / addLocalAiSuggestions /
   sendAiMessage / callMotivAI / toLocalISO / todayISO) — nem duplikálja a
   felismerő logikát. Ahol a teszthez ideiglenes patch szükséges (pl.
   callMotivAI kicserélése egy kontrollált Promise-ra, vagy az #ai-input DOM
   elem hiányának pótlása), azt try/finally biztosítja: a függvény lefutása
   UTÁN App.state.aiChat, App.state.aiPerm és a DOM pontosan olyan állapotban
   marad, mint előtte, és soha nem megy ki valódi hálózati kérés az
   api.anthropic.com felé (callMotivAI mindig helyben kipatch-elve fut az
   ehhez szükséges ellenőrzéseknél). */
async function runRegressionChecks(){
  const results=[];
  function rec(name, pass, detail){ results.push({'Teszt':name, 'Eredmény':pass?'PASS':'FAIL', 'Részlet':detail||''}); }

  // #ai-input csak akkor van a DOM-ban, ha épp a MotivAI chat nézet (RENDERERS.ai)
  // van nyitva. A sendAiMessage() ezt olvassa közvetlenül — ha diagnosztikát más
  // nézetről futtatjuk, ideiglenesen pótoljuk egy rejtett, nem-UI elemmel, majd
  // a teszt végén eltávolítjuk (ha mi hoztuk létre), vagy visszaállítjuk az
  // eredeti értékét (ha már létezett, azaz a valódi UI-hoz tartozik).
  function ensureAiInput(){
    const existing=document.getElementById('ai-input');
    if(existing) return {el:existing, created:false, prevValue:existing.value};
    const el=document.createElement('input');
    el.type='text'; el.id='ai-input'; el.style.display='none';
    document.body.appendChild(el);
    return {el, created:true, prevValue:''};
  }
  function releaseAiInput(ref){
    if(!ref) return;
    if(ref.created){ if(ref.el.parentNode) ref.el.parentNode.removeChild(ref.el); }
    else { ref.el.value=ref.prevValue; }
  }

  // ---- 1) Dupla-küldés guard (_aiSending) ----
  try{
    const origCallMotivAI=callMotivAI;
    const inputRef=ensureAiInput();
    const baseLen=App.state.aiChat.length;
    const testText='Milyen idő lesz holnap Budapesten?'; // nem-helyi szöveg: handleLocalAiCommand nem ismeri fel
    let resolvePending;
    const pending=new Promise(res=>{ resolvePending=res; });

    let pass=false, detail='';
    try{
      const text='Rögzíts két feladatot. Holnap vidd be a autót szervizbe. Pénteken hívd fel Pétert.';
      const ret=handleLocalAiCommand(text);
      const last=App.state.aiChat[App.state.aiChat.length-1];
      const suggs=(last && Array.isArray(last.suggestions)) ? last.suggestions : [];
      const taskSuggs=suggs.filter(s=>s.type==='task');
      const hasAuto=taskSuggs.some(s=>/aut[oó]t szervizbe/i.test(s.title||''));
      const hasPeter=taskSuggs.some(s=>/p[eé]tert?/i.test(s.title||''));
      pass = ret===true && taskSuggs.length===2 && hasAuto && hasPeter;
      detail='handleLocalAiCommand(...) -> '+ret+'; talált task javaslatok ('+taskSuggs.length+' db): '+JSON.stringify(taskSuggs.map(s=>({title:s.title,due:s.due})));
    } finally {
      App.state.aiChat.length=baseLen;
      saveState();
    }
    rec('4c) Több feladat egy üzenetben (2 db task javaslat)', pass, detail);
  }catch(e){
    rec('4c) Több feladat egy üzenetben (2 db task javaslat)', false, 'Hiba a teszt közben: '+(e&&e.message?e.message:e));
  }

  // ---- 5) toLocalISO pontos léptetése év-/hónapváltás határán ----
  try{
    const t1=new Date(2025,11,31); t1.setDate(t1.getDate()+1); // 2025-12-31 -> 2026-01-01 (évváltás)
    const r1=toLocalISO(t1);

    const t2=new Date(2026,0,31); t2.setDate(t2.getDate()+1); // 2026-01-31 -> 2026-02-01 (hónapváltás)
    const r2=toLocalISO(t2);

    const t3=new Date(2026,2,10); t3.setDate(t3.getDate()+7); // sima egy-hetes léptetés
    const r3=toLocalISO(t3);
    const expected3=t3.getFullYear()+'-'+String(t3.getMonth()+1).padStart(2,'0')+'-'+String(t3.getDate()).padStart(2,'0');

    const pass = r1==='2026-01-01' && r2==='2026-02-01' && r3===expected3;
    rec('5) toLocalISO év-/hónapváltás + heti léptetés', pass,
      'évváltás: '+r1+' (elvárt 2026-01-01); hónapváltás: '+r2+' (elvárt 2026-02-01); heti léptetés: '+r3+' (elvárt '+expected3+')');
  }catch(e){
    rec('5) toLocalISO év-/hónapváltás + heti léptetés', false, 'Hiba a teszt közben: '+(e&&e.message?e.message:e));
  }

  // ---- 6) todayISO() helyi getterekkel dolgozik (nincs UTC-csúszás) ----
  try{
    const t=todayISO();
    const now=new Date();
    const expected=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    const pass1 = t===expected;
    let pass2=true, guardDetail='(kihagyva)';
    try{
      /* Csak a tényleges dátum-építő függvények FORRÁSKÓDJÁT (Function.toString(),
         ami nem tartalmazza a függvény előtti kommenteket) vizsgáljuk, NEM a teljes
         oldal HTML-jét — az utóbbi a kommenteket és ezt a tesztet magát is
         tartalmazná, ami önmagát buktatná meg, függetlenül a tényleges kódtól. */
      const fnsToCheck=[todayISO, toLocalISO, shiftCalRef, renderHetView, shiftNutRef, renderNutHet, applyDayTypeTemplateForward];
      const offenders=fnsToCheck.filter(fn=>typeof fn==='function' && /\.toISOString\s*\(/.test(fn.toString())).map(fn=>fn.name);
      pass2 = offenders.length===0;
      guardDetail = pass2 ? 'nincs toISOString hívás az ellenőrzött dátum-építő függvényekben' : 'TALÁLT toISOString hívást: '+offenders.join(', ')+' — regresszió!';
    }catch(e2){
      guardDetail='guard kihagyva (hiba): '+(e2&&e2.message?e2.message:e2);
    }
    rec('6) todayISO helyi dátum + toISOString guard', pass1 && pass2, 'todayISO() -> '+t+' (elvárt '+expected+'); guard: '+guardDetail);
  }catch(e){
    rec('6) todayISO helyi dátum + toISOString guard', false, 'Hiba a teszt közben: '+(e&&e.message?e.message:e));
  }

  const failCount=results.filter(r=>r['Eredmény']==='FAIL').length;
  if(typeof console.table==='function') console.table(results);
  else results.forEach(r=>console.log(r['Teszt']+': '+r['Eredmény']+' — '+r['Részlet']));
  console.log('[runRegressionChecks] Összesen: '+results.length+', PASS: '+(results.length-failCount)+', FAIL: '+failCount);
  return results;
}
window.runRegressionChecks = runRegressionChecks;

(async function init(){
  await loadState();
  renderApp();
  if(typeof promptResumeTrackDraft==='function') promptResumeTrackDraft();
  // App.state betöltése UTÁN hívjuk (nem a szkript tetején, mint a natív híd
  // eredetileg dokumentálja) - onAndroidHealthResult App.state-et olvas/ír, tehát
  // ennek előbb be kell töltődnie, különben az első natív háttér-eredmény elveszne.
  if(typeof pullPendingBackgroundHealthResult==='function') pullPendingBackgroundHealthResult();
  if(typeof startHealthAutoSync==='function') startHealthAutoSync();
})();

/* PWA / offline: a service worker cache-eli az app-shellt (ez a fájl +
   manifest + ikonok), hogy telepítés/hozzáadás után internet nélkül is
   elinduljon és működjön az app. file:// -ról nyitva a böngészők nem
   engedik a Service Worker regisztrációt (ez normális, csak https://
   vagy localhost alól működik), ezért a hibát csendben elnyeljük. */

/* Frissítés-értesítő sáv: amikor egy éles push után új service worker
   települ a háttérben, a MÁR MEGNYITOTT munkamenet ezt csak reload után
   futtatná le — ezért ahelyett, hogy a felhasználó alól rántanánk fel az
   oldalt (pl. gépelés közben), egy eldobható sávon kínáljuk fel az azonnali
   frissítést, a toastUndo()-éhoz hasonló, önálló DOM-elemes mintával. */
let _updateBannerEl = null;
function showUpdateBanner(){
  if(_updateBannerEl) return;
  const t = document.createElement('div');
  t.id = 'update-banner';
  t.setAttribute('role','status'); t.setAttribute('aria-live','polite');
  t.style.cssText = 'position:fixed;bottom:calc(90px + var(--safe-bottom));left:50%;'
    +'transform:translateX(-50%);background:var(--paper);color:var(--ink);'
    +'padding:9px 9px 9px 18px;border-radius:999px;font-weight:600;font-size:13px;z-index:110;'
    +'display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);'
    +'box-shadow:0 6px 20px rgba(0,0,0,.28);';
  const label = document.createElement('span');
  label.textContent = 'Új verzió elérhető';
  label.style.cssText = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
  const btn = document.createElement('button');
  btn.type = 'button'; btn.textContent = 'Frissítés';
  btn.style.cssText = 'background:var(--trail-yellow);color:var(--ink);border:none;'
    +'border-radius:999px;padding:6px 14px;font-weight:700;font-size:12.5px;cursor:pointer;flex-shrink:0;';
  btn.onclick = ()=>window.location.reload();
  t.appendChild(label); t.appendChild(btn);
  document.body.appendChild(t);
  _updateBannerEl = t;
}
/* selfHealIfStale: a service worker SAJÁT frissítési ciklusától (reg.update()
   / skipWaiting+clients.claim) FÜGGETLEN védőháló. Egy régóta futó, telepített
   példányban (pl. Android TWA) előfordulhat, hogy ez a ciklus valamiért nem
   fut le megbízhatóan — pl. egy korábbi telepítés csendben elakadt, mert a
   cache.addAll() egyetlen fájl (pl. ikon) átmeneti hibája miatt sosem futott
   le (ld. sw.js install handler), vagy egyszerűen a böngésző hosszú ideig nem
   ellenőrzött újra. ETTŐL FÜGGETLENÜL, minden oldalbetöltéskor lekérjük magát
   a sw.js-t no-store + egyedi query stringgel (ez sem a böngésző HTTP-cache-ét,
   sem a GitHub Pages CDN URL-kulcsos cache-ét nem hagyja érvényesülni), és
   összevetjük a benne szereplő CACHE_NAME-et az EXPECTED_SW_CACHE_NAME-mel,
   amit EZ a betöltött oldal saját magától vár. Eltérés = ez az oldalpéldány
   régebbi, mint amit a szerver most kiszolgál — ilyenkor minden SW-regisztrációt
   és cache-et törlünk, majd újratöltünk, ami ugyanazt csinálja, mint a
   chrome://serviceworker-internals-beli kézi "Unregister", csak automatikusan.
   sessionStorage-flaggel legfeljebb egyszer avatkozik be munkamenetenként,
   hogy egy váratlan/tartós eltérés esetén se tudjon végtelen reload-hurkot
   okozni. */
function selfHealIfStale(){
  if(!('serviceWorker' in navigator)) return;
  if(sessionStorage.getItem('motivapp2:selfHealed')) return;
  fetch('./sw.js?t='+Date.now(), {cache:'no-store'})
    .then(res=>res.text())
    .then(text=>{
      const m = text.match(/CACHE_NAME\s*=\s*'([^']+)'/);
      if(!m || m[1]===EXPECTED_SW_CACHE_NAME) return;
      sessionStorage.setItem('motivapp2:selfHealed','1');
      return navigator.serviceWorker.getRegistrations()
        .then(regs=>Promise.all(regs.map(r=>r.unregister())))
        .then(()=>('caches' in window ? caches.keys() : []))
        .then(names=>Promise.all(names.map(n=>caches.delete(n))))
        .then(()=>{ window.location.reload(); });
    })
    .catch(()=>{}); // offline / hálózati hiba — nincs teendő, a normál SW-ciklus még megpróbálhatja
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    selfHealIfStale();
    navigator.serviceWorker.register('sw.js').then(reg=>{
      window._swReg = reg;
      const watchForInstall = worker=>{
        if(!worker) return;
        worker.addEventListener('statechange', ()=>{
          // A meglévő controller jelenléte különbözteti meg az első
          // telepítést (nincs mit felkínálni) a háttérben érkezett
          // frissítéstől (van futó, régebbi verzió — azt kínáljuk fel).
          if(worker.state==='installed' && navigator.serviceWorker.controller){
            showUpdateBanner();
          }
        });
      };
      watchForInstall(reg.installing);
      reg.addEventListener('updatefound', ()=>watchForInstall(reg.installing));
      // Rendszeres háttér-ellenőrzés: óránként, és minden alkalommal, amikor
      // a felhasználó visszatér az appba (tabváltás / képernyő felébresztése).
      // A hibát korábban csendben elnyeltük — most legalább console.error-ral
      // látszik, ha ismételten sikertelen (pl. tartósan offline az eszköz).
      setInterval(()=>reg.update().catch(e=>console.error('SW update check failed', e)), 60*60*1000);
      document.addEventListener('visibilitychange', ()=>{
        if(document.visibilityState==='visible'){
          selfHealIfStale();
          reg.update().catch(e=>console.error('SW update check failed', e));
        }
      });
    }).catch(()=>{});
  });
}
