name: Build signed TWA APK

# Manual trigger only - this is a slow build (Android SDK download + Gradle) and
# doesn't need to run on every push.
on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # Must match the values baked into android/twa-manifest.json.
  BUILD_TOOLS_VERSION: "36.1.0"
  PLATFORM_VERSION: "android-36"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;${PLATFORM_VERSION}" "build-tools;${BUILD_TOOLS_VERSION}"

      - name: Install @bubblewrap/cli
        run: npm install -g @bubblewrap/cli@1.25.0

      - name: Point Bubblewrap at the pre-installed JDK and Android SDK
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {"jdkPath":"${JAVA_HOME}","androidSdkPath":"${ANDROID_HOME}"}
          EOF

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Add the four ANDROID_* secrets to this repo (Settings -> Secrets and variables -> Actions) before running this workflow." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android.keystore

      - name: Print signing certificate SHA256 fingerprint
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "== Fingerprint of the key this build will sign with =="
          keytool -list -v -keystore android.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep -i "SHA256:"
          echo "Compare this against the sha256_cert_fingerprints entries in"
          echo "https://kvantum4500.github.io/.well-known/assetlinks.json"

      # The Android/Gradle project under android/app (and friends) is now
      # committed source - see the "Scaffold Android project" workflow and
      # its PR. Do NOT run `bubblewrap update` here: it would regenerate the
      # project from twa-manifest.json on every build and silently overwrite
      # any native customizations (NotificationListenerService, WebView
      # bridge, etc.) added to the committed project since. `bubblewrap
      # build` only compiles/signs the existing project - it doesn't
      # regenerate it - so it's safe to run directly.
      - name: bubblewrap build (compile + sign APK and AAB)
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Read by app/build.gradle's mapsApiKey resolution (JourneyMapActivity's
          # com.google.android.geo.API_KEY). Optional: if this secret isn't set yet,
          # the env var is empty and the build still succeeds - the native map screen
          # just can't render tiles until a real key is added to the repo's secrets.
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          bubblewrap build \
            --signingKeyAlias "${{ secrets.ANDROID_KEY_ALIAS }}"

      - name: List build outputs
        run: ls -la

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: motivapp2-release-apk
          path: android/app-release-signed.apk
          if-no-files-found: error

      - name: Upload signed AAB (Play Store bundle)
        uses: actions/upload-artifact@v4
        with:
          name: motivapp2-release-aab
          path: android/app-release-bundle.aab
          if-no-files-found: warn

      # Also publish as a GitHub Release so the signed APK has a stable,
      # directly downloadable link (workflow-run artifacts require being
      # logged into the Actions UI and expire after 90 days; a Release
      # asset doesn't). Each run gets its own tag so re-running doesn't
      # clobber a previous build's release.
      - name: Create GitHub Release with the signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: "MotivApp APK build #${{ github.run_number }}"
          body: |
            Automatically built and signed by the "Build signed TWA APK" workflow.

            Signing certificate SHA256 fingerprint (must match an entry in
            https://kvantum4500.github.io/.well-known/assetlinks.json for
            the app to open without a browser address bar):
            see the "Print signing certificate SHA256 fingerprint" step of
            this run for the exact value.
          files: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
