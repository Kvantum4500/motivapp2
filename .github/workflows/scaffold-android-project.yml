name: Scaffold Android project

# Manual trigger only. This generates the full Bubblewrap/Gradle Android
# project (via `bubblewrap update`) and commits it to a branch, then opens a
# PR against main so a human can review the generated project before it
# lands. Run this once; after its resulting PR is reviewed and merged,
# build-apk.yml should stop regenerating the project on every build (see the
# PR description of the change that introduced this workflow).
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  # Must match the values in build-apk.yml and the values baked into
  # android/twa-manifest.json. Keep these two workflows in sync.
  BUILD_TOOLS_VERSION: "36.1.0"
  PLATFORM_VERSION: "android-36"
  SCAFFOLD_BRANCH: ci/scaffold-android-project

jobs:
  scaffold:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;${PLATFORM_VERSION}" "build-tools;${BUILD_TOOLS_VERSION}"

      - name: Install @bubblewrap/cli
        run: npm install -g @bubblewrap/cli@1.25.0

      - name: Point Bubblewrap at the pre-installed JDK and Android SDK
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {"jdkPath":"${JAVA_HOME}","androidSdkPath":"${ANDROID_HOME}"}
          EOF

      # `bubblewrap update` reads the signingKey config in twa-manifest.json
      # and will complain if the referenced keystore file is missing, even
      # though this job never builds or signs anything. Decode it just so
      # the command runs non-interactively, then delete it again before any
      # commit is made (see "Remove keystore before committing" below).
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Add the four ANDROID_* secrets to this repo (Settings -> Secrets and variables -> Actions) before running this workflow." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android.keystore

      # Ensure a project-appropriate .gitignore exists before the project is
      # generated, so build output and local config never get staged in the
      # first place. Only write it if the repo doesn't already have one.
      - name: Ensure android/.gitignore exists
        run: |
          if [ -f .gitignore ]; then
            echo ".gitignore already present, leaving it as-is:"
            cat .gitignore
          else
            cat > .gitignore <<'EOF'
          # Local machine config generated by Gradle/Android Studio - never
          # portable across machines and must not be committed.
          local.properties

          # Build output.
          .gradle/
          build/
          */build/
          .cxx/

          # IDE metadata.
          .idea/
          *.iml

          # Signing keystore and any other key material. This must NEVER be
          # committed - it is decoded fresh from the ANDROID_KEYSTORE_BASE64
          # secret in build-apk.yml and this workflow, and is deleted again
          # before this workflow makes its commit.
          *.keystore
          *.jks
          android.keystore

          # Misc caches.
          .cache/
          captures/
          .externalNativeBuild/
          EOF
            echo "Wrote a new android/.gitignore:"
            cat .gitignore
          fi

      # Scaffolds the Android Studio / Gradle project from twa-manifest.json.
      # --skipVersionUpgrade avoids an interactive "enter a new app version"
      # prompt (same flag build-apk.yml uses for the same reason).
      - name: bubblewrap update (scaffold Android project)
        run: bubblewrap update --skipVersionUpgrade

      # Defense in depth: even though android.keystore is gitignored above,
      # delete the decoded keystore outright so it is physically impossible
      # to accidentally commit it (e.g. if the .gitignore step above was
      # skipped because a pre-existing .gitignore didn't cover it).
      - name: Remove keystore before committing
        run: rm -f android.keystore

      - name: Show what would be committed
        run: |
          git status --porcelain=v1 -- .
          echo "---"
          echo "Files that will actually be staged (post .gitignore):"
          git add --dry-run -- . | sed 's/^add //'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit generated project to scaffold branch
        id: commit
        run: |
          set -euo pipefail
          git checkout -B "$SCAFFOLD_BRANCH"
          git add -- .
          if git diff --cached --quiet; then
            echo "No changes produced by bubblewrap update - nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Scaffold generated Android/Gradle project via bubblewrap update

          Generated by the \"Scaffold Android project\" workflow (run ${{ github.run_id }}).
          This commits the full Bubblewrap-generated Gradle project so it can
          live as reviewable source instead of being regenerated fresh on
          every build."
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push scaffold branch
        if: steps.commit.outputs.changed == 'true'
        run: git push --force origin "HEAD:$SCAFFOLD_BRANCH"

      - name: Open PR against main
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh pr view "$SCAFFOLD_BRANCH" --json url >/dev/null 2>&1; then
            echo "PR from $SCAFFOLD_BRANCH already exists, updating it in place via the new push."
            gh pr view "$SCAFFOLD_BRANCH" --json url --jq .url
          else
            gh pr create \
              --base main \
              --head "$SCAFFOLD_BRANCH" \
              --title "Scaffold generated Android/Gradle project" \
              --body "$(cat <<'EOF'
          Generated by the "Scaffold Android project" GitHub Actions workflow
          (`bubblewrap update --skipVersionUpgrade` run against
          `android/twa-manifest.json`, same toolchain as `build-apk.yml`).

          This commits the full Bubblewrap-generated Android/Gradle project
          under `android/` as reviewable source, instead of regenerating it
          fresh on every APK build. Excludes the signing keystore and the
          usual Android build/IDE artifacts (see `android/.gitignore`).

          **Please review before merging**, in particular:
          - No keystore or other key material was committed.
          - `android/.gitignore` looks correct for what got generated.
          - The generated project builds cleanly against the existing
            `build-apk.yml` toolchain.

          After this merges, `build-apk.yml` will need a follow-up change to
          stop running `bubblewrap update` on every build (since that would
          overwrite any native customizations added to the committed
          project afterward) - tracked separately, not part of this PR.
          EOF
          )"
          fi
